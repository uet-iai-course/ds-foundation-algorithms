<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 490" role="img" aria-labelledby="title desc">
<title id="title">Loại nút cụt đệ quy trên Hình 5.4</title><desc id="desc">Bên trái là đồ thị MMDS Hình 5.4 với năm trang: A trỏ tới B, C, D; B trỏ tới A, D; C trỏ tới E; D trỏ tới B, C; E không có cạnh ra. C và E vẽ viền nét đứt màu cam vì chúng bị xóa. Mũi tên ở giữa ghi: xóa E, rồi xóa C; danh sách xóa X = (E, C). Bên phải là đồ thị rút gọn MMDS Hình 5.5 gồm A, B, D: A trỏ tới B, D; B trỏ tới A, D; D trỏ tới B. Dòng chú thích dưới cùng: A có 2 đích trên đồ thị rút gọn nhưng bậc 3 trên đồ thị đầy đủ; D có 1 đích trên đồ thị rút gọn nhưng bậc 2 trên đồ thị đầy đủ.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1100" height="490" fill="#ffffff"/>
