<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 445" role="img" aria-labelledby="t d" font-family="Arial,sans-serif"><title id="t">Dữ kiện: bốn khối và số cạnh</title><desc id="d">Bốn hộp xếp hai hàng hai cột, tiêu đề bốn khối của đồ thị A đến D với k bằng 2. M11 gồm A tới B, B tới A, 2 cạnh; M12 gồm C tới A, D tới B, 2 cạnh; M21, tô cam, gồm A tới C, A tới D, B tới D, 3 cạnh; M22 gồm D tới C, 1 cạnh. Dòng dưới: Map xử lý mỗi cạnh trong một đơn vị thời gian.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#2f3e7a"/></marker><marker id="a0" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0L0,5L10,10Z" fill="#2f3e7a"/></marker></defs><text x="500" y="36" text-anchor="middle" font-size="30" font-weight="bold" fill="#2f3e7a">Bốn khối của đồ thị A–D, k = 2</text><rect x="60" y="70" width="420" height="140" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="90" y="120" text-anchor="start" font-size="34" font-weight="bold" fill="#2f3e7a">M₁₁</text><text x="90" y="170" text-anchor="start" font-size="30" font-weight="normal" fill="#2f3e7a">A→B, B→A</text><text x="455" y="120" text-anchor="end" font-size="30" font-weight="normal" fill="#2f3e7a">2 cạnh</text><rect x="520" y="70" width="420" height="140" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="550" y="120" text-anchor="start" font-size="34" font-weight="bold" fill="#2f3e7a">M₁₂</text><text x="550" y="170" text-anchor="start" font-size="30" font-weight="normal" fill="#2f3e7a">C→A, D→B</text><text x="915" y="120" text-anchor="end" font-size="30" font-weight="normal" fill="#2f3e7a">2 cạnh</text><rect x="60" y="235" width="420" height="140" rx="9" fill="#fff3e0" stroke="#bd6834" stroke-width="2"/><text x="90" y="285" text-anchor="start" font-size="34" font-weight="bold" fill="#bd6834">M₂₁</text><text x="90" y="335" text-anchor="start" font-size="30" font-weight="normal" fill="#bd6834">A→C, A→D, B→D</text><text x="455" y="285" text-anchor="end" font-size="30" font-weight="normal" fill="#bd6834">3 cạnh</text><rect x="520" y="235" width="420" height="140" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="550" y="285" text-anchor="start" font-size="34" font-weight="bold" fill="#2f3e7a">M₂₂</text><text x="550" y="335" text-anchor="start" font-size="30" font-weight="normal" fill="#2f3e7a">D→C</text><text x="915" y="285" text-anchor="end" font-size="30" font-weight="normal" fill="#2f3e7a">1 cạnh</text><text x="500" y="425" text-anchor="middle" font-size="28" font-weight="normal" fill="#555">Map xử lý mỗi cạnh trong một đơn vị thời gian</text></svg>
