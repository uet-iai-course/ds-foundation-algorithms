<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="title desc">
<title id="title">Một clique bốn trang và một nút đích chung</title><desc id="desc">Đồ thị MMDS Hình 5.8 với n = 4. Bốn trang 1, 2, 3, 4 của một clique đặt ở bốn góc; mỗi cặp trang nối bằng hai mũi tên cong ngược chiều, nên mỗi trang trỏ tới ba trang còn lại. Mỗi trang của clique có thêm một mũi tên màu cam tới trang X ở dưới cùng. X không có mũi tên đi ra.</desc>
