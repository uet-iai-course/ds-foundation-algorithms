<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 375" role="img" aria-labelledby="t d" font-family="Arial,sans-serif"><title id="t">Hai khối góp về cùng khóa A</title><desc id="d">M11 tạo cặp A,một phần tám; M12 tạo cặp A,một phần tư. Tổng tại A bằng ba phần tám trước khi nhân beta và cộng phần chung.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2f3e7a"/></marker></defs><rect x="35" y="30" width="280" height="100" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="175.0" y="90.0" text-anchor="middle" font-size="30" fill="#2f3e7a">M11: B → A</text><rect x="35" y="240" width="280" height="100" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="175.0" y="300.0" text-anchor="middle" font-size="30" fill="#2f3e7a">M12: C → A</text><path d="M315,80 L650,170" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arr)"/><path d="M315,290 L650,200" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arr)"/><text x="455" y="95" text-anchor="middle" font-size="34" fill="#2f3e7a">(A, 1/8)</text><text x="455" y="308" text-anchor="middle" font-size="34" fill="#2f3e7a">(A, 1/4)</text><rect x="650" y="125" width="170" height="115" rx="9" fill="#fff3e0" stroke="#cc6b32" stroke-width="2"/><text x="735.0" y="192.5" text-anchor="middle" font-size="40" fill="#cc6b32">A</text><text x="730" y="280" text-anchor="middle" font-size="28" fill="#cc6b32">Tổng 3/8</text></svg>