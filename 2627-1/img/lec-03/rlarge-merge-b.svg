<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 390" role="img" aria-labelledby="t d" font-family="Arial,sans-serif"><title id="t">Hai khối và cặp khởi tạo góp về khóa B</title><desc id="d">M11 tạo cặp B, một phần mười hai từ cạnh A tới B; M12 tạo cặp B, một phần tám từ cạnh D tới B; cặp khởi tạo B, 0. Reduce cộng ba giá trị thành z_B bằng năm phần hai mươi tư.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2f3e7a"/></marker></defs><rect x="35" y="20" width="300" height="90" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="185.0" y="75.0" text-anchor="middle" font-size="30" fill="#2f3e7a">M11: A → B</text><rect x="35" y="150" width="300" height="90" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="185.0" y="205.0" text-anchor="middle" font-size="30" fill="#2f3e7a">Khởi tạo</text><rect x="35" y="280" width="300" height="90" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="185.0" y="335.0" text-anchor="middle" font-size="30" fill="#2f3e7a">M12: D → B</text><path d="M335,65 L640,165" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arr)"/><path d="M335,195 L640,195" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arr)"/><path d="M335,325 L640,225" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arr)"/><text x="470" y="85" text-anchor="middle" font-size="32" fill="#2f3e7a">(B, 1/12)</text><text x="470" y="185" text-anchor="middle" font-size="32" fill="#2f3e7a">(B, 0)</text><text x="470" y="330" text-anchor="middle" font-size="32" fill="#2f3e7a">(B, 1/8)</text><rect x="640" y="140" width="180" height="110" rx="9" fill="#fff3e0" stroke="#cc6b32" stroke-width="2"/><text x="730.0" y="205.0" text-anchor="middle" font-size="40" fill="#cc6b32">B</text><text x="730" y="290" text-anchor="middle" font-size="30" fill="#cc6b32">z_B = 5/24</text></svg>