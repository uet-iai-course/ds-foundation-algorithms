<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="mr-title mr-desc">
<title id="mr-title">Một trang chia điểm cho các đích của nó</title>
<desc id="mr-desc">Nút j bên trái mang điểm cũ rⱼ; ba mũi tên tới ba trang đích bên phải, mỗi mũi tên mang nhãn rⱼ/dⱼ là phần bằng nhau của điểm cũ chia theo số liên kết ra.</desc>
<path d="M190.9,165.6 Q400.0,117.5 595.4,72.6" fill="none" stroke="#2f3e7a" stroke-width="3.5"/><polygon points="609.1,69.4 597.2,80.3 593.6,64.8" fill="#2f3e7a"/><text x="400.0" y="99.5" text-anchor="middle" font-size="24" font-weight="bold" fill="#2f3e7a">rⱼ/dⱼ</text><path d="M192.0,175.0 Q400.0,175.0 594.0,175.0" fill="none" stroke="#2f3e7a" stroke-width="3.5"/><polygon points="608.0,175.0 594.0,183.0 594.0,167.0" fill="#2f3e7a"/><text x="400.0" y="157.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#2f3e7a">rⱼ/dⱼ</text><path d="M190.9,184.4 Q400.0,232.5 595.4,277.4" fill="none" stroke="#2f3e7a" stroke-width="3.5"/><polygon points="609.1,280.6 593.6,285.2 597.2,269.7" fill="#2f3e7a"/><text x="400.0" y="214.5" text-anchor="middle" font-size="24" font-weight="bold" fill="#2f3e7a">rⱼ/dⱼ</text><circle cx="150" cy="175" r="42" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="150" y="184" text-anchor="middle" font-size="30" font-weight="bold" fill="#2f3e7a">j</text><text x="150" y="243" text-anchor="middle" font-size="24" fill="#666666">điểm cũ rⱼ</text><circle cx="650" cy="60" r="42" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="650" y="69" text-anchor="middle" font-size="30" font-weight="bold" fill="#2f3e7a">1</text><circle cx="650" cy="175" r="42" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="650" y="184" text-anchor="middle" font-size="30" font-weight="bold" fill="#2f3e7a">2</text><circle cx="650" cy="290" r="42" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="650" y="299" text-anchor="middle" font-size="30" font-weight="bold" fill="#2f3e7a">3</text><text x="400" y="340" text-anchor="middle" font-size="26" fill="#666666">bước t → t+1</text>
</svg>
