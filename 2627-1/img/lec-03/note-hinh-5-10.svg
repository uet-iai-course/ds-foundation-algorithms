<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">Cây nút cụt có khuyên ở gốc</title><desc id="desc">Đồ thị MMDS Hình 5.10: trang gốc ở mức 0 có một khuyên về chính nó và hai mũi tên xuống hai trang ở mức 1; mỗi trang ở mức 1 có hai mũi tên xuống hai trang ở mức 2. Dấu ba chấm dọc dưới mỗi trang ở mức 2 chỉ các mức tiếp theo của cây nhị phân đầy đủ; các lá ở mức cuối không có mũi tên đi ra. Số trong mỗi nút là mức của nút.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
