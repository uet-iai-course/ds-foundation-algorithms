<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 370" width="840" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="co-title co-desc">
<title id="co-title">Cộng đóng góp theo trang đích</title>
<desc id="co-desc">B đóng góp một phần tám và C đóng góp một phần tư tới A; tổng tại A là ba phần tám, chưa nhân beta và chưa cộng thành phần chung.</desc>
