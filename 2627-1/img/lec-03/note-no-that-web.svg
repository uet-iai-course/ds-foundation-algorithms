<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
<title id="title">Cấu trúc nơ thắt của web</title><desc id="desc">Sơ đồ nơ thắt của web, vẽ lại theo MMDS Hình 5.2. Ở giữa là thành phần liên thông mạnh. Bên trái là thành phần vào, một mũi tên đậm đi từ thành phần vào sang thành phần liên thông mạnh. Bên phải là thành phần ra, một mũi tên đậm đi từ thành phần liên thông mạnh sang thành phần ra. Không có mũi tên nào đi ngược lại. Phía trên trái, khung nét đứt các tua đi ra từ thành phần vào; phía trên phải, khung nét đứt các tua đi vào thành phần ra. Phía dưới, một đường cong nét đứt là ống đi từ thành phần vào tới thành phần ra mà không qua thành phần liên thông mạnh. Góc phải dưới là ba vòng tròn nhỏ không nối với gì, các thành phần rời. Hình không có số liệu.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1100" height="600" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><ellipse cx="550" cy="250" rx="150" ry="105" fill="#eef7f2" stroke="#26704e" stroke-width="3"/><text x="550.0" y="240.0" font-size="23" fill="#26704e" text-anchor="middle" font-weight="bold">Thành phần</text><text x="550.0" y="270.0" font-size="23" fill="#26704e" text-anchor="middle" font-weight="bold">liên thông mạnh</text><ellipse cx="190" cy="250" rx="140" ry="95" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="190.0" y="245.0" font-size="22" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Thành phần</text><text x="190.0" y="274.0" font-size="22" fill="#2f3e7a" text-anchor="middle" font-weight="bold">vào</text><ellipse cx="910" cy="250" rx="140" ry="95" fill="#fff4e9" stroke="#a85b23" stroke-width="3"/><text x="910.0" y="245.0" font-size="22" fill="#a85b23" text-anchor="middle" font-weight="bold">Thành phần</text><text x="910.0" y="274.0" font-size="22" fill="#a85b23" text-anchor="middle" font-weight="bold">ra</text><line x1="332.0" y1="250.0" x2="394.0" y2="250.0" stroke="#2f3e7a" stroke-width="4" marker-end="url(#arrow)"/><line x1="702.0" y1="250.0" x2="764.0" y2="250.0" stroke="#2f3e7a" stroke-width="4" marker-end="url(#arrow)"/><rect x="150.0" y="40.0" width="190.0" height="64.0" rx="10" fill="#ffffff" stroke="#2f3e7a" stroke-width="2.5" stroke-dasharray="7 5"/><text x="245.0" y="80.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">Tua từ phần vào</text><line x1="210.0" y1="156.0" x2="230.0" y2="108.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="760.0" y="40.0" width="190.0" height="64.0" rx="10" fill="#ffffff" stroke="#a85b23" stroke-width="2.5" stroke-dasharray="7 5"/><text x="855.0" y="80.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">Tua tới phần ra</text><line x1="870.0" y1="108.0" x2="890.0" y2="152.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><path d="M230,344 C300,440 800,440 870,344" fill="none" stroke="#5b6778" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#arrow)"/><text x="550.0" y="470.0" font-size="19" fill="#5b6778" text-anchor="middle" font-weight="normal">Ống: từ phần vào tới phần ra, không qua thành phần liên thông mạnh</text><circle cx="930" cy="540" r="16" fill="#f4f6f9" stroke="#5b6778" stroke-width="2.5"/><circle cx="990" cy="520" r="16" fill="#f4f6f9" stroke="#5b6778" stroke-width="2.5"/><circle cx="1040" cy="560" r="16" fill="#f4f6f9" stroke="#5b6778" stroke-width="2.5"/><text x="830.0" y="586.0" font-size="19" fill="#5b6778" text-anchor="middle" font-weight="normal">Thành phần rời</text></g></svg>
