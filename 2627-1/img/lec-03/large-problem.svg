<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 445" role="img" aria-labelledby="t d" font-family="Arial,sans-serif"><title id="t">Một tỷ trang: ma trận gần như toàn số 0</title><desc id="d">Bên trái: hình vuông ma trận liên kết 10 mũ 9 nhân 10 mũ 9, tức 10 mũ 18 ô, chỉ vài chấm cam tượng trưng cho 10 mũ 10 ô khác 0, tỷ lệ 10 mũ trừ 8. Bên phải: ba hộp. Lưu đặc 8 byte mỗi ô cần 8 nhân 10 mũ 18 byte; danh sách liên kết ra 4 nhân (n cộng m) cần 4,4 nhân 10 mũ 10 byte; hai véc-tơ r và new 16n cần 1,6 nhân 10 mũ 10 byte. Dòng dưới: n bằng 10 mũ 9 trang, m xấp xỉ 10 mũ 10 liên kết.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#2f3e7a"/></marker><marker id="a0" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0L0,5L10,10Z" fill="#2f3e7a"/></marker></defs><text x="190" y="34" text-anchor="middle" font-size="28" font-weight="bold" fill="#2f3e7a">Ma trận liên kết</text><rect x="40" y="55" width="300" height="300" rx="9" fill="#ffffff" stroke="#2f3e7a" stroke-width="2"/><text x="190" y="392" text-anchor="middle" font-size="28" font-weight="normal" fill="#2f3e7a">10⁹ × 10⁹ = 10¹⁸ ô</text><text x="190" y="428" text-anchor="middle" font-size="26" font-weight="normal" fill="#bd6834">10¹⁰ ô khác 0, tỷ lệ 10⁻⁸</text><circle cx="70" cy="90" r="6" fill="#bd6834"/><circle cx="150" cy="130" r="6" fill="#bd6834"/><circle cx="260" cy="80" r="6" fill="#bd6834"/><circle cx="110" cy="220" r="6" fill="#bd6834"/><circle cx="300" cy="250" r="6" fill="#bd6834"/><circle cx="200" cy="310" r="6" fill="#bd6834"/><circle cx="90" cy="330" r="6" fill="#bd6834"/><circle cx="240" cy="190" r="6" fill="#bd6834"/><rect x="420" y="60" width="560" height="96" rx="9" fill="#fff3e0" stroke="#bd6834" stroke-width="2"/><text x="440" y="100" text-anchor="start" font-size="27" font-weight="normal" fill="#bd6834">Lưu đặc, 8 byte mỗi ô</text><text x="440" y="140" text-anchor="start" font-size="30" font-weight="bold" fill="#bd6834">8 · 10¹⁸ byte</text><rect x="420" y="180" width="560" height="96" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="440" y="220" text-anchor="start" font-size="27" font-weight="normal" fill="#2f3e7a">Danh sách liên kết ra, 4(n + m)</text><text x="440" y="260" text-anchor="start" font-size="30" font-weight="bold" fill="#2f3e7a">4,4 · 10¹⁰ byte</text><rect x="420" y="300" width="560" height="96" rx="9" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="440" y="340" text-anchor="start" font-size="27" font-weight="normal" fill="#2e7d32">Hai véc-tơ r và new, 16n</text><text x="440" y="380" text-anchor="start" font-size="30" font-weight="bold" fill="#2e7d32">1,6 · 10¹⁰ byte</text><text x="700" y="428" text-anchor="middle" font-size="26" font-weight="normal" fill="#555">n = 10⁹ trang, m ≈ 10¹⁰ liên kết</text></svg>
