<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 445" role="img" aria-labelledby="t d" font-family="Arial,sans-serif"><title id="t">Cấu trúc nơ thắt của web</title><desc id="d">Ở giữa là thành phần liên thông mạnh, SCC. Bên trái là thành phần vào, mũi tên sang SCC; bên phải là thành phần ra, tô cam, mũi tên từ SCC sang. Không có mũi tên nào đi ngược lại. Phía trên, hai hộp tua: một tua ra khỏi thành phần vào, một tua đi vào thành phần ra. Phía dưới, một ống cong nối thẳng thành phần vào với thành phần ra, không qua SCC. Góc phải dưới là một thành phần rời, viền nét đứt, không có mũi tên nối.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#2f3e7a"/></marker><marker id="a0" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0L0,5L10,10Z" fill="#2f3e7a"/></marker></defs><ellipse cx="500" cy="200" rx="170" ry="110" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="500" y="192" text-anchor="middle" font-size="28" font-weight="bold" fill="#2f3e7a">Thành phần liên</text><text x="500" y="228" text-anchor="middle" font-size="28" font-weight="bold" fill="#2f3e7a">thông mạnh (SCC)</text><path d="M40,90 L250,170 L250,230 L40,310 Z" fill="#f7f9ff" stroke="#2f3e7a" stroke-width="2"/><text x="135" y="192" text-anchor="middle" font-size="27" font-weight="normal" fill="#2f3e7a">Thành phần</text><text x="135" y="226" text-anchor="middle" font-size="27" font-weight="normal" fill="#2f3e7a">vào</text><path d="M960,90 L750,170 L750,230 L960,310 Z" fill="#fff3e0" stroke="#bd6834" stroke-width="2"/><text x="865" y="192" text-anchor="middle" font-size="27" font-weight="normal" fill="#bd6834">Thành phần</text><text x="865" y="226" text-anchor="middle" font-size="27" font-weight="normal" fill="#bd6834">ra</text><path d="M255,200 L325,200" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><path d="M675,200 L745,200" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><rect x="150" y="18" width="150" height="50" rx="9" fill="#ffffff" stroke="#555" stroke-width="2"/><text x="225" y="52" text-anchor="middle" font-size="26" font-weight="normal" fill="#555">tua</text><rect x="700" y="18" width="150" height="50" rx="9" fill="#ffffff" stroke="#555" stroke-width="2"/><text x="775" y="52" text-anchor="middle" font-size="26" font-weight="normal" fill="#555">tua</text><path d="M190,95 L215,70" fill="none" stroke="#555" stroke-width="3" marker-end="url(#a)"/><path d="M790,70 L815,95" fill="none" stroke="#555" stroke-width="3" marker-end="url(#a)"/><path d="M150,310 C300,380 700,380 850,310" fill="none" stroke="#555" stroke-width="3" marker-end="url(#a)"/><text x="500" y="425" text-anchor="middle" font-size="26" font-weight="normal" fill="#555">ống: từ thành phần vào tới thành phần ra, không qua SCC</text><rect x="880" y="345" width="100" height="54" rx="9" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="9,7"/><text x="930" y="381" text-anchor="middle" font-size="26" font-weight="normal" fill="#555">rời</text></svg>
