<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Hai phân phối qua cùng phép cập nhật</title><desc id="desc">Hai hàng riêng: x qua F thành F(x), y qua cùng F thành F(y). Công thức trên slide so sánh khoảng cách giữa hai phân phối trước và sau.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f3e7a"/></marker></defs>
<text x="180" y="30" text-anchor="middle" font-size="28" fill="#2f3e7a">Hai phân phối ban đầu</text><text x="870" y="30" text-anchor="middle" font-size="28" fill="#2f3e7a">Sau cùng một phép cập nhật</text><rect x="100" y="50" width="160" height="62" rx="8" fill="#f7f9ff" stroke="#c8d0e8" stroke-width="2"/><text x="180" y="92" text-anchor="middle" font-size="32" fill="#2f3e7a">x</text><line x1="275" y1="81" x2="775" y2="81" stroke="#2f3e7a" stroke-width="2" marker-end="url(#arrow)"/><text x="520" y="70" text-anchor="middle" font-size="30" fill="#2f3e7a">F</text><rect x="790" y="50" width="160" height="62" rx="8" fill="#f7f9ff" stroke="#c8d0e8" stroke-width="2"/><text x="870" y="92" text-anchor="middle" font-size="32" fill="#2f3e7a">F(x)</text><rect x="100" y="140" width="160" height="62" rx="8" fill="#f7f9ff" stroke="#c8d0e8" stroke-width="2"/><text x="180" y="182" text-anchor="middle" font-size="32" fill="#2f3e7a">y</text><line x1="275" y1="171" x2="775" y2="171" stroke="#2f3e7a" stroke-width="2" marker-end="url(#arrow)"/><text x="520" y="160" text-anchor="middle" font-size="30" fill="#2f3e7a">F</text><rect x="790" y="140" width="160" height="62" rx="8" fill="#f7f9ff" stroke="#c8d0e8" stroke-width="2"/><text x="870" y="182" text-anchor="middle" font-size="32" fill="#2f3e7a">F(y)</text><text x="525" y="238" text-anchor="middle" font-size="27" fill="#2f3e7a">So sánh khoảng cách giữa hai phân phối, không so sánh riêng từng điểm.</text></svg>
