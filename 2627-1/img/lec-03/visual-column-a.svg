<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 355" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Ba cạnh ra tạo cột A</title><desc id="desc">A trỏ tới B, C, D. Đường nét đứt ánh xạ đúng tới các hàng B, C, D có giá trị một phần ba; hàng A bằng không.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f3e7a"/></marker></defs>
<text x="78" y="35" text-anchor="middle" font-size="26" fill="#2f3e7a">Nguồn</text><text x="230" y="35" text-anchor="middle" font-size="26" fill="#2f3e7a">Đích</text><text x="428" y="35" text-anchor="middle" font-size="26" fill="#2f3e7a">Cột A</text><rect x="365" y="50" width="125" height="260" rx="8" fill="#f7f9ff" stroke="#c8d0e8" stroke-width="2"/><circle cx="78" cy="180" r="29" fill="#fff3e0" stroke="#bd6834" stroke-width="2"/><text x="78" y="189" text-anchor="middle" font-size="30" fill="#bd6834">A</text><line x1="108" y1="180" x2="196" y2="110" stroke="#2f3e7a" stroke-width="2" marker-end="url(#arrow)"/><circle cx="230" cy="110" r="29" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="230" y="119" text-anchor="middle" font-size="30" fill="#2f3e7a">B</text><line x1="108" y1="180" x2="196" y2="185" stroke="#2f3e7a" stroke-width="2" marker-end="url(#arrow)"/><circle cx="230" cy="185" r="29" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="230" y="194" text-anchor="middle" font-size="30" fill="#2f3e7a">C</text><line x1="108" y1="180" x2="196" y2="260" stroke="#2f3e7a" stroke-width="2" marker-end="url(#arrow)"/><circle cx="230" cy="260" r="29" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="230" y="269" text-anchor="middle" font-size="30" fill="#2f3e7a">D</text><text x="388" y="87" text-anchor="middle" font-size="26" fill="#2f3e7a">A</text><text x="454" y="87" text-anchor="middle" font-size="26" fill="#2f3e7a">0</text><text x="388" y="154" text-anchor="middle" font-size="26" fill="#2f3e7a">B</text><text x="454" y="154" text-anchor="middle" font-size="26" fill="#2f3e7a">1/3</text><text x="388" y="221" text-anchor="middle" font-size="26" fill="#2f3e7a">C</text><text x="454" y="221" text-anchor="middle" font-size="26" fill="#2f3e7a">1/3</text><text x="388" y="288" text-anchor="middle" font-size="26" fill="#2f3e7a">D</text><text x="454" y="288" text-anchor="middle" font-size="26" fill="#2f3e7a">1/3</text><line x1="261" y1="110" x2="363" y2="145" stroke="#2f3e7a" stroke-width="2" stroke-dasharray="6 5"/><line x1="261" y1="185" x2="363" y2="212" stroke="#2f3e7a" stroke-width="2" stroke-dasharray="6 5"/><line x1="261" y1="260" x2="363" y2="279" stroke="#2f3e7a" stroke-width="2" stroke-dasharray="6 5"/><text x="80" y="243" text-anchor="middle" font-size="24" fill="#2f3e7a">3 đích</text><text x="260" y="337" text-anchor="middle" font-size="24" fill="#2f3e7a">A không trỏ tới chính A: hàng A bằng 0.</text></svg>
