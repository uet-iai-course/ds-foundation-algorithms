<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Hai biến thể nút cụt và bẫy nhện của đồ thị y, a, m</title>
  <desc id="desc">Bên trái, y trỏ đến y và a, a trỏ đến y và m, còn m không có cạnh ra. Bên phải giữ các cạnh từ y và a nhưng m chỉ trỏ đến chính nó, tạo bẫy nhện một nút.</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#B15A2B"/></marker></defs>
  <rect width="1120" height="420" rx="18" fill="#fffdf9"/>
  <line x1="560" y1="42" x2="560" y2="385" stroke="#CFD8DC" stroke-width="3"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#2F3E7A"><text x="280" y="45" font-size="28" font-weight="700">Nút cụt: d⁺(m)=0</text><text x="840" y="45" font-size="28" font-weight="700">Bẫy nhện: m chỉ trỏ đến m</text></g>
  <g fill="none" stroke="#B15A2B" stroke-width="5" marker-end="url(#arr)">
    <path d="M220 135 C150 45 115 170 190 177"/><path d="M220 205 L220 278"/><path d="M247 278 L247 205"/><path d="M275 313 L400 313"/>
    <path d="M780 135 C710 45 675 170 750 177"/><path d="M780 205 L780 278"/><path d="M807 278 L807 205"/><path d="M835 313 L960 313"/><path d="M1015 275 C1090 195 1100 345 1035 345"/>
  </g>
  <g fill="#edf4ff" stroke="#2F3E7A" stroke-width="5"><circle cx="235" cy="165" r="42"/><circle cx="235" cy="315" r="42"/><circle cx="445" cy="315" r="42"/><circle cx="795" cy="165" r="42"/><circle cx="795" cy="315" r="42"/><circle cx="1005" cy="315" r="42"/></g>
  <g font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="middle" fill="#2F3E7A"><text x="235" y="178">y</text><text x="235" y="328">a</text><text x="445" y="328">m</text><text x="795" y="178">y</text><text x="795" y="328">a</text><text x="1005" y="328">m</text></g>
  <g font-family="Arial, sans-serif" text-anchor="middle"><text x="365" y="385" font-size="23" fill="#C62828">khối lượng tại m không được phát</text><text x="850" y="385" font-size="23" fill="#C62828">khối lượng vào m không thoát ra</text></g>
</svg>
