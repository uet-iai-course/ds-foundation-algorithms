<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 390" role="img" aria-labelledby="t d" font-family="Arial,sans-serif"><title id="t">Bộ nhớ của một tác vụ khối</title><desc id="d">Khối ma trận đọc qua bộ đệm. Phép tính dùng dải điểm r_b và tích lũy vào z_a. Hai dải mỗi dải n/k số thực.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#2f3e7a"/></marker></defs><rect x="15" y="115" width="195" height="80" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="112.5" y="164.0" text-anchor="middle" font-size="30" fill="#2f3e7a">Khối trên đĩa</text><path d="M210,155L265,155" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><rect x="265" y="115" width="230" height="80" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="380.0" y="164.0" text-anchor="middle" font-size="30" fill="#2f3e7a">Bộ đệm đọc khối</text><rect x="570" y="35" width="235" height="80" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="687.5" y="84.0" text-anchor="middle" font-size="30" fill="#2f3e7a">Dải điểm vào r_b</text><rect x="570" y="255" width="235" height="80" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="687.5" y="304.0" text-anchor="middle" font-size="30" fill="#2f3e7a">Dải tích lũy z_a</text><rect x="570" y="145" width="235" height="60" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="687.5" y="184.0" text-anchor="middle" font-size="30" fill="#2f3e7a">Tính đóng góp</text><path d="M495,155L570,175" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><path d="M685,115L685,145" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><path d="M685,205L685,255" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><text x="382" y="230" text-anchor="middle" font-size="30" fill="#2f3e7a">B_buf</text><text x="685" y="365" text-anchor="middle" font-size="30" fill="#