<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 490" role="img" aria-labelledby="t d" font-family="Arial,sans-serif"><title id="t">Một dải đầu vào cho mỗi cột khối; một dải kết quả cho mỗi hàng</title><desc id="d">r1 cấp cho khung cột chứa M11 và M21; r2 cấp cho khung cột chứa M12 và M22. Khung nét đứt chỉ nhóm theo cột nguồn, không là cạnh dữ liệu. M11 và M12 cùng đóng góp z1; M21 và M22 cùng đóng góp z2. Hàng là đích, cột là nguồn.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2f3e7a"/></marker></defs><rect x="260" y="20" width="180" height="70" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="350.0" y="65.0" text-anchor="middle" font-size="28" fill="#2f3e7a">r1: A, B</text><rect x="500" y="20" width="180" height="70" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="590.0" y="65.0" text-anchor="middle" font-size="28" fill="#2f3e7a">r2: C, D</text><rect x="240" y="150" width="220" height="310" rx="12" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="9,7"/><rect x="480" y="150" width="220" height="310" rx="12" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="9,7"/><path d="M350,90 L350,150" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arr)"/><path d="M590,90 L590,150" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arr)"/><text x="105" y="229" text-anchor="middle" font-size="28" fill="#2f3e7a">Đích A, B</text><rect x="850" y="170" width="170" height="100" rx="9" fill="#fff3e0" stroke="#cc6b32" stroke-width="2"/><text x="935.0" y="230.0" text-anchor="middle" font-size="34" fill="#cc6b32">z1</text><rect x="260" y="170" width="180" height="100" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="350.0" y="230.0" text-anchor="middle" font-size="34" fill="#2f3e7a">M11</text><rect x="500" y="170" width="180" height="100" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="590.0" y="230.0" text-anchor="middle" font-size="34" fill="#2f3e7a">M12</text><path d="M350,270 L350,295 L790,295 L790,220 L850,220" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arr)"/><path d="M680,220 L850,220" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arr)"/><text x="105" y="389" text-anchor="middle" font-size="28" fill="#2f3e7a">Đích C, D</text><rect x="850" y="330" width="170" height="100" rx="9" fill="#fff3e0" stroke="#cc6b32" stroke-width="2"/><text x="935.0" y="390.0" text-anchor="middle" font-size="34" fill="#cc6b32">z2</text><rect x="260" y="330" width="180" height="100" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="350.0" y="390.0" text-anchor="middle" font-size="34" fill="#2f3e7a">M21</text><rect x="500" y="330" width="180" height="100" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="590.0" y="390.0" text-anchor="middle" font-size="34" fill="#2f3e7a">M22</text><path d="M350,430 L350,455 L790,455 L790,380 L850,380" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arr)"/><path d="M680,380 L850,380" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arr)"/></svg>