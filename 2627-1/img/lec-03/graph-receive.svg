<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="rc-title rc-desc">
<title id="rc-title">Cộng điểm tại trang A</title>
<desc id="rc-desc">Hai mũi tên từ B và C vào A; B đóng góp 1/8 vì có hai liên kết ra, C đóng góp cả 1/4 vì chỉ có một liên kết ra; điểm mới của A là 3/8.</desc>
<path d="M222.0,68.9 Q413.9,64.1 570.7,148.5" fill="none" stroke="#2f3e7a" stroke-width="3.5"/><polygon points="583.0,155.1 566.9,155.5 574.5,141.4" fill="#2f3e7a"/><text x="413.9" y="44.1" text-anchor="middle" font-size="24" font-weight="bold" fill="#2f3e7a">1/8</text><path d="M222.0,281.1 Q413.9,285.9 570.7,201.5" fill="none" stroke="#2f3e7a" stroke-width="3.5"/><polygon points="583.0,194.9 574.5,208.6 566.9,194.5" fill="#2f3e7a"/><text x="413.9" y="319.9" text-anchor="middle" font-size="24" font-weight="bold" fill="#2f3e7a">1/4</text><circle cx="180" cy="70" r="42" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="180" y="79" text-anchor="middle" font-size="30" font-weight="bold" fill="#2f3e7a">B</text><text x="180" y="138" text-anchor="middle" font-size="24" fill="#666666">1/4 chia 2</text><circle cx="180" cy="280" r="42" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="180" y="289" text-anchor="middle" font-size="30" font-weight="bold" fill="#2f3e7a">C</text><text x="180" y="348" text-anchor="middle" font-size="24" fill="#666666">1/4 chia 1</text><circle cx="620" cy="175" r="42" fill="#fff3e0" stroke="#ef6c00" stroke-width="5"/><text x="620" y="184" text-anchor="middle" font-size="30" font-weight="bold" fill="#ef6c00">A</text><text x="620" y="243" text-anchor="middle" font-size="24" fill="#666666">điểm mới 3/8</text>
</svg>
