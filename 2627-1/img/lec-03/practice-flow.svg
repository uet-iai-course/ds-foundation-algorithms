<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="t d" font-family="Arial,sans-serif"><title id="t">Từ danh sách kề tới kết quả kiểm được</title><desc id="d">Ba hộp nối bằng mũi tên: adj, danh sách kề của bốn trang A đến D; pagerank.py, hàm step và vòng lặp tới khi độ thay đổi không quá ngưỡng; JSON gồm rank và iterations. Mũi tên hai chiều ghi đối chiếu nối JSON với hộp cam bên dưới: tính tay với beta 0,8, một vòng cho A 7/20, B 13/60; nghiệm A 9/28, B 19/84.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#2f3e7a"/></marker><marker id="a0" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0L0,5L10,10Z" fill="#2f3e7a"/></marker></defs><rect x="20" y="40" width="270" height="120" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="155" y="88" text-anchor="middle" font-size="30" font-weight="bold" fill="#2f3e7a">adj</text><text x="155" y="128" text-anchor="middle" font-size="26" font-weight="normal" fill="#2f3e7a">danh sách kề A–D</text><path d="M290,100 L355,100" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><rect x="360" y="40" width="290" height="120" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="505" y="88" text-anchor="middle" font-size="30" font-weight="bold" fill="#2f3e7a">pagerank.py</text><text x="505" y="128" text-anchor="middle" font-size="26" font-weight="normal" fill="#2f3e7a">step, lặp tới Δ ≤ τ</text><path d="M650,100 L715,100" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><rect x="720" y="40" width="260" height="120" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="850" y="88" text-anchor="middle" font-size="30" font-weight="bold" fill="#2f3e7a">JSON</text><text x="850" y="128" text-anchor="middle" font-size="26" font-weight="normal" fill="#2f3e7a">rank, iterations</text><path d="M850,165 L850,235" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)" marker-start="url(#a0)"/><text x="890" y="210" text-anchor="start" font-size="26" font-weight="normal" fill="#bd6834">đối chiếu</text><rect x="300" y="240" width="680" height="150" rx="9" fill="#fff3e0" stroke="#bd6834" stroke-width="2"/><text x="640" y="285" text-anchor="middle" font-size="28" font-weight="bold" fill="#bd6834">Tính tay, β = 0,8</text><text x="640" y="325" text-anchor="middle" font-size="28" font-weight="normal" fill="#bd6834">một vòng: A 7/20, B 13/60</text><text x="640" y="365" text-anchor="middle" font-size="28" font-weight="normal" fill="#bd6834">nghiệm: A 9/28, B 19/84</text></svg>
