<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Byte qua mạng phụ thuộc vị trí Reduce</title><desc id="desc">Bản ghi của Combine trên máy 1 có thể tới Reduce cùng máy theo nhánh cục bộ, hoặc qua mạng tới Reduce máy 2. Chỉ nhánh qua mạng góp vào Q.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f3e7a"/></marker></defs>
<rect x="15" y="20" width="510" height="220" rx="8" fill="#f7f9ff" stroke="#c8d0e8" stroke-width="2"/><rect x="750" y="20" width="330" height="220" rx="8" fill="#f7f9ff" stroke="#c8d0e8" stroke-width="2"/><text x="270" y="53" text-anchor="middle" font-size="28" fill="#2f3e7a">Máy 1</text><text x="915" y="53" text-anchor="middle" font-size="28" fill="#2f3e7a">Máy 2</text><rect x="45" y="90" width="180" height="70" rx="8" fill="#edf4ff" stroke="#c8d0e8" stroke-width="2"/><text x="135" y="133" text-anchor="middle" font-size="28" fill="#2f3e7a">Combine</text><rect x="305" y="140" width="185" height="60" rx="8" fill="#f7f9ff" stroke="#c8d0e8" stroke-width="2"/><text x="397" y="179" text-anchor="middle" font-size="28" fill="#2f3e7a">Reduce</text><rect x="780" y="90" width="265" height="70" rx="8" fill="#f7f9ff" stroke="#c8d0e8" stroke-width="2"/><text x="912" y="133" text-anchor="middle" font-size="28" fill="#2f3e7a">Reduce</text><line x1="226" y1="122" x2="774" y2="122" stroke="#2f3e7a" stroke-width="2" marker-end="url(#arrow)"/><rect x="555" y="71" width="152" height="38" rx="8" fill="#fff3e0" stroke="#c8d0e8" stroke-width="2"/><text x="631" y="99" text-anchor="middle" font-size="25" fill="#bd6834">Qua mạng</text><line x1="226" y1="145" x2="300" y2="171" stroke="#2f3e7a" stroke-width="2" marker-end="url(#arrow)"/><text x="269" y="210" text-anchor="middle" font-size="24" fill="#2f3e7a">Cục bộ</text><text x="637" y="190" text-anchor="middle" font-size="26" fill="#bd6834">Góp vào Q</text></svg>
