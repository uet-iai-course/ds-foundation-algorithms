<title id="ex57-title">Đồ thị Hình 5.7: ba trang a, b, c</title>
<desc id="ex57-desc">Ba nút a, b, c. Cạnh có hướng: a tới a, a tới b, a tới c, b tới a, b tới c, c tới b, c tới c — tổng cộng bảy cạnh, gồm hai vòng lặp trên a và trên c.</desc>
