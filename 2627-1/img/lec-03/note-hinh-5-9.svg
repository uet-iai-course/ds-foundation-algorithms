<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc">
<title id="title">Chuỗi nút cụt có khuyên ở đầu</title><desc id="desc">Đồ thị MMDS Hình 5.9: một chuỗi trang 1, 2, 3, …, n từ trái sang phải. Trang 1 có một khuyên về chính nó và một mũi tên tới trang 2; mỗi trang i trỏ tới trang i + 1. Trang n ở cuối, viền nét đứt màu cam, không có mũi tên đi ra.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1000" height="230" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><path d="M66.0,116.0 C30.0,52.0 130.0,52.0 94.0,112.0" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="108.0" y1="140.0" x2="228.0" y2="140.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="288.0" y1="140.0" x2="408.0" y2="140.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="468.0" y1="140.0" x2="588.0" y2="140.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="80.0" cy="140.0" r="28" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="80.0" y="148.6" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold">1</text><circle cx="260.0" cy="140.0" r="28" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="260.0" y="148.6" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold">2</text><circle cx="440.0" cy="140.0" r="28" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="440.0" y="148.6" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold">3</text><text x="620.0" y="150.0" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">…</text><line x1="660.0" y1="140.0" x2="826.0" y2="140.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="870.0" cy="140.0" r="28" fill="#fff4e9" stroke="#a85b23" stroke-width="3" stroke-dasharray="6 4"/><text x="870.0" y="148.6" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold">n</text><text x="870.0" y="205.0" font-size="17" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">không có cạnh ra</text></g></svg>
