<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="tp-title tp-desc">
<title id="tp-title">Hai cách chọn trang tiếp theo</title>
<desc id="tp-desc">Từ trang hiện tại, nhánh xác suất beta chọn một đích liên kết; nhánh một trừ beta chọn đều một trang bất kỳ.</desc>
<rect x="30" y="125" width="180" height="90" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/>
    <text x="120" y="179" text-anchor="middle" font-size="26" fill="#2f3e7a">Trang hiện tại</text>
    <path d="M210,150 L360,65 L450,65" fill="none" stroke="#2f3e7a" stroke-width="3"/>
    <polygon points="460,65 446,58 446,72" fill="#2f3e7a"/>
    <path d="M210,195 L360,275 L450,275" fill="none" stroke="#cc6b32" stroke-width="3" stroke-dasharray="9,6"/>
    <polygon points="460,275 446,268 446,282" fill="#cc6b32"/>
    <text x="330" y="42" text-anchor="middle" font-size="30" fill="#2f3e7a">β</text>
    <text x="330" y="322" text-anchor="middle" font-size="30" fill="#cc6b32">1 − β</text>
    <rect x="460" y="20" width="310" height="90" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/>
    <text x="615" y="74" text-anchor="middle" font-size="28" fill="#2f3e7a">Một đích liên kết</text>
    <rect x="460" y="230" width="310" height="90" rx="12" fill="#fff3e0" stroke="#cc6b32" stroke-width="3"/>
    <text x="615" y="284" text-anchor="middle" font-size="28" fill="#cc6b32">Một trang bất kỳ</text>
</svg>
