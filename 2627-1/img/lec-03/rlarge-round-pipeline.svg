<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 345" role="img" aria-labelledby="t d" font-family="Arial,sans-serif"><title id="t">Các giai đoạn trong một vòng</title><desc id="d">Cùng điểm cũ: tính Map và tổng delta; Combine trước khi chuyển và nhóm theo khóa; Reduce; tính độ thay đổi, dừng hoặc dùng điểm mới ở vòng sau.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2f3e7a"/></marker></defs><rect x="20" y="30" width="300" height="95" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="170.0" y="87.5" text-anchor="middle" font-size="29" fill="#2f3e7a">Điểm cũ rᵗ</text><rect x="370" y="30" width="300" height="95" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="520.0" y="87.5" text-anchor="middle" font-size="29" fill="#2f3e7a">Map và tổng δ</text><rect x="720" y="30" width="300" height="95" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="870.0" y="87.5" text-anchor="middle" font-size="29" fill="#2f3e7a">Combine</text><rect x="720" y="220" width="300" height="95" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="870.0" y="277.5" text-anchor="middle" font-size="29" fill="#2f3e7a">Chuyển, nhóm khóa</text><rect x="370" y="220" width="300" height="95" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="520.0" y="277.5" text-anchor="middle" font-size="29" fill="#2f3e7a">Reduce</text><rect x="20" y="220" width="300" height="95" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="170.0" y="277.5" text-anchor="middle" font-size="29" fill="#2f3e7a">Đo Δ; xét vòng tiếp</text><path d="M320,77 L370,77" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arr)"/><path d="M670,77 L720,77" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arr)"/><path d="M870,125 L870,220" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arr)"/><path d="M720,