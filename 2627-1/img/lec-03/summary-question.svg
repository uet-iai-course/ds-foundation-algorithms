<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d" font-family="Arial,sans-serif"><title id="t">Bốn câu hỏi của tình huống một tỷ trang</title><desc id="d">Hộp cam trên cùng: xếp hạng 10 mũ 9 trang, m xấp xỉ 10 mũ 10 liên kết, ma trận đặc 8 nhân 10 mũ 18 byte. Bốn mũi tên xuống bốn hộp câu hỏi: quy tắc chấm điểm nào; hội tụ sau bao nhiêu vòng; lưu và chia việc thế nào; bao nhiêu byte, bao lâu.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#2f3e7a"/></marker><marker id="a0" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0L0,5L10,10Z" fill="#2f3e7a"/></marker></defs><rect x="170" y="20" width="660" height="110" rx="9" fill="#fff3e0" stroke="#bd6834" stroke-width="2"/><text x="500" y="65" text-anchor="middle" font-size="32" font-weight="bold" fill="#bd6834">Xếp hạng 10⁹ trang</text><text x="500" y="108" text-anchor="middle" font-size="27" font-weight="normal" fill="#bd6834">m ≈ 10¹⁰ liên kết; ma trận đặc 8 · 10¹⁸ byte</text><path d="M500,130 L132,235" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="240" width="225" height="120" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="132" y="290" text-anchor="middle" font-size="27" font-weight="normal" fill="#2f3e7a">Quy tắc chấm</text><text x="132" y="328" text-anchor="middle" font-size="27" font-weight="normal" fill="#2f3e7a">điểm nào?</text><path d="M500,130 L377,235" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><rect x="265" y="240" width="225" height="120" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="377" y="290" text-anchor="middle" font-size="27" font-weight="normal" fill="#2f3e7a">Hội tụ sau</text><text x="377" y="328" text-anchor="middle" font-size="27" font-weight="normal" fill="#2f3e7a">bao nhiêu vòng?</text><path d="M500,130 L622,235" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><rect x="510" y="240" width="225" height="120" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="622" y="290" text-anchor="middle" font-size="27" font-weight="normal" fill="#2f3e7a">Lưu và chia</text><text x="622" y="328" text-anchor="middle" font-size="27" font-weight="normal" fill="#2f3e7a">việc thế nào?</text><path d="M500,130 L867,235" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><rect x="755" y="240" width="225" height="120" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="867" y="290" text-anchor="middle" font-size="27" font-weight="normal" fill="#2f3e7a">Bao nhiêu byte,</text><text x="867" y="328" text-anchor="middle" font-size="27" font-weight="normal" fill="#2f3e7a">bao lâu?</text></svg>
