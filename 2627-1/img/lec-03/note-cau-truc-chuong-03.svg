<text x="100.0" y="512.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">liên kết ra</text><line x1="600.0" y1="132.0" x2="298.0" y2="168.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="210.0" y="174.0" width="176.0" height="400.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="298.0" y="210.0" font-size="23" fill="#a85b23" text-anchor="middle" font-weight="bold">Mục 2</text><text x="298.0" y="248.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">Phép lặp</text><text x="298.0" y="275.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">có hội tụ</text><text x="298.0" y="302.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">tới một điểm</text><text x="298.0" y="329.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">duy nhất?</text><line x1="226.0" y1="362.0" x2="370.0" y2="362.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><text x="298.0" y="390.0" font-size="17" fill="#5b6778" text-anchor="middle" font-weight="normal">Khái niệm:</text><text x="298.0" y="422.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">ma trận liên kết,</text><text x="298.0" y="452.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">nút cụt, bẫy,</text><text x="298.0" y="482.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">bước nhảy,</text><text x="298.0" y="512.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">tính co</text><line x1="600.0" y1="132.0" x2="496.0" y2="168.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="408.0" y="174.0" width="176.0" height="400.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="496.0" y="210.0" font-size="23" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Mục 3</text><text x="496.0" y="248.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">Tính một vòng</text><text x="496.0" y="275.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">khi ma trận</text><text x="496.0" y="302.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">không vừa</text><text x="496.0" y="329.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">một máy?</text><line x1="424.0" y1="362.0" x2="568.0" y2="362.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><text x="496.0" y="390.0" font-size="17" fill="#5b6778" text-anchor="middle" font-weight="normal">Khái niệm:</text><text x="496.0" y="422.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">danh sách</text><text x="496.0" y="452.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">liên kết ra,</text><text x="496.0" y="482.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">khối,</text><text x="496.0" y="512.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">MapReduce</text><line x1="600.0" y1="132.0" x2="694.0" y2="168.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="606.0" y="174.0" width="176.0" height="400.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="694.0" y="210.0" font-size="23" fill="#a85b23" text-anchor="middle" font-weight="bold">Mục 4</text><text x="694.0" y="248.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">Một vòng</text><text x="694.0" y="275.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">tốn bao nhiêu?</text><line x1="622.0" y1="362.0" x2="766.0" y2="362.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><text x="694.0" y="390.0" font-size="17" fill="#5b6778" text-anchor="middle" font-weight="normal">Khái niệm:</text><text x="694.0" y="422.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">dung lượng,</text><text x="694.0" y="452.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">bộ nhớ,</text><text x="694.0" y="482.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">dữ liệu,</text><text x="694.0" y="512.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">thời gian</text><line x1="600.0" y1="132.0" x2="892.0" y2="168.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="804.0" y="174.0" width="176.0" height="400.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5" stroke-dasharray="8 6"/><text x="892.0" y="210.0" font-size="23" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Đọc thêm</text><text x="892.0" y="248.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">Xử lý nút cụt</text><text x="892.0" y="275.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">bằng cách</text><text x="892.0" y="302.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">xóa chúng?</text><line x1="820.0" y1="362.0" x2="964.0" y2="362.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><text x="892.0" y="390.0" font-size="17" fill="#5b6778" text-anchor="middle" font-weight="normal">Khái niệm:</text><text x="892.0" y="422.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">loại nút cụt</text><text x="892.0" y="452.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">đệ quy,</text><text x="892.0" y="482.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">khôi phục điểm</text><line x1="600.0" y1="132.0" x2="1090.0" y2="168.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="1002.0" y="174.0" width="176.0" height="400.0" rx="10" fill="#f