<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Cấu trúc của Bài 03</title><desc id="desc">Sơ đồ đọc từ trên xuống. Khối trên cùng là bài toán trung tâm: xếp hạng 10⁹ trang theo cấu trúc liên kết, ma trận đặc cần 8 · 10¹⁸ byte. Sáu mũi tên xuống sáu cột; mỗi cột ghi câu hỏi của phần đó và, dưới đường kẻ đứt, các khái niệm chính. Mục 1: điểm của một trang lấy từ liên kết thế nào; đồ thị web, bậc ra, chia điểm theo liên kết ra. Mục 2: phép lặp có hội tụ tới một điểm duy nhất không; ma trận liên kết, nút cụt, bẫy, bước nhảy, tính co. Mục 3: tính một vòng thế nào khi ma trận không vừa một máy; danh sách liên kết ra, khối, MapReduce. Mục 4: một vòng tốn bao nhiêu; dung lượng, bộ nhớ, dữ liệu, thời gian. Cột đọc thêm, viền nét đứt: xử lý nút cụt bằng cách xóa chúng; loại nút cụt đệ quy, khôi phục điểm. Mục 5: chương trình có cho đúng số tính tay không; pagerank.py, ba lớp kiểm.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="590" fill="#ffffff"/>
