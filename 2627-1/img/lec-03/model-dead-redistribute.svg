<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 395" width="800" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="dr-title dr-desc">
<title id="dr-title">Bù đều cho mọi trang, kể cả nút cụt</title>
<desc id="dr-desc">Điểm gom ở nút cụt được chia theo mô hình tới cả bốn trang A, B, C, D. Mỗi trang nhận beta nhân delta chia n. Mũi tên nét đứt không phải liên kết của đồ thị.</desc>
