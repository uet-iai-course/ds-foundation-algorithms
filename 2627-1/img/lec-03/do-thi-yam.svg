  </g>
  <g font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#2F3E7A" text-anchor="middle"><text x="230" y="215">y</text><text x="620" y="215">a</text><text x="860" y="215">m</text></g>
  <g font-family="Arial, sans-serif" font-size="25" fill="#37474F"><text x="390" y="88">1/2</text><text x="390" y="328">1/2</text><text x="740" y="310">1/2</text><text x="760" y="95">1</text><text x="100" y="108">1/2</text></g>
