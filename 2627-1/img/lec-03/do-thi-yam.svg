    <path d="M270 190 C340 85 515 85 590 190"/>
    <path d="M590 215 C520 315 345 315 270 215"/>
    <path d="M650 215 C720 300 825 280 850 205"/>
    <path d="M845 170 C800 80 700 100 650 180"/>
    <path d="M205 168 C130 70 105 245 198 225"/>
  </g>
  <g fill="#edf4ff" stroke="#2F3E7A" stroke-width="5">
