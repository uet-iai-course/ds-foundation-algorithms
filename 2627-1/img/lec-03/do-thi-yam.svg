<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc">
  <title id="title">Đồ thị liên kết ba nút y, a, m</title>
  <desc id="desc">Đồ thị có hướng: y trỏ đến y và a; a trỏ đến y và m; m trỏ đến a.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#B15A2B"/></marker></defs>
