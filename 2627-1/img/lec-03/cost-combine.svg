<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 330" role="img" aria-labelledby="t d" font-family="Arial,sans-serif"><title id="t">Combine gộp hai đóng góp tại D trong M21</title><desc id="d">A góp một phần mười hai, B góp một phần tám. Combine cùng tác vụ M21 tạo một cặp D,năm phần hai mươi tư.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#2f3e7a"/></marker></defs><text x="410" y="35" text-anchor="middle" font-size="31" fill="#2f3e7a">Trong cùng tác vụ M21</text><rect x="20" y="80" width="255" height="70" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="147.5" y="124.0" text-anchor="middle" font-size="30" fill="#2f3e7a">A → D: (D, 1/12)</text><rect x="20" y="210" width="255" height="70" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="147.5" y="254.0" text-anchor="middle" font-size="30" fill="#2f3e7a">B → D: (D, 1/8)</text><path d="M275,115L510,175" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><path d="M275,245L510,200" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><rect x="510" y="140" width="290" height="100" rx="8" fill="#e8f4ea" stroke="#2f3e7a" stroke-width="2"/><text x="655.0" y="199.0" text-anchor="middle" font-size="30" fill="#2f3e7a">(D, 5/24)</text><text x="650" y="280" text-anchor="middle" font-size="24" fill="#555">Combine: cộng theo khóa</text></svg>