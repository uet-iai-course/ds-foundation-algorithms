<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Jaguar và chủ đề đã xác định</title>
<desc id="desc">Một từ truy vấn có bốn nghĩa. Với đầu vào chủ đề ô tô đã xác định, mục tiêu là ưu tiên trang về xe. Đây là sơ đồ yêu cầu, không phải kết quả tính xếp hạng.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif">
<rect x="15" y="90" width="290" height="165" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="160" y="134" font-size="32" fill="#2F3E7A" text-anchor="middle">Truy vấn: jaguar</text><text x="160" y="186" font-size="30" fill="#2F3E7A" text-anchor="middle">Chủ đề đã biết:</text><text x="160" y="229" font-size="36" fill="#B15A2B" text-anchor="middle">ô tô</text><path d="M310 173L462 55" fill="none" stroke="#8794a6" stroke-width="4"  /><path d="M310 173L462 135" fill="none" stroke="#8794a6" stroke-width="4"  /><path d="M310 173L462 215" fill="none" stroke="#8794a6" stroke-width="4"  /><path d="M310 173L462 295" fill="none" stroke="#8794a6" stroke-width="4"  /><rect x="480" y="20" width="330" height="66" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="645" y="63" font-size="32" fill="#2F3E7A" text-anchor="middle">Loài báo</text><rect x="480" y="100" width="330" height="66" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3" /><text x="645" y="143" font-size="32" fill="#2F3E7A" text-anchor="middle">Ô tô</text><rect x="480" y="180" width="330" height="66" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="645" y="223" font-size="32" fill="#2F3E7A" text-anchor="middle">Hệ điều hành</text><rect x="480" y="260" width="330" height="66" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="645" y="303" font-size="32" fill="#2F3E7A" text-anchor="middle">Máy chơi trò chơi</text><path d="M820 135H887" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)" /><rect x="905" y="70" width="280" height="171" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3" /><text x="1045" y="114" font-size="30" fill="#2F3E7A" text-anchor="middle">Yêu cầu đầu ra</text><text x="1045" y="163" font-size="32" fill="#2F3E7A" text-anchor="middle">Ưu tiên trang</text><text x="1045" y="204" font-size="32" fill="#2F3E7A" text-anchor="middle">về xe</text>
</g>
</svg>
