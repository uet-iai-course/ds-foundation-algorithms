<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Truy vấn jaguar có nhiều nghĩa</title><desc id="desc">Một truy vấn jaguar có thể chỉ loài báo, ô tô, hệ điều hành hoặc máy chơi trò chơi; chủ đề định hướng đầu ra.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="35" y="115" width="250" height="130" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="160" y="171.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Truy vấn</text><text x="160" y="210.5" font-size="32" fill="#2F3E7A" text-anchor="middle">jaguar</text><path d="M290 180 L780 50" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="800" y="17" width="365" height="67" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="982.5" y="61.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Loài báo</text><path d="M290 180 L780 130" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="800" y="97" width="365" height="67" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="982.5" y="141.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Ô tô</text><path d="M290 180 L780 210" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="800" y="177" width="365" height="67" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="982.5" y="221.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Hệ điều hành</text><path d="M290 180 L780 290" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="800" y="257" width="365" height="67" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="982.5" y="301.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Máy chơi trò chơi</text></g>
</svg>
