<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Truy vấn vùng và tinh lọc</title><desc id="desc">Vùng Q giữ nguyên vị trí tương đối trong sơ đồ R-tree của Bài14: Q giao hai hộp bao A và B. Cả hai nhánh tạo ứng viên; cần kiểm đối tượng thật trước khi trả kết quả.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="30" y="30" width="480" height="285" fill="#fff" stroke="#2F3E7A" stroke-width="3"/><rect x="75" y="70" width="245" height="150" fill="none" stroke="#B15A2B" stroke-width="4"/><rect x="215" y="130" width="230" height="130" fill="none" stroke="#2F3E7A" stroke-width="4" stroke-dasharray="10 6"/><rect x="255" y="160" width="70" height="65" fill="#F7EFE6" stroke="#111" stroke-width="3"/><text x="115" y="113" font-size="32" fill="#2F3E7A" text-anchor="middle">A</text><text x="398" y="238" font-size="32" fill="#2F3E7A" text-anchor="middle">B</text><text x="290" y="202" font-size="32" fill="#2F3E7A" text-anchor="middle">Q</text><path d="M515 175 L575 175" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="590" y="110" width="240" height="125" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="710" y="164" font-size="32" fill="#2F3E7A" text-anchor="middle">Ứng viên</text><text x="710" y="203" font-size="32" fill="#2F3E7A" text-anchor="middle">từ A và B</text><path d="M835 175 L895 175" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="910" y="110" width="265" height="125" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="1042.5" y="164" font-size="32" fill="#2F3E7A" text-anchor="middle">Kiểm đối</text><text x="1042.5" y="203" font-size="32" fill="#2F3E7A" text-anchor="middle">tượng thật</text><text x="825" y="307" font-size="28" fill="#37474F" text-anchor="middle">Hộp bao giao Q chưa đủ kết luận</text></g>
</svg>
