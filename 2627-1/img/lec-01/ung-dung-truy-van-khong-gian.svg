<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Tìm đối tượng giao vùng bản đồ</title><desc id="desc">Q là vùng truy vấn, A và B là hộp bao hai nhóm đối tượng. Giữ vị trí tương đối của sơ đồ Bài14. Q giao cả hai hộp bao nên phải kiểm cả hai nhóm; không gán đối tượng kết quả khi chưa kiểm hình thật.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="30" y="30" width="480" height="285" fill="#fff" stroke="#2F3E7A" stroke-width="3"/>
<rect x="75" y="70" width="245" height="150" fill="none" stroke="#B15A2B" stroke-width="4"/>
<rect x="215" y="130" width="230" height="130" fill="none" stroke="#2F3E7A" stroke-width="4" stroke-dasharray="10 6"/>
<rect x="255" y="160" width="70" height="65" fill="#F7EFE6" stroke="#111" stroke-width="3"/><text x="115" y="113" font-size="32" fill="#2F3E7A" text-anchor="middle">A</text><text x="398" y="238" font-size="32" fill="#2F3E7A" text-anchor="middle">B</text><text x="290" y="202" font-size="32" fill="#2F3E7A" text-anchor="middle">Q</text><text x="850" y="60" font-size="34" fill="#2F3E7A" text-anchor="middle">Q: vùng bản đồ được chọn</text><text x="850" y="112" font-size="32" fill="#2F3E7A" text-anchor="middle">A, B: hộp bao hai nhóm đối tượng</text><rect x="565" y="155" width="595" height="115" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="862.5" y="203" font-size="32" fill="#2F3E7A" text-anchor="middle">Q giao cả hai hộp bao</text><text x="862.5" y="244" font-size="32" fill="#2F3E7A" text-anchor="middle">→ kiểm đối tượng trong cả hai nhóm</text><text x="850" y="326" font-size="32" fill="#2F3E7A" text-anchor="middle">Giao hộp bao chưa phải kết quả cuối</text></g>
</svg>
