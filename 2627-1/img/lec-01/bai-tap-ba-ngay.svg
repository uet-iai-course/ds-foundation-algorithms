<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="title desc"><title id="title">Tiêu chuẩn trùng trong ba ngày</title><desc id="desc">Một cặp người phải cùng khách sạn trong từng ngày của một bộ ba ngày khác nhau. Khách sạn có thể khác giữa các ngày. Đây là điều kiện phần c của MMDS1.2.1.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b15a2b"/></marker></defs><g font-family="Arial, sans-serif" font-size="32" fill="#2f3e7a"><rect x="20" y="15" width="350" height="90" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="195" y="71" text-anchor="middle">Một cặp người</text><path d="M374 60h39" stroke="#b15a2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="15" width="350" height="90" rx="12" fill="#f7efe6" stroke="#b15a2b" stroke-width="2"/><text x="595" y="71" text-anchor="middle">Ba ngày khác nhau</text><path d="M774 60h39" stroke="#b15a2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="820" y="15" width="350" height="90" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="995" y="71" text-anchor="middle">Trùng ở cả ba ngày</text></g></svg>
