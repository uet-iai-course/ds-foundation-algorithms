<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="title desc"><title id="title">Trùng trong cả hai ngày đã chọn</title><desc id="desc">Điều kiện yêu cầu cùng cặp người trùng trong ngày s và trong ngày t. Giả thiết độc lập giữa ngày cho phép nhân hai xác suất; hình không gán xác suất cho dữ liệu thực.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b15a2b"/></marker></defs><g font-family="Arial, sans-serif" font-size="32" fill="#2f3e7a"><rect x="20" y="15" width="350" height="90" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="195" y="71" text-anchor="middle">Trùng ngày s</text><path d="M374 60h39" stroke="#b15a2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="15" width="350" height="90" rx="12" fill="#f7efe6" stroke="#b15a2b" stroke-width="2"/><text x="595" y="71" text-anchor="middle">Và trùng ngày t</text><path d="M774 60h39" stroke="#b15a2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="820" y="15" width="350" height="90" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="995" y="50" text-anchor="middle">Mẫu hai ngày</text><text x="995" y="89" text-anchor="middle">thỏa điều kiện</text></g></svg>
