<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Nội dung gần trùng và số cặp phải so sánh</title>
<desc id="desc">Hai trang có các đoạn văn bản giữ nguyên và một phần thay đổi, minh họa định tính chứ không đo độ tương đồng. Bên phải, bốn biểu tượng tài liệu nối bằng đủ sáu đường so sánh không có hướng, minh họa việc xét mọi cặp trong kho.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif">
<text x="270" y="38" font-size="32" fill="#2F3E7A" text-anchor="middle">Bản sao có sửa văn bản</text><rect x="35" y="65" width="205" height="185" rx="12" fill="#fff" stroke="#2F3E7A" stroke-width="3" /><rect x="300" y="65" width="205" height="185" rx="12" fill="#fff" stroke="#2F3E7A" stroke-width="3" /><path d="M60 95H210M325 95H475" fill="none" stroke="#2F3E7A" stroke-width="4"  /><path d="M60 130H210M325 130H475" fill="none" stroke="#2F3E7A" stroke-width="4"  /><path d="M60 165H210M325 165H475" fill="none" stroke="#2F3E7A" stroke-width="4"  /><path d="M60 207H195" stroke-dasharray="12 8" fill="none" stroke="#B15A2B" stroke-width="4"  /><path d="M325 207H475" fill="none" stroke="#B15A2B" stroke-width="4"  stroke-dasharray="12 8"/><text x="270" y="294" font-size="30" fill="#2F3E7A" text-anchor="middle">Nét liền: phần chung</text><text x="270" y="336" font-size="30" fill="#B15A2B" text-anchor="middle">Nét đứt: phần khác</text><text x="910" y="38" font-size="32" fill="#2F3E7A" text-anchor="middle">So sánh mọi cặp trong kho</text><path d="M755 100H1065V280H755V100L1065 280M1065 100L755 280" fill="none" stroke="#8794a6" stroke-width="4"  /><rect x="705" y="60" width="100" height="70" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="755" y="106" font-size="34" fill="#2F3E7A" text-anchor="middle">A</text><rect x="1015" y="60" width="100" height="70" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="1065" y="106" font-size="34" fill="#2F3E7A" text-anchor="middle">B</text><rect x="705" y="235" width="100" height="70" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="755" y="281" font-size="34" fill="#2F3E7A" text-anchor="middle">C</text><rect x="1015" y="235" width="100" height="70" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="1065" y="281" font-size="34" fill="#2F3E7A" text-anchor="middle">D</text><text x="910" y="348" font-size="30" fill="#2F3E7A" text-anchor="middle">Mỗi đường là một cặp</text>
</g>
</svg>
