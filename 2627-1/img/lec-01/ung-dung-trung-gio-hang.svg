<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
<title id="title">So sánh hai lượt mua</title><desc id="desc">Một lượt mua của người thứ nhất được so với một lượt mua của người thứ hai. Mỗi giỏ là một tập mười mặt hàng chọn từ một nghìn mặt hàng; chỉ so người khác nhau.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="25" y="10" width="300" height="90" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="175" y="47" font-size="32" fill="#2F3E7A" text-anchor="middle">Người thứ nhất</text><text x="175" y="85" font-size="32" fill="#2F3E7A" text-anchor="middle">một lượt mua</text><rect x="25" y="140" width="300" height="90" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="175" y="177" font-size="32" fill="#2F3E7A" text-anchor="middle">Người thứ hai</text><text x="175" y="215" font-size="32" fill="#2F3E7A" text-anchor="middle">một lượt mua</text><path d="M330 55L420 55" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 185L420 185" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><rect x="435" y="10" width="330" height="90" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="600" y="66" font-size="32" fill="#2F3E7A" text-anchor="middle">Tập 10 mặt hàng</text><rect x="435" y="140" width="330" height="90" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="600" y="196" font-size="32" fill="#2F3E7A" text-anchor="middle">Tập 10 mặt hàng</text><path d="M770 55L880 100" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><path d="M770 185L880 140" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><rect x="895" y="55" width="280" height="135" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="1035" y="114.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Cùng một tập</text><text x="1035" y="152.5" font-size="32" fill="#2F3E7A" text-anchor="middle">hay khác tập</text></g>
</svg>
