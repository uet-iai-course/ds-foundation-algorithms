<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Liên kết giữa trang và điểm quan trọng</title>
<desc id="desc">Đồ thị có hướng y đến y và a, a đến y và m, m đến a. Tính điểm đọc liên kết và cập nhật nhiều vòng. Điểm của từng trang hỗ trợ sắp kết quả tìm kiếm; không gán điểm hay thứ hạng.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif">
<path d="M162 116Q230 26 310 116" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)" /><path d="M315 185Q230 251 160 185" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)" /><path d="M420 116Q490 26 560 116" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)" /><path d="M565 185Q490 251 415 185" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)" /><path d="M65 117C0 12 0 247 67 182" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)" /><rect x="55" y="113" width="110" height="80" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="110" y="164" font-size="30" fill="#2F3E7A" text-anchor="middle">Trang y</text><rect x="310" y="113" width="110" height="80" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="365" y="164" font-size="30" fill="#2F3E7A" text-anchor="middle">Trang a</text><rect x="565" y="113" width="110" height="80" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="620" y="164" font-size="30" fill="#2F3E7A" text-anchor="middle">Trang m</text><path d="M690 151H807" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)" /><rect x="825" y="65" width="360" height="175" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="1005" y="109" font-size="34" fill="#2F3E7A" text-anchor="middle">Điểm từng trang</text><text x="1005" y="156" font-size="36" fill="#B15A2B" text-anchor="middle">↓</text><text x="1005" y="206" font-size="32" fill="#2F3E7A" text-anchor="middle">Hỗ trợ sắp kết quả</text><rect x="100" y="276" width="1000" height="65" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3" /><text x="600" y="318" font-size="34" fill="#2F3E7A" text-anchor="middle">Đọc liên kết → cập nhật điểm → lặp lại</text>
</g>
</svg>
