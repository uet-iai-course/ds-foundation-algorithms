<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Đồ thị liên kết y, a, m</title><desc id="desc">Đồ thị có hướng: y trỏ đến chính y và a; a trỏ đến y và m; m trỏ đến a. Cần tính một điểm cho mỗi trang, không có điểm xếp hạng được tự gán.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><g fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"><path d="M245 150Q400 15 553 150"/><path d="M550 205Q400 330 245 205"/><path d="M645 150Q800 15 953 150"/><path d="M950 205Q800 330 645 205"/><path d="M150 150C30 15 20 315 151 211"/></g><circle cx="200" cy="180" r="58" fill="#edf4ff" stroke="#2F3E7A" stroke-width="4"/><text x="200" y="194" font-size="44" fill="#2F3E7A" text-anchor="middle">y</text><circle cx="600" cy="180" r="58" fill="#edf4ff" stroke="#2F3E7A" stroke-width="4"/><text x="600" y="194" font-size="44" fill="#2F3E7A" text-anchor="middle">a</text><circle cx="1000" cy="180" r="58" fill="#edf4ff" stroke="#2F3E7A" stroke-width="4"/><text x="1000" y="194" font-size="44" fill="#2F3E7A" text-anchor="middle">m</text><text x="600" y="343" font-size="32" fill="#37474F" text-anchor="middle">Liên kết có hướng → một điểm cho mỗi trang</text></g>
</svg>
