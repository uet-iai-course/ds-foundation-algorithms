<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Xây chỉ mục trước khi phục vụ truy vấn</title><desc id="desc">Kho véc-tơ đi qua bước xây dựng để tạo chỉ mục; nhiều truy vấn dùng chung chỉ mục đã tạo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b15a2b"/></marker></defs><g font-family="Arial, sans-serif"><rect x="20" y="106" width="250" height="112" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="145" y="150" font-size="32" text-anchor="middle" fill="#2f3e7a">Kho véc-tơ</text><text x="145" y="192" font-size="28" text-anchor="middle" fill="#2f3e7a">Dữ liệu đầu vào</text><path d="M 287 162 L 373 162" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><rect x="390" y="106" width="245" height="112" rx="12" fill="#f7efe6" stroke="#2f3e7a" stroke-width="3"/><text x="512" y="150" font-size="34" text-anchor="middle" fill="#2f3e7a">Xây dựng</text><text x="512" y="192" font-size="27" text-anchor="middle" fill="#2f3e7a">Thời gian, bộ nhớ</text><path d="M 650 162 L 735 162" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><rect x="754" y="106" width="210" height="112" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="859" y="174" font-size="34" text-anchor="middle" fill="#2f3e7a">Chỉ mục</text><path d="M 1030 50 L 981 162" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><text x="1050" y="60" font-size="27" text-anchor="start" fill="#2f3e7a">Truy vấn 1</text><path d="M 1030 160 L 981 162" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><text x="1050" y="170" font-size="27" text-anchor="start" fill="#2f3e7a">Truy vấn 2</text><path d="M 1030 270 L 981 162" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><text x="1050" y="280" font-size="27" text-anchor="start" fill="#2f3e7a">Truy vấn 3</text></g></svg>
