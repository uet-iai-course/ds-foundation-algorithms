<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Văn bản phải giải mã nguyên vẹn</title><desc id="desc">Dữ liệu mã cùng thông tin giải mã tạo ra đúng văn bản gốc. Hình không biểu diễn tỷ lệ nén hoặc bộ mã cụ thể.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="35" y="82" width="320" height="160" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="195" y="152.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Văn bản gốc</text><text x="195" y="193.5" font-size="32" fill="#2F3E7A" text-anchor="middle">aabaacabcabcb</text><path d="M360 160L425 160" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><rect x="440" y="82" width="320" height="160" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="600" y="152.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Dữ liệu mã</text><text x="600" y="193.5" font-size="32" fill="#2F3E7A" text-anchor="middle">+ thông tin giải mã</text><path d="M765 160L830 160" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><rect x="845" y="82" width="320" height="160" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="1005" y="152.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Văn bản khôi phục</text><text x="1005" y="193.5" font-size="32" fill="#2F3E7A" text-anchor="middle">aabaacabcabcb</text><text x="390" y="60" font-size="32" fill="#2F3E7A" text-anchor="middle">Nén</text><text x="815" y="60" font-size="32" fill="#2F3E7A" text-anchor="middle">Giải mã</text><text x="600" y="312" font-size="36" fill="#2F3E7A" text-anchor="middle">Khôi phục đúng cả ký hiệu lẫn thứ tự</text></g>
</svg>
