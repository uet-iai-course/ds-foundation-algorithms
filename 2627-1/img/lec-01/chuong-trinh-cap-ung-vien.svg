<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc"><title id="title">Chữ ký và ứng viên</title><desc id="desc">Tập đoạn ký tự được biểu diễn bằng chữ ký; LSH chọn cặp, sau đó kiểm ngưỡng Jaccard. Không biểu diễn xác suất hay số cặp.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b15a2b"/></marker></defs><g font-family="Arial, sans-serif" font-size="32" fill="#2f3e7a"><rect x="20" y="15" width="350" height="90" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="195" y="71" text-anchor="middle">Tập đoạn ký tự</text><path d="M374 60h39" stroke="#b15a2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="15" width="350" height="90" rx="12" fill="#f7efe6" stroke="#b15a2b" stroke-width="2"/><text x="595" y="50" text-anchor="middle">MinHash</text><text x="595" y="89" text-anchor="middle">Chữ ký gọn</text><path d="M774 60h39" stroke="#b15a2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="820" y="15" width="350" height="90" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="995" y="50" text-anchor="middle">LSH</text><text x="995" y="89" text-anchor="middle">Cặp ứng viên</text><rect x="20" y="135" width="350" height="90" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="195" y="191" text-anchor="middle">Cặp được chọn</text><path d="M374 180h39" stroke="#b15a2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="135" width="350" height="90" rx="12" fill="#f7efe6" stroke="#b15a2b" stroke-width="2"/><text x="595" y="191" text-anchor="middle">Tính Jaccard</text><path d="M774 180h39" stroke="#b15a2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="820" y="135" width="350" height="90" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="995" y="170" text-anchor="middle">Kiểm ngưỡng</text><text x="995" y="209" text-anchor="middle">Giữ hoặc loại</text></g></svg>
