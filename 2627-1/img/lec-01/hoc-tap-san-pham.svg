<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="title desc"><title id="title">Sản phẩm học tập từ bài toán cặp gần trùng</title><desc id="desc">Đặc tả nêu tập kết quả; vết chạy và lập luận giải thích thuật toán; cài đặt và chi phí là sản phẩm cần kiểm.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b15a2b"/></marker></defs><g font-family="Arial, sans-serif" font-size="32" fill="#2f3e7a"><rect x="20" y="15" width="350" height="90" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="195" y="50" text-anchor="middle">Đặc tả</text><text x="195" y="89" text-anchor="middle">Cặp đạt ngưỡng</text><path d="M374 60h39" stroke="#b15a2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="15" width="350" height="90" rx="12" fill="#f7efe6" stroke="#b15a2b" stroke-width="2"/><text x="595" y="50" text-anchor="middle">Vết chạy</text><text x="595" y="89" text-anchor="middle">Lập luận đúng</text><path d="M774 60h39" stroke="#b15a2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="820" y="15" width="350" height="90" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="995" y="50" text-anchor="middle">Kiểm mã</text><text x="995" y="89" text-anchor="middle">Phân tích chi phí</text></g></svg>
