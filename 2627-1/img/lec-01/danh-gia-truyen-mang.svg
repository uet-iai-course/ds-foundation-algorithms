<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Đếm tại mỗi máy rồi gửi số đếm</title><desc id="desc">Hai máy giữ văn bản và đếm từ w cục bộ; các số đếm được gửi tới nơi tổng hợp, không gửi toàn bộ văn bản.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b15a2b"/></marker></defs><g font-family="Arial, sans-serif"><rect x="20" y="45" width="360" height="100" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="200" y="86" font-size="32" text-anchor="middle" fill="#2f3e7a">Máy A: văn bản</text><text x="200" y="126" font-size="30" text-anchor="middle" fill="#2f3e7a">Đếm từ w tại chỗ</text><rect x="20" y="190" width="360" height="100" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="200" y="231" font-size="32" text-anchor="middle" fill="#2f3e7a">Máy B: văn bản</text><text x="200" y="271" font-size="30" text-anchor="middle" fill="#2f3e7a">Đếm từ w tại chỗ</text><path d="M 396 94 L 814 136" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><path d="M 396 239 L 814 193" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><text x="600" y="66" font-size="30" text-anchor="middle" fill="#2f3e7a">Gửi số đếm của w</text><text x="600" y="285" font-size="30" text-anchor="middle" fill="#2f3e7a">Gửi số đếm của w</text><rect x="835" y="88" width="345" height="156" rx="12" fill="#f7efe6" stroke="#2f3e7a" stroke-width="3"/><text x="1007" y="140" font-size="34" text-anchor="middle" fill="#2f3e7a">Tổng hợp</text><text x="1007" y="190" font-size="30" text-anchor="middle" fill="#2f3e7a">Đếm trên toàn kho</text></g></svg>
