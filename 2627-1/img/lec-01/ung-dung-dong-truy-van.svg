<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Lấy mẫu truy vấn và lọc thư</title><desc id="desc">Hai dòng đầu vào khác nhau: nhật ký truy vấn phục vụ lấy mẫu theo người dùng; thư đến được kiểm địa chỉ với danh sách cho phép. Không mô tả bộ lọc như quyết định chính xác khi chưa tra lại.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="25" y="25" width="325" height="115" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="187.5" y="73" font-size="32" fill="#2F3E7A" text-anchor="middle">Nhật ký truy vấn</text><text x="187.5" y="114" font-size="32" fill="#2F3E7A" text-anchor="middle">người dùng · truy vấn</text><path d="M355 82L425 82" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><rect x="440" y="25" width="330" height="115" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="605" y="73" font-size="32" fill="#2F3E7A" text-anchor="middle">Mẫu theo người dùng</text><text x="605" y="114" font-size="32" fill="#2F3E7A" text-anchor="middle">giữ lịch sử của họ</text><path d="M775 82L835 82" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><rect x="850" y="25" width="325" height="115" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="1012.5" y="73" font-size="32" fill="#2F3E7A" text-anchor="middle">Đo truy vấn lặp</text><text x="1012.5" y="114" font-size="32" fill="#2F3E7A" text-anchor="middle">trong mẫu</text><path d="M25 180H1175" stroke="#777" stroke-dasharray="8 7" stroke-width="2"/><rect x="25" y="215" width="325" height="115" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="187.5" y="263" font-size="32" fill="#2F3E7A" text-anchor="middle">Thư đến</text><text x="187.5" y="304" font-size="32" fill="#2F3E7A" text-anchor="middle">kèm địa chỉ gửi</text><path d="M355 272L425 272" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><rect x="440" y="215" width="330" height="115" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="605" y="263" font-size="32" fill="#2F3E7A" text-anchor="middle">Danh sách cho phép</text><text x="605" y="304" font-size="32" fill="#2F3E7A" text-anchor="middle">lớn hơn bộ nhớ</text><path d="M775 272L835 272" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><rect x="850" y="215" width="325" height="115" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="1012.5" y="263" font-size="32" fill="#2F3E7A" text-anchor="middle">Chỉ nhận thư từ</text><text x="1012.5" y="304" font-size="32" fill="#2F3E7A" text-anchor="middle">địa chỉ được phép</text></g>
</svg>
