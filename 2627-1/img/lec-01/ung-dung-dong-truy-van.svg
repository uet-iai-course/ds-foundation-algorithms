<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Lấy mẫu và lọc dòng truy vấn</title><desc id="desc">Dòng truy vấn được xử lý khi đến. Nhánh lấy mẫu giữ một mẫu; nhánh bộ lọc chuyển các trường hợp có thể có tới phép tra cứu chính xác.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="25" y="115" width="250" height="125" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="150" y="169" font-size="32" fill="#2F3E7A" text-anchor="middle">Dòng</text><text x="150" y="208" font-size="32" fill="#2F3E7A" text-anchor="middle">truy vấn</text><path d="M280 165 L395 75" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><path d="M280 195 L395 265" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="410" y="25" width="295" height="105" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="557.5" y="88.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Trạng thái mẫu</text><path d="M710 75 L835 75" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="850" y="25" width="325" height="105" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="1012.5" y="88.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Mẫu giữ lại</text><rect x="410" y="210" width="295" height="105" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="557.5" y="273.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Bộ lọc</text><path d="M710 265 L835 265" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="850" y="210" width="325" height="105" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="1012.5" y="273.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Tra cứu chính xác</text><text x="1020" y="186" font-size="30" fill="#B15A2B" text-anchor="middle">“Có thể có”</text></g>
</svg>
