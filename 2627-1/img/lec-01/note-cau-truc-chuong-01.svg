<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" role="img" aria-labelledby="title desc">
<title id="title">Cấu trúc của Bài 01</title><desc id="desc">Sơ đồ đọc từ trên xuống. Khối trên cùng là bài toán trung tâm của Mục 1: trả mọi cặp tài liệu có độ tương đồng Jaccard SIM ≥ τ trong N = 10⁶ tài liệu, tức 499 999 500 000 cặp. Ba mũi tên đi xuống ba cột, mỗi cột ghi số câu hỏi, mục trả lời, nội dung câu hỏi và kết quả chính dưới một đường kẻ đứt. Câu hỏi 1, Mục 2: đo chi phí khi dữ liệu trên đĩa; kết quả: khối, lượt quét, F, 2F, 2mF. Câu hỏi 2, Mục 3.1–3.4: đặc tả R và xét mọi cặp, tính đúng và chi phí; kết quả: N(N−1)L phép so sánh. Câu hỏi 3, Mục 3.5 và 4: giảm số cặp khi nào vẫn đủ; kết quả: R̂ = A ∩ R, đủ khi và chỉ khi R ⊆ A.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="680" height="640" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="20.0" y="14.0" width="640.0" height="132.0" rx="10" fill="#f4f6f9" stroke="#233247" stroke-width="3"/><text x="340.0" y="50.0" font-size="25" fill="#233247" text-anchor="middle" font-weight="bold">Bài toán trung tâm (Mục 1)</text><text x="340.0" y="86.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">Trả mọi cặp tài liệu có SIM ≥ τ</text><text x="340.0" y="120.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">N = 10⁶ tài liệu, 499 999 500 000 cặp</text><line x1="340.0" y1="148.0" x2="115.0" y2="190.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="14.0" y="196.0" width="202.0" height="400.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="115.0" y="232.0" font-size="22" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Câu hỏi 1</text><text x="115.0" y="264.0" font-size="22" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Mục 2</text><text x="115.0" y="310.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">Đo chi phí</text><text x="115.0" y="340.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">khi dữ liệu</text><text x="115.0" y="370.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">trên đĩa</text><line x1="34.0" y1="418.0" x2="196.0" y2="418.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><text x="115.0" y="452.0" font-size="19" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">Kết quả:</text><text x="115.0" y="490.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="bold">khối, lượt quét</text><text x="115.0" y="522.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="bold">F, 2F, 2mF</text><line x1="340.0" y1="148.0" x2="335.0" y2="190.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="234.0" y="196.0" width="202.0" height="400.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="335.0" y="232.0" font-size="22" fill="#a85b23" text-anchor="middle" font-weight="bold">Câu hỏi 2</text><text x="335.0" y="264.0" font-size="22" fill="#a85b23" text-anchor="middle" font-weight="bold">Mục 3.1–3.4</text><text x="335.0" y="310.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">Đặc tả R;</text><text x="335.0" y="340.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">xét mọi cặp</text><text x="335.0" y="370.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">đúng và chi phí</text><line x1="254.0" y1="418.0" x2="416.0" y2="418.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><text x="335.0" y="452.0" font-size="19" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">Kết quả:</text><text x="335.0" y="490.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="bold">N(N−1)L</text><text x="335.0" y="522.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="bold">phép so sánh</text><line x1="340.0" y1="148.0" x2="555.0" y2="190.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="454.0" y="196.0" width="202.0" height="400.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="555.0" y="232.0" font-size="22" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Câu hỏi 3</text><text x="555.0" y="264.0" font-size="22" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Mục 3.5, 4</text><text x="555.0" y="310.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">Giảm số cặp</text><text x="555.0" y="340.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">khi nào</text><text x="555.0" y="370.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">vẫn đủ</text><line x1="474.0" y1="418.0" x2="636.0" y2="418.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><text x="555.0" y="452.0" font-size="19" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">Kết quả:</text><text x="555.0" y="490.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="bold">R̂ = A ∩ R</text><text x="555.0" y="522.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="bold">đủ ⇔ R ⊆ A</text><text x="340.0" y="626.0" font-size="18" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">Mỗi cột: câu hỏi, mục trả lời, kết quả chính</text></g></svg>
