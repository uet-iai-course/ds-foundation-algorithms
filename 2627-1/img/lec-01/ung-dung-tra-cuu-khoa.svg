<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Tra mã và khoảng lương</title><desc id="desc">Truy vấn theo mã tìm hồ sơ tương ứng; truy vấn khoảng lương trả các hồ sơ có giá trị trên một đoạn kín. Không gán mã hoặc mức lương giả.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="30" y="25" width="330" height="125" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="195" y="78" font-size="32" fill="#2F3E7A" text-anchor="middle">Mã giảng viên</text><text x="195" y="119" font-size="32" fill="#2F3E7A" text-anchor="middle">được yêu cầu</text><path d="M365 88L445 88" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><rect x="460" y="25" width="330" height="125" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="625" y="78" font-size="32" fill="#2F3E7A" text-anchor="middle">Bảng hồ sơ</text><text x="625" y="119" font-size="32" fill="#2F3E7A" text-anchor="middle">trên đĩa</text><path d="M795 88L865 88" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><rect x="880" y="25" width="290" height="125" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="1025" y="98.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Hồ sơ đúng mã</text><text x="205" y="236" font-size="32" fill="#2F3E7A" text-anchor="middle">Khoảng lương yêu cầu</text><path d="M425 238H1110" stroke="#2F3E7A" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M575 238H950" stroke="#B15A2B" stroke-width="12"/><circle cx="575" cy="238" r="10" fill="#B15A2B"/><circle cx="950" cy="238" r="10" fill="#B15A2B"/><text x="575" y="291" font-size="32" fill="#2F3E7A" text-anchor="middle">Cận dưới</text><text x="950" y="291" font-size="32" fill="#2F3E7A" text-anchor="middle">Cận trên</text><text x="775" y="339" font-size="32" fill="#2F3E7A" text-anchor="middle">Lấy đủ hồ sơ có lương trong khoảng</text></g>
</svg>
