<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Tra khóa và duy trì chỉ mục</title><desc id="desc">Yêu cầu tra điểm hoặc khoảng dùng chỉ mục để chọn khối cần đọc. Khi dữ liệu thay đổi, chỉ mục cũng phải được cập nhật.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="25" y="70" width="310" height="125" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="180" y="124" font-size="32" fill="#2F3E7A" text-anchor="middle">Tra một khóa</text><text x="180" y="163" font-size="32" fill="#2F3E7A" text-anchor="middle">hoặc một khoảng</text><path d="M340 132 L420 132" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="435" y="70" width="320" height="125" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="595" y="143.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Chỉ mục</text><path d="M760 132 L845 132" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="860" y="70" width="315" height="125" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="1017.5" y="143.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Khối cần đọc</text><path d="M1020 200V275H600V205" fill="none" stroke="#B15A2B" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#arrow)"/><text x="805" y="335" font-size="30" fill="#37474F" text-anchor="middle">Cập nhật dữ liệu → duy trì chỉ mục</text></g>
</svg>
