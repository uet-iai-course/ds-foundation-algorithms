<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Kết nối hai bảng theo mã sinh viên</title><desc id="desc">Hai bảng student và takes trên đĩa được kết nối bằng ID. Bộ nhớ chứa một phần dữ liệu và đầu ra phải gồm mọi cặp khớp khóa.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="25" y="25" width="300" height="110" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="175" y="91" font-size="32" fill="#2F3E7A" text-anchor="middle">Bảng student</text><rect x="25" y="225" width="300" height="110" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="175" y="291" font-size="32" fill="#2F3E7A" text-anchor="middle">Bảng takes</text><path d="M330 80 L470 157" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><path d="M330 280 L470 207" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="485" y="112" width="300" height="135" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="635" y="171" font-size="32" fill="#2F3E7A" text-anchor="middle">Bộ nhớ</text><text x="635" y="210" font-size="32" fill="#2F3E7A" text-anchor="middle">ghép theo ID</text><path d="M790 180 L865 180" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="880" y="112" width="295" height="135" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="1027.5" y="171" font-size="32" fill="#2F3E7A" text-anchor="middle">Mọi cặp</text><text x="1027.5" y="210" font-size="32" fill="#2F3E7A" text-anchor="middle">ID bằng nhau</text></g>
</svg>
