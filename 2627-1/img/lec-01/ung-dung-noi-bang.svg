<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Ghép hồ sơ sinh viên với đăng ký học</title><desc id="desc">Hồ sơ sinh viên và lượt đăng ký cùng mã được ghép để trả thông tin sinh viên kèm từng môn đã đăng ký. Không gán dữ liệu bản ghi mới.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="25" y="25" width="350" height="140" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="200" y="65" font-size="32" fill="#2F3E7A" text-anchor="middle">Hồ sơ sinh viên</text><text x="200" y="106" font-size="32" fill="#2F3E7A" text-anchor="middle">mã · tên</text><text x="200" y="147" font-size="32" fill="#2F3E7A" text-anchor="middle">student: 100 khối</text><rect x="25" y="195" width="350" height="140" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="200" y="235" font-size="32" fill="#2F3E7A" text-anchor="middle">Lượt đăng ký học</text><text x="200" y="276" font-size="32" fill="#2F3E7A" text-anchor="middle">mã sinh viên · mã môn</text><text x="200" y="317" font-size="32" fill="#2F3E7A" text-anchor="middle">takes: 400 khối</text><path d="M385 95L480 151" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><path d="M385 260L480 210" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><rect x="495" y="107" width="260" height="140" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="625" y="147" font-size="32" fill="#2F3E7A" text-anchor="middle">Ghép khi</text><text x="625" y="188" font-size="32" fill="#2F3E7A" text-anchor="middle">cùng mã</text><text x="625" y="229" font-size="32" fill="#2F3E7A" text-anchor="middle">sinh viên</text><path d="M765 180L835 180" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><rect x="850" y="90" width="325" height="180" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="1012.5" y="150" font-size="32" fill="#2F3E7A" text-anchor="middle">Sinh viên kèm</text><text x="1012.5" y="191" font-size="32" fill="#2F3E7A" text-anchor="middle">từng môn</text><text x="1012.5" y="232" font-size="32" fill="#2F3E7A" text-anchor="middle">đã đăng ký</text></g>
</svg>
