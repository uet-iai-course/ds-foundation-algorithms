<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Độ tương đồng Jaccard</title><desc id="desc">Hai phần tử chỉ thuộc S, ba phần tử chung, ba phần tử chỉ thuộc T. Giao có ba phần tử, hợp có tám.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b15a2b"/></marker></defs><g font-family="Arial, sans-serif"><ellipse cx="470" cy="170" rx="240" ry="125" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><ellipse cx="730" cy="170" rx="240" ry="125" fill="#f7efe6" fill-opacity=".55" stroke="#b15a2b" stroke-width="3"/><text x="320" y="58" font-size="36" text-anchor="middle" fill="#2f3e7a">S</text><text x="880" y="58" font-size="36" text-anchor="middle" fill="#2f3e7a">T</text><circle cx="360" cy="125" r="13" fill="#2f3e7a"/><circle cx="360" cy="215" r="13" fill="#2f3e7a"/><circle cx="600" cy="100" r="13" fill="#2f3e7a"/><circle cx="600" cy="170" r="13" fill="#2f3e7a"/><circle cx="600" cy="240" r="13" fill="#2f3e7a"/><circle cx="840" cy="105" r="13" fill="#2f3e7a"/><circle cx="840" cy="170" r="13" fill="#2f3e7a"/><circle cx="840" cy="235" r="13" fill="#2f3e7a"/><text x="85" y="138" font-size="34" text-anchor="middle" fill="#2f3e7a">2 riêng</text><text x="1100" y="138" font-size="34" text-anchor="middle" fill="#2f3e7a">3 riêng</text><text x="600" y="319" font-size="34" text-anchor="middle" fill="#2f3e7a">3 chung</text></g></svg>
