<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Sắp xếp tệp vượt bộ nhớ</title><desc id="desc">Hai tệp có cùng các bản ghi với thứ tự khóa trước và sau khi sắp. Bộ nhớ chỉ chứa một phần tệp. Vạch ngang biểu diễn thứ tự tương đối, không gán dữ liệu số.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="35" y="30" width="355" height="230" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><rect x="810" y="30" width="355" height="230" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="212" y="75" font-size="32" fill="#2F3E7A" text-anchor="middle">Tệp chưa sắp</text><text x="987" y="75" font-size="32" fill="#2F3E7A" text-anchor="middle">Tệp theo khóa tăng</text><path d="M110 108h170" stroke="#2F3E7A" stroke-width="9"/><path d="M110 137h75" stroke="#2F3E7A" stroke-width="9"/><path d="M110 166h135" stroke="#2F3E7A" stroke-width="9"/><path d="M110 195h105" stroke="#2F3E7A" stroke-width="9"/><path d="M110 224h135" stroke="#2F3E7A" stroke-width="9"/><path d="M890 108h75" stroke="#2F3E7A" stroke-width="9"/><path d="M890 137h105" stroke="#2F3E7A" stroke-width="9"/><path d="M890 166h135" stroke="#2F3E7A" stroke-width="9"/><path d="M890 195h135" stroke="#2F3E7A" stroke-width="9"/><path d="M890 224h170" stroke="#2F3E7A" stroke-width="9"/><path d="M400 133L480 133" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><rect x="495" y="73" width="210" height="130" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="600" y="149" font-size="32" fill="#2F3E7A" text-anchor="middle">Sắp xếp</text><path d="M710 133L795 133" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><text x="600" y="319" font-size="35" fill="#2F3E7A" text-anchor="middle">Bộ nhớ chỉ chứa một phần tệp; đọc và ghi theo khối</text></g>
</svg>
