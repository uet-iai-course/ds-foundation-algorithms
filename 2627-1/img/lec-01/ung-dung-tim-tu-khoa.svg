<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Chỉ mục từ khóa</title><desc id="desc">Từ khóa được ánh xạ qua từ điển tới danh sách mã tài liệu chứa từ. Kết hợp điều kiện bằng giao hoặc hợp các danh sách.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="25" y="110" width="250" height="125" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="150" y="183.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Từ khóa</text><rect x="325" y="110" width="250" height="125" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="450" y="183.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Từ điển</text><rect x="625" y="110" width="250" height="125" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="750" y="164" font-size="32" fill="#2F3E7A" text-anchor="middle">Danh sách</text><text x="750" y="203" font-size="32" fill="#2F3E7A" text-anchor="middle">mã tài liệu</text><rect x="925" y="110" width="250" height="125" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="1050" y="164" font-size="32" fill="#2F3E7A" text-anchor="middle">Tài liệu</text><text x="1050" y="203" font-size="32" fill="#2F3E7A" text-anchor="middle">thỏa điều kiện</text><path d="M278 172 L318 172" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><path d="M578 172 L618 172" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><path d="M878 172 L918 172" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><text x="600" y="310" font-size="30" fill="#37474F" text-anchor="middle">Điều kiện đồng thời: giao; điều kiện hoặc: hợp</text></g>
</svg>
