<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Thống kê người dùng và cửa sổ</title><desc id="desc">Nhật ký có người dùng trở lại; cửa sổ chỉ giữ ảnh hưởng của các lượt truy cập gần đây. Hình không gán dữ liệu đếm hoặc độ dài thời gian mới.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><text x="600" y="35" font-size="34" fill="#2F3E7A" text-anchor="middle">Nhật ký: mỗi lượt có mã người dùng và thời điểm</text><path d="M55 133H1140" stroke="#2F3E7A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="485" y="62" width="600" height="126" rx="10" fill="#F7EFE6" fill-opacity=".65" stroke="#B15A2B" stroke-width="3"/>
<path d="M485 48V209" stroke="#B15A2B" stroke-width="3" stroke-dasharray="7 6"/><circle cx="105" cy="133" r="13" fill="#777"/><circle cx="220" cy="133" r="13" fill="#777"/><circle cx="335" cy="133" r="13" fill="#777"/><circle cx="550" cy="133" r="13" fill="#2F3E7A"/><circle cx="665" cy="133" r="13" fill="#2F3E7A"/><circle cx="780" cy="133" r="13" fill="#2F3E7A"/><circle cx="895" cy="133" r="13" fill="#2F3E7A"/><circle cx="1010" cy="133" r="13" fill="#2F3E7A"/><text x="225" y="95" font-size="32" fill="#2F3E7A" text-anchor="middle">Các lượt quá cũ</text><text x="785" y="96" font-size="32" fill="#2F3E7A" text-anchor="middle">Các lượt trong cửa sổ gần đây</text><text x="1080" y="227" font-size="32" fill="#2F3E7A" text-anchor="middle">Hiện tại</text><rect x="35" y="254" width="525" height="85" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="297.5" y="307.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Số người: nhận ra lần quay lại</text><rect x="600" y="254" width="565" height="85" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="882.5" y="307.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Số lượt: loại ảnh hưởng quá cũ</text></g>
</svg>
