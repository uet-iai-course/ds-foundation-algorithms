<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Bốn yêu cầu thống kê trên dòng</title><desc id="desc">Cùng một dòng có thể được dùng để đếm khóa khác nhau, tần suất, mômen hoặc sự kiện gần đây. Cửa sổ chỉ lấy dữ liệu sau mốc.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><path d="M40 75H1150" stroke="#2F3E7A" stroke-width="4" marker-end="url(#arrow)"/><path d="M520 25V120" stroke="#37474F" stroke-dasharray="8 6" stroke-width="3"/><text x="260" y="45" font-size="32" fill="#2F3E7A" text-anchor="middle">Quá khứ</text><text x="790" y="45" font-size="32" fill="#2F3E7A" text-anchor="middle">Phần trong cửa sổ</text><text x="520" y="153" font-size="28" fill="#37474F" text-anchor="middle">Mốc cửa sổ</text><rect x="25" y="220" width="250" height="105" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="150" y="264" font-size="32" fill="#2F3E7A" text-anchor="middle">Số khóa</text><text x="150" y="303" font-size="32" fill="#2F3E7A" text-anchor="middle">khác nhau</text><rect x="325" y="220" width="250" height="105" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="450" y="264" font-size="32" fill="#2F3E7A" text-anchor="middle">Tần suất</text><text x="450" y="303" font-size="32" fill="#2F3E7A" text-anchor="middle">một khóa</text><rect x="625" y="220" width="250" height="105" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="750" y="264" font-size="32" fill="#2F3E7A" text-anchor="middle">Mômen</text><text x="750" y="303" font-size="32" fill="#2F3E7A" text-anchor="middle">tần suất</text><rect x="925" y="220" width="250" height="105" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="1050" y="264" font-size="32" fill="#2F3E7A" text-anchor="middle">Sự kiện</text><text x="1050" y="303" font-size="32" fill="#2F3E7A" text-anchor="middle">gần đây</text></g>
</svg>
