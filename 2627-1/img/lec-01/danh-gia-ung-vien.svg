<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Ứng viên và hậu kiểm</title><desc id="desc">Một bộ lọc chọn ứng viên từ miền cặp; kiểm chính xác loại cặp không đạt ngưỡng trong ứng viên. Cặp đạt ngưỡng bị loại trước đó vẫn bị thiếu.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b15a2b"/></marker></defs><g font-family="Arial, sans-serif"><rect x="15" y="53" width="250" height="110" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="140" y="96" font-size="32" text-anchor="middle" fill="#2f3e7a">Toàn bộ</text><text x="140" y="136" font-size="32" text-anchor="middle" fill="#2f3e7a">các cặp</text><path d="M 280 106 L 389 106" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><text x="333" y="52" font-size="30" text-anchor="middle" fill="#2f3e7a">Chọn</text><rect x="411" y="53" width="235" height="110" rx="12" fill="#f7efe6" stroke="#2f3e7a" stroke-width="3"/><text x="528" y="120" font-size="34" text-anchor="middle" fill="#2f3e7a">Ứng viên</text><path d="M 663 106 L 770 106" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><rect x="791" y="53" width="390" height="110" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="986" y="98" font-size="32" text-anchor="middle" fill="#2f3e7a">Kiểm tra chính xác</text><text x="986" y="138" font-size="29" text-anchor="middle" fill="#2f3e7a">Chỉ trả cặp đạt ngưỡng</text><path d="M 333 126 L 333 231" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><rect x="160" y="246" width="710" height="66" rx="12" fill="#fff" stroke="#2f3e7a" stroke-width="3" stroke-dasharray="9 7"/><text x="515" y="289" font-size="30" text-anchor="middle" fill="#2f3e7a">Cặp không được chọn: không được kiểm lại</text></g></svg>
