<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Năm mạch của học phần</title><desc id="desc">Bài01 là nền chung. Năm nhóm bài liên tiếp:2–4 phân tán và xếp hạng;5–7 tương đồng và hàng xóm gần;8–9 dòng và cửa sổ;10–11 nén;12–15 lưu trữ, chỉ mục và kết nối. Các nhánh là nhóm chủ đề, không phải toàn bộ quan hệ tiên quyết.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="20" y="230" width="330" height="150" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="185" y="277" font-size="36" fill="#2F3E7A" text-anchor="middle">Bài 01</text><text x="185" y="316" font-size="36" fill="#2F3E7A" text-anchor="middle">Đầu ra · tài nguyên</text><text x="185" y="355" font-size="36" fill="#2F3E7A" text-anchor="middle">bảo đảm</text><path d="M355 305 L620 65" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="640" y="15" width="535" height="100" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="907.5" y="56.5" font-size="36" fill="#2F3E7A" text-anchor="middle">Bài 02–04</text><text x="907.5" y="95.5" font-size="36" fill="#2F3E7A" text-anchor="middle">Phân tán và xếp hạng</text><path d="M355 305 L620 185" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="640" y="135" width="535" height="100" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="907.5" y="176.5" font-size="36" fill="#2F3E7A" text-anchor="middle">Bài 05–07</text><text x="907.5" y="215.5" font-size="36" fill="#2F3E7A" text-anchor="middle">Tương đồng và tìm gần</text><path d="M355 305 L620 305" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="640" y="255" width="535" height="100" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="907.5" y="296.5" font-size="36" fill="#2F3E7A" text-anchor="middle">Bài 08–09</text><text x="907.5" y="335.5" font-size="36" fill="#2F3E7A" text-anchor="middle">Dòng và cửa sổ</text><path d="M355 305 L620 425" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="640" y="375" width="535" height="100" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="907.5" y="416.5" font-size="36" fill="#2F3E7A" text-anchor="middle">Bài 10–11</text><text x="907.5" y="455.5" font-size="36" fill="#2F3E7A" text-anchor="middle">Nén và khôi phục</text><path d="M355 305 L620 545" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="640" y="495" width="535" height="100" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="907.5" y="536.5" font-size="36" fill="#2F3E7A" text-anchor="middle">Bài 12–15</text><text x="907.5" y="575.5" font-size="36" fill="#2F3E7A" text-anchor="middle">Lưu trữ và truy vấn</text></g>
</svg>
