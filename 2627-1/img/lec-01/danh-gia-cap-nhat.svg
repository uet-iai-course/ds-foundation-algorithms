<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Cập nhật bản ghi và chỉ mục theo lương</title><desc id="desc">Lương mới phải được phản ánh trong bản ghi giảng viên và chỉ mục theo lương; truy vấn dùng hai cấu trúc nhất quán.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b15a2b"/></marker></defs><g font-family="Arial, sans-serif"><rect x="25" y="108" width="300" height="115" rx="12" fill="#f7efe6" stroke="#2f3e7a" stroke-width="3"/><text x="175" y="152" font-size="32" text-anchor="middle" fill="#2f3e7a">Thay đổi lương</text><text x="175" y="195" font-size="30" text-anchor="middle" fill="#2f3e7a">Một giảng viên</text><path d="M 344 154 L 465 90" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><path d="M 344 177 L 465 251" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><rect x="490" y="35" width="365" height="100" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="672" y="78" font-size="32" text-anchor="middle" fill="#2f3e7a">Bản ghi gốc</text><text x="672" y="116" font-size="30" text-anchor="middle" fill="#2f3e7a">Lưu lương mới</text><rect x="490" y="203" width="365" height="100" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="672" y="246" font-size="32" text-anchor="middle" fill="#2f3e7a">Chỉ mục theo lương</text><text x="672" y="284" font-size="30" text-anchor="middle" fill="#2f3e7a">Sửa mục chỉ dẫn</text><path d="M 870 84 L 996 145" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><path d="M 870 252 L 996 185" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><rect x="1015" y="106" width="170" height="112" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="1100" y="152" font-size="30" text-anchor="middle" fill="#2f3e7a">Tra cứu</text><text x="1100" y="192" font-size="28" text-anchor="middle" fill="#2f3e7a">nhất quán</text></g></svg>
