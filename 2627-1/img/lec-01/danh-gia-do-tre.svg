<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Độ trễ một truy vấn véc-tơ</title><desc id="desc">Khoảng từ nhận truy vấn tới trả kết quả bao gồm chờ, truy cập dữ liệu và tính toán. Sơ đồ không biểu diễn thời gian đo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b15a2b"/></marker></defs><g font-family="Arial, sans-serif"><text x="35" y="50" font-size="32" text-anchor="start" fill="#2f3e7a">Nhận truy vấn</text><text x="1160" y="50" font-size="32" text-anchor="end" fill="#2f3e7a">Trả k kết quả</text><rect x="20" y="98" width="266" height="96" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="153" y="156" font-size="32" text-anchor="middle" fill="#2f3e7a">Chờ xử lý</text><path d="M 290 146 L 310 146" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><rect x="320" y="98" width="266" height="96" rx="12" fill="#f7efe6" stroke="#2f3e7a" stroke-width="3"/><text x="453" y="156" font-size="32" text-anchor="middle" fill="#2f3e7a">Truy cập</text><path d="M 590 146 L 610 146" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><rect x="620" y="98" width="266" height="96" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="753" y="156" font-size="29" text-anchor="middle" fill="#2f3e7a">Tính khoảng cách</text><path d="M 890 146 L 910 146" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><rect x="920" y="98" width="266" height="96" rx="12" fill="#f7efe6" stroke="#2f3e7a" stroke-width="3"/><text x="1053" y="156" font-size="32" text-anchor="middle" fill="#2f3e7a">Trả lời</text><path d="M30 228V259H1170V228" fill="none" stroke="#2f3e7a" stroke-width="3"/><text x="600" y="310" font-size="34" text-anchor="middle" fill="#2f3e7a">Độ trễ: từ lúc nhận đến lúc trả</text></g></svg>
