<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Cụm liên kết hỗ trợ trang đích</title><desc id="desc">Các trang có thể tác động trỏ đến trang đích t. Trang t trỏ đến từng trang hỗ trợ và mỗi trang hỗ trợ trỏ lại t. Các trang ngoài tầm tác động không có liên kết bị tự thêm.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
