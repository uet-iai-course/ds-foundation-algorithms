<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Cụm liên kết do cùng một bên kiểm soát</title>
<desc id="desc">Giữ ba nhóm trong MMDS Hình 5.16. Nhóm ngoài tầm tác động không có cạnh tự thêm. Nhóm có thể đặt liên kết trỏ tới t. Nhóm cùng bên kiểm soát chứa t và các trang hỗ trợ; t trỏ đến mỗi hỗ trợ, mỗi hỗ trợ trỏ lại t. Các liên kết có thể đẩy điểm t.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif">
<rect x="10" y="105" width="260" height="180" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="140" y="155" font-size="30" fill="#2F3E7A" text-anchor="middle">Trang ngoài</text><text x="140" y="196" font-size="30" fill="#2F3E7A" text-anchor="middle">tầm tác động</text><text x="140" y="244" font-size="30" fill="#2F3E7A" text-anchor="middle">của bên tạo rác</text><rect x="290" y="105" width="270" height="180" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="425" y="151" font-size="30" fill="#2F3E7A" text-anchor="middle">Trang cho phép</text><text x="425" y="192" font-size="30" fill="#2F3E7A" text-anchor="middle">bên tạo rác</text><text x="425" y="233" font-size="30" fill="#2F3E7A" text-anchor="middle">đặt liên kết</text><rect x="630" y="15" width="555" height="300" rx="12" fill="#fffaf5" stroke="#B15A2B" stroke-width="3" stroke-dasharray="10 7"/><text x="908" y="58" font-size="32" fill="#2F3E7A" text-anchor="middle">Cùng một bên kiểm soát</text><path d="M565 196H699" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)" /><path d="M786 177L992 100" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)" /><path d="M992 120L786 207" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)" /><rect x="1005" y="80" width="155" height="60" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="1082" y="120" font-size="30" fill="#2F3E7A" text-anchor="middle">Hỗ trợ</text><path d="M786 177L992 185" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)" /><path d="M992 205L786 207" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)" /><rect x="1005" y="165" width="155" height="60" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="1082" y="205" font-size="30" fill="#2F3E7A" text-anchor="middle">Hỗ trợ</text><path d="M786 177L992 265" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)" /><path d="M992 285L786 207" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)" /><rect x="1005" y="245" width="155" height="60" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="1082" y="285" font-size="30" fill="#2F3E7A" text-anchor="middle">Hỗ trợ</text><circle cx="745" cy="195" r="40" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/><text x="745" y="207" font-size="38" fill="#2F3E7A" text-anchor="middle">t</text><text x="745" y="280" font-size="30" fill="#2F3E7A" text-anchor="middle">Trang đích</text><text x="600" y="352" font-size="32" fill="#B15A2B" text-anchor="middle">Liên kết cùng nguồn tạo có thể đẩy điểm trang đích</text>
</g>
</svg>
