<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Số phép thử tạo nhiều dương tính giả</title>
  <desc id="desc">Số cặp người nhân số cặp ngày nhân xác suất trùng ngẫu nhiên cho kỳ vọng khoảng 250 nghìn biến cố trùng dù dữ liệu hoàn toàn ngẫu nhiên.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#2f3e7a"/></marker></defs>
  <rect width="1100" height="430" rx="22" fill="#fffdf9"/>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="45" y="105" width="260" height="140" rx="16" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/>
    <text x="175" y="155" font-size="25" font-weight="700" fill="#263238">Cặp người</text>
    <text x="175" y="205" font-size="31" fill="#2f3e7a">C(10⁹, 2)</text>
    <text x="335" y="185" font-size="36" fill="#263238">×</text>
    <rect x="375" y="105" width="260" height="140" rx="16" fill="#eef7ee" stroke="#2e7d32" stroke-width="4" stroke-dasharray="10 7"/>
    <text x="505" y="155" font-size="25" font-weight="700" fill="#263238">Cặp ngày</text>
    <text x="505" y="205" font-size="31" fill="#2e7d32">C(1000, 2)</text>
    <text x="665" y="185" font-size="36" fill="#263238">×</text>
    <rect x="705" y="105" width="260" height="140" rx="16" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/>
    <text x="835" y="155" font-size="25" font-weight="700" fill="#263238">Xác suất mỗi phép thử</text>
    <text x="835" y="205" font-size="31" fill="#b15a2b">10⁻¹⁸</text>
    <path d="M505 268v58" stroke="#2f3e7a" stroke-width="6" marker-end="url(#a)"/>
    <rect x="330" y="335" width="350" height="70" rx="16" fill="#2f3e7a"/>
    <text x="505" y="380" font-size="30" font-weight="700" fill="white">E[X] ≈ 250.000</text>
    <text x="880" y="375" font-size="23" fill="#263238">dữ liệu ngẫu nhiên</text>
  </g>
</svg>
