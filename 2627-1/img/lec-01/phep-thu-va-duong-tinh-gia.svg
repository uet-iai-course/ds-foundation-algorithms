<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
<title id="title">Phép thử trùng khách sạn</title><desc id="desc">Một cặp người và một cặp ngày xác định một phép thử. Hai người cùng khách sạn trong từng ngày; khách sạn có thể khác giữa hai ngày.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="25" y="10" width="300" height="85" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="175" y="63.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Một cặp người</text><rect x="25" y="145" width="300" height="85" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="175" y="198.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Một cặp ngày</text><path d="M330 52L470 105" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 187L470 135" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><rect x="485" y="55" width="350" height="135" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="660" y="114.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Cùng khách sạn</text><text x="660" y="152.5" font-size="32" fill="#2F3E7A" text-anchor="middle">trong từng ngày</text><path d="M840 122L900 122" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><rect x="915" y="55" width="260" height="135" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="1045" y="114.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Một biến cố</text><text x="1045" y="152.5" font-size="32" fill="#2F3E7A" text-anchor="middle">trùng</text></g>
</svg>
