<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc"><title id="title">Hai biến thể độc lập của quy mô quan sát</title><desc id="desc">Phần a tăng thời gian lên 2000 ngày. Phần b tăng lên 2 tỷ người và 200 000 khách sạn. Mỗi nhánh bắt đầu từ mô hình gốc, các tham số không nêu giữ nguyên; hình không cho kết quả kỳ vọng.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b15a2b"/></marker></defs><g font-family="Arial, sans-serif" font-size="32" fill="#2f3e7a"><rect x="20" y="15" width="350" height="90" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="195" y="71" text-anchor="middle">Mô hình gốc</text><path d="M374 60h39" stroke="#b15a2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="15" width="350" height="90" rx="12" fill="#f7efe6" stroke="#b15a2b" stroke-width="2"/><text x="595" y="50" text-anchor="middle">Phần (a)</text><text x="595" y="89" text-anchor="middle">Tăng số ngày</text><path d="M774 60h39" stroke="#b15a2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="820" y="15" width="350" height="90" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="995" y="71" text-anchor="middle">2000 ngày</text><rect x="20" y="135" width="350" height="90" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="195" y="191" text-anchor="middle">Mô hình gốc</text><path d="M374 180h39" stroke="#b15a2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="135" width="350" height="90" rx="12" fill="#f7efe6" stroke="#b15a2b" stroke-width="2"/><text x="595" y="170" text-anchor="middle">Phần (b)</text><text x="595" y="209" text-anchor="middle">Tăng số người</text><path d="M774 180h39" stroke="#b15a2b" stroke-width="3" marker-end="url(#arrow)"/><rect x="820" y="135" width="350" height="90" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="995" y="170" text-anchor="middle">2 tỷ người</text><text x="995" y="209" text-anchor="middle">200 000 khách sạn</text></g></svg>
