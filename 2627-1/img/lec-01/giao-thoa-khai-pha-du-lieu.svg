<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Ba miền tạo nên khai phá dữ liệu quy mô lớn</title>
  <desc id="desc">Ba vòng có nhãn Lý thuyết và giải thuật, Học máy, Hệ thống xử lý dữ liệu giao nhau tại Khai phá dữ liệu quy mô lớn. Hoa văn khác nhau giúp phân biệt mà không chỉ dựa vào màu.</desc>
  <defs>
    <pattern id="p1" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 14L14 0" stroke="#2f3e7a" stroke-width="2"/></pattern>
    <pattern id="p2" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="2.5" fill="#2e7d32"/></pattern>
    <pattern id="p3" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 7h14" stroke="#b15a2b" stroke-width="2"/></pattern>
  </defs>
  <rect width="1000" height="520" rx="22" fill="#fffdf9"/>
  <circle cx="390" cy="220" r="175" fill="#dfe8ff" fill-opacity=".78" stroke="#2f3e7a" stroke-width="5"/>
  <circle cx="610" cy="220" r="175" fill="#e2f3e4" fill-opacity=".78" stroke="#2e7d32" stroke-width="5" stroke-dasharray="14 7"/>
  <circle cx="500" cy="350" r="155" fill="#f6e4d5" fill-opacity=".78" stroke="#b15a2b" stroke-width="5" stroke-dasharray="4 6"/>
  <circle cx="390" cy="220" r="175" fill="url(#p1)" fill-opacity=".32"/>
  <circle cx="610" cy="220" r="175" fill="url(#p2)" fill-opacity=".38"/>
  <circle cx="500" cy="350" r="155" fill="url(#p3)" fill-opacity=".30"/>
  <text x="285" y="130" font-family="sans-serif" font-size="28" text-anchor="middle" font-weight="700" fill="#263238">Lý thuyết</text>
  <text x="285" y="166" font-family="sans-serif" font-size="28" text-anchor="middle" font-weight="700" fill="#263238">và giải thuật</text>
  <text x="715" y="145" font-family="sans-serif" font-size="28" text-anchor="middle" font-weight="700" fill="#263238">Học máy</text>
  <text x="500" y="430" font-family="sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#263238">Hệ thống xử lý dữ liệu</text>
  <rect x="350" y="240" width="300" height="86" rx="18" fill="#fff" stroke="#263238" stroke-width="4"/>
  <text x="500" y="276" font-family="sans-serif" font-size="25" text-anchor="middle" font-weight="700" fill="#263238">Khai phá dữ liệu</text>
  <text x="500" y="309" font-family="sans-serif" font-size="25" text-anchor="middle" font-weight="700" fill="#263238">quy mô lớn</text>
</svg>
