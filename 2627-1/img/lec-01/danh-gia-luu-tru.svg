<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Lưu văn bản nén và khôi phục</title><desc id="desc">Mã và thông tin giải mã cần lưu tạo thành bản lưu; khi giải mã phải khôi phục nguyên văn bản.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b15a2b"/></marker></defs><g font-family="Arial, sans-serif"><rect x="20" y="102" width="270" height="115" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="155" y="152" font-size="32" text-anchor="middle" fill="#2f3e7a">Văn bản gốc</text><text x="155" y="193" font-size="30" text-anchor="middle" fill="#2f3e7a">Cần giữ nguyên</text><path d="M 308 160 L 422 160" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><text x="360" y="116" font-size="30" text-anchor="middle" fill="#2f3e7a">Nén</text><rect x="446" y="40" width="410" height="252" rx="12" fill="#fff" stroke="#2f3e7a" stroke-width="3"/><text x="651" y="79" font-size="34" text-anchor="middle" fill="#2f3e7a">Bản lưu</text><rect x="469" y="101" width="364" height="65" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="651" y="145" font-size="32" text-anchor="middle" fill="#2f3e7a">Dòng mã</text><rect x="469" y="188" width="364" height="65" rx="12" fill="#f7efe6" stroke="#2f3e7a" stroke-width="3"/><text x="651" y="229" font-size="30" text-anchor="middle" fill="#2f3e7a">Thông tin giải mã</text><path d="M 874 160 L 981 160" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><text x="928" y="112" font-size="27" text-anchor="middle" fill="#2f3e7a">Giải mã</text><rect x="1003" y="102" width="181" height="115" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="1093" y="150" font-size="30" text-anchor="middle" fill="#2f3e7a">Văn bản</text><text x="1093" y="192" font-size="28" text-anchor="middle" fill="#2f3e7a">khôi phục</text></g></svg>
