<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
<title id="title">Tệp bản ghi không vừa bộ nhớ</title>
<desc id="desc">Kho bản ghi trên đĩa có nhiều phần; bộ nhớ chính chỉ chứa được một phần. Mũi tên nạp toàn bộ bị chặn, không biểu diễn một thuật toán đã giải xong.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif">
<rect x="10" y="10" width="210" height="275" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="115" y="52" font-size="30" fill="#2F3E7A" text-anchor="middle">Tệp trên đĩa</text><rect x="35" y="70" width="160" height="32" rx="12" fill="#fff" stroke="#2F3E7A" stroke-width="3" /><rect x="35" y="117" width="160" height="32" rx="12" fill="#fff" stroke="#2F3E7A" stroke-width="3" /><rect x="35" y="164" width="160" height="32" rx="12" fill="#fff" stroke="#2F3E7A" stroke-width="3" /><rect x="35" y="211" width="160" height="32" rx="12" fill="#fff" stroke="#2F3E7A" stroke-width="3" /><path d="M235 150H330" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)" /><path d="M273 123l43 54M316 123l-43 54" fill="none" stroke="#B15A2B" stroke-width="4"  /><rect x="350" y="108" width="235" height="97" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3" /><text x="467" y="150" font-size="30" fill="#2F3E7A" text-anchor="middle">Bộ nhớ chính</text><text x="467" y="185" font-size="30" fill="#2F3E7A" text-anchor="middle">hữu hạn</text><text x="310" y="326" font-size="32" fill="#B15A2B" text-anchor="middle">Không thể nạp trọn tệp</text>
</g>
</svg>
