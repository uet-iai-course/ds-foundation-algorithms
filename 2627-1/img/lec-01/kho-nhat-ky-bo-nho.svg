<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Tổng kích thước theo máy chủ</title><desc id="desc">Kho nhật ký lớn hơn bộ nhớ được quét tuần tự. Bộ nhớ giữ một bảng tổng theo máy chủ; kết quả gồm các tổng chính xác.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="30" y="85" width="310" height="165" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="185" y="159" font-size="32" fill="#2F3E7A" text-anchor="middle">Kho nhật ký</text><text x="185" y="198" font-size="32" fill="#2F3E7A" text-anchor="middle">địa chỉ · byte · ngày</text><path d="M345 170 L422 170" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="435" y="85" width="330" height="165" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="600" y="159" font-size="32" fill="#2F3E7A" text-anchor="middle">Bộ nhớ chính</text><text x="600" y="198" font-size="32" fill="#2F3E7A" text-anchor="middle">bảng tổng theo khóa</text><path d="M770 170 L847 170" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="860" y="85" width="310" height="165" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="1015" y="159" font-size="32" fill="#2F3E7A" text-anchor="middle">Kết quả</text><text x="1015" y="198" font-size="32" fill="#2F3E7A" text-anchor="middle">tổng byte / máy chủ</text><text x="600" y="320" font-size="32" fill="#37474F" text-anchor="middle">Đọc tuần tự; không giữ toàn bộ bản ghi</text></g>
</svg>
