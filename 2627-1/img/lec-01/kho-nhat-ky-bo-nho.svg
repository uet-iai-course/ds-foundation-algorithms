<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Quét kho nhật ký lớn hơn bộ nhớ</title>
  <desc id="desc">Kho nhật ký dung lượng D được đọc tuần tự theo các khối qua bộ nhớ dung lượng M nhỏ hơn D, rồi cộng dồn thành thống kê theo máy chủ. Số lượt truyền tối thiểu là D chia cho b.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#2f3e7a"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#c2610f" stroke-width="2"/></pattern>
  </defs>
  <rect width="1000" height="420" rx="22" fill="#fffdf9"/>
  <text x="80" y="52" font-family="sans-serif" font-size="28" font-weight="700" fill="#263238">Kho nhật ký trên đĩa</text>
  <g stroke="#37474f" stroke-width="3">
    <rect x="55" y="85" width="300" height="170" rx="14" fill="#f7efe6"/>
    <path d="M105 85v170M155 85v170M205 85v170M255 85v170M305 85v170"/>
  </g>
  <text x="175" y="292" font-family="sans-serif" font-size="25" text-anchor="middle" fill="#37474f">kích thước D byte</text>
  <path d="M370 170H492" stroke="#2f3e7a" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="431" y="143" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#2f3e7a">đọc tuần tự</text>
  <rect x="510" y="103" width="190" height="135" rx="14" fill="url(#hatch)" stroke="#c2610f" stroke-width="4"/>
  <rect x="530" y="123" width="150" height="95" rx="8" fill="#fffdf9" stroke="#37474f" stroke-width="2"/>
  <text x="605" y="163" font-family="sans-serif" font-size="25" text-anchor="middle" font-weight="700" fill="#263238">Bộ nhớ</text>
  <text x="605" y="199" font-family="sans-serif" font-size="23" text-anchor="middle" fill="#37474f">M &lt; D</text>
  <path d="M718 170H828" stroke="#2f3e7a" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="842" y="100" width="118" height="142" rx="14" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/>
  <text x="901" y="145" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="700" fill="#263238">Tổng</text>
  <text x="901" y="177" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#263238">byte theo</text>
  <text x="901" y="209" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#263238">máy chủ</text>
  <rect x="280" y="330" width="440" height="62" rx="14" fill="#2f3e7a"/>
  <text x="500" y="371" font-family="sans-serif" font-size="29" text-anchor="middle" fill="white">T_quét ≥ D / b</text>
</svg>
