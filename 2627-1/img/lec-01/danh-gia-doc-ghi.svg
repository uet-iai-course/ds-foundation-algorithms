<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Các lượt đọc và ghi khi sắp ngoài</title><desc id="desc">Dữ liệu từ đĩa được đọc vào bộ đệm, xử lý rồi ghi thành các dãy; lượt trộn tiếp theo lại đọc và ghi.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b15a2b"/></marker></defs><g font-family="Arial, sans-serif"><rect x="20" y="82" width="290" height="122" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="165" y="132" font-size="34" text-anchor="middle" fill="#2f3e7a">Tệp trên đĩa</text><text x="165" y="177" font-size="30" text-anchor="middle" fill="#2f3e7a">Các khối dữ liệu</text><path d="M 327 143 L 449 143" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><text x="385" y="95" font-size="30" text-anchor="middle" fill="#2f3e7a">Đọc</text><rect x="468" y="82" width="280" height="122" rx="12" fill="#f7efe6" stroke="#2f3e7a" stroke-width="3"/><text x="608" y="132" font-size="34" text-anchor="middle" fill="#2f3e7a">Bộ đệm</text><text x="608" y="177" font-size="30" text-anchor="middle" fill="#2f3e7a">Sắp hoặc trộn</text><path d="M 764 143 L 878 143" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><text x="820" y="95" font-size="30" text-anchor="middle" fill="#2f3e7a">Ghi</text><rect x="900" y="82" width="275" height="122" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="1037" y="132" font-size="34" text-anchor="middle" fill="#2f3e7a">Dãy trên đĩa</text><text x="1037" y="177" font-size="30" text-anchor="middle" fill="#2f3e7a">Đầu ra một lượt</text><path d="M1040 216V280H165V218" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><text x="604" y="266" font-size="32" text-anchor="middle" fill="#2f3e7a">Đọc lại ở lượt trộn tiếp theo</text></g></svg>
