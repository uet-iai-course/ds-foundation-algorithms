<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Tổng hợp tài liệu phân tán</title><desc id="desc">Các phần kho nằm ở nhiều máy. Đóng góp theo từ được chuyển qua mạng và gom lại; một tác vụ lỗi cần chạy lại.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="25" y="20" width="280" height="80" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="165" y="71" font-size="32" fill="#2F3E7A" text-anchor="middle">Phần kho ở máy 1</text><rect x="25" y="135" width="280" height="80" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="165" y="186" font-size="32" fill="#2F3E7A" text-anchor="middle">Phần kho ở máy 2</text><rect x="25" y="250" width="280" height="80" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="165" y="301" font-size="32" fill="#2F3E7A" text-anchor="middle">Phần kho ở máy 3</text><path d="M310 60 L425 155" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><path d="M310 175 L425 175" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><path d="M310 290 L425 195" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="440" y="110" width="330" height="130" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="605" y="166.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Đóng góp theo từ</text><text x="605" y="205.5" font-size="32" fill="#2F3E7A" text-anchor="middle">gom qua mạng</text><path d="M775 175 L885 175" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="900" y="110" width="275" height="130" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="1037.5" y="166.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Tổng số lần</text><text x="1037.5" y="205.5" font-size="32" fill="#2F3E7A" text-anchor="middle">xuất hiện / từ</text><text x="620" y="310" font-size="30" fill="#B15A2B" text-anchor="middle">Tác vụ lỗi: chạy lại</text></g>
</svg>
