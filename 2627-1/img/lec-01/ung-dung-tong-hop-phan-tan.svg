<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Đếm từ trong kho chia trên nhiều máy</title>
<desc id="desc">Hai phần kho đều chứa từ w. Cách gom toàn bộ tài liệu về một máy truyền dữ liệu qua cùng đường mạng, dồn công việc vào máy nhận, rồi xuất tổng số lần xuất hiện. Không gán số đếm.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif">
<rect x="15" y="28" width="290" height="130" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="160" y="68" font-size="30" fill="#2F3E7A" text-anchor="middle">Máy 1 · phần kho 1</text><rect x="110" y="85" width="100" height="50" rx="12" fill="#fff" stroke="#B15A2B" stroke-width="3" /><text x="160" y="121" font-size="36" fill="#2F3E7A" text-anchor="middle">w</text><rect x="15" y="202" width="290" height="130" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="160" y="242" font-size="30" fill="#2F3E7A" text-anchor="middle">Máy 2 · phần kho 2</text><rect x="110" y="259" width="100" height="50" rx="12" fill="#fff" stroke="#B15A2B" stroke-width="3" /><text x="160" y="295" font-size="36" fill="#2F3E7A" text-anchor="middle">w</text><path d="M310 100L400 170" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)" /><path d="M310 260L400 190" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)" /><path d="M400 180H520" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)" /><text x="425" y="58" font-size="30" fill="#2F3E7A" text-anchor="middle">Gom toàn bộ</text><text x="425" y="95" font-size="30" fill="#2F3E7A" text-anchor="middle">tài liệu</text><path d="M454 145V215" fill="none" stroke="#B15A2B" stroke-width="4"  /><text x="426" y="291" font-size="30" fill="#2F3E7A" text-anchor="middle">Qua mạng</text><rect x="540" y="101" width="275" height="158" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3" /><text x="677" y="145" font-size="32" fill="#2F3E7A" text-anchor="middle">Một máy nhận</text><text x="677" y="194" font-size="32" fill="#2F3E7A" text-anchor="middle">đếm toàn kho</text><text x="677" y="237" font-size="30" fill="#2F3E7A" text-anchor="middle">→ dồn việc</text><path d="M820 180H887" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)" /><rect x="905" y="91" width="280" height="180" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="1045" y="134" font-size="32" fill="#2F3E7A" text-anchor="middle">Kết quả cho w</text><text x="1045" y="183" font-size="32" fill="#2F3E7A" text-anchor="middle">Tổng số lần</text><text x="1045" y="225" font-size="32" fill="#2F3E7A" text-anchor="middle">xuất hiện</text>
</g>
