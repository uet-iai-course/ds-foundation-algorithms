<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Truy hồi theo véc-tơ</title><desc id="desc">Véc-tơ truy vấn dùng chỉ mục để tìm các mục gần. Đánh giá độ thu hồi, độ trễ, bộ nhớ và chi phí xây dựng.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="25" y="40" width="290" height="120" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="170" y="111" font-size="32" fill="#2F3E7A" text-anchor="middle">Véc-tơ truy vấn</text><path d="M320 100 L445 100" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="460" y="40" width="280" height="120" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="600" y="111" font-size="32" fill="#2F3E7A" text-anchor="middle">Chỉ mục</text><path d="M745 100 L870 100" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="885" y="40" width="290" height="120" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="1030" y="111" font-size="32" fill="#2F3E7A" text-anchor="middle">Các mục gần</text><rect x="25" y="235" width="250" height="85" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="150" y="288.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Độ thu hồi</text><rect x="325" y="235" width="250" height="85" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="450" y="288.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Độ trễ</text><rect x="625" y="235" width="250" height="85" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="750" y="288.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Bộ nhớ</text><rect x="925" y="235" width="250" height="85" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="1050" y="288.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Xây dựng</text></g>
</svg>
