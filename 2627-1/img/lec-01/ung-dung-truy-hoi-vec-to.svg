<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Tìm đoạn tài liệu bằng véc-tơ truy vấn</title>
<desc id="desc">Truy vấn và các đoạn tài liệu đều ở dạng véc-tơ. Một truy vấn được đối chiếu với từng đoạn nếu quét toàn kho; đầu ra là k đoạn gần nhất theo khoảng cách đã chọn. Không gán tọa độ, khoảng cách hay thứ hạng cụ thể.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif">
<rect x="15" y="111" width="265" height="128" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="147" y="154" font-size="30" fill="#2F3E7A" text-anchor="middle">Truy vấn</text><text x="147" y="204" font-size="30" fill="#2F3E7A" text-anchor="middle">dạng véc-tơ</text><path d="M285 174L505 65" fill="none" stroke="#B15A2B" stroke-width="4"  /><path d="M285 174L505 170" fill="none" stroke="#B15A2B" stroke-width="4"  /><path d="M285 174L505 275" fill="none" stroke="#B15A2B" stroke-width="4"  /><text x="397" y="45" font-size="30" fill="#2F3E7A" text-anchor="middle">Tính khoảng cách</text><rect x="525" y="27" width="280" height="75" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="665" y="58" font-size="30" fill="#2F3E7A" text-anchor="middle">Đoạn tài liệu</text><text x="665" y="91" font-size="30" fill="#2F3E7A" text-anchor="middle">dạng véc-tơ</text><rect x="525" y="132" width="280" height="75" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="665" y="163" font-size="30" fill="#2F3E7A" text-anchor="middle">Đoạn tài liệu</text><text x="665" y="196" font-size="30" fill="#2F3E7A" text-anchor="middle">dạng véc-tơ</text><rect x="525" y="237" width="280" height="75" rx="12" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3" /><text x="665" y="268" font-size="30" fill="#2F3E7A" text-anchor="middle">Đoạn tài liệu</text><text x="665" y="301" font-size="30" fill="#2F3E7A" text-anchor="middle">dạng véc-tơ</text><text x="665" y="350" font-size="30" fill="#2F3E7A" text-anchor="middle">… còn nhiều đoạn</text><path d="M820 170H907" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)" /><rect x="925" y="78" width="260" height="187" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3" /><text x="1055" y="120" font-size="32" fill="#2F3E7A" text-anchor="middle">Kết quả</text><text x="1055" y="168" font-size="30" fill="#2F3E7A" text-anchor="middle">k đoạn</text><text x="1055" y="210" font-size="30" fill="#2F3E7A" text-anchor="middle">tài liệu</text><text x="1055" y="247" font-size="30" fill="#2F3E7A" text-anchor="middle">gần nhất</text>
</g>
</svg>
