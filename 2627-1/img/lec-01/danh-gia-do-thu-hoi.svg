<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Ba trong năm hàng xóm thật được tìm lại</title><desc id="desc">Tập đúng a,b,c,d,e và tập trả về c,d,e,f,g có ba phần tử chung; hai điểm a,b bị bỏ sót.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b15a2b"/></marker></defs><g font-family="Arial, sans-serif"><ellipse cx="470" cy="175" rx="240" ry="125" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><ellipse cx="730" cy="175" rx="240" ry="125" fill="#f7efe6" fill-opacity=".55" stroke="#b15a2b" stroke-width="3"/><text x="400" y="37" font-size="32" text-anchor="middle" fill="#2f3e7a">5 hàng xóm thật</text><text x="840" y="37" font-size="32" text-anchor="middle" fill="#2f3e7a">5 kết quả trả về</text><text x="360" y="148" font-size="38" text-anchor="middle" fill="#2f3e7a">a</text><text x="360" y="219" font-size="38" text-anchor="middle" fill="#2f3e7a">b</text><text x="600" y="115" font-size="38" text-anchor="middle" fill="#2f3e7a">c</text><text x="600" y="185" font-size="38" text-anchor="middle" fill="#2f3e7a">d</text><text x="600" y="255" font-size="38" text-anchor="middle" fill="#2f3e7a">e</text><text x="840" y="148" font-size="38" text-anchor="middle" fill="#2f3e7a">f</text><text x="840" y="219" font-size="38" text-anchor="middle" fill="#2f3e7a">g</text><text x="105" y="182" font-size="30" text-anchor="middle" fill="#2f3e7a">Bị thiếu</text><text x="1090" y="180" font-size="28" text-anchor="middle" fill="#2f3e7a">Ngoài tập</text><text x="1090" y="217" font-size="28" text-anchor="middle" fill="#2f3e7a">đúng</text></g></svg>
