<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Kết quả trên phần đã xét</title><desc id="desc">Ba cặp đầu trong sáu cặp của bốn tài liệu đã xét; chỉ các cặp đạt ngưỡng trong phần đã xét được xuất.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b15a2b"/></marker></defs><g font-family="Arial, sans-serif"><text x="285" y="42" font-size="34" text-anchor="middle" fill="#2f3e7a">Phần đã xét</text><text x="900" y="42" font-size="34" text-anchor="middle" fill="#2f3e7a">Phần chưa xét</text><rect x="20" y="70" width="175" height="90" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="107" y="126" font-size="32" text-anchor="middle" fill="#2f3e7a">Cặp 1–2</text><rect x="215" y="70" width="175" height="90" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="302" y="126" font-size="32" text-anchor="middle" fill="#2f3e7a">Cặp 1–3</text><rect x="410" y="70" width="175" height="90" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="497" y="126" font-size="32" text-anchor="middle" fill="#2f3e7a">Cặp 1–4</text><rect x="605" y="70" width="175" height="90" rx="12" fill="#fff" stroke="#2f3e7a" stroke-width="3" stroke-dasharray="9 7"/><text x="692" y="126" font-size="32" text-anchor="middle" fill="#2f3e7a">Cặp 2–3</text><rect x="800" y="70" width="175" height="90" rx="12" fill="#fff" stroke="#2f3e7a" stroke-width="3" stroke-dasharray="9 7"/><text x="887" y="126" font-size="32" text-anchor="middle" fill="#2f3e7a">Cặp 2–4</text><rect x="995" y="70" width="175" height="90" rx="12" fill="#fff" stroke="#2f3e7a" stroke-width="3" stroke-dasharray="9 7"/><text x="1082" y="126" font-size="32" text-anchor="middle" fill="#2f3e7a">Cặp 3–4</text><path d="M 285 171 L 285 223" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><rect x="70" y="238" width="1060" height="70" rx="12" fill="#f7efe6" stroke="#2f3e7a" stroke-width="3"/><text x="600" y="284" font-size="32" text-anchor="middle" fill="#2f3e7a">Đã xuất đúng các cặp đạt ngưỡng trong phần đã xét</text></g></svg>
