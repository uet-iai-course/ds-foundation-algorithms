<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Ngân sách bộ nhớ khi nối bảng</title><desc id="desc">Hai bảng chiếm 100 và 400 khối trên đĩa; bộ nhớ chỉ có 20 khối, không chứa trọn bảng nào.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b15a2b"/></marker></defs><g font-family="Arial, sans-serif"><rect x="25" y="50" width="365" height="95" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="207" y="90" font-size="32" text-anchor="middle" fill="#2f3e7a">Hồ sơ sinh viên</text><text x="207" y="128" font-size="32" text-anchor="middle" fill="#2f3e7a">100 khối</text><rect x="25" y="182" width="365" height="95" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="207" y="222" font-size="32" text-anchor="middle" fill="#2f3e7a">Lượt đăng ký</text><text x="207" y="260" font-size="32" text-anchor="middle" fill="#2f3e7a">400 khối</text><path d="M 405 98 L 558 145" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><path d="M 405 229 L 558 184" fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#arrow)"/><rect x="582" y="40" width="590" height="255" rx="12" fill="#fff" stroke="#2f3e7a" stroke-width="3"/><text x="877" y="85" font-size="36" text-anchor="middle" fill="#2f3e7a">Bộ nhớ: 20 khối</text><rect x="607" y="112" width="43" height="45" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><rect x="661" y="112" width="43" height="45" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><rect x="715" y="112" width="43" height="45" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><rect x="769" y="112" width="43" height="45" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><rect x="823" y="112" width="43" height="45" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><rect x="877" y="112" width="43" height="45" fill="#edf4ff" s