<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Nén ảnh có lượng tử hóa</title><desc id="desc">Khối ảnh đi qua biến đổi, lượng tử hóa và mã hóa, rồi giải mã để tái tạo. Lượng tử hóa làm mất thông tin; không dùng ảnh trước sau giả.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="25" y="35" width="240" height="95" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="145" y="93.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Khối ảnh</text><path d="M270 82 L335 82" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="350" y="35" width="240" height="95" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="470" y="93.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Biến đổi</text><path d="M595 82 L660 82" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="675" y="35" width="490" height="95" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="920" y="93.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Lượng tử hóa: mất thông tin</text><path d="M920 135 L920 215" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="675" y="230" width="490" height="95" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="920" y="288.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Mã hóa và giải mã</text><path d="M670 275 L595 275" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="350" y="230" width="240" height="95" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="470" y="288.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Tái tạo</text><path d="M345 275 L270 275" fill="none" stroke="#B15A2B" stroke-width="4"  marker-end="url(#arrow)"/><rect x="25" y="230" width="240" height="95" rx="14" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="145" y="288.5" font-size="32" fill="#2F3E7A" text-anchor="middle">Ảnh khôi phục</text><path d="M690 47L715 72M715 47L690 72" stroke="#B15A2B" stroke-width="4"/></g>
</svg>
