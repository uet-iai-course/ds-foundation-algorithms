<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Gộp mức sáng làm mất thông tin</title><desc id="desc">Minh họa định tính lượng tử hóa: nhiều mức sáng gần nhau được thay bằng một mức đại diện. Không phải dữ liệu ảnh thực nghiệm hay tỷ lệ nén.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker><linearGradient id="gray"><stop offset="0" stop-color="#303030"/><stop offset="1" stop-color="#eee"/></linearGradient></defs>
<g font-family="Arial, sans-serif"><text x="255" y="57" font-size="34" fill="#2F3E7A" text-anchor="middle">Nhiều mức sáng gần nhau</text><text x="920" y="57" font-size="34" fill="#2F3E7A" text-anchor="middle">Ít mức đại diện hơn</text><rect x="45" y="95" width="430" height="95" fill="url(#gray)" stroke="#2F3E7A" stroke-width="3"/><path d="M495 143L675 143" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow)"/><rect x="705" y="95" width="107.5" height="95" fill="#303030" stroke="#2F3E7A" stroke-width="2"/><rect x="812.5" y="95" width="107.5" height="95" fill="#777777" stroke="#2F3E7A" stroke-width="2"/><rect x="920" y="95" width="107.5" height="95" fill="#b5b5b5" stroke="#2F3E7A" stroke-width="2"/><rect x="1027.5" y="95" width="107.5" height="95" fill="#eeeeee" stroke="#2F3E7A" stroke-width="2"/><text x="590" y="218" font-size="34" fill="#2F3E7A" text-anchor="middle">Gộp mức sáng</text><text x="600" y="281" font-size="36" fill="#B15A2B" text-anchor="middle">Không thể phân biệt lại mọi mức sáng ban đầu</text><text x="600" y="331" font-size="32" fill="#2F3E7A" text-anchor="middle">Sơ đồ định tính; chất lượng phải được đo trên ảnh khôi phục</text></g>
</svg>
