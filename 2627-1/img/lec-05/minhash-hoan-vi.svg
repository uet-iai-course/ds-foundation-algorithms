<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
  <title id="title">MinHash theo một hoán vị hàng</title><desc id="desc">Ma trận đặc trưng bốn tập được đọc theo thứ tự b,e,a,d,c; hàng đầu tiên có giá trị một cho mỗi cột xác định MinHash tương ứng.</desc>
  <style>.h{font:700 23px sans-serif;fill:#2F3E7A}.t{font:21px monospace;fill:#263238}.grid{stroke:#B0BEC5;stroke-width:2}.hit{fill:#FFF0E5}.one{font-weight:700;fill:#B15A2B}.arr{stroke:#B15A2B;stroke-width:4}</style>
  <rect x="175" y="40" width="680" height="330" fill="#fff" stroke="#90A4AE" stroke-width="3"/><g class="grid"><path d="M175 95H855M175 150H855M175 205H855M175 260H855M175 315H855M310 40V370M445 40V370M580 40V370M715 40V370"/></g>
  <rect class="hit" x="176" y="96" width="678" height="53"/><rect class="hit" x="176" y="206" width="678" height="53"/>
  <text class="h" x="240" y="75" text-anchor="middle">Hàng</text><text class="h" x="377" y="75" text-anchor="middle">S₁</text><text class="h" x="512" y="75" text-anchor="middle">S₂</text><text class="h" x="647" y="75" text-anchor="middle">S₃</text><text class="h" x="782" y="75" text-anchor="middle">S₄</text>
  <g class="t" text-anchor="middle"><text x="240" y="130">b</text><text x="377" y="130">0</text><text x="512" y="130">0</text><text class="one" x="647" y="130">1</text><text x="782" y="130">0</text><text x="240" y="185">e</text><text x="377" y="185">0</text><text x="512" y="185">0</text><text class="one" x="647" y="185">1</text><text x="782" y="185">0</text><text x="240" y="240">a</text><text class="one" x="377" y="240">1</text><text x="512" y="240">0</text><text x="647" y="240">0</text><text class="one" x="782" y="240">1</text><text x="240" y="295">d</text><text class="one" x="377" y="295">1</text><text x="512" y="295">0</text><text class="one" x="647" y="295">1</text><text class="one" x="782" y="295">1</text><text x="240" y="350">c</text><text x="377" y="350">0</text><text class="one" x="512" y="350">1</text><text x="647" y="350">0</text><text class="one" x="782" y="350">1</text></g>
  <text class="h" x="515" y="410" text-anchor="middle">h(S₁)=a, h(S₂)=c, h(S₃)=b, h(S₄)=a</text>
