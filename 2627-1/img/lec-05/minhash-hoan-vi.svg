<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
<title id="title">Một thứ tự chung cho hai tập</title><desc id="desc">Thứ tự b, e, a, d, c được dùng cho S1 bằng tập a,d và S4 bằng tập a,c,d. Cả hai gặp a trước tiên; b và e ngoài hợp nên không ảnh hưởng lựa chọn.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif" font-size="28" fill="#243247">
<text x="50" y="55">Thứ tự chung</text><path d="M290 65H950" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/>
<g font-size="38" font-family="monospace" text-anchor="middle"><text x="335" y="115">b</text><text x="475" y="115">e</text><text x="615" y="115">a</text><text x="755" y="115">d</text><text x="895" y="115">c</text></g>
<text x="50" y="215">S₁ = {a, d}</text><text x="50" y="315">S₄ = {a, c, d}</text>
<g fill="#2f3e7a"><circle cx="615" cy="205" r="12"/><circle cx="755" cy="205" r="12"/><circle cx="615" cy="305" r="12"/><circle cx="755" cy="305" r="12"/><circle cx="895" cy="305" r="12"/></g>
<g fill="none" stroke="#b15a2b" stroke-width="4"><rect x="582" y="168" width="66" height="176" rx="10"/></g>
<path d="M615 360V380" stroke="#b15a2b" stroke-width="3"/>
<text x="615" y="420" text-anchor="middle">Phần tử đầu tiên: a</text>
</g></svg>
