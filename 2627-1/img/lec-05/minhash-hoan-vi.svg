<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">Một thứ tự chung cho hai tập</title><desc id="desc">Thứ tự b, e, a, d, c dùng chung cho S1 = {a, d} và S4 = {a, c, d}. Chấm đặc đánh dấu phần tử thuộc tập. Cả hai tập gặp a trước tiên, khung viền đậm quanh cột a; b và e nằm ngoài hợp nên không ảnh hưởng lựa chọn.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="40.0" y="60.0" font-size="34" fill="#243247" text-anchor="start" font-weight="normal">Thứ tự chung</text><line x1="290.0" y1="70.0" x2="950.0" y2="70.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><text x="335.0" y="125.0" font-size="40" fill="#243247" text-anchor="middle" font-weight="normal" font-family="monospace">b</text><text x="475.0" y="125.0" font-size="40" fill="#243247" text-anchor="middle" font-weight="normal" font-family="monospace">e</text><text x="615.0" y="125.0" font-size="40" fill="#243247" text-anchor="middle" font-weight="normal" font-family="monospace">a</text><text x="755.0" y="125.0" font-size="40" fill="#243247" text-anchor="middle" font-weight="normal" font-family="monospace">d</text><text x="895.0" y="125.0" font-size="40" fill="#243247" text-anchor="middle" font-weight="normal" font-family="monospace">c</text><text x="40.0" y="220.0" font-size="34" fill="#243247" text-anchor="start" font-weight="normal">S<tspan baseline-shift="sub" font-size="75%">1</tspan> = {a, d}</text><text x="40.0" y="320.0" font-size="34" fill="#243247" text-anchor="start" font-weight="normal">S<tspan baseline-shift="sub" font-size="75%">4</tspan> = {a, c, d}</text><circle cx="615" cy="208" r="13" fill="#2f3e7a"/><circle cx="755" cy="208" r="13" fill="#2f3e7a"/><circle cx="615" cy="308" r="13" fill="#2f3e7a"/><circle cx="755" cy="308" r="13" fill="#2f3e7a"/><circle cx="895" cy="308" r="13" fill="#2f3e7a"/><rect x="580.0" y="168.0" width="70.0" height="180.0" rx="10" fill="none" stroke="#a85b23" stroke-width="4"/><line x1="615.0" y1="352.0" x2="615.0" y2="378.0" stroke="#a85b23" stroke-width="3"/><text x="615.0" y="425.0" font-size="34" fill="#243247" text-anchor="middle" font-weight="normal">Phần tử đầu tiên: a</text></g></svg>
