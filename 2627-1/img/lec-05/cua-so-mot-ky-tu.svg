<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Một ký tự đổi chỉ đổi hai cửa sổ</title><desc id="desc">Hai chuỗi abcdabd và abcxabd, vị trí 0 đến 6, chỉ khác ở vị trí 3 (ô viền đậm). Với k = 2, hai cửa sổ chứa vị trí 3 bắt đầu tại 2 và 3, đánh dấu bằng ngoặc nét đứt: cd, da của chuỗi thứ nhất thành cx, xa của chuỗi thứ hai; bốn cửa sổ còn lại trùng nhau. Hai tập 2-shingle có giao 3 phần tử, hợp 7 phần tử, Jaccard 3/7.</desc>
