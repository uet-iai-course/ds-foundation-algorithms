<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Phần tử đầu trong hợp quyết định trùng MinHash</title><desc id="desc">Đối với S1 và S4, a,d thuộc giao X, c thuộc phần riêng Y; b,e thuộc Z ngoài hợp. Trong hoán vị đều, phần tử đầu của hợp đồng đều giữa a,c,d; hai trên ba lựa chọn làm hai MinHash bằng nhau.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif" font-size="28" fill="#243247">
<text x="500" y="32" text-anchor="middle">Xét loại của phần tử đầu tiên trong hợp</text>
<rect x="45" y="60" width="255" height="230" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/>
<rect x="335" y="60" width="255" height="230" rx="12" fill="#fff5e9" stroke="#b15a2b" stroke-width="3"/>
<rect x="625" y="60" width="330" height="230" rx="12" fill="#f5f5f5" stroke="#667085" stroke-width="2" stroke-dasharray="8 5"/>
<text x="172" y="112" text-anchor="middle">X: thuộc cả hai</text><text x="172" y="186" text-anchor="middle" font-size="40">a, d</text><text x="172" y="245" text-anchor="middle">MinHash trùng</text>
<text x="462" y="99" text-anchor="middle">Y: thuộc đúng</text><text x="462" y="135" text-anchor="middle">một tập</text><text x="462" y="186" text-anchor="middle" font-size="40">c</text><text x="462" y="245" text-anchor="middle">MinHash khác</text>
<text x="790" y="112" text-anchor="middle">Z: ngoài hợp</text><text x="790" y="186" text-anchor="middle" font-size="40">b, e</text><text x="790" y="245" text-anchor="middle">Không được chọn</text>
<path d="M45 315V335H590V315" fill="none" stroke="#2f3e7a" stroke-width="3"/>
<text x="320" y="385" text-anchor="middle">Hợp: a, c, d</text>
</g></svg>
