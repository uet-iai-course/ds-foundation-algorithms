<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Phần tử đứng đầu hợp quyết định trùng MinHash</title><desc id="desc">Với cặp S1, S4: a và d thuộc giao, loại X, MinHash trùng; c thuộc đúng một tập, loại Y, MinHash khác; b và e ngoài hợp, loại Z, khung viền đứt, không được chọn. Phần tử đứng đầu hợp a, c, d quyết định kết quả; hai trong ba phần tử cho MinHash trùng.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="500.0" y="40.0" font-size="34" fill="#243247" text-anchor="middle" font-weight="normal">Loại của phần tử đứng đầu hợp</text><rect x="20.0" y="65.0" width="300.0" height="240.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><rect x="340.0" y="65.0" width="300.0" height="240.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="3"/><rect x="660.0" y="65.0" width="320.0" height="240.0" rx="10" fill="#f4f6f9" stroke="#5b6778" stroke-width="2.5" stroke-dasharray="9 6"/><text x="170.0" y="115.0" font-size="34" fill="#243247" text-anchor="middle" font-weight="normal">X: thuộc cả hai</text><text x="170.0" y="195.0" font-size="44" fill="#243247" text-anchor="middle" font-weight="normal">a, d</text><text x="170.0" y="270.0" font-size="34" fill="#243247" text-anchor="middle" font-weight="normal">MinHash trùng</text><text x="490.0" y="108.0" font-size="34" fill="#243247" text-anchor="middle" font-weight="normal">Y: thuộc đúng</text><text x="490.0" y="146.0" font-size="34" fill="#243247" text-anchor="middle" font-weight="normal">một tập</text><text x="490.0" y="200.0" font-size="44" fill="#243247" text-anchor="middle" font-weight="normal">c</text><text x="490.0" y="270.0" font-size="34" fill="#243247" text-anchor="middle" font-weight="normal">MinHash khác</text><text x="820.0" y="115.0" font-size="34" fill="#243247" text-anchor="middle" font-weight="normal">Z: ngoài hợp</text><text x="820.0" y="195.0" font-size="44" fill="#243247" text-anchor="middle" font-weight="normal">b, e</text><text x="820.0" y="270.0" font-size="34" fill="#243247" text-anchor="middle" font-weight="normal">Không được chọn</text><path d="M20 330V352H640V330" fill="none" stroke="#2f3e7a" stroke-width="3"/><text x="330.0" y="400.0" font-size="34" fill="#243247" text-anchor="middle" font-weight="normal">Hợp: a, c, d</text><text x="330.0" y="450.0" font-size="34" fill="#5b6778" text-anchor="middle" font-weight="normal">Trùng ở 2 trong 3 phần tử</text></g></svg>
