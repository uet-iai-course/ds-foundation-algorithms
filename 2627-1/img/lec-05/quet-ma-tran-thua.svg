<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Quét danh sách cột theo hàng</title><desc id="desc">Với mỗi hàng r, tính n giá trị băm một lần. Danh sách cột chứa hàng r xác định các chữ ký cần cập nhật bằng phép min theo từng thành phần. Sau đó chuyển tới hàng kế tiếp.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif" font-size="28" fill="#243247">
<rect x="30" y="80" width="220" height="180" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/>
<rect x="370" y="80" width="250" height="180" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/>
<rect x="740" y="80" width="230" height="180" rx="10" fill="#fff5e9" stroke="#b15a2b" stroke-width="2"/>
<text x="140" y="137" text-anchor="middle">Hàng r</text><text x="140" y="187" text-anchor="middle">Tính n giá trị</text><text x="140" y="232" text-anchor="middle">băm</text>
<text x="495" y="137" text-anchor="middle">Các cột có 1</text><text x="495" y="187" text-anchor="middle">trong hàng r</text><text x="495" y="232" text-anchor="middle">Danh sách đã có</text>
<text x="855" y="137" text-anchor="middle">Cập nhật min</text><text x="855" y="187" text-anchor="middle">n thành phần</text><text x="855" y="232" text-anchor="middle">mỗi cột</text>
<path d="M262 170H355" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M632 170H725" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M855 275V330H140V275" fill="none" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="380" text-anchor="middle">Lặp với hàng tiếp theo</text>
</g></svg>
