<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">Kích thước tài liệu, tập mã và chữ ký</title><desc id="desc">Ba thanh ngang cùng tỷ lệ: tài liệu 50 000 ký tự chiếm 50 000 byte; tập mã 9-shingle, mỗi mã 4 byte, chiếm tới 199 968 byte, khoảng bốn lần tài liệu; chữ ký 250 thành phần, mỗi thành phần 4 byte, chiếm 1 000 byte, khoảng 1/200 tập mã.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="350" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="60.0" y="58.0" font-size="30" fill="#243247" text-anchor="start" font-weight="normal">Tài liệu 50 000 ký tự: 50 000 byte</text><rect x="60.0" y="72.0" width="225.0" height="40.0" rx="4" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="60.0" y="163.0" font-size="30" fill="#243247" text-anchor="start" font-weight="normal">Tập mã 9-shingle, mã 4 byte: tới 199 968 byte</text><rect x="60.0" y="177.0" width="899.9" height="40.0" rx="4" fill="#fff4e9" stroke="#a85b23" stroke-width="3"/><text x="60.0" y="268.0" font-size="30" fill="#243247" text-anchor="start" font-weight="normal">Chữ ký n = 250, mỗi thành phần 4 byte: 1 000 byte</text><rect x="60.0" y="282.0" width="8.0" height="40.0" rx="4" fill="#f4f6f9" stroke="#243247" stroke-width="3"/><text x="1150.0" y="163.0" font-size="28" fill="#5b6778" text-anchor="end" font-weight="normal">≈ 4 lần tài liệu</text><text x="1150.0" y="268.0" font-size="28" fill="#5b6778" text-anchor="end" font-weight="normal">≈ 1/200 tập mã</text></g></svg>
