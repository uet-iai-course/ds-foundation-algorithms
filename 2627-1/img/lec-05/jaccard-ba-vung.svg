<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
<title id="title">Ba vùng của hai tập hợp</title><desc id="desc">Hai phần tử chỉ thuộc S, ba phần tử thuộc giao của S và T, ba phần tử chỉ thuộc T; hợp có tám phần tử. Đường tròn S viền liền, đường tròn T viền đứt. Diện tích các vùng không biểu diễn số lượng.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1000" height="450" fill="#ffffff"/>
