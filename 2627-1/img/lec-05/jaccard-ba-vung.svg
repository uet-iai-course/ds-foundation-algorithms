<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Ba vùng của hai tập hợp</title><desc id="desc">Hình 3.1: hai phần tử chỉ thuộc S, ba phần tử thuộc giao S và T, ba phần tử chỉ thuộc T. Hợp có tám phần tử. Diện tích các vùng không mã hóa số lượng.</desc>
