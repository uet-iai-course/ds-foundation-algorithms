<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" role="img" aria-labelledby="title desc">
  <title id="title">Quy mô so sánh cặp tài liệu</title>
  <desc id="desc">Một triệu tài liệu dẫn tới xấp xỉ năm trăm tỷ cặp; chuỗi xử lý tạo tập shingle rồi chữ ký MinHash nhỏ hơn.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#B15A2B"/></marker></defs>
  <style>.t{font:700 24px sans-serif;fill:#2F3E7A}.s{font:20px sans-serif;fill:#37474F}.box{fill:#fff;stroke:#B0BEC5;stroke-width:3}.hot{fill:#FFF4EC;stroke:#B15A2B;stroke-width:4}.arr{stroke:#B15A2B;stroke-width:4;marker-end:url(#a)}</style>
  <rect class="box" x="25" y="80" width="250" height="160" rx="16"/><text class="t" x="150" y="130" text-anchor="middle">1.000.000 tài liệu</text><text class="s" x="150" y="175" text-anchor="middle">văn bản, bản sao,</text><text class="s" x="150" y="207" text-anchor="middle">phiên bản gần giống</text>
  <line class="arr" x1="285" y1="160" x2="375" y2="160"/>
  <rect class="hot" x="390" y="65" width="260" height="190" rx="16"/><text class="t" x="520" y="120" text-anchor="middle">≈ 5 × 10¹¹ cặp</text><text class="s" x="520" y="165" text-anchor="middle">so sánh trực tiếp</text><text class="s" x="520" y="200" text-anchor="middle">không còn phù hợp</text>
  <line class="arr" x1="665" y1="160" x2="755" y2="160"/>
  <rect class="box" x="770" y="80" width="245" height="160" rx="16"/><text class="t" x="892" y="128" text-anchor="middle">Biểu diễn nhỏ</text><text class="s" x="892" y="172" text-anchor="middle">shingle → tập</text><text class="s" x="892" y="205" text-anchor="middle">→ chữ ký MinHash</text>
</svg>
