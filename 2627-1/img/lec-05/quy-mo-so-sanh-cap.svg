<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 245" role="img" aria-labelledby="title desc">
<title id="title">Hai thừa số của công việc so sánh</title><desc id="desc">Tổng công việc bằng số cặp nhân chi phí so sánh một cặp. Biểu diễn chữ ký làm thay đổi chi phí một cặp; chưa làm thay đổi số cặp.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif" font-size="28" fill="#243247">
<rect x="55" y="45" width="380" height="155" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/>
<rect x="565" y="45" width="380" height="155" rx="12" fill="#fff5e9" stroke="#b15a2b" stroke-width="2"/>
<text x="245" y="103" text-anchor="middle">Số cặp</text><text x="245" y="157" text-anchor="middle">trong kho tài liệu</text>
<text x="500" y="137" text-anchor="middle" font-size="48">×</text>
<text x="755" y="103" text-anchor="middle">Chi phí so sánh</text><text x="755" y="157" text-anchor="middle">một cặp</text>
</g></svg>
