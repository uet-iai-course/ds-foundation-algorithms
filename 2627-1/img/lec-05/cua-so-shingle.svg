<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 405" role="img" aria-labelledby="title desc">
<title id="title">Các cửa sổ hai ký tự của abcdabd</title><desc id="desc">Chuỗi abcdabd có bảy ký tự ở vị trí 0 đến 6. Sáu cửa sổ dài hai lần lượt là ab, bc, cd, da, ab, bd. Hai cửa sổ ab cùng tạo một phần tử của tập shingle.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif" font-size="28" fill="#243247">
<text x="75" y="45">Chuỗi D</text><g font-family="monospace" font-size="42" text-anchor="middle">
<text x="275" y="60">a</text><text x="365" y="60">b</text><text x="455" y="60">c</text><text x="545" y="60">d</text><text x="635" y="60">a</text><text x="725" y="60">b</text><text x="815" y="60">d</text></g>
<g text-anchor="middle" fill="#526070" font-size="23"><text x="275" y="95">0</text><text x="365" y="95">1</text><text x="455" y="95">2</text><text x="545" y="95">3</text><text x="635" y="95">4</text><text x="725" y="95">5</text><text x="815" y="95">6</text></g>
<g fill="none" stroke="#2f3e7a" stroke-width="3"><rect x="240" y="15" width="160" height="55" rx="5"/><path d="M320 112V132H112V172" marker-end="url(#arrow)"/></g>
<text x="365" y="160">Cửa sổ</text>
<g text-anchor="middle" font-family="monospace" font-size="32">
<rect x="50" y="185" width="125" height="65" rx="6" fill="#fff0df" stroke="#b15a2b" stroke-width="3"/><text x="112" y="229">ab</text>
<rect x="205" y="185" width="125" height="65" rx="6" fill="#edf4ff" stroke="#2f3e7a"/><text x="267" y="229">bc</text>
<rect x="360" y="185" width="125" height="65" rx="6" fill="#edf4ff" stroke="#2f3e7a"/><text x="422" y="229">cd</text>
<rect x="515" y="185" width="125" height="65" rx="6" fill="#edf4ff" stroke="#2f3e7a"/><text x="577" y="229">da</text>
<rect x="670" y="185" width="125" height="65" rx="6" fill="#fff0df" stroke="#b15a2b" stroke-width="3"/><text x="732" y="229">ab</text>
<rect x="825" y="185" width="125" height="65" rx="6" fill="#edf4ff" stroke="#2f3e7a"/><text x="887" y="229">bd</text></g>
<path d="M112 263V295H732V263" fill="none" stroke="#b15a2b" stroke-width="3"/>
<text x="500" y="365" text-anchor="middle">Hai cửa sổ ab → một phần tử của tập</text>
</g></svg>
