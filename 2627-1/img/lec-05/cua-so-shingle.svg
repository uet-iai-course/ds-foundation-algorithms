<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 315" role="img" aria-labelledby="title desc">
<title id="title">Các cửa sổ hai ký tự của abcdabd</title><desc id="desc">Chuỗi abcdabd có bảy ký tự ở vị trí 0 đến 6. Sáu cửa sổ dài hai lần lượt là ab, bc, cd, da, ab, bd; hai cửa sổ ab viền đậm, nối bằng một ngoặc, cùng tạo một phần tử của tập shingle.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="315" fill="#ffffff"/>
