#arrow)"/><text x="420.0" y="160.0" font-size="28" fill="#243247" text-anchor="start" font-weight="normal">Cửa sổ dài 2</text><rect x="50.0" y="175.0" width="140.0" height="62.0" rx="6" fill="#fff4e9" stroke="#a85b23" stroke-width="4"/><text x="120.0" y="218.0" font-size="34" fill="#243247" text-anchor="middle" font-weight="bold" font-family="monospace">ab</text><rect x="240.0" y="175.0" width="140.0" height="62.0" rx="6" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="310.0" y="218.0" font-size="34" fill="#243247" text-anchor="middle" font-weight="normal" font-family="monospace">bc</text><rect x="430.0" y="175.0" width="140.0" height="62.0" rx="6" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="500.0" y="218.0" font-size="34" fill="#243247" text-anchor="middle" font-weight="normal" font-family="monospace">cd</text><rect x="620.0" y="175.0" width="140.0" height="62.0" rx="6" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="690.0" y="218.0" font-size="34" fill="#243247" text-anchor="middle" font-weight="normal" font-family="monospace">da</text><rect x="810.0" y="175.0" width="140.0" height="62.0" rx="6" fill="#fff4e9" stroke="#a85b23" stroke-width="4"/><text x="880.0" y="218.0" font-size="34" fill="#243247" text-anchor="middle" font-weight="bold" font-family="monospace">ab</text><rect x="1000.0" y="175.0" width="140.0" height="62.0" rx="6" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="1070.0" y="218.0" font-size="34" fill="#243247" text-anchor="middle" font-weight="normal" font-family="monospace">bd</text><path d="M120 247V265H880V247" fill="none" stroke="#a85b23" stroke-width="3"/><text x="600.0" y="300.0" font-size="28" fill="#243247" text-anchor="middle" font-weight="normal">Hai cửa sổ ab → một phần tử của tập</text></g></svg>
