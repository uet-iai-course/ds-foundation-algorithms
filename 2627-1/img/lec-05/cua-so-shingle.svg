<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" role="img" aria-labelledby="title desc">
  <title id="title">Cửa sổ tạo 2-shingle</title><desc id="desc">Chuỗi abcdabd được quét bằng cửa sổ dài hai, tạo các shingle ab, bc, cd, da, ab và bd; tập kết quả loại bản lặp ab.</desc>
  <style>.c{font:700 34px monospace;fill:#263238}.lab{font:22px sans-serif;fill:#37474F}.win{fill:#FFF4EC;stroke:#B15A2B;stroke-width:4}.tag{fill:#EDF4FF;stroke:#2F3E7A;stroke-width:2}</style>
  <text class="lab" x="30" y="48">Tài liệu D</text><text class="c" x="260" y="65">a b c d a b d</text>
  <g transform="translate(230,90)"><rect class="win" x="0" y="0" width="120" height="62" rx="8"/><rect class="win" x="105" y="0" width="120" height="62" rx="8"/><rect class="win" x="210" y="0" width="120" height="62" rx="8"/><rect class="win" x="315" y="0" width="120" height="62" rx="8"/><rect class="win" x="420" y="0" width="120" height="62" rx="8"/><rect class="win" x="525" y="0" width="120" height="62" rx="8"/><text class="c" x="60" y="43" text-anchor="middle">ab</text><text class="c" x="165" y="43" text-anchor="middle">bc</text><text class="c" x="270" y="43" text-anchor="middle">cd</text><text class="c" x="375" y="43" text-anchor="middle">da</text><text class="c" x="480" y="43" text-anchor="middle">ab</text><text class="c" x="585" y="43" text-anchor="middle">bd</text></g>
  <text class="lab" x="30" y="245">Tập 2-shingle</text><g transform="translate(250,215)"><rect class="tag" x="0" y="0" width="120" height="62" rx="12"/><rect class="tag" x="135" y="0" width="120" height="62" rx="12"/><rect class="tag" x="270" y="0" width="120" height="62" rx="12"/><rect class="tag" x="405" y="0" width="120" height="62" rx="12"/><rect class="tag" x="540" y="0" width="120" height="62" rx="12"/><text class="c" x="60" y="43" text-anchor="middle">ab</text><text class="c" x="195" y="43" text-anchor="middle">bc</text><text class="c" x="330" y="43" text-anchor="middle">cd</text><text class="c" x="465" y="43" text-anchor="middle">da</text><text class="c" x="600" y="43" text-anchor="middle">bd</text></g>
  <text class="lab" x="520" y="335" text-anchor="middle">Lần xuất hiện thứ hai của “ab” không tạo phần tử mới.</text>
</svg>
