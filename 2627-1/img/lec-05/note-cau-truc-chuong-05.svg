"256.0" y="174.0" width="216.0" height="366.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="364.0" y="210.0" font-size="23" fill="#a85b23" text-anchor="middle" font-weight="bold">Mục 2</text><text x="364.0" y="248.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">Biến văn bản</text><text x="364.0" y="275.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">thành tập</text><text x="364.0" y="302.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">thế nào?</text><line x1="272.0" y1="352.0" x2="456.0" y2="352.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><text x="364.0" y="380.0" font-size="17" fill="#5b6778" text-anchor="middle" font-weight="normal">Khái niệm:</text><text x="364.0" y="414.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">tập k-shingle,</text><text x="364.0" y="446.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">khoảng trắng,</text><text x="364.0" y="478.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">mã 4 byte</text><line x1="600.0" y1="132.0" x2="600.0" y2="168.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="492.0" y="174.0" width="216.0" height="366.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="600.0" y="210.0" font-size="23" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Mục 3</text><text x="600.0" y="248.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">Một phép thử</text><text x="600.0" y="275.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">nào giữ</text><text x="600.0" y="302.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">Jaccard?</text><line x1="508.0" y1="352.0" x2="692.0" y2="352.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><text x="600.0" y="380.0" font-size="17" fill="#5b6778" text-anchor="middle" font-weight="normal">Khái niệm:</text><text x="600.0" y="414.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">ma trận đặc trưng,</text><text x="600.0" y="446.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">MinHash,</text><text x="600.0" y="478.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">Pr = SIM</text><line x1="600.0" y1="132.0" x2="836.0" y2="168.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="728.0" y="174.0" width="216.0" height="366.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="836.0" y="210.0" font-size="23" fill="#a85b23" text-anchor="middle" font-weight="bold">Mục 4</text><text x="836.0" y="248.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">Ước lượng</text><text x="836.0" y="275.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">chính xác</text><text x="836.0" y="302.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">đến đâu?</text><line x1="744.0" y1="352.0" x2="928.0" y2="352.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><text x="836.0" y="380.0" font-size="17" fill="#5b6778" text-anchor="middle" font-weight="normal">Khái niệm:</text><text x="836.0" y="414.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">chữ ký,</text><text x="836.0" y="446.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">kỳ vọng s,</text><text x="836.0" y="478.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">s(1 − s)/n</text><line x1="600.0" y1="132.0" x2="1072.0" y2="168.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="964.0" y="174.0" width="216.0" height="366.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="1072.0" y="210.0" font-size="23" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Mục 5</text><text x="1072.0" y="248.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">Tính chữ ký</text><text x="1072.0" y="275.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">cho cả kho</text><text x="1072.0" y="302.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">thế nào?</text><line x1="980.0" y1="352.0" x2="1164.0" y2="352.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><text x="1072.0" y="380.0" font-size="17" fill="#5b6778" text-anchor="middle" font-weight="normal">Khái niệm:</text><text x="1072.0" y="414.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">hàm băm hàng,</text><text x="1072.0" y="446.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">quét hàng,</text><text x="1072.0" y="478.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">Θ(nC + nR + nL)</text><line x1="364.0" y1="542.0" x2="364.0" y2="580.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><rect x="20.0" y="584.0" width="460.0" height="76.0" rx="10" fill="#f4f6f9" stroke="#5b6778" stroke-width="2.5" stroke-dasharray="8 6"/><text x="250.0" y="616.0" font-size="18" fill="#5b6778" text-anchor="middle" font-weight="bold">Đọc thêm (thu gọn)</text><text x="250.0" y="644.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">đa tập, shingle theo từ dừng</text><line x1="964.0" y1="542.0" x2="864.0" y2="590.0" stroke="#233247" stroke-width="3" marker-end="url(#arrow)"/><rect x="500.0" y="584.0" width="360.0" height="76.0" rx="10" fill="#ffffff" stroke="#233247" stroke-width="3.5"/><text x="680.0" y="616.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="bold">Bài 06</text><text x="680.0" y="644.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal">giảm số cặp phải so</text><line x1="1100.0" y1="542.0" x2="1100.0" y2="580.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><rect x="880.0" y="584.0" width="300.0" height="76.0" rx="10" fill="#f4f6f9" stroke="#5b6778" stroke-width="2.5" stroke-dasharray="8 6"/><text x="1030.0" y="616.0" font-size="18" fill="#5b6778" text-anchor="middle" font-weight="bold">Đọc thêm (thu gọn)</text><text x="1030.0" y="644.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">rút ngắn phép quét</text></g></svg>
