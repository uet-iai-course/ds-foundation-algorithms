<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Cấu trúc của Bài 05</title><desc id="desc">Sơ đồ đọc từ trên xuống. Khối trên cùng là bài toán trung tâm: kho 10⁶ tài liệu, 499 999 500 000 cặp, tập mã shingle khoảng 200 000 byte mỗi tài liệu. Năm mũi tên xuống năm cột; mỗi cột ghi câu hỏi của mục và, dưới đường kẻ đứt, các khái niệm chính. Mục 1: tổng công việc gồm những thừa số nào; số cặp, chi phí một cặp, Jaccard. Mục 2: biến văn bản thành tập thế nào; tập k-shingle, khoảng trắng, mã 4 byte. Mục 3: một phép thử nào giữ Jaccard; ma trận đặc trưng, MinHash, xác suất trùng bằng SIM. Mục 4: ước lượng chính xác đến đâu; chữ ký, kỳ vọng s, phương sai s(1 − s)/n. Mục 5: tính chữ ký cho cả kho thế nào; hàm băm hàng, quét hàng, chi phí Θ(nC + nR + nL). Hàng dưới: ô đọc thêm viền nét đứt dưới Mục 2 (đa tập, shingle theo từ dừng); mũi tên từ Mục 5 tới khối viền đậm &quot;Bài 06: giảm số cặp phải so&quot;; ô đọc thêm viền nét đứt dưới Mục 5 (rút ngắn phép quét).</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>
