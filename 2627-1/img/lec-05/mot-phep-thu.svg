<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Một phép thử MinHash</title><desc id="desc">Một phép thử MinHash cho S1, S4 với π chọn đều: phần tử đứng đầu hợp là a, c hoặc d, mỗi phần tử với xác suất 1/3; a và d cho kết quả trùng 1 (khung viền liền), c cho kết quả khác 0 (khung viền đứt). Xác suất trùng bằng 2/3, nhưng mỗi lần chạy chỉ thấy 0 hoặc 1.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="360" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="20.0" y="20.0" width="1160.0" height="320.0" rx="12" fill="#f4f6f9" stroke="#5b6778" stroke-width="2"/><text x="600.0" y="70.0" font-size="30" fill="#243247" text-anchor="middle" font-weight="bold">Một phép thử, π chọn đều: phần tử đứng đầu hợp {a, c, d}</text><rect x="120.0" y="110.0" width="100.0" height="76.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="170.0" y="162.0" font-size="40" fill="#243247" text-anchor="middle" font-weight="normal" font-family="monospace">a</text><text x="170.0" y="222.0" font-size="26" fill="#5b6778" text-anchor="middle" font-weight="normal">xác suất 1/3</text><line x1="170.0" y1="236.0" x2="170.0" y2="266.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><text x="170.0" y="306.0" font-size="30" fill="#243247" text-anchor="middle" font-weight="normal">trùng: 1</text><rect x="350.0" y="110.0" width="100.0" height="76.0" rx="8" fill="#fff4e9" stroke="#a85b23" stroke-width="3" stroke-dasharray="8 5"/><text x="400.0" y="162.0" font-size="40" fill="#243247" text-anchor="middle" font-weight="normal" font-family="monospace">c</text><text x="400.0" y="222.0" font-size="26" fill="#5b6778" text-anchor="middle" font-weight="normal">xác suất 1/3</text><line x1="400.0" y1="236.0" x2="400.0" y2="266.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><text x="400.0" y="306.0" font-size="30" fill="#243247" text-anchor="middle" font-weight="normal">khác: 0</text><rect x="580.0" y="110.0" width="100.0" height="76.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="630.0" y="162.0" font-size="40" fill="#243247" text-anchor="middle" font-weight="normal" font-family="monospace">d</text><text x="630.0" y="222.0" font-size="26" fill="#5b6778" text-anchor="middle" font-weight="normal">xác suất 1/3</text><line x1="630.0" y1="236.0" x2="630.0" y2="266.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><text x="630.0" y="306.0" font-size="30" fill="#243247" text-anchor="middle" font-weight="normal">trùng: 1</text><line x1="790.0" y1="100.0" x2="790.0" y2="320.0" stroke="#5b6778" stroke-width="2"/><text x="985.0" y="150.0" font-size="32" fill="#243247" text-anchor="middle" font-weight="bold">Pr[trùng] = 2/3</text><text x="985.0" y="215.0" font-size="30" fill="#243247" text-anchor="middle" font-weight="normal">Mỗi lần chạy</text><text x="985.0" y="255.0" font-size="30" fill="#243247" text-anchor="middle" font-weight="normal">chỉ thấy 0 hoặc 1</text></g></svg>
