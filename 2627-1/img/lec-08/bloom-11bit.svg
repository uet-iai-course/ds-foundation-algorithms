<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 360" role="img" aria-labelledby="t d">
<title id="t">Ví dụ Bloom filter mười một bit</title><desc id="d">Bốn khóa băm vào hai vị trí; các bit 0,2,5,7,9 được đặt một. Khóa 118 băm vào 3 và 5; bit 3 bằng không nên chắc chắn không thuộc tập.</desc>
<g font-family="Arial,sans-serif" fill="#263238"><text x="35" y="38" font-size="23" font-weight="700">Chỉ số bit tăng từ trái sang phải</text>
<g font-size="19" text-anchor="middle"><text x="90" y="92">0</text><text x="170" y="92">1</text><text x="250" y="92">2</text><text x="330" y="92">3</text><text x="410" y="92">4</text><text x="490" y="92">5</text><text x="570" y="92">6</text><text x="650" y="92">7</text><text x="730" y="92">8</text><text x="810" y="92">9</text><text x="890" y="92">10</text></g>
<g stroke="#2f3e7a" stroke-width="3"><rect x="55" y="110" width="70" height="65" fill="#f7efe6"/><rect x="135" y="110" width="70" height="65" fill="#fff"/><rect x="215" y="110" width="70" height="65" fill="#f7efe6"/><rect x="295" y="110" width="70" height="65" fill="#fff"/><rect x="375" y="110" width="70" height="65" fill="#fff"/><rect x="455" y="110" width="70" height="65" fill="#f7efe6"/><rect x="535" y="110" width="70" height="65" fill="#fff"/><rect x="615" y="110" width="70" height="65" fill="#f7efe6"/><rect x="695" y="110" width="70" height="65" fill="#fff"/><rect x="775" y="110" width="70" height="65" fill="#f7efe6"/><rect x="855" y="110" width="70" height="65" fill="#fff"/></g>
<g font-size="31" text-anchor="middle"><text x="90" y="154">1</text><text x="170" y="154">0</text><text x="250" y="154">1</text><text x="330" y="154" fill="#e62727">0</text><text x="410" y="154">0</text><text x="490" y="154">1</text><text x="570" y="154">0</text><text x="650" y="154">1</text><text x="730" y="154">0</text><text x="810" y="154">1</text><text x="890" y="154">0</text></g>
<g font-size="23"><text x="55" y="225">25 → (5, 2)</text><text x="285" y="225">159 → (7, 0)</text><text x="540" y="225">585 → (9, 7)</text><text x="55" y="280" font-weight="700">Kiểm tra 118 → (3, 5)</text><text x="385" y="280">bit 3 = 0</text><text x="570" y="280" fill="#2e7d32" font-weight="700">chắc chắn 118 ∉ S</text><text x="55" y="330" fill="#607d8b">Khi thêm 585, bit 7 đã bằng 1 nên phép đặt bit này va chạm.</text></g></g></svg>
