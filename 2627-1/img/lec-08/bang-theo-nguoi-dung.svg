<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="btn-t btn-d">
<title id="btn-t">Bảng giữ hoặc bỏ theo người dùng</title>
<desc id="btn-d">Năm bộ đến lần lượt: (An, “đồ thị”), (Bình, “lọc”), (An, “băm”), (An, “đồ thị”), (Chi, “lọc”). Sau năm bộ, bảng tra có ba hàng, một hàng cho mỗi người dùng: An rút số 0, nhãn giữ; Bình rút số 7, nhãn bỏ; Chi rút số 4, nhãn bỏ. Các lần gặp lại An chỉ tra bảng, không thêm hàng. Mỗi người dùng mới thêm một hàng.</desc>
<defs><marker id="btn-a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#263238">
<text x="125" y="40" text-anchor="middle" font-weight="700">Bộ đến</text>
<g fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"><rect x="5" y="58" width="240" height="44" rx="8"/><rect x="5" y="110" width="240" height="44" rx="8"/><rect x="5" y="162" width="240" height="44" rx="8"/><rect x="5" y="214" width="240" height="44" rx="8"/><rect x="5" y="266" width="240" height="44" rx="8"/></g>
<text x="125" y="89" text-anchor="middle">(An, “đồ thị”)</text>
<text x="125" y="141" text-anchor="middle">(Bình, “lọc”)</text>
<text x="125" y="193" text-anchor="middle">(An, “băm”)</text>
<text x="125" y="245" text-anchor="middle">(An, “đồ thị”)</text>
<text x="125" y="297" text-anchor="middle">(Chi, “lọc”)</text>
<path d="M250 184 H298" stroke="#2f3e7a" stroke-width="4" fill="none" marker-end="url(#btn-a)"/>
<text x="500" y="40" text-anchor="middle" font-weight="700">Bảng tra theo người dùng</text>
<rect x="305" y="80" width="390" height="46" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/>
<g fill="none" stroke="#2f3e7a" stroke-width="2"><rect x="305" y="126" width="390" height="46"/><rect x="305" y="172" width="390" height="46"/><rect x="305" y="218" width="390" height="46"/><path d="M475 80 V264 M570 80 V264"/></g>
<rect x="305" y="264" width="390" height="40" fill="none" stroke="#2f3e7a" stroke-width="2" stroke-dasharray="8 6"/>
<text x="390" y="112" text-anchor="middle" font-weight="700">Người dùng</text><text x="522" y="112" text-anchor="middle" font-weight="700">Số rút</text><text x="632" y="112" text-anchor="middle" font-weight="700">Nhãn</text>
<text x="390" y="158" text-anchor="middle">An</text><text x="522" y="158" text-anchor="middle">0</text><text x="632" y="158" text-anchor="middle" font-weight="700">giữ</text>
<text x="390" y="204" text-anchor="middle">Bình</text><text x="522" y="204" text-anchor="middle">7</text><text x="632" y="204" text-anchor="middle">bỏ</text>
<text x="390" y="250" text-anchor="middle">Chi</text><text x="522" y="250" text-anchor="middle">4</text><text x="632" y="250" text-anchor="middle">bỏ</text>
<text x="500" y="292" text-anchor="middle">…</text>
<text x="350" y="370" text-anchor="middle">Mỗi người dùng mới thêm một hàng</text>
</g></svg>
