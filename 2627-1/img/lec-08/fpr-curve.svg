<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="fpr-title fpr-desc">
  <title id="fpr-title">Xác suất dương giả theo số hàm băm</title>
  <desc id="fpr-desc">Đồ thị trục tuyến tính với k từ 1 đến 10 và xác suất từ 0 đến 0,12. Khi có tám bit trên mỗi khóa, hai điểm k bằng 5 và 6 được đánh dấu; k bằng 6 có xác suất nhỏ nhất, khoảng 0,02158.</desc>
  <g font-family="Arial, sans-serif" fill="#263238">
    <g stroke="#d5dae2" stroke-width="1"><path d="M110 45H930M110 105H930M110 165H930M110 225H930M110 285H930"/></g>
    <path d="M110 45V285H930" fill="none" stroke="#263238" stroke-width="3"/>
    <g font-size="20" text-anchor="end"><text x="98" y="52">0,12</text><text x="98" y="112">0,09</text><text x="98" y="172">0,06</text><text x="98" y="232">0,03</text><text x="98" y="292">0</text></g>
    <text x="26" y="30" font-size="21" font-weight="700">Xác suất dương giả</text><text x="930" y="348" font-size="21" font-weight="700" text-anchor="end">Số hàm băm k</text>
    <polyline points="145,50 225,187 305,224 385,237 465,242 545,242 625,239 705,234 785,227 865,217" fill="none" stroke="#b15a2b" stroke-width="6" stroke-linejoin="round"/>
    <g fill="#2f3e7a"><circle cx="145" cy="50" r="7"/><circle cx="225" cy="187" r="7"/><circle cx="305" cy="224" r="7"/><circle cx="385" cy="237" r="7"/><circle cx="625" cy="239" r="7"/><circle cx="705" cy="234" r="7"/><circle cx="785" cy="227" r="7"/><circle cx="865" cy="217" r="7"/></g>
    <rect x="456" y="233" width="18" height="18" fill="#fff" stroke="#2e7d32" stroke-width="5"/><circle cx="545" cy="242" r="11" fill="#2e7d32" stroke="#263238" stroke-width="2"/>
    <g font-size="19" text-anchor="middle"><text x="145" y="317">1</text><text x="225" y="317">2</text><text x="305" y="317">3</text><text x="385" y="317">4</text><text x="465" y="317">5</text><text x="545" y="317">6</text><text x="625" y="317">7</text><text x="705" y="317">8</text><text x="785" y="317">9</text><text x="865" y="317">10</text></g>
    <g font-size="20"><text x="415" y="205" fill="#2e7d32">k=5: 0,02168</text><text x="560" y="272" fill="#2e7d32" font-weight="700">k=6: 0,02158</text><text x="770" y="68" fill="#607d8b">n/m = 8</text></g>
  </g>
</svg>
