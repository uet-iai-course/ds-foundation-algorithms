<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 192" role="img" aria-labelledby="cmb-t cmb-d">
<title id="cmb-t">Một mảng chung và bốn mảng chia</title>
<desc id="cmb-d">Trái: một mảng 64 bit, chỉ số 0 đến 63; khóa v được băm bằng bốn hàm h1, h2, h3, h4 vào bất kỳ vị trí nào của cả mảng, ở đây h2 và h3 rơi vào cùng một bit. Phải: 64 bit chia thành bốn mảng, mỗi mảng 16 bit; hàm h1 chỉ băm vào mảng 1, h2 vào mảng 2, h3 vào mảng 3, h4 vào mảng 4. Bit bị trúng có nền đậm.</desc>
