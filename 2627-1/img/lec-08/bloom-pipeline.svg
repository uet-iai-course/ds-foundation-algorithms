<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" role="img" aria-labelledby="t d">
<title id="t">Bloom filter đứng trước phép tra cứu đắt</title><desc id="d">Khóa dòng đi qua Bloom filter. Kết quả chắc chắn không thuộc bị loại; kết quả có thể thuộc mới đi tới phép tra cứu chính xác.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b15a2b"/></marker></defs>
<g font-family="Arial,sans-serif" font-size="24" fill="#263238"><rect x="30" y="110" width="160" height="80" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="110" y="160" text-anchor="middle">khóa đến</text><path d="M190 150 H330" stroke="#b15a2b" stroke-width="4" marker-end="url(#a)"/><rect x="345" y="85" width="230" height="130" rx="16" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="460" y="140" text-anchor="middle" font-weight="700">Bloom filter</text><text x="460" y="177" text-anchor="middle">kiểm tra k bit</text><path d="M575 125 H750" stroke="#2e7d32" stroke-width="4" marker-end="url(#a)"/><text x="665" y="102" text-anchor="middle">có thể thuộc</text><rect x="765" y="78" width="205" height="95" rx="12" fill="#eef7f2" stroke="#2e7d32" stroke-width="3"/><text x="867" y="120" text-anchor="middle">tra cứu chính xác</text><text x="867" y="150" text-anchor="middle">trên S</text><path d="M460 215 V275 H745" stroke="#e62727" stroke-width="4" marker-end="url(#a)"/><text x="605" y="260" text-anchor="middle">có bit 0: loại</text><text x="835" y="285" text-anchor="middle" fill="#e62727">chắc chắn không thuộc</text></g></svg>
