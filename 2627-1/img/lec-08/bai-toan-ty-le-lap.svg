<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" role="img" aria-labelledby="btl-t btl-d">
<title id="btl-t">Dòng truy vấn tìm kiếm, tỷ lệ lặp của An và ngân sách lưu một phần mười</title>
<desc id="btl-d">Trên: năm bộ theo thứ tự đến, ghi (người dùng, truy vấn), lược thời gian: (An, “đồ thị”), (Bình, “lọc”), (An, “đệ quy”), (An, “đồ thị”), (Chi, “lọc”); ba bộ của An có khung đậm. Dưới trái: khối bộ của An, “đồ thị” hai lần, “đệ quy” một lần, tỷ lệ lặp 1/2. Dưới phải: hai thanh ngang vẽ theo tỷ lệ 10 : 1; thanh dài là dòng, vài trăm triệu bộ mỗi ngày; thanh ngắn khung nét đứt là phần lưu được, 1/10; bên cạnh ghi câu hỏi lưu 1/10 nào.</desc>
<g font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#263238">
<text x="10" y="26" font-weight="700">bộ theo thứ tự đến, ghi (người dùng, truy vấn), lược thời gian</text>
<rect x="10" y="40" width="222" height="52" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="5"/>
<text x="121" y="76" text-anchor="middle" font-weight="700">(An, “đồ thị”)</text>
<rect x="244" y="40" width="222" height="52" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/>
<text x="355" y="76" text-anchor="middle">(Bình, “lọc”)</text>
<rect x="478" y="40" width="222" height="52" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="5"/>
<text x="589" y="76" text-anchor="middle" font-weight="700">(An, “đệ quy”)</text>
<rect x="712" y="40" width="222" height="52" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="5"/>
<text x="823" y="76" text-anchor="middle" font-weight="700">(An, “đồ thị”)</text>
<rect x="946" y="40" width="222" height="52" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/>
<text x="1057" y="76" text-anchor="middle">(Chi, “lọc”)</text>
<rect x="10" y="120" width="390" height="172" rx="10" fill="#fdf6ef" stroke="#b15a2b" stroke-width="2"/>
<text x="205" y="154" text-anchor="middle" font-weight="700">bộ của An</text>
<text x="205" y="192" text-anchor="middle">“đồ thị”: 2 lần</text>
<text x="205" y="228" text-anchor="middle">“đệ quy”: 1 lần</text>
<text x="205" y="268" text-anchor="middle" font-weight="700">tỷ lệ lặp: 1/2</text>
<text x="450" y="140">dòng: vài trăm triệu bộ mỗi ngày</text>
<rect x="450" y="152" width="700" height="40" fill="#f7efe6" stroke="#263238" stroke-width="3"/>
<text x="450" y="236">lưu được: 1/10</text>
<rect x="450" y="248" width="70" height="40" fill="#ffffff" stroke="#263238" stroke-width="3" stroke-dasharray="9 6"/>
<text x="540" y="278" font-weight="700">lưu 1/10 nào?</text>
</g></svg>
