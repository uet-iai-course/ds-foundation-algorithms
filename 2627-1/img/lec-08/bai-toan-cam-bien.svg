<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330" role="img" aria-labelledby="btc-t btc-d">
<title id="btc-t">Ba truy vấn trên dòng của một cảm biến và ràng buộc bộ nhớ</title>
<desc id="btc-d">Trái, trên: dòng của một cảm biến gồm tám số 1, 5, 2, 7, 4, 0, 3, 5, đến lần lượt từ x1 đến x8 theo chiều mũi tên. Trái, dưới: lưới ba hàng, tám cột; ba hàng là giá trị lớn nhất, trung bình mọi số, trung bình 24 số gần nhất; mỗi cột ứng với thời điểm sau một số; mọi ô ghi dấu hỏi, tức câu trả lời cần có sau mỗi số. Phải: hai cột đứng chung đáy. Cột cao là lịch sử của một triệu cảm biến, khoảng 3,5 TB mỗi ngày, tăng theo r. Cột thấp khung nét đứt là bộ nhớ, cỡ cố định.</desc>
