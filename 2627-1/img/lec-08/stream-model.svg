<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="t d">
<title id="t">Mô hình xử lý dòng dữ liệu</title><desc id="d">Ba dòng phần tử đi vào bộ xử lý có bộ nhớ làm việc hữu hạn; bộ xử lý trả lời truy vấn thường trực và có thể ghi kho lưu trữ.</desc>
