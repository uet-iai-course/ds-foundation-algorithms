<title id="t">Lấy mẫu nhất quán theo khóa</title><desc id="d">Các bộ có cùng khóa người dùng đi qua cùng hàm băm; khóa có giá trị băm nhỏ hơn ba được giữ toàn bộ.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b15a2b"/></marker></defs>
<g font-family="Arial,sans-serif" font-size="22" fill="#263238"><text x="70" y="42" font-weight="700">Bộ đến</text>
<g fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"><rect x="45" y="60" width="280" height="48" rx="8"/><rect x="45" y="120" width="280" height="48" rx="8"/><rect x="45" y="180" width="280" height="48" rx="8"/><rect x="45" y="240" width="280" height="48" rx="8"/></g>
<text x="65" y="91">(An, “đồ thị”, t₁)</text><text x="65" y="151">(Bình, “băm”, t₂)</text><text x="65" y="211">(An, “đồ thị”, t₃)</text><text x="65" y="271">(Chi, “lọc”, t₄)</text>
