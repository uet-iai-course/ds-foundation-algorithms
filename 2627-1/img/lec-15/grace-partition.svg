<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Grace Hash Join chia hai quan hệ bằng cùng hàm băm thành sáu cặp phân hoạch"><title>Phân hoạch Grace Hash Join</title><desc>student một trăm khối và takes bốn trăm khối cùng đi qua hàm h để tạo sáu cặp phân hoạch tương ứng; chỉ các cặp cùng số cần nối.</desc><g font-family="sans-serif" text-anchor="middle"><text x="580" y="38" font-size="28" font-weight="700" fill="#2F3E7A">Cùng khóa luôn đi vào cùng số phân hoạch</text><text x="130" y="110" font-size="24" font-weight="700">student: 100</text><text x="1030" y="110" font-size="24" font-weight="700">takes: 400</text><circle cx="580" cy="115" r="55" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="580" y="125" font-size="28" font-weight="700">h</text><g font-size="19"><text x="580" y="205">6 cặp phân hoạch với M = 20</text></g><g fill="#EEF2FA" stroke="#2F3E7A" stroke-width="2"><rect x="150" y="245" width="120" height="90"/><rect x="295" y="245" width="120" height="90"/><rect x="440" y="245" width="120" height="90"/><rect x="600" y="245" width="120" height="90"/><rect x="745" y="245" width="120" height="90"/><rect x="890" y="245" width="120" height="90"/></g><g font-size="20"><text x="210" y="285">s₀ ↔ r₀</text><text x="355" y="285">s₁ ↔ r₁</text><text x="500" y="285">s₂ ↔ r₂</text><text x="660" y="285">s₃ ↔ r₃</text><text x="805" y="285">s₄ ↔ r₄</text><text x="950" y="285">s₅ ↔ r₅</text><text x="580" y="392" font-size="23" fill="#B15A2B">mỗi phân hoạch xây phải vừa vùng M − 2 khối</text></g></g></svg>
