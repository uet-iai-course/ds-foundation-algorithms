<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Grace Hash Join chia hai quan hệ thành bảy cặp phân hoạch với bố trí bộ đệm khả thi"><title>Phân hoạch Grace Hash Join</title><desc>Với hai mươi khối bộ nhớ, lô hai khối và bảy phân hoạch, pha phân hoạch dùng mười sáu khối; phía xây một trăm khối chia thành các phân hoạch không quá mười lăm khối.</desc><g font-family="sans-serif" text-anchor="middle"><text x="580" y="38" font-size="28" font-weight="700" fill="#2F3E7A">Cùng khóa đi vào cùng một trong bảy cặp</text><text x="145" y="105" font-size="23" font-weight="700">student: 100 khối</text><text x="1015" y="105" font-size="23" font-weight="700">takes: 400 khối</text><circle cx="580" cy="105" r="48" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="580" y="115" font-size="27" font-weight="700">h₁</text><text x="580" y="185" font-size="21">M = 20; b_b = 2; p_h = 7</text><g fill="#EEF2FA" stroke="#2F3E7A" stroke-width="2"><rect x="75" y="225" width="120" height="85"/><rect x="220" y="225" width="120" height="85"/><rect x="365" y="225" width="120" height="85"/><rect x="520" y="225" width="120" height="85"/><rect x="675" y="225" width="120" height="85"/><rect x="820" y="225" width="120" height="85"/><rect x="965" y="225" width="120" height="85"/></g><g font-size="19"><text x="135" y="275">s₀ ↔ r₀</text><text x="280" y="275">s₁ ↔ r₁</text><text x="425" y="275">s₂ ↔ r₂</text><text x="580" y="275">s₃ ↔ r₃</text><text x="735" y="275">s₄ ↔ r₄</text><text x="880" y="275">s₅ ↔ r₅</text><text x="1025" y="275">s₆ ↔ r₆</text><text x="580" y="365" font-size="22" fill="#B15A2B">100 → 15; 15; 14; 14; 14; 14; 14</text><text x="580" y="405" font-size="21">pha phân hoạch: (p_h + 1)b_b = 16 ≤ 20</text></g></g></svg>
