<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" role="img" aria-label="Bảng băm phân biệt hai tuple trùng khóa với hai khóa khác nhau va chạm cùng ngăn"><title>Bản sao và va chạm băm</title><desc>Hai tuple khóa 17 là bản sao cần giữ; khóa 23 khác khóa 17 nhưng va chạm cùng ngăn và bị loại khi kiểm khóa thật.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#B15A2B"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><text x="580" y="38" font-size="28" font-weight="700" fill="#2F3E7A">Băm định vị ngăn; so sánh khóa xác nhận kết quả</text><rect x="55" y="110" width="260" height="200" rx="14" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="185" y="160" font-size="24" font-weight="700">xây trên s</text><text x="185" y="210" font-size="22">giữ mọi tuple</text><text x="185" y="250" font-size="22">cùng khóa</text><path d="M315 210H465" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><rect x="500" y="85" width="260" height="250" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="630" y="135" font-size="24" font-weight="700">bảng băm</text><text x="630" y="185" font-size="22">0: [s₀]</text><text x="630" y="225" font-size="22">1: [s₁₇, s'₁₇, s₂₃]</text><text x="630" y="265" font-size="22">2: [ ]</text><path d="M760 210H900" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><rect x="925" y="110" width="190" height="200" rx="14" fill="#EDF7EE" stroke="#2E7D32" stroke-width="3"/><text x="1020" y="165" font-size="24" font-weight="700">dò r₁₇</text><text x="1020" y="215" font-size="22">giữ s₁₇, s'₁₇</text><text x="1020" y="255" font-size="22">loại s₂₃</text><text x="580" y="385" font-size="22" fill="#B15A2B">17 = 17: bản sao · 23 ≠ 17: va chạm</text></g></svg>
