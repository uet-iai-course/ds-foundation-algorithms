<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Bản đồ chọn thuật toán nối theo điều kiện nối, chỉ mục, thứ tự, bộ nhớ và độ lệch"><title>Bản đồ chọn thuật toán nối</title><desc>Nối theta tổng quát đi tới vòng lặp lồng; nối bằng xét chỉ mục, thứ tự hoặc băm; dữ liệu lệch cần đường lui an toàn.</desc><g font-family="sans-serif" text-anchor="middle"><text x="580" y="38" font-size="28" font-weight="700" fill="#2F3E7A">Điều kiện và trạng thái dữ liệu thu hẹp lựa chọn</text><rect x="455" y="75" width="250" height="75" rx="12" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="580" y="122" font-size="24">điều kiện nối</text><path d="M520 150L240 230M640 150L920 230" stroke="#B15A2B" stroke-width="4"/><rect x="80" y="225" width="320" height="115" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="240" y="270" font-size="23">theta tổng quát</text><text x="240" y="310" font-size="21">Nested / Block Nested</text><rect x="760" y="225" width="320" height="115" rx="12" fill="#EDF7EE" stroke="#2E7D32" stroke-width="3"/><text x="920" y="270" font-size="23">bằng hoặc tự nhiên</text><text x="920" y="310" font-size="20">chỉ mục / sắp xếp / băm</text><text x="580" y="395" font-size="22" fill="#B15A2B">so sánh cả truyền khối, seek, bộ nhớ và skew</text></g></svg>
