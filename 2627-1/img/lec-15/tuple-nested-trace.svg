<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" role="img" aria-label="Vết Nested-Loop Join quét toàn bộ quan hệ trong cho từng tuple ngoài"><title>Vết vòng lặp lồng theo tuple</title><desc>Ba tuple ngoài lần lượt kích hoạt ba lượt quét qua bốn tuple trong; ba cặp có cùng khóa được xuất.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#B15A2B"/></marker></defs><g font-family="sans-serif"><text x="580" y="36" text-anchor="middle" font-size="28" font-weight="700" fill="#2F3E7A">Mỗi tuple ngoài mở một lượt quét trong</text><g font-size="23"><text x="80" y="95">r ngoài</text><text x="80" y="155">(1, An)</text><text x="80" y="225">(2, Bình)</text><text x="80" y="295">(4, Chi)</text><text x="360" y="95">s trong: (1,A), (1,B), (3,C), (4,D)</text></g><g stroke="#B15A2B" stroke-width="4" marker-end="url(#a)"><path d="M170 148H985"/><path d="M170 218H985"/><path d="M170 288H985"/></g><g font-size="21"><text x="440" y="140">khớp khóa 1 hai lần</text><text x="520" y="210">không khớp</text><text x="780" y="280">khớp khóa 4</text></g><text x="580" y="382" text-anchor="middle" font-size="23" fill="#B15A2B">không cần chỉ mục; áp dụng được cho mọi điều kiện nối</text></g></svg>
