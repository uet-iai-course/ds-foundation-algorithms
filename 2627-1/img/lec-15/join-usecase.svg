<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" role="img" aria-label="Kết nối bảng sự kiện takes với bảng thực thể student khi cả hai lớn hơn bộ nhớ"><title>Kết nối bảng sự kiện với bảng thực thể</title><desc>Bảng student một trăm khối và bảng takes bốn trăm khối đi qua phép nối theo ID để tạo các cặp khớp.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#B15A2B"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><text x="580" y="38" font-size="28" font-weight="700" fill="#2F3E7A">Hai bảng đều nằm trên đĩa</text><rect x="55" y="95" width="300" height="230" rx="16" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="205" y="145" font-size="27" font-weight="700">student</text><text x="205" y="205" font-size="24">5.000 tuple</text><text x="205" y="250" font-size="24">100 khối</text><rect x="805" y="95" width="300" height="230" rx="16" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="955" y="145" font-size="27" font-weight="700">takes</text><text x="955" y="205" font-size="24">10.000 tuple</text><text x="955" y="250" font-size="24">400 khối</text><path d="M355 210H485M805 210H675" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><circle cx="580" cy="210" r="92" fill="#EDF7EE" stroke="#2E7D32" stroke-width="4"/><text x="580" y="195" font-size="26" font-weight="700">nối theo ID</text><text x="580" y="235" font-size="22">mọi cặp trùng khóa</text><text x="580" y="385" font-size="23" fill="#B15A2B">đơn vị I/O là khối; kết quả không tính chi phí ghi</text></g></svg>
