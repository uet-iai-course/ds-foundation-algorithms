<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" role="img" aria-label="Hai cách bố trí bộ đệm của Block Nested-Loop Join"><title>Bố trí bộ đệm Block Nested</title><desc>Khi vật chất hóa đầu ra, nhóm ngoài có M trừ hai khối; khi chuyển tiếp đầu ra và không giữ bộ đệm ra riêng, nhóm ngoài có M trừ một khối.</desc><g font-family="sans-serif" text-anchor="middle"><text x="580" y="38" font-size="28" font-weight="700" fill="#2F3E7A">Kích thước nhóm ngoài phụ thuộc bố trí bộ đệm</text><rect x="55" y="90" width="500" height="245" rx="16" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="305" y="130" font-size="23" font-weight="700">Đầu ra vật chất hóa</text><rect x="85" y="170" width="300" height="95" fill="#dce4f5" stroke="#2F3E7A" stroke-width="2"/><rect x="400" y="170" width="60" height="95" fill="#F7EFE6" stroke="#B15A2B" stroke-width="2"/><rect x="470" y="170" width="60" height="95" fill="#EDF7EE" stroke="#2E7D32" stroke-width="2"/><text x="235" y="225" font-size="22">q = M − 2</text><text x="430" y="212" font-size="17">khối</text><text x="430" y="238" font-size="17">trong</text><text x="500" y="212" font-size="17">khối</text><text x="500" y="238" font-size="17">ra</text><rect x="605" y="90" width="500" height="245" rx="16" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="855" y="130" font-size="23" font-weight="700">Đầu ra chuyển tiếp</text><rect x="635" y="170" width="370" height="95" fill="#dce4f5" stroke="#2F3E7A" stroke-width="2"/><rect x="1020" y="170" width="60" height="95" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="2"/><text x="820" y="225" font-size="22">q = M − 1</text><text x="1050" y="212" font-size="17">khối</text><text x="1050" y="238" font-size="17">trong</text><text x="580" y="385" font-size="23" fill="#B15A2B">khai báo quy ước trước khi thay q vào công thức</text></g></svg>
