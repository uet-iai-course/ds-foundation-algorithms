<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" role="img" aria-label="Block Nested-Loop Join giữ M trừ hai khối của quan hệ ngoài trong bộ nhớ"><title>Vòng lặp lồng theo nhóm khối</title><desc>Bộ nhớ M khối dành M trừ hai khối cho quan hệ ngoài, một khối cho quan hệ trong và một khối cho đầu ra.</desc><g font-family="sans-serif" text-anchor="middle"><text x="580" y="38" font-size="28" font-weight="700" fill="#2F3E7A">Một nhóm ngoài tái sử dụng cả lượt quét trong</text><rect x="55" y="95" width="650" height="235" rx="16" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="380" y="135" font-size="25" font-weight="700">Bộ nhớ M khối</text><g fill="#dce4f5" stroke="#2F3E7A" stroke-width="2"><rect x="90" y="175" width="390" height="100"/><rect x="500" y="175" width="80" height="100"/><rect x="595" y="175" width="80" height="100"/></g><text x="285" y="230" font-size="23">M − 2 khối ngoài</text><text x="540" y="215" font-size="18">1 khối</text><text x="540" y="242" font-size="18">trong</text><text x="635" y="215" font-size="18">1 khối</text><text x="635" y="242" font-size="18">ra</text><rect x="790" y="125" width="300" height="180" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="940" y="180" font-size="24">số lượt quét trong</text><text x="940" y="235" font-size="30" font-weight="700">⌈bᵣ/(M−2)⌉</text><text x="580" y="382" font-size="23" fill="#B15A2B">đưa quan hệ ít khối hơn ra ngoài</text></g></svg>
