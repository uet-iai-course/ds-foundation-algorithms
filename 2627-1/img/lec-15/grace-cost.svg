<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" role="img" aria-label="Ba lượt truyền khối của Grace Hash Join gồm đọc ghi phân hoạch và đọc để nối"><title>Chi phí truyền khối của Grace Hash Join</title><desc>Hai quan hệ tổng năm trăm khối được đọc và ghi khi phân hoạch rồi đọc lại khi nối, cho chi phí lý tưởng một nghìn năm trăm lần truyền khối.</desc><g font-family="sans-serif" text-anchor="middle"><text x="580" y="38" font-size="28" font-weight="700" fill="#2F3E7A">Mỗi khối đi qua ba lần truyền lý tưởng</text><g><rect x="75" y="115" width="280" height="190" rx="14" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="215" y="165" font-size="24" font-weight="700">đọc để phân hoạch</text><text x="215" y="230" font-size="30">500</text><rect x="440" y="115" width="280" height="190" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="580" y="165" font-size="24" font-weight="700">ghi phân hoạch</text><text x="580" y="230" font-size="30">500</text><rect x="805" y="115" width="280" height="190" rx="14" fill="#EDF7EE" stroke="#2E7D32" stroke-width="3"/><text x="945" y="165" font-size="24" font-weight="700">đọc để nối</text><text x="945" y="230" font-size="30">500</text></g><text x="580" y="370" font-size="28" font-weight="700" fill="#B15A2B">3(100 + 400) = 1.500</text></g></svg>
