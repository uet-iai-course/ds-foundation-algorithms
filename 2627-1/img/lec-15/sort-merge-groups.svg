<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Sort-Merge Join tạo tích Descartes giữa hai nhóm tuple có cùng khóa"><title>Ghép hai nhóm khóa trùng</title><desc>Quan hệ r có hai tuple khóa 2 và quan hệ s có ba tuple khóa 2; thuật toán xuất đủ sáu cặp trước khi tiến sang khóa mới.</desc><g font-family="sans-serif" text-anchor="middle"><text x="580" y="38" font-size="28" font-weight="700" fill="#2F3E7A">Khóa trùng tạo tích hai nhóm</text><rect x="65" y="95" width="300" height="230" rx="14" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="215" y="140" font-size="24" font-weight="700">nhóm r, khóa 2</text><text x="215" y="205" font-size="24">r₂₁, r₂₂</text><rect x="795" y="95" width="300" height="230" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="945" y="140" font-size="24" font-weight="700">nhóm s, khóa 2</text><text x="945" y="205" font-size="24">s₂₁, s₂₂, s₂₃</text><rect x="445" y="125" width="270" height="170" rx="14" fill="#EDF7EE" stroke="#2E7D32" stroke-width="3"/><text x="580" y="175" font-size="24">2 × 3</text><text x="580" y="225" font-size="32" font-weight="700">6 cặp</text><text x="580" y="382" font-size="23" fill="#B15A2B">không được tiến qua nhóm trước khi xuất hết tích</text></g></svg>
