<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" role="img" aria-label="Ba khóa phía ngoài tra chỉ mục và giữ đủ hai bản sao khóa 17"><title>Vết Indexed Nested-Loop Join</title><desc>Khóa ngoài 17 nhận hai con trỏ, khóa 23 nhận danh sách rỗng, và khóa 17 cuối lại nhận đủ hai con trỏ.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#B15A2B"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><text x="580" y="38" font-size="28" font-weight="700" fill="#2F3E7A">Mỗi tuple ngoài nhận trọn danh sách con trỏ</text><rect x="55" y="100" width="250" height="220" rx="14" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="180" y="145" font-size="23" font-weight="700">khóa phía ngoài</text><text x="180" y="195" font-size="25">r₁: 17</text><text x="180" y="240" font-size="25">r₂: 23</text><text x="180" y="285" font-size="25">r₃: 17</text><path d="M305 210H450" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><rect x="480" y="90" width="260" height="240" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="610" y="140" font-size="25" font-weight="700">B+-Tree trên ID</text><text x="610" y="200" font-size="23">17 → [s₁,s₂]</text><text x="610" y="245" font-size="23">23 → []</text><text x="610" y="290" font-size="20">không bỏ bản sao</text><path d="M740 210H880" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><rect x="910" y="115" width="200" height="190" rx="14" fill="#EDF7EE" stroke="#2E7D32" stroke-width="3"/><text x="1010" y="160" font-size="22" font-weight="700">số cặp xuất</text><text x="1010" y="230" font-size="45" font-weight="700">4</text><text x="580" y="385" font-size="22" fill="#B15A2B">khóa vắng không làm dừng vòng ngoài</text></g></svg>
