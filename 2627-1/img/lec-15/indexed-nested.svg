<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" role="img" aria-label="Indexed Nested-Loop Join tra chỉ mục của quan hệ trong cho từng tuple ngoài"><title>Vòng lặp lồng dùng chỉ mục</title><desc>Mỗi tuple ngoài đưa khóa nối vào B cộng tree của quan hệ trong, nhận các con trỏ rồi đọc mọi tuple có khóa bằng nhau.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#B15A2B"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><text x="580" y="38" font-size="28" font-weight="700" fill="#2F3E7A">Thay lượt quét trong bằng phép tra chỉ mục</text><rect x="60" y="125" width="250" height="160" rx="14" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="185" y="180" font-size="24">tuple ngoài</text><text x="185" y="230" font-size="26" font-weight="700">ID = 17</text><path d="M310 205H470" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><rect x="500" y="95" width="240" height="220" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="620" y="145" font-size="25" font-weight="700">B+-Tree trên ID</text><text x="620" y="205" font-size="23">lá → con trỏ</text><text x="620" y="250" font-size="22">giữ mọi bản sao</text><path d="M740 205H880" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><rect x="905" y="125" width="205" height="160" rx="14" fill="#EDF7EE" stroke="#2E7D32" stroke-width="3"/><text x="1007" y="180" font-size="23">tuple trong</text><text x="1007" y="225" font-size="22">ID = 17</text><text x="580" y="380" font-size="22" fill="#B15A2B">chỉ dùng cho nối bằng hoặc nối tự nhiên</text></g></svg>
