  <text x="60" y="125" font-size="24">P<tspan baseline-shift="sub">cây</tspan></text><text x="190" y="125" font-size="28" font-family="monospace">1  3  4  8</text><text x="60" y="210" font-size="24">P<tspan baseline-shift="sub">tìm</tspan></text><text x="190" y="210" font-size="28" font-family="monospace">2  3  6  8</text>
