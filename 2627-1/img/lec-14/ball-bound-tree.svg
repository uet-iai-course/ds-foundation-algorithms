<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="Ball tree dùng cận dưới khoảng cách từ truy vấn đến tâm trừ bán kính và tổ chức các ball trong cây">
  <g font-family="sans-serif" text-anchor="middle"><text x="580" y="38" font-size="28" font-weight="700" fill="#2F3E7A">Một ball cho cận dưới tới mọi điểm bên trong</text><rect x="40" y="75" width="580" height="310" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><circle cx="390" cy="225" r="115" fill="none" stroke="#2E7D32" stroke-width="5"/><circle cx="390" cy="225" r="7" fill="#2E7D32"/><text x="410" y="215" font-size="22">c</text><circle cx="125" cy="225" r="8" fill="#B15A2B"/><text x="105" y="205" font-size="22">q</text><path d="M125 225H390" stroke="#777" stroke-width="4"/><path d="M275 225H390" stroke="#2E7D32" stroke-width="6"/><text x="335" y="205" font-size="22">r</text><text x="205" y="205" font-size="22">δ(q,c)−r</text>
  <rect x="780" y="75" width="220" height="62" rx="10" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="890" y="114" font-size="23">B(c,r)</text><g fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"><rect x="680" y="245" width="190" height="62" rx="10"/><rect x="920" y="245" width="190" height="62" rx="10"/></g><text x="775" y="283" font-size="22">ball trái</text><text x="1015" y="283" font-size="22">ball phải</text><path d="M840 137L775 245M940 137L1015 245" stroke="#777" stroke-width="3"/><text x="580" y="415" font-size="22" fill="#B15A2B">LB = max(0, δ(q,c)−r)</text></g>
</svg>
