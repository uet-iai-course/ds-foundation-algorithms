<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" role="img" aria-label="Vết số kd-tree với q bằng 3 phẩy 2, hai nghiệm đồng hạng và một nhánh bị cắt">
  <g font-family="sans-serif" text-anchor="middle"><text x="580" y="36" font-size="28" font-weight="700" fill="#2F3E7A">Thăm p, giữ s đồng hạng, cắt miền x ≥ 5</text><rect x="45" y="70" width="650" height="300" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><path d="M405 70V370" stroke="#B15A2B" stroke-width="5"/><path d="M525 70V370" stroke="#777" stroke-width="4" stroke-dasharray="8 6"/><circle cx="285" cy="220" r="9" fill="#B15A2B"/><text x="285" y="252" font-size="22">q=(3,2)</text><circle cx="165" cy="220" r="9" fill="#2E7D32"/><text x="165" y="196" font-size="22">p=(2,2)</text><circle cx="405" cy="220" r="9" fill="#2E7D32"/><text x="405" y="196" font-size="22">s=(4,2)</text><circle cx="585" cy="145" r="8" fill="#777"/><circle cx="625" cy="300" r="8" fill="#777"/><path d="M285 220H165M285 220H405" stroke="#2E7D32" stroke-width="4"/><text x="345" y="248" font-size="21">LB=1=τ</text><text x="550" y="342" font-size="21">LB=2&gt;τ</text>
  <rect x="750" y="80" width="365" height="270" rx="16" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="932" y="130" font-size="23">1. p cho τ=1</text><text x="932" y="185" font-size="23">2. x≥4: LB=1 ⇒ thăm</text><text x="932" y="240" font-size="23">3. s cách q đúng 1 ⇒ thêm</text><text x="932" y="295" font-size="23">4. x≥5: LB=2 ⇒ cắt</text><text x="580" y="410" font-size="22" fill="#B15A2B">best={p,s}, τ=1</text></g>
</svg>
