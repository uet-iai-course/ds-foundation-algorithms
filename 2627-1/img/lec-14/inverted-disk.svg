<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 420" role="img" aria-label="B cộng tree ánh xạ thuật ngữ tới các trang posting liên tiếp trên đĩa">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#B15A2B"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><text x="580" y="42" font-size="29" font-weight="700" fill="#2F3E7A">Từ điển nhỏ, posting nằm theo đoạn trang</text>
  <rect x="65" y="105" width="300" height="190" rx="16" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="4"/><text x="215" y="155" font-size="25" font-weight="700">B+-Tree thuật ngữ</text><text x="215" y="210" font-size="23">cây → địa chỉ đầu</text><text x="215" y="255" font-size="23">tìm → địa chỉ đầu</text>
