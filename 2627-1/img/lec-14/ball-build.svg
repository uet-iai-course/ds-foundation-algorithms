<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" role="img" aria-label="Cách dựng ball tree chọn hai điểm xa, chiếu điểm lên hướng nối và chia theo trung vị có phá hòa">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#B15A2B"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><text x="580" y="38" font-size="28" font-weight="700" fill="#2F3E7A">Hướng trải rộng rồi chia theo hạng trung vị</text><circle cx="150" cy="220" r="8" fill="#B15A2B"/><text x="150" y="195" font-size="22">x₁</text><circle cx="470" cy="145" r="8" fill="#2E7D32"/><text x="470" y="120" font-size="22">x₂</text><g fill="#111"><circle cx="220" cy="260" r="7"/><circle cx="285" cy="185" r="7"/><circle cx="350" cy="300" r="7"/><circle cx="405" cy="205" r="7"/></g><path d="M150 220L500 138" stroke="#777" stroke-width="4" marker-end="url(#a)"/><text x="320" y="105" font-size="22">hướng x₁−x₂</text>
