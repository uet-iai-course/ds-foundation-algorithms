<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" role="img" aria-label="Các ô không gian đổi thành nhiều đoạn khóa Z-order rồi được tra bằng B cộng tree và lọc lại">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#B15A2B"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><text x="580" y="38" font-size="28" font-weight="700" fill="#2F3E7A">Một vùng có thể thành nhiều đoạn khóa</text><rect x="45" y="85" width="315" height="250" rx="14" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="202" y="135" font-size="23">vùng truy vấn</text><text x="202" y="205" font-size="25">mã {4, 7, 10, 13}</text><text x="202" y="270" font-size="22">nhiều đoạn rời</text><path d="M360 210H525" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><rect x="560" y="85" width="250" height="250" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="685" y="135" font-size="24" font-weight="700">B+-Tree theo z</text><text x="685" y="195" font-size="22">quét từng đoạn</text><text x="685" y="250" font-size="22">lấy ứng viên</text><path d="M810 210H930" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><rect x="955" y="120" width="165" height="180" rx="14" fill="#EDF7EE" stroke="#2E7D32" stroke-width="3"/><text x="1037" y="185" font-size="23">tinh lọc</text><text x="1037" y="230" font-size="21">theo tọa độ</text><text x="580" y="385" font-size="22" fill="#B15A2B">thứ tự tuyến tính không giữ mọi lân cận hình học</text></g>
