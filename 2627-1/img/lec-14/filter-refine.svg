  <rect x="45" y="90" width="390" height="250" rx="14" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><rect x="105" y="155" width="140" height="115" fill="none" stroke="#B15A2B" stroke-width="4"/><ellipse cx="305" cy="215" rx="105" ry="55" fill="none" stroke="#2E7D32" stroke-width="5"/><text x="240" y="130" font-size="23">hộp bao giao vùng hỏi</text>
