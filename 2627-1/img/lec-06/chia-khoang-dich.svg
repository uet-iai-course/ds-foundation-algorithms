<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 365" role="img" aria-labelledby="title desc">
<title id="title">Chia khoảng trên trục hình chiếu</title><desc id="desc">Các khoảng nửa mở có độ rộng a; biên có dạng ka−delta. Hai hình chiếu cách nhau ell, có thể bị biên tách.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="35" y="95" width="100" height="120" fill="#edf4ff"/><line x1="35" y1="75" x2="35" y2="245" stroke="#2f3e7a" stroke-width="3"/><text x="85" y="275" font-size="24" fill="#233247" text-anchor="middle">k = -2</text><rect x="135" y="95" width="100" height="120" fill="#fff4e9"/><line x1="135" y1="75" x2="135" y2="245" stroke="#2f3e7a" stroke-width="3"/><text x="185" y="275" font-size="24" fill="#233247" text-anchor="middle">k = -1</text><rect x="235" y="95" width="100" height="120" fill="#edf4ff"/><line x1="235" y1="75" x2="235" y2="245" stroke="#2f3e7a" stroke-width="3"/><text x="285" y="275" font-size="24" fill="#233247" text-anchor="middle">k = 0</text><rect x="335" y="95" width="100" height="120" fill="#fff4e9"/><line x1="335" y1="75" x2="335" y2="245" stroke="#2f3e7a" stroke-width="3"/><text x="385" y="275" font-size="24" fill="#233247" text-anchor="middle">k = 1</text><rect x="435" y="95" width="100" height="120" fill="#edf4ff"/><line x1="435" y1="75" x2="435" y2="245" stroke="#2f3e7a" stroke-width="3"/><text x="485" y="275" font-size="24" fill="#233247" text-anchor="middle">k = 2</text><rect x="535" y="95" width="100" height="120" fill="#fff4e9"/><line x1="535" y1="75" x2="535" y2="245" stroke="#2f3e7a" stroke-width="3"/><line x1="35" y1="170" x2="635" y2="170" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><text x="315" y="35" font-size="30" fill="#233247" text-anchor="middle">Biên: ka − δ</text><circle cx="265" cy="170" r="8" fill="#2f3e7a"/><circle cx="320" cy="170" r="8" fill="#a85b23"/><text x="265" y="140" font-size="26" fill="#233247" text-anchor="middle">u · x</text><text x="335" y="140" font-size="26" fill="#233247" text-anchor="middle">u · y</text><line x1="265" y1="305" x2="320" y2="305" stroke="#a85b23" stroke-width="3"/><text x="292" y="343" font-size="30" fill="#a85b23" text-anchor="middle">ℓ</text></g></svg>