<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" role="img">
<title>Băm siêu phẳng cho độ tương đồng cosin</title>
<desc>Hai vector tạo góc theta; pháp tuyến ngẫu nhiên phân chia chúng với xác suất theta trên pi.</desc>
<style>text{font-family:Arial,sans-serif;fill:#26345f}.t{font-size:25px}.v{stroke-width:6;marker-end:url(#m)}.p{stroke:#b15a2b;stroke-width:5}</style>
<defs>
<marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
<path d="M0,0 L0,6 L9,3 z" fill="#26345f"/>
</marker>
</defs>
<path class="p" d="M70 420L620 80"/>
<path class="v" stroke="#2f3e7a" d="M330 300L570 260"/>
<path class="v" stroke="#2e7d32" d="M330 300L470 100"/>
<path fill="none" stroke="#26345f" stroke-width="3" d="M430 283 A105 105 0 0 0 389 214"/>
<text class="t" x="430" y="238">θ</text>
<text class="t" x="585" y="270">x</text>
<text class="t" x="475" y="95">y</text>
<path class="v" stroke="#b15a2b" d="M330 300L210 105"/>
<text class="t" x="175" y="95">v</text>
<text class="t" x="350" y="470" text-anchor="middle">hᵥ(x)=dấu(v·x), với v đẳng hướng</text>
</svg>
