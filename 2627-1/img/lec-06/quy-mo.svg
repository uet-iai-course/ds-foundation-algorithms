<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img">
<title>Quy mô Ví dụ 3.10</title>
<desc>Một triệu chữ ký tạo gần năm trăm tỷ cặp, trong khi toàn bộ chữ ký chỉ chiếm khoảng một gigabyte.</desc>
<style>text{font-family:Arial,sans-serif;fill:#26345f}.n{font-size:36px;font-weight:bold}.s{font-size:25px}.b{fill:#f7efe6;stroke:#b15a2b;stroke-width:3}.a{stroke:#b15a2b;stroke-width:4;marker-end:url(#m)}</style>
<defs>
<marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
<path d="M0,0 L0,6 L9,3 z" fill="#b15a2b"/>
</marker>
</defs>
<rect class="b" x="30" y="80" width="220" height="150" rx="16"/>
<text class="n" x="140" y="140" text-anchor="middle">10⁶</text>
<text class="s" x="140" y="180" text-anchor="middle">văn bản</text>
<text class="s" x="140" y="210" text-anchor="middle">250 số / chữ ký</text>
<path class="a" d="M260 155H370"/>
<rect class="b" x="385" y="80" width="190" height="150" rx="16"/>
<text class="n" x="480" y="145" text-anchor="middle">≈ 1 GB</text>
<text class="s" x="480" y="190" text-anchor="middle">lưu chữ ký</text>
<path class="a" d="M585 155H680"/>
<rect class="b" x="695" y="65" width="180" height="180" rx="16"/>
<text class="n" x="785" y="125" text-anchor="middle">≈ 5·10¹¹</text>
<text class="s" x="785" y="165" text-anchor="middle">cặp</text>
<text class="s" x="785" y="205" text-anchor="middle">≈ 6 ngày</text>
<text class="s" x="450" y="320" text-anchor="middle">Nút thắt là số cặp, không phải dung lượng chữ ký.</text>
</svg>
