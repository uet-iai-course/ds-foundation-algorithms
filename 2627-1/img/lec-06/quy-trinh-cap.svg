<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 205" role="img" aria-labelledby="title desc">
<title id="title">Quy trình tạo và xác minh cặp</title><desc id="desc">Chữ ký đi qua khóa dải, sinh ứng viên duy nhất rồi kiểm tập gốc.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="15" y="40" width="230" height="80" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="130.0" y="89.0" font-size="28" fill="#2f3e7a" text-anchor="middle">Chữ ký</text><line x1="251" y1="80" x2="279" y2="80" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="285" y="40" width="230" height="80" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="400.0" y="89.0" font-size="28" fill="#2f3e7a" text-anchor="middle">Khóa dải</text><line x1="521" y1="80" x2="549" y2="80" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="555" y="40" width="230" height="80" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="670.0" y="89.0" font-size="28" fill="#2f3e7a" text-anchor="middle">Ứng viên</text><line x1="791" y1="80" x2="819" y2="80" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="825" y="40" width="230" height="80" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="940.0" y="89.0" font-size="28" fill="#2f3e7a" text-anchor="middle">Kiểm tập gốc</text><text x="555" y="172" font-size="30" fill="#233247" text-anchor="middle">Tập cặp duy nhất trước khi xác minh</text></g></svg>