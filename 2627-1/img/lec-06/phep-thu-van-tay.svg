<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 665 380" role="img" aria-labelledby="title desc">
<title id="title">Phép thử ba ô vân tay</title><desc id="desc">Lưới khái niệm đánh dấu ba ô được chọn trước khi xét ảnh. Ảnh có đủ ba ô vào một thùng chung; mỗi ảnh thiếu ô nhận thùng đơn riêng.</desc>
