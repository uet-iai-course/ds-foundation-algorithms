troke-width="2"/><rect x="246" y="197" width="54" height="54" fill="#fff" stroke="#2f3e7a" stroke-width="2"/><rect x="30" y="251" width="54" height="54" fill="#fff" stroke="#2f3e7a" stroke-width="2"/><rect x="84" y="251" width="54" height="54" fill="#fff" stroke="#2f3e7a" stroke-width="2"/><rect x="138" y="251" width="54" height="54" fill="#fff" stroke="#2f3e7a" stroke-width="2"/><rect x="192" y="251" width="54" height="54" fill="#fff" stroke="#2f3e7a" stroke-width="2"/><rect x="246" y="251" width="54" height="54" fill="#fff" stroke="#2f3e7a" stroke-width="2"/><text x="165" y="344" font-size="26" fill="#233247" text-anchor="middle">Ba ô chọn từ lưới</text><line x1="315" y1="180" x2="365" y2="180" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="385" y="65" width="245" height="95" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="507.5" y="121.5" font-size="28" fill="#2f3e7a" text-anchor="middle">Có đủ ba ô</text><text x="508" y="198" font-size="27" fill="#233247" text-anchor="middle">→ thùng chung</text><rect x="385" y="235" width="245" height="65" rx="9" fill="#fff4e9" stroke="#a85b23" stroke-width="2"/><text x="507.5" y="276.5" font-size="28" fill="#a85b23" text-anchor="middle">Thiếu ít nhất một ô</text><text x="508" y="344" font-size="27" fill="#233247" text-anchor="middle">→ thùng riêng</text></g></svg>