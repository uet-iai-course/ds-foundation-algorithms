<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 335" role="img" aria-labelledby="title desc">
<title id="title">Độ dài đoạn nối và hình chiếu</title><desc id="desc">Đoạn nối x với y dài rho tạo góc nhọn phi với trục chiếu u. Đường vuông góc nét đứt xác định đoạn chiếu dài ell bằng rho nhân trị tuyệt đối cos phi. Hình biểu diễn quan hệ chiếu, không ấn định độ rộng thùng a.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif"><line x1="55" y1="240" x2="575" y2="240" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="90" y1="240" x2="380" y2="65" stroke="#2f3e7a" stroke-width="3"/><line x1="380" y1="65" x2="380" y2="240" stroke="#a85b23" stroke-width="3" stroke-dasharray="8 5"/><line x1="90" y1="273" x2="380" y2="273" stroke="#a85b23" stroke-width="3"/><path d="M362,240 V222 H380" fill="none" stroke="#a85b23" stroke-width="2"/><path d="M158,240 A68,68 0 0 0 148.2,204.9" fill="none" stroke="#26704e" stroke-width="3"/><text x="183" y="224" font-size="36" fill="#26704e" text-anchor="middle">φ</text><text x="218" y="135" font-size="38" fill="#2f3e7a" text-anchor="middle">ρ</text><text x="240" y="312" font-size="32" fill="#a85b23" text-anchor="middle">ℓ = ρ |cos φ|</text><text x="548" y="220" font-size="34" fill="#233247" text-anchor="middle">u</text><text x="75" y="218" font-size="32" fill="#233247" text-anchor="middle">x</text><text x="402" y="65" font-size="32" fill="#233247" text-anchor="middle">y</text><circle cx="90" cy="240" r="6" fill="#2f3e7a"/><circle cx="380" cy="65" r="6" fill="#2f3e7a"/></g></svg>