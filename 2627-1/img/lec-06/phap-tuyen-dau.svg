<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 390" role="img" aria-labelledby="title desc">
<title id="title">Pháp tuyến và hai nửa không gian</title><desc id="desc">Mặt phân chia v nhân x bằng 0 nằm ngang; pháp tuyến vuông góc và hướng vào miền dấu dương. Hình hai chiều mô tả quan hệ, không phải tọa độ của ví dụ bốn chiều.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif"><path d="M40,40 H580 V180 H40 Z" fill="#edf4ff"/><path d="M40,180 H580 V315 H40 Z" fill="#fff4e9"/><line x1="40" y1="180" x2="580" y2="180" stroke="#2f3e7a" stroke-width="3"/><line x1="310" y1="180" x2="310" y2="48" stroke="#a85b23" stroke-width="3" marker-end="url(#arrow)"/><text x="440" y="162" font-size="28" fill="#233247" text-anchor="middle">v · x = 0</text><text x="356" y="60" font-size="32" fill="#a85b23" text-anchor="middle">v</text><text x="115" y="105" font-size="32" fill="#233247" text-anchor="middle">Dấu +</text><text x="115" y="265" font-size="32" fill="#233247" text-anchor="middle">Dấu −</text><text x="310" y="356" font-size="26" fill="#233247" text-anchor="middle">Pháp tuyến vuông góc mặt phân chia</text></g></svg>