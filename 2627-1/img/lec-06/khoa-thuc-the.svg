<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 360" role="img" aria-labelledby="title desc">
<title id="title">Ba khóa tạo ứng viên thực thể</title><desc id="desc">Khớp tên, địa chỉ hoặc điện thoại đều có thể sinh cặp; hợp các tập cặp trước khi chấm điểm và xác minh.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="15" y="50" width="250" height="70" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="140.0" y="94.0" font-size="28" fill="#2f3e7a" text-anchor="middle">Tên</text><rect x="15" y="145" width="250" height="70" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="140.0" y="189.0" font-size="28" fill="#2f3e7a" text-anchor="middle">Địa chỉ</text><rect x="15" y="240" width="250" height="70" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="140.0" y="284.0" font-size="28" fill="#2f3e7a" text-anchor="middle">Điện thoại</text><line x1="277" y1="85" x2="365" y2="180" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="277" y1="180" x2="365" y2="180" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="277" y1="275" x2="365" y2="180" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="380" y="135" width="235" height="90" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="497.5" y="189.0" font-size="28" fill="#2f3e7a" text-anchor="middle">Hợp ứng viên</text><line x1="630" y1="180" x2="715" y2="180" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="730" y="135" width="285" height="90" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="872.5" y="189.0" font-size="28" fill="#2f3e7a" text-anchor="middle">Chấm điểm, xác minh</text></g></svg>