<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 435" role="img" aria-labelledby="title desc">
<title id="title">Hai miền hướng làm khác dấu</title><desc id="desc">Hai hướng x,y tạo góc theta, có cung theta giữa hai mũi tên. Hai miền hướng pháp tuyến đối nhau làm dấu khác nhau, mỗi miền có góc theta; chú giải nằm ngoài vòng tròn.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif"><circle cx="200" cy="205" r="145" fill="#f6f8fc" stroke="#2f3e7a" stroke-width="2"/><path d="M200,205 L200.0,60.0 A145,145 0 0 0 74.42631645125643,132.49999999999994 Z" fill="#ffe5c6" stroke="#a85b23" stroke-dasharray="6 4"/><path d="M200,205 L199.99999999999997,350.0 A145,145 0 0 0 325.5736835487436,277.50000000000006 Z" fill="#ffe5c6" stroke="#a85b23" stroke-dasharray="6 4"/><line x1="200" y1="205" x2="345.0" y2="205.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><text x="367.0" y="210.0" font-size="30" fill="#233247" text-anchor="middle">x</text><line x1="200" y1="205" x2="272.5" y2="79.4263164512564" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><text x="294.5" y="84.4263164512564" font-size="30" fill="#233247" text-anchor="middle">y</text><path d="M265,205 A65,65 0 0 0 232.5,148.7083487540115" fill="none" stroke="#26704e" stroke-width="3"/><text x="274" y="171" font-size="32" fill="#26704e" text-anchor="middle">θ</text><text x="108" y="53" font-size="30" fill="#a85b23" text-anchor="middle">θ</text><text x="286" y="377" font-size="30" fill="#a85b23" text-anchor="middle">θ</text><text x="510" y="115" font-size="27" fill="#233247" text-anchor="middle">Hai miền tách</text><text x="510" y="164" font-size="28" fill="#a85b23" text-anchor="middle">Tổng góc 2θ</text><text x="510" y="213" font-size="27" fill="#233247" text-anchor="middle">trên góc 2π</text><text x="330" y="411" font-size="26" fill="#233247" text-anchor="middle">Hướng pháp tuyến đều trên vòng tròn</text></g></svg>