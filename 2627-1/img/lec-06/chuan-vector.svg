<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 470" role="img" aria-labelledby="title desc">
<title id="title">Khoảng cách giữa hai điểm</title><desc id="desc">Hai điểm (2,7) và (6,4). Hai trục dùng cùng tỷ lệ 50 đơn vị ảnh cho một đơn vị tọa độ; độ lệch 4 và 3 tạo đoạn nối dài 5.</desc>
