 y="42" font-size="32" fill="#a85b23" text-anchor="middle">Δ₁ = 4</text><text x="463" y="137" font-size="32" fill="#a85b23" text-anchor="middle">Δ₂ = 3</text><text x="246" y="168" font-size="36" fill="#2f3e7a" text-anchor="middle">L₂ = 5</text><text x="604" y="419" font-size="34" fill="#233247" text-anchor="middle">x₁</text><text x="32" y="35" font-size="32" fill="#233247" text-anchor="middle">x₂</text></g></svg>