<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img">
<title>Chia chữ ký thành các dải</title>
<desc>Ma trận chữ ký p hàng được chia thành b dải, mỗi dải có r hàng.</desc>
<style>text{font-family:Arial,sans-serif;fill:#26345f}.h{font-size:28px;font-weight:bold}.t{font-size:24px}.c{fill:#edf4ff;stroke:#2f3e7a;stroke-width:2}.d{fill:#f7efe6;stroke:#b15a2b;stroke-width:3}</style>
<text class="h" x="450" y="35" text-anchor="middle">p = br hàng</text>
<g transform="translate(180,65)">
<rect class="c" width="540" height="300"/>
<path stroke="#2f3e7a" stroke-width="2" d="M180 0V300M360 0V300"/>
<path stroke="#b15a2b" stroke-width="4" d="M0 100H540M0 200H540"/>
<text class="t" x="90" y="-12" text-anchor="middle">D₁</text>
<text class="t" x="270" y="-12" text-anchor="middle">D₂</text>
<text class="t" x="450" y="-12" text-anchor="middle">D₃</text>
<text class="t" x="-75" y="55">dải 1</text>
<text class="t" x="-75" y="155">dải 2</text>
<text class="t" x="-75" y="255">dải b</text>
<text class="h" x="270" y="58" text-anchor="middle">r hàng</text>
<text class="h" x="270" y="158" text-anchor="middle">r hàng</text>
<text class="h" x="270" y="258" text-anchor="middle">r hàng</text>
</g>
<text class="t" x="450" y="410" text-anchor="middle">Trùng toàn bộ một dải ⇒ cặp ứng viên</text>
</svg>
