<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 312" role="img" aria-labelledby="title desc">
<title id="title">Ba kiểu dữ liệu chưa có họ băm</title><desc id="desc">Ba cặp dữ liệu: véc-tơ bit 10101 và 11110 với khoảng cách Hamming 3; hai véc-tơ (1,2,−1) và (2,1,1) với góc π/3; hai điểm (2,7) và (6,4) với khoảng cách Euclid 5. Cả ba đi vào ô Họ băm có dấu hỏi, viền nét đứt; sau đó là ba khối Khóa dải, Ứng viên, Xác minh, giữ nguyên như phân dải.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="10" y="12" width="330" height="86" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="175" y="48" font-size="27" fill="#233247" text-anchor="middle">10101 và 11110</text><text x="175" y="84" font-size="27" fill="#233247" text-anchor="middle">Hamming = 3</text><line x1="346" y1="55" x2="402" y2="160" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="10" y="112" width="330" height="86" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="175" y="148" font-size="27" fill="#233247" text-anchor="middle">(1,2,−1) và (2,1,1)</text><text x="175" y="184" font-size="27" fill="#233247" text-anchor="middle">Góc θ = π/3</text><line x1="346" y1="155" x2="402" y2="160" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="10" y="212" width="330" height="86" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="175" y="248" font-size="27" fill="#233247" text-anchor="middle">(2,7) và (6,4)</text><text x="175" y="284" font-size="27" fill="#233247" text-anchor="middle">Euclid L₂ = 5</text><line x1="346" y1="255" x2="402" y2="160" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="410" y="85" width="170" height="150" rx="9" fill="#fff4e9" stroke="#a85b23" stroke-width="3" stroke-dasharray="10 6"/><text x="495" y="140" font-size="28" fill="#a85b23" text-anchor="middle">Họ băm</text><text x="495" y="192" font-size="44" fill="#a85b23" text-anchor="middle">?</text><rect x="620" y="120" width="145" height="80" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="692.5" y="169.0" font-size="28" fill="#2f3e7a" text-anchor="middle">Khóa dải</text><line x1="584" y1="160" x2="614" y2="160" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="800" y="120" width="145" height="80" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="872.5" y="169.0" font-size="28" fill="#2f3e7a" text-anchor="middle">Ứng viên</text><line x1="769" y1="160" x2="794" y2="160" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="980" y="120" width="145" height="80" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="1052.5" y="169.0" font-size="28" fill="#2f3e7a" text-anchor="middle">Xác minh</text><line x1="949" y1="160" x2="974" y2="160" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><text x="872" y="262" font-size="27" fill="#233247" text-anchor="middle">Giữ nguyên như phân dải</text></g></svg>