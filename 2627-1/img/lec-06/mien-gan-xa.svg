<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 300" role="img" aria-labelledby="title desc">
<title id="title">Ba miền của họ nhạy cảm</title><desc id="desc">Miền gần có cận dưới p1, miền xa có cận trên p2, miền giữa không có bảo đảm từ định nghĩa.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="10" y="20" width="232" height="180" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="126" y="62" font-size="30" fill="#2f3e7a" text-anchor="middle">Gần</text><text x="126" y="106" font-size="28" fill="#233247" text-anchor="middle">d ≤ d₁</text><text x="126" y="146" font-size="26" fill="#233247" text-anchor="middle">Pr[h(x)=h(y)]</text><text x="126" y="184" font-size="28" fill="#233247" text-anchor="middle">≥ p₁</text><rect x="250" y="20" width="232" height="180" rx="9" fill="#f8fafc" stroke="#5f6b7a" stroke-width="2"/><text x="366" y="62" font-size="30" fill="#5f6b7a" text-anchor="middle">Giữa</text><text x="366" y="110" font-size="28" fill="#233247" text-anchor="middle">d₁ &lt; d &lt; d₂</text><text x="366" y="158" font-size="25" fill="#233247" text-anchor="middle">không có cận chung</text><rect x="490" y="20" width="232" height="180" rx="9" fill="#fff4e9" stroke="#a85b23" stroke-width="2"/><text x="606" y="62" font-size="30" fill="#a85b23" text-anchor="middle">Xa</text><text x="606" y="106" font-size="28" fill="#233247" text-anchor="middle">d ≥ d₂</text><text x="606" y="146" font-size="26" fill="#233247" text-anchor="middle">Pr[h(x)=h(y)]</text><text x="606" y="184" font-size="28" fill="#233247" text-anchor="middle">≤ p₂</text><line x1="10" y1="240" x2="715" y2="240" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><text x="705" y="282" font-size="28" fill="#233247" text-anchor="end">Khoảng cách d</text></g></svg>