<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 335" role="img" aria-labelledby="title desc">
<title id="title">Ba miền của họ nhạy cảm</title><desc id="desc">Miền gần có cận dưới p1, miền xa có cận trên p2, miền giữa không có bảo đảm từ định nghĩa.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="40" y="60" width="280" height="90" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="180.0" y="114.0" font-size="28" fill="#2f3e7a" text-anchor="middle">Gần: d ≤ d₁</text><rect x="355" y="60" width="280" height="90" rx="9" fill="#f8fafc" stroke="#788597" stroke-width="2"/><text x="495.0" y="114.0" font-size="28" fill="#788597" text-anchor="middle">d₁ &lt; d &lt; d₂</text><rect x="670" y="60" width="280" height="90" rx="9" fill="#fff4e9" stroke="#a85b23" stroke-width="2"/><text x="810.0" y="114.0" font-size="28" fill="#a85b23" text-anchor="middle">Xa: d ≥ d₂</text><text x="180" y="205" font-size="28" fill="#233247" text-anchor="middle">Pr[h(x)=h(y)] ≥ p₁</text><text x="495" y="205" font-size="28" fill="#233247" text-anchor="middle">Không có cận chung</text><text x="810" y="205" font-size="28" fill="#233247" text-anchor="middle">Pr[h(x)=h(y)] ≤ p₂</text><line x1="40" y1="265" x2="950" y2="265" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><text x="930" y="310" font-size="26" fill="#233247" text-anchor="end">Khoảng cách d</text></g></svg>