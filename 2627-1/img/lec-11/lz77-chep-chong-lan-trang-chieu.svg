<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 178" role="img" aria-labelledby="title desc">
<title id="title">Sao chép chồng lấn khi giải mã (3, 4, b) sau aac</title><desc id="desc">Một hàng tám ô y1 đến y8 chứa aacaacab. Ba ô đầu aac có trước bộ ba (3, 4, b). Bốn mũi tên cong phía dưới hàng, ghi j = 1 đến 4, chép y1 sang y4, y2 sang y5, y3 sang y6, y4 sang y7. Ô y4 viền nét đứt đậm màu cam: nó là đích của bước j = 1 và là nguồn của bước j = 4. Ô y8 = b, viền xanh lục, là ký tự kế.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="178" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="20.0" y="82.0" font-size="28" fill="#233247" text-anchor="start" font-weight="bold">y</text><rect x="170.0" y="40.0" width="92.0" height="62.0" rx="4" fill="#f4f6f9" stroke="#233247" stroke-width="2"/><text x="216.0" y="81.0" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">a</text><rect x="266.0" y="40.0" width="92.0" height="62.0" rx="4" fill="#f4f6f9" stroke="#233247" stroke-width="2"/><text x="312.0" y="81.0" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">a</text><rect x="362.0" y="40.0" width="92.0" height="62.0" rx="4" fill="#f4f6f9" stroke="#233247" stroke-width="2"/><text x="408.0" y="81.0" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">c</text><rect x="458.0" y="40.0" width="92.0" height="62.0" rx="4" fill="#fff4e9" stroke="#a85b23" stroke-width="4.5" stroke-dasharray="9 6"/><text x="504.0" y="81.0" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">a</text><rect x="554.0" y="40.0" width="92.0" height="62.0" rx="4" fill="#fff4e9" stroke="#a85b23" stroke-width="3"/><text x="600.0" y="81.0" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">a</text><rect x="650.0" y="40.0" width="92.0" height="62.0" rx="4" fill="#fff4e9" stroke="#a85b23" stroke-width="3"/><text x="696.0" y="81.0" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">c</text><rect x="746.0" y="40.0" width="92.0" height="62.0" rx="4" fill="#fff4e9" stroke="#a85b23" stroke-width="3"/><text x="792.0" y="81.0" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">a</text><rect x="842.0" y="40.0" width="92.0" height="62.0" rx="4" fill="#eef7f2" stroke="#26704e" stroke-width="3.5"/><text x="888.0" y="81.0" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">b</text><text x="216.0" y="28.0" font-size="21" fill="#5b6778" text-anchor="middle" font-weight="normal">y1</text><text x="312.0" y="28.0" font-size="21" fill="#5b6778" text-anchor="middle" font-weight="normal">y2</text><text x="408.0" y="28.0" font-size="21" fill="#5b6778" text-anchor="middle" font-weight="normal">y3</text><text x="504.0" y="28.0" font-size="21" fill="#5b6778" text-anchor="middle" font-weight="normal">y4</text><text x="600.0" y="28.0" font-size="21" fill="#5b6778" text-anchor="middle" font-weight="normal">y5</text><text x="696.0" y="28.0" font-size="21" fill="#5b6778" text-anchor="middle" font-weight="normal">y6</text><text x="792.0" y="28.0" font-size="21" fill="#5b6778" text-anchor="middle" font-weight="normal">y7</text><text x="888.0" y="28.0" font-size="21" fill="#5b6778" text-anchor="middle" font-weight="normal">y8</text><path d="M216.0,106.0 C216.0,134.0 498.0,134.0 498.0,106.0" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="508.0" y="138.0" font-size="21" fill="#2f3e7a" text-anchor="start" font-weight="bold">j = 1</text><path d="M318.0,106.0 C318.0,154.0 600.0,154.0 600.0,106.0" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="610.0" y="138.0" font-size="21" fill="#2f3e7a" text-anchor="start" font-weight="bold">j = 2</text><path d="M420.0,106.0 C420.0,174.0 702.0,174.0 702.0,106.0" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="712.0" y="138.0" font-size="21" fill="#2f3e7a" text-anchor="start" font-weight="bold">j = 3</text><path d="M522.0,106.0 C522.0,194.0 804.0,194.0 804.0,106.0" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="814.0" y="138.0" font-size="21" fill="#2f3e7a" text-anchor="start" font-weight="bold">j = 4</text><text x="944.0" y="70.0" font-size="21" fill="#a85b23" text-anchor="start" font-weight="bold">nguồn của j = 4</text><text x="944.0" y="96.0" font-size="21" fill="#a85b23" text-anchor="start" font-weight="bold">là ô y4 ghi ở j = 1</text></g></svg>
