<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Đường ống nén và giải nén một khối 8 × 8</title><desc id="desc">Hai hàng sáu khối. Hàng nén, từ trái sang phải: khối P điểm ảnh 8 bit; dịch mức A = P − 128; DCT F = T A Tᵀ; lượng tử hóa F̂ = round(F / Q), khối viền nét đứt đậm màu cam ghi bước duy nhất làm mất dữ liệu; sai phân DC, zigzag; mã độ dài loạt, mã entropy; ra dòng bit có ghi q. Hàng giải nén chạy từ phải sang trái: giải mã loạt, entropy; đảo zigzag, cộng dồn DC; giải lượng tử F̃ = Q F̂; IDCT Ã = Tᵀ F̃ T; cộng 128, làm tròn; khối P̃ cắt về [0, 255]. Chú thích: mọi bước trừ lượng tử hóa đảo ngược được, sai khác chỉ do làm tròn.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="960" height="420" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="20.0" y="32.0" font-size="22" fill="#2f3e7a" text-anchor="start" font-weight="bold">Nén một khối 8 × 8</text><rect x="10.0" y="48.0" width="143.0" height="96.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="81.5" y="89.7" font-size="20" fill="#2f3e7a" text-anchor="middle" font-weight="bold">khối P</text><text x="81.5" y="115.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">điểm ảnh 8 bit</text><line x1="155.0" y1="96.0" x2="167.0" y2="96.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="169.0" y="48.0" width="143.0" height="96.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="240.5" y="89.7" font-size="20" fill="#2f3e7a" text-anchor="middle" font-weight="bold">dịch mức</text><text x="240.5" y="115.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">A = P − 128</text><line x1="314.0" y1="96.0" x2="326.0" y2="96.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="328.0" y="48.0" width="143.0" height="96.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="399.5" y="89.7" font-size="20" fill="#2f3e7a" text-anchor="middle" font-weight="bold">DCT</text><text x="399.5" y="115.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">F = T A Tᵀ</text><line x1="473.0" y1="96.0" x2="485.0" y2="96.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="487.0" y="48.0" width="143.0" height="96.0" rx="8" fill="#fff4e9" stroke="#a85b23" stroke-width="4" stroke-dasharray="8 5"/><text x="558.5" y="76.7" font-size="20" fill="#a85b23" text-anchor="middle" font-weight="bold">lượng tử hóa</text><text x="558.5" y="102.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">F̂ = F/Q,</text><text x="558.5" y="128.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">làm tròn</text><line x1="632.0" y1="96.0" x2="644.0" y2="96.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="646.0" y="48.0" width="143.0" height="96.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="717.5" y="89.7" font-size="20" fill="#2f3e7a" text-anchor="middle" font-weight="bold">sai phân DC,</text><text x="717.5" y="115.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">zigzag</text><line x1="791.0" y1="96.0" x2="803.0" y2="96.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="805.0" y="48.0" width="143.0" height="96.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="876.5" y="76.7" font-size="20" fill="#2f3e7a" text-anchor="middle" font-weight="bold">mã hóa</text><text x="876.5" y="102.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">độ dài loạt,</text><text x="876.5" y="128.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">entropy</text><text x="558.5" y="172.0" font-size="21" fill="#a85b23" text-anchor="middle" font-weight="bold">bước duy nhất</text><text x="558.5" y="198.0" font-size="21" fill="#a85b23" text-anchor="middle" font-weight="bold">làm mất dữ liệu</text><line x1="876.5" y1="146.0" x2="876.5" y2="266.0" stroke="#233247" stroke-width="2.5" marker-end="url(#arrow)"/><text x="864.5" y="214.0" font-size="21" fill="#233247" text-anchor="end" font-weight="normal" font-style="italic">dòng bit (có ghi q)</text><text x="20.0" y="236.0" font-size="22" fill="#26704e" text-anchor="start" font-weight="bold">Giải nén: chạy ngược</text><rect x="10.0" y="272.0" width="143.0" height="96.0" rx="8" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="81.5" y="313.7" font-size="20" fill="#26704e" text-anchor="middle" font-weight="bold">khối P̃</text><text x="81.5" y="339.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">cắt về [0, 255]</text><line x1="167.0" y1="320.0" x2="155.0" y2="320.0" stroke="#26704e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="169.0" y="272.0" width="143.0" height="96.0" rx="8" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="240.5" y="313.7" font-size="20" fill="#26704e" text-anchor="middle" font-weight="bold">cộng 128,</text><text x="240.5" y="339.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">làm tròn</text><line x1="326.0" y1="320.0" x2="314.0" y2="320.0" stroke="#26704e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="328.0" y="272.0" width="143.0" height="96.0" rx="8" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="399.5" y="313.7" font-size="20" fill="#26704e" text-anchor="middle" font-weight="bold">IDCT</text><text x="399.5" y="339.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">Ã = Tᵀ F̃ T</text><line x1="485.0" y1="320.0" x2="473.0" y2="320.0" stroke="#26704e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="487.0" y="272.0" width="143.0" height="96.0" rx="8" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="558.5" y="313.7" font-size="20" fill="#26704e" text-anchor="middle" font-weight="bold">giải lượng tử</text><text x="558.5" y="339.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">F̃ = Q F̂</text><line x1="644.0" y1="320.0" x2="632.0" y2="320.0" stroke="#26704e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="646.0" y="272.0" width="143.0" height="96.0" rx="8" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="717.5" y="313.7" font-size="20" fill="#26704e" text-anchor="middle" font-weight="bold">đảo zigzag,</text><text x="717.5" y="339.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">cộng dồn DC</text><line x1="803.0" y1="320.0" x2="791.0" y2="320.0" stroke="#26704e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="805.0" y="272.0" width="143.0" height="96.0" rx="8" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="876.5" y="300.7" font-size="20" fill="#26704e" text-anchor="middle" font-weight="bold">giải mã</text><text x="876.5" y="326.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">entropy,</text><text x="876.5" y="352.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">độ dài loạt</text><text x="480.0" y="404.0" font-size="21" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">mọi bước trừ lượng tử hóa đảo ngược được, sai khác chỉ do làm tròn</text></g></svg>
