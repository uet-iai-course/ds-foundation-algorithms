<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">Cửa sổ LZ77 tại con trỏ p = 3</title><desc id="desc">Chuỗi aacaacabcabaaac trong mười lăm ô đánh số 1 đến 15; vạch đứng sau ô 3 là con trỏ p = 3. Ô 1 đến 3 (aac), viền liền xanh lam, là lịch sử x[1..3]. Ô 4 đến 7 (aaca), viền nét đứt màu cam, là vùng nhìn trước x[4..7]. Ô 8 (b), viền đậm xanh lục, là ký tự kế x₈ = b. Mũi tên cong từ ô 4 lùi về ô 1 ghi lùi d = 3.</desc>
