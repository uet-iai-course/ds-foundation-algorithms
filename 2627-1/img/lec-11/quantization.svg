<svg xmlns='http://www.w3.org/2000/svg' width='1100' height='340' viewBox='0 0 1100 340' role='img' aria-label='Lượng tử hóa hệ số DCT bằng cách chia cho bước lượng tử và làm tròn để tạo nhiều số không' aria-labelledby='t d'>
  <title id='t'>Lượng tử hóa hệ số DCT</title>
  <desc id='d'>Hai ô từ Hình 11.10 và 11.11 của Nelson và Gailly: âm chín chia bảy được làm tròn thành âm một rồi tái tạo thành âm bảy; ba chia mười một được làm tròn và tái tạo thành không.</desc>
  <defs>
    <marker id='a' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'>
      <path d='M0 0L9 3L0 6Z' fill='#B15A2B'/>
    </marker>
  </defs>
  <style>
    text{font:23px sans-serif;fill:#263238}.m{fill:#edf4ff;stroke:#2f3e7a;stroke-width:3}.q{fill:#f7efe6;stroke:#B15A2B;stroke-width:3}.arr{stroke:#B15A2B;stroke-width:4;marker-end:url(#a)}.z{fill:#2E7D32;font-weight:700}
  </style>
  <rect class='m' x='30' y='40' width='1040' height='105' rx='12'/>
  <text x='55' y='82'>Ô (0,2)</text><text x='205' y='82'>C = −9, Q = 7</text>
  <text x='485' y='82'>Ĉ = round(−9/7) = −1</text><text x='815' y='82'>C̃ = 7(−1) = −7</text>
  <rect class='q' x='30' y='175' width='1040' height='105' rx='12'/>
  <text x='55' y='217'>Ô (0,4)</text><text x='205' y='217'>C = 3, Q = 11</text>
  <text x='485' y='217'>Ĉ = round(3/11) = 0</text><text x='815' y='217'>C̃ = 11(0) = 0</text>
  <text class='z' x='255' y='322'>Nguồn số: Nelson–Gailly, Hình 11.10–11.11, PDF tr. 260–261.</text>
</svg>
