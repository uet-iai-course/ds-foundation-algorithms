<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" role="img" aria-labelledby="title desc">
<title id="title">Cây từ điển LZ78 sau bốn cặp đầu</title><desc id="desc">Cây từ điển LZ78 sau bốn cặp đầu của aabaacabcabcb. Gốc 0 là chuỗi rỗng. Từ gốc, cạnh a tới nút 1 (cụm a) và cạnh c tới nút 4 (cụm c). Từ nút 1, cạnh a tới nút 3 (cụm aa) và cạnh b tới nút 2 (cụm ab).</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="700" height="270" fill="#ffffff"/>
