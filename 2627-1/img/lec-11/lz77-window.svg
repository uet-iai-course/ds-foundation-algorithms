<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-label="Cửa sổ LZ77 trong vết CMU: lịch sử aac, vùng nhìn trước aacabc và cụm khớp khoảng lùi 3 độ dài 4" aria-labelledby="t d">
  <title id="t">Cửa sổ LZ77 trong vết mã hóa</title>
  <desc id="d">Sau khi xử lý aac, bộ mã hóa khớp aaca bằng khoảng lùi ba; ký tự thứ tư của cụm được lấy từ ký tự vừa mã hóa.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#B15A2B"/></marker></defs>
  <style>text{font:24px sans-serif;fill:#263238}.lab{font-weight:700;fill:#2f3e7a}.look{fill:#f7efe6;stroke:#B15A2B;stroke-width:2}.hit{fill:#c8e6c9;stroke:#2f3e7a;stroke-width:2}.arr{fill:none;stroke:#B15A2B;stroke-width:4;marker-end:url(#a)}</style>
  <text class="lab" x="115" y="44">lịch sử đã mã hóa</text><text class="lab" x="565" y="44">vùng nhìn trước</text>
  <g transform="translate(115 95)">
    <rect class="hit" width="72" height="64"/><rect class="hit" x="72" width="72" height="64"/><rect class="hit" x="144" width="72" height="64"/>
    <rect class="look" x="216" width="72" height="64"/><rect class="look" x="288" width="72" height="64"/><rect class="look" x="360" width="72" height="64"/><rect class="look" x="432" width="72" height="64"/><rect class="look" x="504" width="72" height="64"/><rect class="look" x="576" width="72" height="64"/>
    <text x="27" y="43">a</text><text x="99" y="43">a</text><text x="171" y="43">c</text><text x="243" y="43">a</text><text x="315" y="43">a</text><text x="387" y="43">c</text><text x="459" y="43">a</text><text x="531" y="43">b</text><text x="603" y="43">c</text>
  </g>
  <path stroke="#E62727" stroke-width="5" d="M331 82v92"/><text x="305" y="205" fill="#E62727">con trỏ</text>
  <path class="arr" d="M145 170C135 280 320 280 365 205"/><text x="365" y="285">khoảng lùi 3, độ dài 4</text>
</svg>
