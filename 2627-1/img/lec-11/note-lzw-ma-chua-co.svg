<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">Độ trễ một mục và mã chưa có trong từ điển LZW</title><desc id="desc">Hai hàng bốn cột cho đầu vào giả sử abababa với a = 97, b = 98. Hàng bộ mã hóa: phát 97, thêm 256 = ab; phát 98, thêm 257 = ba; phát 256, thêm 258 = aba; phát 258, hết đầu vào. Hàng bộ giải mã: đọc 97, xuất a, chưa thêm; đọc 98, xuất b, thêm 256 = ab; đọc 256, xuất ab, thêm 257 = ba; ô cuối viền nét đứt đậm: đọc 258 bằng next_code, xuất ab + a = aba, thêm 258 = aba. Mũi tên chéo nối mỗi mục bộ mã hóa thêm với cột kế tiếp của bộ giải mã. Chú thích: bộ giải mã thêm mỗi mục chậm hơn bộ mã hóa một mã.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="20.0" y="34.0" font-size="22" fill="#233247" text-anchor="start" font-weight="bold">Giả sử đầu vào abababa; mã a = 97, b = 98</text><text x="20.0" y="104.0" font-size="22" fill="#2f3e7a" text-anchor="start" font-weight="bold">Bộ mã hóa</text><text x="20.0" y="268.0" font-size="22" fill="#a85b23" text-anchor="start" font-weight="bold">Bộ giải mã</text><rect x="160.0" y="70.0" width="186.0" height="76.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="253.0" y="101.7" font-size="20" fill="#2f3e7a" text-anchor="middle" font-weight="bold">phát 97</text><text x="253.0" y="127.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">thêm 256 = ab</text><rect x="358.0" y="70.0" width="186.0" height="76.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="451.0" y="101.7" font-size="20" fill="#2f3e7a" text-anchor="middle" font-weight="bold">phát 98</text><text x="451.0" y="127.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">thêm 257 = ba</text><rect x="556.0" y="70.0" width="186.0" height="76.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="649.0" y="101.7" font-size="20" fill="#2f3e7a" text-anchor="middle" font-weight="bold">phát 256</text><text x="649.0" y="127.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">thêm 258 = aba</text><rect x="754.0" y="70.0" width="186.0" height="76.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="847.0" y="101.7" font-size="20" fill="#2f3e7a" text-anchor="middle" font-weight="bold">phát 258</text><text x="847.0" y="127.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">(hết đầu vào)</text><rect x="160.0" y="220.0" width="186.0" height="76.0" rx="8" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="253.0" y="251.7" font-size="20" fill="#a85b23" text-anchor="middle" font-weight="bold">đọc 97, xuất a</text><text x="253.0" y="277.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">(chưa thêm)</text><rect x="358.0" y="220.0" width="186.0" height="76.0" rx="8" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="451.0" y="251.7" font-size="20" fill="#a85b23" text-anchor="middle" font-weight="bold">đọc 98, xuất b</text><text x="451.0" y="277.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">thêm 256 = ab</text><rect x="556.0" y="220.0" width="186.0" height="76.0" rx="8" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="649.0" y="251.7" font-size="20" fill="#a85b23" text-anchor="middle" font-weight="bold">đọc 256, xuất ab</text><text x="649.0" y="277.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">thêm 257 = ba</text><rect x="754.0" y="200.0" width="186.0" height="124.0" rx="8" fill="#fff4e9" stroke="#a85b23" stroke-width="4" stroke-dasharray="8 5"/><text x="847.0" y="229.7" font-size="20" fill="#a85b23" text-anchor="middle" font-weight="bold">đọc 258;</text><text x="847.0" y="255.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">258 = next_code:</text><text x="847.0" y="281.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">xuất ab + a = aba,</text><text x="847.0" y="307.7" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">thêm 258 = aba</text><line x1="310.0" y1="148.0" x2="380.0" y2="216.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="508.0" y1="148.0" x2="578.0" y2="216.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="706.0" y1="148.0" x2="776.0" y2="216.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="480.0" y="368.0" font-size="21" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">bộ giải mã thêm mỗi mục chậm hơn bộ mã hóa một mã</text></g></svg>
