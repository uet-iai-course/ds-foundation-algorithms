<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">Hai đặc tả khôi phục</title><desc id="desc">Hai hàng. Hàng trên, khôi phục đúng: văn bản x qua bộ nén φ thành dòng bit, qua bộ giải nén ψ thành y; khung điều kiện viền liền: y = x với mọi x; chú thích: mỗi x một dòng bit riêng. Hàng dưới, khôi phục gần đúng: khối ảnh P qua φ thành dòng bit, qua ψ thành P̃; khung điều kiện viền nét đứt: sai số RMS giữa P và P̃ không quá ε; chú thích: nhiều khối chung một dòng bit.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="250" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="6.0" y="12.0" width="170.0" height="76.0" rx="8" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="91.0" y="58.3" font-size="25" fill="#233247" text-anchor="middle" font-weight="bold">văn bản x</text><line x1="178.0" y1="50.0" x2="226.0" y2="50.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="202.0" y="38.0" font-size="25" fill="#233247" text-anchor="middle" font-weight="bold">φ</text><rect x="230.0" y="12.0" width="150.0" height="76.0" rx="8" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="305.0" y="58.3" font-size="25" fill="#233247" text-anchor="middle" font-weight="normal">dòng bit</text><line x1="382.0" y1="50.0" x2="430.0" y2="50.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="406.0" y="38.0" font-size="25" fill="#233247" text-anchor="middle" font-weight="bold">ψ</text><rect x="434.0" y="12.0" width="110.0" height="76.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="489.0" y="59.0" font-size="27" fill="#2f3e7a" text-anchor="middle" font-weight="bold">y</text><rect x="562.0" y="16.0" width="250.0" height="68.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="687.0" y="58.3" font-size="25" fill="#2f3e7a" text-anchor="middle" font-weight="bold">y = x với mọi x</text><text x="826.0" y="58.0" font-size="23" fill="#5b6778" text-anchor="start" font-weight="normal" font-style="italic">mỗi x một dòng bit riêng</text><rect x="6.0" y="132.0" width="170.0" height="76.0" rx="8" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="91.0" y="178.3" font-size="25" fill="#233247" text-anchor="middle" font-weight="bold">khối ảnh P</text><line x1="178.0" y1="170.0" x2="226.0" y2="170.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="202.0" y="158.0" font-size="25" fill="#233247" text-anchor="middle" font-weight="bold">φ</text><rect x="230.0" y="132.0" width="150.0" height="76.0" rx="8" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="305.0" y="178.3" font-size="25" fill="#233247" text-anchor="middle" font-weight="normal">dòng bit</text><line x1="382.0" y1="170.0" x2="430.0" y2="170.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="406.0" y="158.0" font-size="25" fill="#233247" text-anchor="middle" font-weight="bold">ψ</text><rect x="434.0" y="132.0" width="110.0" height="76.0" rx="8" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="489.0" y="179.0" font-size="27" fill="#a85b23" text-anchor="middle" font-weight="bold">P̃</text><rect x="562.0" y="136.0" width="250.0" height="68.0" rx="8" fill="#fff4e9" stroke="#a85b23" stroke-width="3" stroke-dasharray="10 6"/><text x="687.0" y="178.3" font-size="25" fill="#a85b23" text-anchor="middle" font-weight="bold">RMS(P, P̃) ≤ ε</text><text x="826.0" y="178.0" font-size="23" fill="#5b6778" text-anchor="start" font-weight="normal" font-style="italic">nhiều khối chung một dòng bit</text></g></svg>
