<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
<title id="title">Bộ giải mã LZW chậm một mục và mã 258 chưa có</title><desc id="desc">Hai hàng bốn cột cho đầu vào abababa với a = 97, b = 98. Hàng mã hóa: phát 97, thêm 256 = ab; phát 98, thêm 257 = ba; phát 256, thêm 258 = aba; phát 258. Hàng giải mã: đọc 97, xuất a; đọc 98, xuất b, thêm 256 = ab; đọc 256, xuất ab, thêm 257 = ba; ô cuối viền nét đứt đậm: đọc 258 bằng next_code, xuất aba, thêm 258 = aba. Mũi tên chéo nét đứt nối mỗi mục bộ mã hóa thêm với cột kế tiếp của bộ giải mã.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="290" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="10.0" y="70.0" font-size="25" fill="#2f3e7a" text-anchor="start" font-weight="bold">Mã hóa</text><text x="10.0" y="210.0" font-size="25" fill="#a85b23" text-anchor="start" font-weight="bold">Giải mã</text><rect x="140.0" y="26.0" width="240.0" height="80.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="260.0" y="59.2" font-size="23" fill="#2f3e7a" text-anchor="middle" font-weight="bold">phát 97</text><text x="260.0" y="88.2" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">thêm 256 = ab</text><rect x="402.0" y="26.0" width="240.0" height="80.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="522.0" y="59.2" font-size="23" fill="#2f3e7a" text-anchor="middle" font-weight="bold">phát 98</text><text x="522.0" y="88.2" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">thêm 257 = ba</text><rect x="664.0" y="26.0" width="240.0" height="80.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="784.0" y="59.2" font-size="23" fill="#2f3e7a" text-anchor="middle" font-weight="bold">phát 256</text><text x="784.0" y="88.2" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">thêm 258 = aba</text><rect x="926.0" y="26.0" width="240.0" height="80.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="1046.0" y="73.7" font-size="23" fill="#2f3e7a" text-anchor="middle" font-weight="bold">phát 258</text><rect x="140.0" y="160.0" width="240.0" height="80.0" rx="8" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="260.0" y="193.2" font-size="23" fill="#a85b23" text-anchor="middle" font-weight="bold">đọc 97</text><text x="260.0" y="222.2" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">xuất a</text><rect x="402.0" y="160.0" width="240.0" height="80.0" rx="8" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="522.0" y="193.2" font-size="23" fill="#a85b23" text-anchor="middle" font-weight="bold">đọc 98, xuất b</text><text x="522.0" y="222.2" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">thêm 256 = ab</text><rect x="664.0" y="160.0" width="240.0" height="80.0" rx="8" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="784.0" y="193.2" font-size="23" fill="#a85b23" text-anchor="middle" font-weight="bold">đọc 256, xuất ab</text><text x="784.0" y="222.2" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">thêm 257 = ba</text><rect x="926.0" y="150.0" width="240.0" height="108.0" rx="8" fill="#fff4e9" stroke="#a85b23" stroke-width="4.5" stroke-dasharray="9 6"/><text x="1046.0" y="182.7" font-size="23" fill="#a85b23" text-anchor="middle" font-weight="bold">đọc 258 = next_code</text><text x="1046.0" y="211.7" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">xuất aba</text><text x="1046.0" y="240.7" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">thêm 258 = aba</text><line x1="300.0" y1="108.0" x2="492.0" y2="148.0" stroke="#5b6778" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><line x1="562.0" y1="108.0" x2="754.0" y2="148.0" stroke="#5b6778" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><line x1="824.0" y1="108.0" x2="1016.0" y2="148.0" stroke="#5b6778" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="660.0" y="280.0" font-size="22" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">mỗi mũi tên: mục bộ mã hóa thêm, bộ giải mã thêm ở cột kế tiếp</text></g></svg>
