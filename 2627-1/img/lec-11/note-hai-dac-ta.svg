<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">Hai đặc tả khôi phục</title><desc id="desc">Hai hàng. Hàng trên, khôi phục đúng: văn bản x qua bộ nén φ thành dòng bit, R bit mỗi mẫu, qua bộ giải nén ψ thành y; điều kiện y = x với mọi x; chú thích: nhiều x khác nhau không bao giờ chung một dòng bit. Hàng dưới, khôi phục gần đúng, khung điều kiện viền nét đứt: khối ảnh P qua φ và ψ thành P̃; điều kiện RMS(P, P̃) ≤ ε, tức sai số RMS giữa P và P̃ không quá ε; chú thích: nhiều khối được phép chung một dòng bit.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="960" height="300" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="10.0" y="20.0" width="170.0" height="70.0" rx="8" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="95.0" y="62.3" font-size="22" fill="#233247" text-anchor="middle" font-weight="bold">x: văn bản</text><line x1="182.0" y1="55.0" x2="228.0" y2="55.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="205.0" y="44.0" font-size="22" fill="#233247" text-anchor="middle" font-weight="bold">φ</text><rect x="232.0" y="20.0" width="190.0" height="70.0" rx="8" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="327.0" y="48.5" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">dòng bit φ(·)</text><text x="327.0" y="75.5" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">R bit mỗi mẫu</text><line x1="424.0" y1="55.0" x2="470.0" y2="55.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="447.0" y="44.0" font-size="22" fill="#233247" text-anchor="middle" font-weight="bold">ψ</text><rect x="474.0" y="20.0" width="150.0" height="70.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="549.0" y="63.0" font-size="24" fill="#2f3e7a" text-anchor="middle" font-weight="bold">y</text><rect x="650.0" y="25.0" width="300.0" height="60.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="800.0" y="62.3" font-size="22" fill="#2f3e7a" text-anchor="middle" font-weight="bold">y = x với mọi x</text><rect x="10.0" y="165.0" width="170.0" height="70.0" rx="8" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="95.0" y="207.3" font-size="22" fill="#233247" text-anchor="middle" font-weight="bold">P: khối ảnh</text><line x1="182.0" y1="200.0" x2="228.0" y2="200.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="205.0" y="189.0" font-size="22" fill="#233247" text-anchor="middle" font-weight="bold">φ</text><rect x="232.0" y="165.0" width="190.0" height="70.0" rx="8" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="327.0" y="193.5" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">dòng bit φ(·)</text><text x="327.0" y="220.5" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">R bit mỗi mẫu</text><line x1="424.0" y1="200.0" x2="470.0" y2="200.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="447.0" y="189.0" font-size="22" fill="#233247" text-anchor="middle" font-weight="bold">ψ</text><rect x="474.0" y="165.0" width="150.0" height="70.0" rx="8" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="549.0" y="208.0" font-size="24" fill="#a85b23" text-anchor="middle" font-weight="bold">P̃</text><rect x="650.0" y="170.0" width="300.0" height="60.0" rx="8" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5" stroke-dasharray="10 6"/><text x="800.0" y="207.3" font-size="22" fill="#a85b23" text-anchor="middle" font-weight="bold">RMS(P, P̃) ≤ ε</text><text x="480.0" y="140.0" font-size="21" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">khôi phục đúng: nhiều x khác nhau không bao giờ chung một dòng bit</text><text x="480.0" y="285.0" font-size="21" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">khôi phục gần đúng: nhiều khối được phép chung một dòng bit</text></g></svg>
