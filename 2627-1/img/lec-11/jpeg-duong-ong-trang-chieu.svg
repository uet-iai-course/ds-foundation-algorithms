<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Ba giai đoạn nén một ảnh JPEG theo khối</title><desc id="desc">Hai hàng sáu khối. Hàng nén, từ trái sang phải: khối P; dịch mức; DCT; lượng tử hóa, khối viền nét đứt đậm màu cam, ghi chỉ bước này làm mất dữ liệu; sai phân DC, zigzag; độ dài loạt, mã entropy; ra dòng bit có ghi q. Hàng giải nén chạy từ phải sang trái: giải mã entropy, loạt; đảo zigzag, cộng dồn DC; giải lượng tử; IDCT; cộng 128, làm tròn; khối P̃ cắt về [0, 255].</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="300" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="12.0" y="28.0" font-size="24" fill="#2f3e7a" text-anchor="start" font-weight="bold">Nén</text><rect x="12.0" y="42.0" width="178.0" height="86.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="101.0" y="93.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">khối P</text><line x1="192.0" y1="85.0" x2="209.0" y2="85.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="211.0" y="42.0" width="178.0" height="86.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="300.0" y="93.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">dịch mức</text><line x1="391.0" y1="85.0" x2="408.0" y2="85.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="410.0" y="42.0" width="178.0" height="86.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="499.0" y="93.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">DCT</text><line x1="590.0" y1="85.0" x2="607.0" y2="85.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="609.0" y="42.0" width="178.0" height="86.0" rx="8" fill="#fff4e9" stroke="#a85b23" stroke-width="5" stroke-dasharray="9 6"/><text x="698.0" y="93.0" font-size="24" fill="#a85b23" text-anchor="middle" font-weight="bold">lượng tử hóa</text><line x1="789.0" y1="85.0" x2="806.0" y2="85.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="808.0" y="42.0" width="178.0" height="86.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="897.0" y="78.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">sai phân DC,</text><text x="897.0" y="108.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">zigzag</text><line x1="988.0" y1="85.0" x2="1005.0" y2="85.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1007.0" y="42.0" width="178.0" height="86.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="1096.0" y="78.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">độ dài loạt,</text><text x="1096.0" y="108.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">mã entropy</text><line x1="1096.0" y1="130.0" x2="1096.0" y2="168.0" stroke="#233247" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1082.0" y="156.0" font-size="22" fill="#233247" text-anchor="end" font-weight="normal" font-style="italic">dòng bit có ghi q</text><text x="588.0" y="156.0" font-size="22" fill="#a85b23" text-anchor="middle" font-weight="bold">chỉ bước này làm mất dữ liệu</text><text x="12.0" y="290.0" font-size="24" fill="#26704e" text-anchor="start" font-weight="bold">Giải nén, chạy ngược</text><rect x="12.0" y="172.0" width="178.0" height="86.0" rx="8" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="101.0" y="208.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">khối P̃</text><text x="101.0" y="238.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">cắt về [0, 255]</text><line x1="209.0" y1="215.0" x2="192.0" y2="215.0" stroke="#26704e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="211.0" y="172.0" width="178.0" height="86.0" rx="8" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="300.0" y="208.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">cộng 128,</text><text x="300.0" y="238.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">làm tròn</text><line x1="408.0" y1="215.0" x2="391.0" y2="215.0" stroke="#26704e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="410.0" y="172.0" width="178.0" height="86.0" rx="8" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="499.0" y="223.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">IDCT</text><line x1="607.0" y1="215.0" x2="590.0" y2="215.0" stroke="#26704e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="609.0" y="172.0" width="178.0" height="86.0" rx="8" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="698.0" y="223.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">giải lượng tử</text><line x1="806.0" y1="215.0" x2="789.0" y2="215.0" stroke="#26704e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="808.0" y="172.0" width="178.0" height="86.0" rx="8" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="897.0" y="208.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">đảo zigzag,</text><text x="897.0" y="238.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">cộng dồn DC</text><line x1="1005.0" y1="215.0" x2="988.0" y2="215.0" stroke="#26704e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1007.0" y="172.0" width="178.0" height="86.0" rx="8" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="1096.0" y="208.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">giải mã</text><text x="1096.0" y="238.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">entropy, loạt</text></g></svg>
