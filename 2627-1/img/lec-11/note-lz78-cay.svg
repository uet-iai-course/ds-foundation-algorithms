<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
<title id="title">Cây từ điển LZ78 sau bốn cặp đầu</title><desc id="desc">Cây từ điển LZ78 sau bốn cặp đầu của chuỗi aabaacabcabcb. Gốc 0 là chuỗi rỗng. Từ gốc, cạnh a tới nút 1 (cụm a) và cạnh c tới nút 4 (cụm c). Từ nút 1, cạnh a tới nút 3 (cụm aa) và cạnh b tới nút 2 (cụm ab). Bên phải: cặp (0, a) thêm 1 = a; cặp (1, b) thêm 2 = ab; cặp (1, a) thêm 3 = aa; cặp (0, c) thêm 4 = c. Chú thích: mỗi nút là một mã; cụm của nút là các nhãn cạnh trên đường từ gốc.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="960" height="380" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><line x1="300.0" y1="90.0" x2="170.0" y2="160.0" stroke="#2f3e7a" stroke-width="2.5"/><text x="219.0" y="131.0" font-size="24" fill="#2f3e7a" text-anchor="end" font-weight="bold">a</text><line x1="300.0" y1="90.0" x2="430.0" y2="160.0" stroke="#2f3e7a" stroke-width="2.5"/><text x="381.0" y="131.0" font-size="24" fill="#2f3e7a" text-anchor="start" font-weight="bold">c</text><line x1="170.0" y1="220.0" x2="80.0" y2="290.0" stroke="#2f3e7a" stroke-width="2.5"/><text x="109.0" y="261.0" font-size="24" fill="#2f3e7a" text-anchor="end" font-weight="bold">a</text><line x1="170.0" y1="220.0" x2="260.0" y2="290.0" stroke="#2f3e7a" stroke-width="2.5"/><text x="231.0" y="261.0" font-size="24" fill="#2f3e7a" text-anchor="start" font-weight="bold">b</text><rect x="230.0" y="30.0" width="140.0" height="60.0" rx="24" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="300.0" y="68.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="bold">0: rỗng</text><rect x="100.0" y="160.0" width="140.0" height="60.0" rx="24" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="170.0" y="198.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="bold">1: a</text><rect x="360.0" y="160.0" width="140.0" height="60.0" rx="24" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="430.0" y="198.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="bold">4: c</text><rect x="10.0" y="290.0" width="140.0" height="60.0" rx="24" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="80.0" y="328.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="bold">3: aa</text><rect x="190.0" y="290.0" width="140.0" height="60.0" rx="24" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="260.0" y="328.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="bold">2: ab</text><text x="560.0" y="70.0" font-size="22" fill="#233247" text-anchor="start" font-weight="bold">Bốn cặp đầu của aabaacabcabcb</text><text x="560.0" y="112.0" font-size="22" fill="#233247" text-anchor="start" font-weight="normal">cặp (0, a): thêm 1 = a</text><text x="560.0" y="152.0" font-size="22" fill="#233247" text-anchor="start" font-weight="normal">cặp (1, b): thêm 2 = ab</text><text x="560.0" y="192.0" font-size="22" fill="#233247" text-anchor="start" font-weight="normal">cặp (1, a): thêm 3 = aa</text><text x="560.0" y="232.0" font-size="22" fill="#233247" text-anchor="start" font-weight="normal">cặp (0, c): thêm 4 = c</text><text x="560.0" y="290.0" font-size="21" fill="#5b6778" text-anchor="start" font-weight="normal" font-style="italic">mỗi nút là một mã; cụm của nút</text><text x="560.0" y="318.0" font-size="21" fill="#5b6778" text-anchor="start" font-weight="normal" font-style="italic">là các nhãn cạnh trên đường từ gốc</text></g></svg>
