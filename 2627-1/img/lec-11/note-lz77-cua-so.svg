<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
<title id="title">Cửa sổ LZ77 tại con trỏ p = 3 trên chuỗi aacaacabcabaaac</title><desc id="desc">Chuỗi aacaacabcabaaac, mười lăm ô đánh số 1 đến 15, con trỏ p = 3 đứng sau ô 3. Ô 1 đến 3 (aac) là lịch sử, viền liền màu xanh lam, ghi W = 6 nhưng mới có 3 ký tự. Ô 4 đến 7 (aaca) là vùng nhìn trước L = 4, viền nét đứt màu cam. Ô 8 (b) là ký tự kế, viền đậm màu xanh lục. Mũi tên cong từ ô 4 lùi về ô 1 ghi lùi d = 3. Dòng dưới: x[4..7] = x[1..4] = aaca; khung bên phải: bộ ba (d, ℓ, c) = (3, 4, b).</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="960" height="370" fill="#ffffff"/>
