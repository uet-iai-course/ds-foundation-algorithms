a" text-anchor="middle" font-weight="bold">lùi d = 3</text><rect x="420.0" y="286.0" width="520.0" height="70.0" rx="8" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="680.0" y="314.5" font-size="21" fill="#233247" text-anchor="middle" font-weight="bold">bộ ba (d, ℓ, c) = (3, 4, b)</text><text x="680.0" y="341.5" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">vì x[4..7] = x[1..4] = aaca, x[8] = b</text></g></svg>
