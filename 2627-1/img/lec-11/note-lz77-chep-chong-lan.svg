<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">Sao chép chồng lấn khi giải mã bộ ba (3, 4, b)</title><desc id="desc">Sáu hàng mô tả giải mã bộ ba (3, 4, b) khi bản giải mã là aac. Hàng 1: aac. Hàng j = 1: y4 ← y1, được aaca. Hàng j = 2: y5 ← y2, được aacaa. Hàng j = 3: y6 ← y3, được aacaac. Hàng j = 4: y7 ← y4, được aacaaca; ô nguồn y4 viền nét đứt, chú thích: nguồn y4 vừa được ghi ở j = 1. Hàng cuối: ghi c, y8 ← b, được aacaacab. Ở mỗi hàng, ô nguồn viền xanh lam và ô đích viền cam đậm, mũi tên đi từ nguồn tới đích.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
