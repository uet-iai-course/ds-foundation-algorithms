<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Lưới minh họa định tính các mẫu tần số không gian từ trơn đến đổi sáng tối nhanh" aria-labelledby="t d">
  <title id="t">Minh họa định tính về tần số không gian</title>
  <desc id="d">Lưới minh họa định tính: mẫu trơn ở góc trên trái, số lần đổi sáng tối tăng sang phải và xuống dưới. Hình không biểu diễn giá trị chính xác của hàm cơ sở DCT.</desc>
  <defs>
    <linearGradient id="h1"><stop stop-color="#222"/><stop offset="1" stop-color="#ddd"/></linearGradient>
    <linearGradient id="h2"><stop stop-color="#222"/><stop offset=".5" stop-color="#ddd"/><stop offset="1" stop-color="#222"/></linearGradient>
    <linearGradient id="v1" x2="0" y2="1"><stop stop-color="#222"/><stop offset="1" stop-color="#ddd"/></linearGradient>
    <linearGradient id="v2" x2="0" y2="1"><stop stop-color="#222"/><stop offset=".5" stop-color="#ddd"/><stop offset="1" stop-color="#222"/></linearGradient>
    <pattern id="x1" width="140" height="80" patternUnits="userSpaceOnUse"><rect width="70" height="40" fill="#222"/><rect x="70" width="70" height="40" fill="#ddd"/><rect y="40" width="70" height="40" fill="#ddd"/><rect x="70" y="40" width="70" height="40" fill="#222"/></pattern>
    <pattern id="x2" width="70" height="40" patternUnits="userSpaceOnUse"><rect width="35" height="20" fill="#222"/><rect x="35" width="35" height="20" fill="#ddd"/><rect y="20" width="35" height="20" fill="#ddd"/><rect x="35" y="20" width="35" height="20" fill="#222"/></pattern>
  </defs>
  <style>text{font:22px sans-serif;fill:#263238}.c{stroke:#fff;stroke-width:3}.lab{font-weight:700;fill:#2f3e7a}.note{font-size:18px;fill:#8a431f}</style>
  <text class="lab" x="45" y="35">tần số dọc tăng ↓</text><text class="lab" x="530" y="35">tần số ngang tăng →</text>
  <g transform="translate(170 62)">
    <rect class="c" width="180" height="120" fill="#808080"/>
    <g transform="translate(180 0)"><rect class="c" width="90" height="120" fill="#222"/><rect class="c" x="90" width="90" height="120" fill="#ddd"/></g>
    <g transform="translate(360 0)"><rect class="c" width="60" height="120" fill="#222"/><rect class="c" x="60" width="60" height="120" fill="#ddd"/><rect class="c" x="120" width="60" height="120" fill="#222"/></g>
    <g transform="translate(0 120)"><rect class="c" width="180" height="60" fill="#222"/><rect class="c" y="60" width="180" height="60" fill="#ddd"/></g>
    <g transform="translate(180 120)"><rect class="c" width="90" height="60" fill="#222"/><rect class="c" x="90" width="90" height="60" fill="#ddd"/><rect class="c" y="60" width="90" height="60" fill="#ddd"/><rect class="c" x="90" y="60" width="90" height="60" fill="#222"/></g>
    <g transform="translate(360 120)"><rect class="c" width="60" height="60" fill="#222"/><rect class="c" x="60" width="60" height="60" fill="#ddd"/><rect class="c" x="120" width="60" height="60" fill="#222"/><rect class="c" y="60" width="60" height="60" fill="#ddd"/><rect class="c" x="60" y="60" width="60" height="60" fill="#222"/><rect class="c" x="120" y="60" width="60" height="60" fill="#ddd"/></g>
  </g>
  <text class="note" x="220" y="385">Minh họa định tính; không phải giá trị hàm cơ sở DCT.</text>
</svg>
