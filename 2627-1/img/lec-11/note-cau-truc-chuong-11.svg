<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
<title id="title">Cấu trúc của Bài 11</title><desc id="desc">Sơ đồ cấu trúc chương. Khối trên cùng: Mục 1, hai đặc tả khôi phục. Nhánh trái, nhãn y = x, gồm ba khối nối tiếp: Mục 2, LZ77, cửa sổ W ký tự, bộ ba (d, ℓ, c); Mục 3, LZ78, từ điển cụm, cặp (i, c); Mục 4, LZW, từ điển nạp sẵn, chỉ phát mã; chú thích: khai thác cụm lặp đúng từng ký tự. Nhánh phải, nhãn sai số RMS ≤ ε, gồm khối viền nét đứt Mục 5, JPEG dựa trên DCT: dịch mức, DCT, lượng tử hóa, zigzag, mã độ dài loạt; chú thích: khai thác giới hạn của mắt. Hai nhánh gặp nhau ở khối dưới cùng: Mục 6, chọn phương pháp nén theo đặc tả, dạng dư thừa, bộ nhớ.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="960" height="460" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="255.0" y="12.0" width="450.0" height="78.0" rx="8" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="480.0" y="44.3" font-size="22" fill="#233247" text-anchor="middle" font-weight="bold">Mục 1. Hai đặc tả khôi phục</text><text x="480.0" y="72.3" font-size="22" fill="#233247" text-anchor="middle" font-weight="normal">khôi phục đúng hay khôi phục gần đúng</text><line x1="360.0" y1="92.0" x2="200.0" y2="140.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="600.0" y1="92.0" x2="790.0" y2="140.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="215.0" y="112.0" font-size="22" fill="#2f3e7a" text-anchor="end" font-weight="bold">y = x</text><text x="735.0" y="112.0" font-size="22" fill="#a85b23" text-anchor="start" font-weight="bold">sai số RMS ≤ ε</text><rect x="12.0" y="148.0" width="180.0" height="120.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="102.0" y="188.0" font-size="21" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Mục 2. LZ77</text><text x="102.0" y="215.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">cửa sổ W ký tự,</text><text x="102.0" y="242.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">bộ ba (d, ℓ, c)</text><line x1="194.0" y1="208.0" x2="210.0" y2="208.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="212.0" y="148.0" width="180.0" height="120.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="302.0" y="188.0" font-size="21" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Mục 3. LZ78</text><text x="302.0" y="215.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">từ điển cụm,</text><text x="302.0" y="242.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">cặp (i, c)</text><line x1="394.0" y1="208.0" x2="410.0" y2="208.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="412.0" y="148.0" width="180.0" height="120.0" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="502.0" y="188.0" font-size="21" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Mục 4. LZW</text><text x="502.0" y="215.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">từ điển nạp sẵn,</text><text x="502.0" y="242.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">chỉ phát mã</text><rect x="650.0" y="148.0" width="298.0" height="120.0" rx="8" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5" stroke-dasharray="10 6"/><text x="799.0" y="188.0" font-size="21" fill="#a85b23" text-anchor="middle" font-weight="bold">Mục 5. JPEG dựa trên DCT</text><text x="799.0" y="215.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">dịch mức, DCT, lượng tử hóa,</text><text x="799.0" y="242.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">zigzag, mã độ dài loạt</text><text x="306.0" y="300.0" font-size="21" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">khai thác cụm lặp đúng từng ký tự</text><text x="799.0" y="300.0" font-size="21" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">khai thác giới hạn của mắt</text><line x1="306.0" y1="312.0" x2="400.0" y2="362.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="799.0" y1="312.0" x2="600.0" y2="362.0" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="255.0" y="368.0" width="450.0" height="80.0" rx="8" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="480.0" y="401.3" font-size="22" fill="#26704e" text-anchor="middle" font-weight="bold">Mục 6. Chọn phương pháp nén</text><text x="480.0" y="429.3" font-size="22" fill="#233247" text-anchor="middle" font-weight="normal">theo đặc tả, dạng dư thừa, bộ nhớ</text></g></svg>
