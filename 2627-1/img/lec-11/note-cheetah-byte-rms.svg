<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Số byte và sai số RMS của CHEETAH.GS theo hệ số chất lượng</title><desc id="desc">Hai biểu đồ đường cạnh nhau cho ảnh CHEETAH.GS 64 000 byte theo hệ số chất lượng q bằng 1, 2, 3, 4, 5, 10, 15, 25. Biểu đồ trái, số byte sau nén: 27 809; 18 367; 14 084; 11 731; 10 232; 7 167; 6 074; 5 094, giảm dần. Biểu đồ phải, sai số RMS: 4,3; 6,9; 8,6; 9,9; 10,9; 13,6; 15,2; 17,4, tăng dần.</desc>
