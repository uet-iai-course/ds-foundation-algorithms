    <path d="M615 178 L615 272"/><path d="M567 330 L353 330"/>
    <path d="M305 282 L305 178"/><path d="M650 295 C710 235 710 205 650 165"/>
  </g>
  <g stroke="#2F3E7A" stroke-width="5">
    <circle cx="305" cy="130" r="48" fill="#edf4ff"/><circle cx="615" cy="130" r="48" fill="#fff2df"/>
