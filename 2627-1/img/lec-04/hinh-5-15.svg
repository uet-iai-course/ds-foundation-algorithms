  <desc id="desc">Đồ thị có hướng: A trỏ đến B, C, D; B trỏ đến A, D; C trỏ đến A; D trỏ đến B, C. B và D thuộc tập dịch chuyển theo chủ đề.</desc>
  <defs><marker id="m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#B15A2B"/></marker></defs>
