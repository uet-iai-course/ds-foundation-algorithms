<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="420" height="460" role="img" aria-labelledby="weighted-t weighted-d">
  <title id="weighted-t">Kết hợp các vector chủ đề</title>
  <desc id="weighted-d">Các vector chủ đề một tới k được kết hợp bằng các trọng số w một tới w k.</desc>
  <defs>
    <marker id="weighted-arw" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#B15A2B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="420" height="460" fill="#edf4ff"/>
  <rect x="30" y="30" width="185" height="70" rx="10" fill="#ffffff" stroke="#2F3E7A" stroke-width="2.5"/>
  <text x="122.5" y="75.15" font-family="Arial, sans-serif" font-size="29" fill="#2F3E7A" font-weight="bold" text-anchor="middle">Chủ đề 1</text>
  <rect x="30" y="325" width="185" height="70" rx="10" fill="#ffffff" stroke="#2F3E7A" stroke-width="2.5"/>
  <text x="122.5" y="370.15" font-family="Arial, sans-serif" font-size="29" fill="#2F3E7A" font-weight="bold" text-anchor="middle">Chủ đề k</text>
  <text x="120" y="230" font-family="Arial, sans-serif" font-size="46" fill="#2F3E7A" font-weight="normal" text-anchor="middle">⋮</text>
  <rect x="270" y="175" width="130" height="105" rx="10" fill="#ffffff" stroke="#2F3E7A" stroke-width="2.5"/>
  <text x="335.0" y="220.75" font-family="Arial, sans-serif" font-size="25" fill="#2F3E7A" font-weight="bold" text-anchor="middle">Tổng có</text>
  <text x="335.0" y="251.75" font-family="Arial, sans-serif" font-size="25" fill="#2F3E7A" font-weight="bold" text-anchor="middle">trọng số</text>
  <path d="M 215,65 Q 300,65 325,175" fill="none" stroke="#B15A2B" stroke-width="2.5" marker-end="url(#weighted-arw)" data-source="" data-target="" />
  <path d="M 215,360 Q 300,360 325,280" fill="none" stroke="#B15A2B" stroke-width="2.5" marker-end="url(#weighted-arw)" data-source="" data-target="" />
  <text x="305" y="105" font-family="Arial, sans-serif" font-size="32" fill="#2F3E7A" font-weight="normal" text-anchor="middle">w₁</text>
  <text x="305" y="360" font-family="Arial, sans-serif" font-size="32" fill="#2F3E7A" font-weight="normal" text-anchor="middle">wₖ</text>
</svg>
