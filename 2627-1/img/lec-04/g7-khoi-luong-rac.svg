<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="g7sm-t g7sm-d">
  <title id="g7sm-t">Khối lượng rác trên đồ thị bảy trang</title>
  <desc id="g7sm-d">Cùng đồ thị bảy trang, beta bằng 4/5. B và D có viền đôi: tập tin cậy T gồm B, D. Cạnh đậm từ C tới trang đích Y là cạnh duy nhất vào cụm. Nhãn cạnh mỗi trang ghi khối lượng rác: A và C mỗi trang âm 0,40; B và D mỗi trang âm 1,47; Y 0,53; P1, P2 mỗi trang 0,62. Ba trang của cụm là ba trang duy nhất có khối lượng rác dương.</desc>
