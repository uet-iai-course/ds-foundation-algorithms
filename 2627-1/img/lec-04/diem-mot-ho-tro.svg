  <text x="260.0" y="347.65" font-family="Arial, sans-serif" font-size="29" fill="#2F3E7A" font-weight="bold" text-anchor="middle">điểm p</text>
  <path d="M 260,115 L 260,270" fill="none" stroke="#B15A2B" stroke-width="2.5" marker-end="url(#pair-arw)" data-source="" data-target="" />
  <text x="345" y="200" font-family="Arial, sans-serif" font-size="34" fill="#2F3E7A" font-weight="bold" text-anchor="middle">βy/m</text>
  <path d="M 25,320 L 130,320" fill="none" stroke="#B15A2B" stroke-width="2.5" marker-end="url(#pair-arw)" data-source="" data-target="" stroke-dasharray="9 7"/>
  <text x="72" y="294" font-family="Arial, sans-serif" font-size="34" fill="#2F3E7A" font-weight="bold" text-anchor="middle">b</text>
