<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" role="img" aria-labelledby="pair-t pair-d">
  <title id="pair-t">Điểm tại một hỗ trợ</title>
  <desc id="pair-d">Đích có điểm y truyền beta y trên m tới mỗi hỗ trợ; bước dịch chuyển b cũng vào hỗ trợ.</desc>
  <defs>
    <marker id="pair-arw" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#B15A2B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="520" height="420" fill="#edf4ff"/>
  <rect x="130" y="25" width="260" height="90" rx="10" fill="#ffffff" stroke="#2F3E7A" stroke-width="2.5"/>
  <text x="260.0" y="80.15" font-family="Arial, sans-serif" font-size="29" fill="#2F3E7A" font-weight="bold" text-anchor="middle">Đích: điểm y</text>
  <rect x="130" y="270" width="260" height="100" rx="10" fill="#ffffff" stroke="#2F3E7A" stroke-width="2.5"/>
