<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="650" height="420" role="img" aria-labelledby="branches-t branches-d">
  <title id="branches-t">Hai nhánh di chuyển</title>
  <desc id="branches-d">Nhánh liên kết đi tới đích của một cạnh ra từ trang hiện tại với xác suất beta; nhánh dịch chuyển nét đứt đi tới tập S với xác suất một trừ beta.</desc>
  <defs>
    <marker id="branches-arw" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#B15A2B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="650" height="420" fill="#edf4ff"/>
  <rect x="20" y="145" width="160" height="105" rx="10" fill="#ffffff" stroke="#2F3E7A" stroke-width="2.5"/>
  <text x="100.0" y="190.15" font-family="Arial, sans-serif" font-size="29" fill="#2F3E7A" font-weight="bold" text-anchor="middle">Trang</text>
  <text x="100.0" y="225.15" font-family="Arial, sans-serif" font-size="29" fill="#2F3E7A" font-weight="bold" text-anchor="middle">hiện tại</text>
  <rect x="380" y="35" width="240" height="105" rx="10" fill="#ffffff" stroke="#2F3E7A" stroke-width="2.5"/>
  <text x="500.0" y="80.15" font-family="Arial, sans-serif" font-size="29" fill="#2F3E7A" font-weight="bold" text-anchor="middle">Đích của</text>
  <text x="500.0" y="115.15" font-family="Arial, sans-serif" font-size="29" fill="#2F3E7A" font-weight="bold" text-anchor="middle">liên kết ra</text>
  <rect x="380" y="285" width="240" height="105" rx="10" fill="#ffffff" stroke="#2F3E7A" stroke-width="2.5"/>
  <text x="500.0" y="347.65" font-family="Arial, sans-serif" font-size="29" fill="#2F3E7A" font-weight="bold" text-anchor="middle">Tập chủ đề S</text>
  <path d="M 180,175 L 380,90" fill="none" stroke="#B15A2B" stroke-width="2.5" marker-end="url(#branches-arw)" data-source="" data-target="" />
  <path d="M 180,220 L 380,330" fill="none" stroke="#B15A2B" stroke-width="2.5" marker-end="url(#branches-arw)" data-source="" data-target="" stroke-dasharray="9 7"/>
  <text x="260" y="108" font-family="Arial, sans-serif" font-size="34" fill="#2F3E7A" font-weight="bold" text-anchor="middle">β</text>
  <text x="260" y="310" font-family="Arial, sans-serif" font-size="34" fill="#2F3E7A" font-weight="bold" text-anchor="middle">1−β</text>
</svg>
