<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="g7pr-t g7pr-d">
  <title id="g7pr-t">Đồ thị bảy trang: G4 gắn một cụm thao túng</title>
  <desc id="g7pr-d">Bốn trang A, B, C, D giữ các cạnh của G4: A tới B, C, D; B tới A, D; C tới A; D tới B, C. Thêm một cạnh đậm từ C tới trang đích Y, cạnh duy nhất từ ngoài vào cụm. Khung nét đứt là cụm thao túng: Y trỏ tới hai trang hỗ trợ P1, P2, mỗi trang hỗ trợ chỉ trỏ lại Y. Nhãn cạnh mỗi trang ghi PageRank với beta bằng 4/5: A 3/29; B, C, D mỗi trang 19/203; Y 9/29; P1, P2 mỗi trang 31/203.</desc>
