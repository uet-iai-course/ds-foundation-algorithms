<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Cấu trúc của Bài 04</title><desc id="desc">Sơ đồ đọc từ trên xuống. Khối trên cùng là bài toán trung tâm: xếp hạng 10⁹ trang cho 10⁹ người dùng; một véc-tơ mỗi người cần 8 · 10¹⁸ byte. Sáu mũi tên xuống sáu cột; mỗi cột ghi câu hỏi của phần đó và, dưới đường kẻ đứt, các khái niệm chính. Mục 2: điểm phụ thuộc chủ đề bằng cách nào; phân phối dịch chuyển, tiền tính, ghép chủ đề. Mục 3: liên kết rác tăng điểm đến đâu; cụm thao túng, trang đích, trang hỗ trợ, hệ số khuếch đại. Mục 4: hạ điểm trang rác bằng thông tin nào; tập tin cậy, TrustRank, khối lượng rác. Mục 5: tách hai vai trò của một trang thế nào; trung tâm, uy tín, chuẩn hóa, véc-tơ riêng. Cột đọc thêm, viền nét đứt: HITS hội tụ nhanh đến đâu; khoảng cách trị riêng, trị riêng bội. Mục 6: chọn phương pháp nào; đầu ra, giả thiết, chi phí mỗi vòng.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
