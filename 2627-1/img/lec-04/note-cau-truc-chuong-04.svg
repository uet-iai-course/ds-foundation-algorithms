g rác bằng</text><text x="496.0" y="302.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">thông tin nào?</text><line x1="424.0" y1="362.0" x2="568.0" y2="362.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><text x="496.0" y="390.0" font-size="17" fill="#5b6778" text-anchor="middle" font-weight="normal">Khái niệm:</text><text x="496.0" y="422.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">tập tin cậy,</text><text x="496.0" y="452.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">TrustRank,</text><text x="496.0" y="482.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">khối lượng rác</text><line x1="600.0" y1="132.0" x2="694.0" y2="168.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="606.0" y="174.0" width="176.0" height="410.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="694.0" y="210.0" font-size="23" fill="#a85b23" text-anchor="middle" font-weight="bold">Mục 5</text><text x="694.0" y="248.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">Tách hai vai trò</text><text x="694.0" y="275.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">của một trang</text><text x="694.0" y="302.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">thế nào?</text><line x1="622.0" y1="362.0" x2="766.0" y2="362.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><text x="694.0" y="390.0" font-size="17" fill="#5b6778" text-anchor="middle" font-weight="normal">Khái niệm:</text><text x="694.0" y="422.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">trung tâm,</text><text x="694.0" y="452.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">uy tín,</text><text x="694.0" y="482.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">chuẩn hóa,</text><text x="694.0" y="512.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">véc-tơ riêng</text><line x1="600.0" y1="132.0" x2="892.0" y2="168.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="804.0" y="174.0" width="176.0" height="410.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5" stroke-dasharray="8 6"/><text x="892.0" y="210.0" font-size="23" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Đọc thêm</text><text x="892.0" y="248.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">HITS hội tụ</text><text x="892.0" y="275.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">nhanh</text><text x="892.0" y="302.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">đến đâu?</text><line x1="820.0" y1="362.0" x2="964.0" y2="362.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><text x="892.0" y="390.0" font-size="17" fill="#5b6778" text-anchor="middle" font-weight="normal">Khái niệm:</text><text x="892.0" y="422.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">khoảng cách</text><text x="892.0" y="452.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">trị riêng,</text><text x="892.0" y="482.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="bold">trị riêng bội</text><line x1="600.0" y1="132.0" x2="1090.0" y2="168.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="1002.0" y="174.0" width="176.0" height="410.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="1090.0" y="210.0" font-size="23" fill="#a85b23" text-anchor="middle" font-weight="bold">Mục 6</text><text x="1090.0" y="248.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">Chọn</text><text x="1090.0" y="275.0" font-size="18" fill="#233247" text-ancho