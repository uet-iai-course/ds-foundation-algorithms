<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 750" role="img" aria-labelledby="title desc">
<title id="title">Khối lượng rác trên đồ thị bảy trang</title><desc id="desc">Cùng đồ thị bảy trang, β = 4/5. B và D có viền đôi màu xanh lục và nhãn T: tập tin cậy T = {B, D}. Cạnh từ C tới trang đích Y vẽ nét đứt màu cam, đậm, nhãn liên kết bình luận. Nhãn mỗi trang ghi khối lượng rác s khi PageRank nền và TrustRank cùng β: A và C mỗi trang −0,40; B và D mỗi trang −1,47; Y 0,53; P1 và P2 mỗi trang 0,62. Ba trang của cụm là ba trang duy nhất có khối lượng rác dương.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
