  <text x="175.0" y="237.65" font-family="Arial, sans-serif" font-size="29" fill="#2F3E7A" font-weight="bold" text-anchor="middle">trang trung tâm</text>
  <rect x="565" y="60" width="310" height="110" rx="10" fill="#ffffff" stroke="#2F3E7A" stroke-width="2.5"/>
  <text x="720.0" y="107.65" font-family="Arial, sans-serif" font-size="29" fill="#2F3E7A" font-weight="bold" text-anchor="middle">Trang học phần 1</text>
  <text x="720.0" y="142.65" font-family="Arial, sans-serif" font-size="29" fill="#2F3E7A" font-weight="bold" text-anchor="middle">trang uy tín</text>
  <rect x="565" y="250" width="310" height="110" rx="10" fill="#ffffff" stroke="#2F3E7A" stroke-width="2.5"/>
  <text x="720.0" y="297.65" font-family="Arial, sans-serif" font-size="29" fill="#2F3E7A" font-weight="bold" text-anchor="middle">Trang học phần 2</text>
  <text x="720.0" y="332.65" font-family="Arial, sans-serif" font-size="29" fill="#2F3E7A" font-weight="bold" text-anchor="middle">trang uy tín</text>
  <line x1="325" y1="185" x2="565" y2="120" stroke="#B15A2B" stroke-width="2.5" marker-end="url(#hits-arw)"/>
