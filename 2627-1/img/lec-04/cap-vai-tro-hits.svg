<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" role="img" aria-labelledby="title desc">
  <title id="title">Hai vai trò trong HITS</title>
  <desc id="desc">Hai trang trung tâm ở bên trái trỏ đến ba trang thẩm quyền ở bên phải. Trang trung tâm tốt trỏ đến nhiều trang thẩm quyền tốt; trang thẩm quyền tốt được nhiều trang trung tâm tốt trỏ đến.</desc>
  <defs><marker id="m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#B15A2B"/></marker></defs>
  <g font-family="Arial,sans-serif" text-anchor="middle"><text x="235" y="55" font-size="31" font-weight="700" fill="#2F3E7A">Trang trung tâm</text><text x="805" y="55" font-size="31" font-weight="700" fill="#2F3E7A">Trang thẩm quyền</text></g>
  <g fill="#edf4ff" stroke="#2F3E7A" stroke-width="5"><circle cx="220" cy="145" r="48"/><circle cx="220" cy="300" r="48"/></g>
  <g fill="#fff7ed" stroke="#B15A2B" stroke-width="5"><circle cx="800" cy="105" r="48"/><circle cx="800" cy="220" r="48"/><circle cx="800" cy="335" r="48"/></g>
  <g fill="none" stroke="#B15A2B" stroke-width="5" marker-end="url(#m)"><path d="M270 135 L745 110"/><path d="M270 150 L745 210"/><path d="M268 165 L750 320"/><path d="M270 285 L745 230"/><path d="M270 305 L748 332"/></g>
  <g font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#2F3E7A" text-anchor="middle"><text x="220" y="155">h1</text><text x="220" y="310">h2</text><text x="800" y="115">a1</text><text x="800" y="230">a2</text><text x="800" y="345">a3</text></g>
</svg>
