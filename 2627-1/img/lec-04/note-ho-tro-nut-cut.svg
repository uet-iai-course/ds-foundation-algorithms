<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
<title id="title">(b) Hỗ trợ không có cạnh ra</title><desc id="desc">Biến thể b của cụm thao túng. Bên trái, một mũi tên màu cam nhãn x đi vào trang đích. Trang đích có ba mũi tên tới các trang hỗ trợ H1, H2, …, Hm xếp dọc bên phải. Các trang hỗ trợ có viền nét đứt màu cam và nhãn không có cạnh ra: không có mũi tên nào đi ra từ trang hỗ trợ, kể cả về trang đích.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="640" height="420" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="30.0" y="40.0" font-size="28" fill="#2f3e7a" text-anchor="start" font-weight="bold">(b)</text><line x1="20.0" y1="210.0" x2="140.0" y2="210.0" stroke="#a85b23" stroke-width="4" marker-end="url(#arrow)"/><text x="70.0" y="192.0" font-size="24" fill="#a85b23" text-anchor="middle" font-weight="normal" font-style="italic">x</text><line x1="226.3" y1="193.2" x2="430.1" y2="98.5" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="230.0" y1="210.0" x2="426.0" y2="210.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="225.3" y1="228.9" x2="431.2" y2="339.2" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="190.0" cy="210.0" r="44" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="190.0" y="218.6" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold">Đích</text><circle cx="470.0" cy="80.0" r="40" fill="#fff4e9" stroke="#a85b23" stroke-width="3" stroke-dasharray="7 5"/><text x="470.0" y="88.6" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold">H<tspan baseline-shift="sub" font-size="75%">1</tspan></text><circle cx="470.0" cy="210.0" r="40" fill="#fff4e9" stroke="#a85b23" stroke-width="3" stroke-dasharray="7 5"/><text x="470.0" y="218.6" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold">H<tspan baseline-shift="sub" font-size="75%">2</tspan></text><circle cx="470.0" cy="360.0" r="40" fill="#fff4e9" stroke="#a85b23" stroke-width="3" stroke-dasharray="7 5"/><text x="470.0" y="368.6" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold">H<tspan baseline-shift="sub" font-size="75%">m</tspan></text><text x="470.0" y="292.0" font-size="30" fill="#5b6778" text-anchor="middle" font-weight="normal">⋮</text><text x="530.0" y="214.0" font-size="18" fill="#5b6778" text-anchor="start" font-weight="normal" font-style="italic">không có</text><text x="530.0" y="238.0" font-size="18" fill="#5b6778" text-anchor="start" font-weight="normal" font-style="italic">cạnh ra</text></g></svg>
