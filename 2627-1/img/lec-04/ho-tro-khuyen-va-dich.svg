  <text x="305" y="70" font-family="Arial, sans-serif" font-size="30" fill="#2F3E7A" font-weight="normal" text-anchor="middle">H → H</text>
  <path d="M 265,230 Q 200,285 130,230" fill="none" stroke="#B15A2B" stroke-width="2.5" marker-end="url(#variant-c-arw)" data-source="" data-target="" />
