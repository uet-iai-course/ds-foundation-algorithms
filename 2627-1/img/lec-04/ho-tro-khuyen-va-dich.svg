  <circle cx="90" cy="210" r="45" fill="#ffffff" stroke="#2F3E7A" stroke-width="3" />
  <text x="90" y="220" font-family="Arial, sans-serif" font-size="30" fill="#2F3E7A" font-weight="bold" text-anchor="middle">Đích</text>
  <circle cx="305" cy="210" r="45" fill="#ffffff" stroke="#2F3E7A" stroke-width="3" />
  <text x="305" y="221" font-family="Arial, sans-serif" font-size="32" fill="#2F3E7A" font-weight="bold" text-anchor="middle">H</text>
