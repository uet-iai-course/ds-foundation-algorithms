0</text><rect x="143.1" y="90.0" width="32.3" height="380.0" fill="#2f3e7a"/><text x="159.2857142857143" y="496" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal">1</text><rect x="189.3" y="90.0" width="32.3" height="380.0" fill="#2f3e7a"/><text x="205.47619047619048" y="496" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal">2</text><rect x="235.5" y="90.0" width="32.3" height="380.0" fill="#2f3e7a"/><text x="251.66666666666666" y="496" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal">3</text><rect x="281.7" y="90.0" width="32.3" height="380.0" fill="#2f3e7a"/><text x="297.85714285714283" y="496" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal">4</text><rect x="327.9" y="90.0" width="32.3" height="380.0" fill="#2f3e7a"/><text x="344.04761904761904" y="496" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal">5</text><rect x="374.1" y="90.0" width="32.3" height="380.0" fill="#2f3e7a"/><text x="390.2380952380952" y="496" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal">6</text><rect x="420.3" y="90.1" width="32.3" height="379.9" fill="#2f3e7a"/><text x="436.4285714285714" y="496" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal">7</text><rect x="466.5" y="97.6" width="32.3" height="372.4" fill="#2f3e7a"/><text x="482.6190476190476" y="496" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal">8</text><text x="482.6" y="89.6" font-size="15" fill="#233247" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">0,98</text><rect x="512.6" y="143.8" width="32.3" height="326.2" fill="#2f3e7a"/><text x="528.8095238095239" y="496" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal">9</text><text x="528.8" y="135.8" font-size="15" fill="#233247" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">0,86</text><rect x="558.8" y="233.0" width="32.3