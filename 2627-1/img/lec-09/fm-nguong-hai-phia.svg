<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">Xác suất có đuôi dài ít nhất ℓ</title><desc id="desc">Đồ thị cột: trục ngang là ngưỡng độ dài đuôi ℓ từ 0 đến 20, trục đứng là xác suất Pr[R ≥ ℓ] = 1 − (1 − 2^−ℓ)^d với d = 1000. Cột bằng 1 tới ℓ = 6, bằng 0,98 tại ℓ = 8, 0,86 tại 9, 0,62 tại 10, 0,39 tại 11, 0,22 tại 12, 0,11 tại 13, rồi giảm gần 0. Đường đứng nét đứt đánh dấu log2 d xấp xỉ 9,97. Vùng tô bên trái có nhãn ℓ ≤ 7, xác suất gần 1; vùng tô bên phải có nhãn ℓ ≥ 12, xác suất nhỏ.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1100" height="560" fill="#ffffff"/>
