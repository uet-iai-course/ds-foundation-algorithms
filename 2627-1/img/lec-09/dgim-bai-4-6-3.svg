<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1224 300" role="img" aria-labelledby="title desc">
<title id="title">Trạng thái DGIM của MMDS Hình 4.3</title><desc id="desc">26 ô bit từ cũ bên trái sang mới bên phải: 10110110001011101100101101, nhãn vị trí từ r−25 tới r ghi cách một ô. Khung bao các thùng, tam giác dưới ô đánh dấu mốc phải: cỡ 8 mốc r−23, cỡ 4 mốc r−15, cỡ 4 mốc r−9, cỡ 2 mốc r−5, cỡ 2 mốc r−2, cỡ 1 mốc r; thùng cỡ 8 bị cắt ở mép trái với dấu ba chấm. Bit mới nhất ở r là bit 1 tạo thùng cỡ 1; hai thùng cỡ 2 mốc r−5 và r−2. Chú thích: bên trái có ít nhất một thùng cỡ 8.</desc>
