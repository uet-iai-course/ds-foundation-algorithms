="2"/><text x="640.0" y="416" font-size="26" fill="#233247" text-anchor="middle" font-weight="normal">ngưỡng độ dài đuôi ℓ; chiều cao cột: Pr[R ≥ ℓ] với d = 1000</text></g></svg>
