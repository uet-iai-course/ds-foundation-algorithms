dle" font-weight="normal">0</text><rect x="173.1" y="64.0" width="44.5" height="276.0" fill="#2f3e7a"/><text x="195.29411764705884" y="372" font-size="25" fill="#233247" text-anchor="middle" font-weight="normal">1</text><rect x="236.6" y="64.0" width="44.5" height="276.0" fill="#2f3e7a"/><text x="258.8235294117647" y="372" font-size="25" fill="#233247" text-anchor="middle" font-weight="normal">2</text><rect x="300.1" y="64.0" width="44.5" height="276.0" fill="#2f3e7a"/><text x="322.3529411764706" y="372" font-size="25" fill="#233247" text-anchor="middle" font-weight="normal">3</text><rect x="363.6" y="64.0" width="44.5" height="276.0" fill="#2f3e7a"/><text x="385.88235294117646" y="372" font-size="25" fill="#233247" text-anchor="middle" font-weight="normal">4</text><rect x="427.2" y="64.0" width="44.5" height="276.0" fill="#2f3e7a"/><text x="449.4117647058823" y="372" font-size="25" fill="#233247" text-anchor="middle" font-weight="normal">5</text><rect x="490.7" y="64.0" width="44.5" height="276.0" fill="#2f3e7a"/><text x="512.9411764705883" y="372" font-size="25" fill="#233247" text-anchor="middle" font-weight="normal">6</text><rect x="554.2" y="64.1" width="44.5" height="275.9" fill="#2f3e7a"/><text x="576.4705882352941" y="372" font-size="25" fill="#233247" text-anchor="middle" font-weight="normal">7</text><rect x="617.8" y="69.5" width="44.5" height="270.5" fill="#2f3e7a"/><text x="640.0" y="372" font-size="25" fill="#233247" text-anchor="middle" font-weight="normal">8</text><text x="640.0" y="61.5" font-size="23" fill="#233247" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">0,98</text><rect x="681.3" y="103.1" width="44.5" height="236.9" fill="#2f3e7a"/><text x="703.5294117647059" y="372" font-size="25" fill="#233247" text-anchor="middle" font-weight="normal">9</text><text x="703.5" y="95.1" font-size="23" fill="#233247" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">0,86</text><rect x="744.8" y="167.9" 