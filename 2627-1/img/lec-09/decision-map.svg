<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
<title id="title">Bản đồ chọn cấu trúc tóm tắt dòng dữ liệu</title><desc id="desc">Dòng sự kiện chia thành bốn câu hỏi: phần tử phân biệt dùng Flajolet–Martin, tần suất một khóa dùng Count-Min Sketch, độ lệch phân phối dùng AMS và số bit một trong cửa sổ dùng DGIM.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f3e7a"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#18223c}.h{font-size:27px;font-weight:700}.b{font-size:22px}.box{fill:#fff;stroke:#2f3e7a;stroke-width:3}.out{fill:#f7efe6;stroke:#b15a2b;stroke-width:3}.line{stroke:#2f3e7a;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<rect class="box" x="430" y="20" width="240" height="62" rx="14"/><text class="h" x="550" y="59" text-anchor="middle">Dòng sự kiện</text>
<path class="line" d="M550 82 V125 M550 125 H145 V160 M550 125 H415 V160 M550 125 H685 V160 M550 125 H955 V160"/>
<rect class="box" x="25" y="160" width="240" height="82" rx="12"/><text class="b" x="145" y="193" text-anchor="middle">Bao nhiêu khóa</text><text class="b" x="145" y="221" text-anchor="middle">phân biệt?</text>
<rect class="box" x="295" y="160" width="240" height="82" rx="12"/><text class="b" x="415" y="193" text-anchor="middle">Một khóa xuất hiện</text><text class="b" x="415" y="221" text-anchor="middle">bao nhiêu lần?</text>
<rect class="box" x="565" y="160" width="240" height="82" rx="12"/><text class="b" x="685" y="193" text-anchor="middle">Phân phối lệch</text><text class="b" x="685" y="221" text-anchor="middle">đến đâu?</text>
<rect class="box" x="835" y="160" width="240" height="82" rx="12"/><text class="b" x="955" y="193" text-anchor="middle">Có bao nhiêu bit 1</text><text class="b" x="955" y="221" text-anchor="middle">trong cửa sổ?</text>
<path class="line" d="M145 242 V278 M415 242 V278 M685 242 V278 M955 242 V278"/>
<rect class="out" x="25" y="280" width="240" height="58" rx="12"/><text class="h" x="145" y="317" text-anchor="middle">Flajolet–Martin</text>
<rect class="out" x="295" y="280" width="240" height="58" rx="12"/><text class="h" x="415" y="317" text-anchor="middle">Count-Min Sketch</text>
<rect class="out" x="565" y="280" width="240" height="58" rx="12"/><text class="h" x="685" y="317" text-anchor="middle">AMS</text>
<rect class="out" x="835" y="280" width="240" height="58" rx="12"/><text class="h" x="955" y="317" text-anchor="middle">DGIM</text>
</svg>
