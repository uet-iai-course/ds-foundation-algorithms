<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
<title id="title">Hàm băm của bảng Count-Min hai hàng ba ô</title><desc id="desc">Bảng hai hàng ba ô ghi các phần tử băm vào mỗi ô. Hàng 1 theo h1, ô 0, 1, 2: ô 0 chứa a và d, ô 1 chứa b, ô 2 chứa c. Hàng 2 theo h2, viền nét đứt: ô 0 chứa d, ô 1 chứa a và c, ô 2 chứa b.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="320" y="30" font-size="24" fill="#6b7788" text-anchor="middle" font-weight="normal" font-style="italic">phần tử băm vào mỗi ô</text><text x="10" y="128" font-size="26" fill="#233247" text-anchor="start" font-weight="bold">A₁ (h₁)</text><rect x="150" y="70" width="146" height="88" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="223" y="126" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">a, d</text><text x="223" y="62" font-size="22" fill="#6b7788" text-anchor="middle" font-weight="normal">ô 0</text><rect x="310" y="70" width="146" height="88" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="383" y="126" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">b</text><text x="383" y="62" font-size="22" fill="#6b7788" text-anchor="middle" font-weight="normal">ô 1</text><rect x="470" y="70" width="146" height="88" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="543" y="126" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">c</text><text x="543" y="62" font-size="22" fill="#6b7788" text-anchor="middle" font-weight="normal">ô 2</text><text x="10" y="258" font-size="26" fill="#233247" text-anchor="start" font-weight="bold">A₂ (h₂)</text><rect x="150" y="200" width="146" height="88" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="3" stroke-dasharray="10 6"/><text x="223" y="256" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">d</text><rect x="310" y="200" width="146" height="88" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="3" stroke-dasharray="10 6"/><text x="383" y="256" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">a, c</text><rect x="470" y="200" width="146" height="88" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="3" stroke-dasharray="10 6"/><text x="543" y="256" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">b</text></g></svg>
