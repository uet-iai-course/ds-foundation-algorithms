<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
<title id="title">Cửa sổ suy giảm mũ và cửa sổ cố định</title><desc id="desc">Đồ thị trọng số theo tuổi, hiện tại ở bên phải. Trục ngang là tuổi từ 30 về 0, trục đứng là trọng số từ 0 đến 1. Các cột trọng số suy giảm mũ (1 − c)^tuổi với c = 0,1: tuổi 0 cao 1, tuổi 5 cao 0,59, tuổi 10 cao 0,35, tuổi 20 cao 0,12, tuổi 30 cao 0,04, cao dần đều về phía phải. Khung chữ nhật nét đứt cao 1 phủ 10 tuổi cuối, nhãn cửa sổ cố định độ dài 1/c bằng 10: trọng số 1 bên trong, 0 bên ngoài.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1100" height="500" fill="#ffffff"/>
