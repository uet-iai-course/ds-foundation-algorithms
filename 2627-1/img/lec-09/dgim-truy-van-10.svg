<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1205 300" role="img" aria-labelledby="title desc">
<title id="title">Truy vấn mười vị trí cuối trên Hình 4.2</title><desc id="desc">25 ô bit từ cũ bên trái sang mới bên phải: 1011011000101110110010110, nhãn vị trí từ r−24 tới r ghi cách một ô. Khung bao các thùng, tam giác dưới ô đánh dấu mốc phải: cỡ 8 mốc r−22, cỡ 4 mốc r−14, cỡ 4 mốc r−8, cỡ 2 mốc r−4, cỡ 1 mốc r−2, cỡ 1 mốc r−1; thùng cỡ 8 bị cắt ở mép trái với dấu ba chấm. Đường nét đứt trước r−9 đánh dấu mười vị trí cuối, k = 10. Khung cỡ 4 mốc r−8 viền đậm màu khác; ba khung mới hơn viền nhạt.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
