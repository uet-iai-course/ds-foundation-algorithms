<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Đếm địa chỉ phân biệt của một trang</title><desc id="desc">Bên trái: dòng lượt truy cập của một trang, tám ô a, b, c, b, d, a, c, d rồi dấu ba chấm; mỗi phần tử là một địa chỉ IPv4, cùng chữ là cùng địa chỉ; tám lượt đầu có d bằng 4 địa chỉ phân biệt. Mũi tên sang khối cao ở giữa: lời giải chính xác, véc-tơ bit 2 mũ 32 bit bằng 512 MiB. Bên phải: khối thấp viền nét đứt, cần bộ nhớ không tăng theo d. Chiều cao không theo tỷ lệ.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="360" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="10" y="34" font-size="27" fill="#233247" text-anchor="start" font-weight="bold">Dòng lượt truy cập của một trang</text><rect x="10" y="54" width="56" height="58" rx="6" fill="#f4f6f9" stroke="#6b7788" stroke-width="2"/><text x="38.0" y="93" font-size="30" fill="#233247" text-anchor="middle" font-weight="normal">a</text><rect x="74" y="54" width="56" height="58" rx="6" fill="#f4f6f9" stroke="#6b7788" stroke-width="2"/><text x="102.0" y="93" font-size="30" fill="#233247" text-anchor="middle" font-weight="normal">b</text><rect x="138" y="54" width="56" height="58" rx="6" fill="#f4f6f9" stroke="#6b7788" stroke-width="2"/><text x="166.0" y="93" font-size="30" fill="#233247" text-anchor="middle" font-weight="normal">c</text><rect x="202" y="54" width="56" height="58" rx="6" fill="#f4f6f9" stroke="#6b7788" stroke-width="2"/><text x="230.0" y="93" font-size="30" fill="#233247" text-anchor="middle" font-weight="normal">b</text><rect x="266" y="54" width="56" height="58" rx="6" fill="#f4f6f9" stroke="#6b7788" stroke-width="2"/><text x="294.0" y="93" font-size="30" fill="#233247" text-anchor="middle" font-weight="normal">d</text><rect x="330" y="54" width="56" height="58" rx="6" fill="#f4f6f9" stroke="#6b7788" stroke-width="2"/><text x="358.0" y="93" font-size="30" fill="#233247" text-anchor="middle" font-weight="normal">a</text><rect x="394" y="54" width="56" height="58" rx="6" fill="#f4f6f9" stroke="#6b7788" stroke-width="2"/><text x="422.0" y="93" font-size="30" fill="#233247" text-anchor="middle" font-weight="normal">c</text><rect x="458" y="54" width="56" height="58" rx="6" fill="#f4f6f9" stroke="#6b7788" stroke-width="2"/><text x="486.0" y="93" font-size="30" fill="#233247" text-anchor="middle" font-weight="normal">d</text><text x="526" y="93" font-size="30" fill="#6b7788" text-anchor="start" font-weight="normal">…</text><text x="10" y="160" font-size="25" fill="#6b7788" text-anchor="start" font-weight="normal" font-style="italic">mỗi phần tử là một địa chỉ IPv4;</text><text x="10" y="196" font-size="25" fill="#6b7788" text-anchor="start" font-weight="normal" font-style="italic">cùng chữ là cùng địa chỉ</text><text x="10" y="254" font-size="26" fill="#2f3e7a" text-anchor="start" font-weight="bold">8 lượt đầu: d = 4 địa chỉ phân biệt</text><line x1="575" y1="84" x2="655" y2="84" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><text x="790" y="30" font-size="25" fill="#2f3e7a" text-anchor="middle" font-weight="bold">lời giải chính xác</text><rect x="680" y="44" width="220" height="268" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><rect x="702" y="64" width="176" height="22" rx="3" fill="#ffffff" stroke="#6b7788" stroke-width="1"/><rect x="702" y="98" width="176" height="22" rx="3" fill="#ffffff" stroke="#6b7788" stroke-width="1"/><rect x="702" y="132" width="176" height="22" rx="3" fill="#ffffff" stroke="#6b7788" stroke-width="1"/><rect x="702" y="166" width="176" height="22" rx="3" fill="#ffffff" stroke="#6b7788" stroke-width="1"/><rect x="702" y="200" width="176" height="22" rx="3" fill="#ffffff" stroke="#6b7788" stroke-width="1"/><rect x="702" y="234" width="176" height="22" rx="3" fill="#ffffff" stroke="#6b7788" stroke-width="1"/><rect x="702" y="268" width="176" height="22" rx="3" fill="#ffffff" stroke="#6b7788" stroke-width="1"/><text x="790" y="344" font-size="27" fill="#2f3e7a" text-anchor="middle" font-weight="bold">2³² bit = 512 MiB</text><rect x="950" y="230" width="240" height="82" rx="10" fill="#ffffff" stroke="#a85b23" stroke-width="3" stroke-dasharray="10 6"/><text x="1070" y="263" font-size="25" fill="#a85b23" text-anchor="middle" font-weight="bold">cần: bộ nhớ</text><text x="1070" y="295" font-size="25" fill="#a85b23" text-anchor="middle" font-weight="bold">không tăng theo d</text><text x="1070" y="60" font-size="22" fill="#6b7788" text-anchor="middle" font-weight="normal" font-style="italic">chiều cao không</text><text x="1070" y="90" font-size="22" fill="#6b7788" text-anchor="middle" font-weight="normal" font-style="italic">theo tỷ lệ</text></g></svg>
