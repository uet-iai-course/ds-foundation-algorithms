<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
<title id="title">Hai ranh giới truy vấn cho Bài 4.6.1</title><desc id="desc">Hình 4.2 với hai đường dọc đánh dấu 15 và 5 vị trí gần nhất. Hình không hiển thị ước lượng hay số thật.</desc>
<style>text{font-family:Arial,sans-serif;fill:#18223c}.h{font-size:24px;font-weight:700}.b{font-size:20px}.bit{fill:#fff;stroke:#adb5c3;stroke-width:1.5}.one{fill:#edf4ff}.buck{fill:none;stroke:#2f3e7a;stroke-width:4}.unk{fill:#f7efe6;stroke:#b15a2b;stroke-width:4}.k5{stroke:#b15a2b;stroke-width:4;stroke-dasharray:8 6}.k15{stroke:#2e7d32;stroke-width:4;stroke-dasharray:8 6}</style>
<text class="h" x="25" y="35">cũ → mới</text><text class="b" x="1080" y="35" text-anchor="end">mỗi khung kết thúc ở bit 1</text>
<g transform="translate(50,55)"><g>
<rect class="one" x="0" y="0" width="40" height="48"/><rect class="bit" x="40" y="0" width="40" height="48"/><rect class="one" x="80" y="0" width="40" height="48"/><rect class="one" x="120" y="0" width="40" height="48"/><rect class="bit" x="160" y="0" width="40" height="48"/><rect class="one" x="200" y="0" width="40" height="48"/><rect class="one" x="240" y="0" width="40" height="48"/><rect class="bit" x="280" y="0" width="40" height="48"/><rect class="bit" x="320" y="0" width="40" height="48"/><rect class="bit" x="360" y="0" width="40" height="48"/><rect class="one" x="400" y="0" width="40" height="48"/><rect class="bit" x="440" y="0" width="40" height="48"/><rect class="one" x="480" y="0" width="40" height="48"/><rect class="one" x="520" y="0" width="40" height="48"/><rect class="one" x="560" y="0" width="40" height="48"/><rect class="bit" x="600" y="0" width="40" height="48"/><rect class="one" x="640" y="0" width="40" height="48"/><rect class="one" x="680" y="0" width="40" height="48"/><rect class="bit" x="720" y="0" width="40" height="48"/><rect class="bit" x="760" y="0" width="40" height="48"/><rect class="one" x="800" y="0" width="40" height="48"/><rect class="bit" x="840" y="0" width="40" height="48"/><rect class="one" x="880" y="0" width="40" height="48"/><rect class="one" x="920" y="0" width="40" height="48"/><rect class="bit" x="960" y="0" width="40" height="48"/></g>
<g class="h" text-anchor="middle"><text x="20" y="33">1</text><text x="60" y="33">0</text><text x="100" y="33">1</text><text x="140" y="33">1</text><text x="180" y="33">0</text><text x="220" y="33">1</text><text x="260" y="33">1</text><text x="300" y="33">0</text><text x="340" y="33">0</text><text x="380" y="33">0</text><text x="420" y="33">1</text><text x="460" y="33">0</text><text x="500" y="33">1</text><text x="540" y="33">1</text><text x="580" y="33">1</text><text x="620" y="33">0</text><text x="660" y="33">1</text><text x="700" y="33">1</text><text x="740" y="33">0</text><text x="780" y="33">0</text><text x="820" y="33">1</text><text x="860" y="33">0</text><text x="900" y="33">1</text><text x="940" y="33">1</text><text x="980" y="33">0</text></g></g>
<g transform="translate(0,135)"><rect class="unk" x="20" y="0" width="150" height="72" rx="9"/><rect class="buck" x="170" y="0" width="320" height="72" rx="9"/><rect class="buck" x="490" y="0" width="240" height="72" rx="9"/><rect class="buck" x="730" y="0" width="160" height="72" rx="9"/><rect class="buck" x="890" y="0" width="80" height="72" rx="9"/><rect class="buck" x="970" y="0" width="40" height="72" rx="9"/><g class="h" text-anchor="middle"><text x="95" y="44">≥ 8</text><text x="330" y="44">4</text><text x="610" y="44">4</text><text x="810" y="44">2</text><text x="930" y="44">1</text><text x="990" y="44">1</text></g></g>
<path d="M50 111 V126 M170 111 V126 M490 111 V126 M730 111 V126 M890 111 V126 M970 111 V126 M1010 111 V126" stroke="#7c879a" stroke-width="2"/><text class="b" x="95" y="245" text-anchor="middle">phần trái bị ẩn</text><text class="b" x="530" y="305" text-anchor="middle">Kích thước đếm số bit 1, không đếm độ dài hình chữ nhật</text>
<line class="k15" x1="450" y1="45" x2="450" y2="270"/><line class="k5" x1="850" y1="45" x2="850" y2="270"/><text class="h" x="450" y="340" text-anchor="middle" fill="#2e7d32">k = 15</text><text class="h" x="850" y="340" text-anchor="middle" fill="#b15a2b">k = 5</text><text class="b" x="560" y="410" text-anchor="middle">Xác định bucket biên, ước lượng, số thật và sai lệch</text>
