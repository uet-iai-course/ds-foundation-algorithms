<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Năm câu hỏi và năm phác thảo của Bài 09</title><desc id="desc">Sơ đồ đọc từ trên xuống. Một dòng x1, x2, … đọc một lượt đi vào năm khối song song, mỗi khối ghi số mạch, câu hỏi, đại lượng và phác thảo. Mạch 2: số phần tử phân biệt, F0 bằng d, Flajolet–Martin, toàn dòng. Mạch 3: độ lệch của phân bố, F2, biến AMS, toàn dòng. Mạch 4: tần suất của phần tử u, f_u, Count-Min, toàn dòng. Mạch 5, hai khối viền nét đứt có nhãn gần đây: số bit 1 trong k vị trí cuối, y_k, DGIM; phần tử phổ biến gần đây, D_r(u), cửa sổ suy giảm. Năm mũi tên hội tụ vào khối mạch 6, chọn phác thảo theo câu hỏi.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="470" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="360" y="6" width="480" height="58" rx="10" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="600" y="45" font-size="27" fill="#233247" text-anchor="middle" font-weight="bold">Dòng x₁, x₂, … đọc một lượt</text><line x1="600" y1="66" x2="125.0" y2="100" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="14" y="106" width="222" height="262" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="125.0" y="144" font-size="30" fill="#2f3e7a" text-anchor="middle" font-weight="bold">2.</text><text x="125.0" y="184" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">Số phần tử</text><text x="125.0" y="214" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">phân biệt</text><text x="125.0" y="262" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold" font-style="italic">F<tspan baseline-shift="sub" font-size="21">0</tspan> = d</text><text x="125.0" y="308" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold">Flajolet–Martin</text><text x="125.0" y="350" font-size="22" fill="#2f3e7a" text-anchor="middle" font-weight="bold" font-style="italic">toàn dòng</text><line x1="125.0" y1="370" x2="600" y2="402" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="600" y1="66" x2="362.0" y2="100" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="251" y="106" width="222" height="262" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="362.0" y="144" font-size="30" fill="#2f3e7a" text-anchor="middle" font-weight="bold">3.</text><text x="362.0" y="184" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">Độ lệch của</text><text x="362.0" y="214" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">phân bố</text><text x="362.0" y="262" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold" font-style="italic">F<tspan baseline-shift="sub" font-size="21">2</tspan></text><text x="362.0" y="308" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold">biến AMS</text><text x="362.0" y="350" font-size="22" fill="#2f3e7a" text-anchor="middle" font-weight="bold" font-style="italic">toàn dòng</text><line x1="362.0" y1="370" x2="600" y2="402" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="600" y1="66" x2="599.0" y2="100" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="488" y="106" width="222" height="262" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="599.0" y="144" font-size="30" fill="#2f3e7a" text-anchor="middle" font-weight="bold">4.</text><text x="599.0" y="184" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">Tần suất của</text><text x="599.0" y="214" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">phần tử u</text><text x="599.0" y="262" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold" font-style="italic">f<tspan baseline-shift="sub" font-size="21">u</tspan></text><text x="599.0" y="308" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold">Count-Min</text><text x="599.0" y="350" font-size="22" fill="#2f3e7a" text-anchor="middle" font-weight="bold" font-style="italic">toàn dòng</text><line x1="599.0" y1="370" x2="600" y2="402" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="600" y1="66" x2="836.0" y2="100" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="725" y="106" width="222" height="262" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5" stroke-dasharray="10 6"/><text x="836.0" y="144" font-size="30" fill="#a85b23" text-anchor="middle" font-weight="bold">5.</text><text x="836.0" y="184" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">Số bit 1 trong</text><text x="836.0" y="214" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">k vị trí cuối</text><text x="836.0" y="262" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold" font-style="italic">y<tspan baseline-shift="sub" font-size="21">k</tspan></text><text x="836.0" y="308" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold">DGIM</text><text x="836.0" y="350" font-size="22" fill="#a85b23" text-anchor="middle" font-weight="bold" font-style="italic">gần đây</text><line x1="836.0" y1="370" x2="600" y2="402" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="600" y1="66" x2="1073.0" y2="100" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="962" y="106" width="222" height="262" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5" stroke-dasharray="10 6"/><text x="1073.0" y="144" font-size="30" fill="#a85b23" text-anchor="middle" font-weight="bold">5.</text><text x="1073.0" y="184" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">Phần tử phổ</text><text x="1073.0" y="214" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">biến gần đây</text><text x="1073.0" y="262" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold" font-style="italic">D<tspan baseline-shift="sub" font-size="21">r</tspan>(u)</text><text x="1073.0" y="308" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold">cửa sổ suy giảm</text><text x="1073.0" y="350" font-size="22" fill="#a85b23" text-anchor="middle" font-weight="bold" font-style="italic">gần đây</text><line x1="1073.0" y1="370" x2="600" y2="402" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="300" y="408" width="600" height="56" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="600" y="446" font-size="27" fill="#26704e" text-anchor="middle" font-weight="bold">6. Chọn phác thảo theo câu hỏi</text></g></svg>
