<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
<title id="title">Ba bộ đếm hậu tố trên dòng độ dài 15</title><desc id="desc">Dòng a b c b d a c d a b d c a a b. Chọn các vị trí 3, 8 và 13; khóa được chọn xuất hiện trong hậu tố lần lượt 3, 2 và 2 lần.</desc>
<style>text{font-family:Arial,sans-serif;fill:#18223c}.h{font-size:26px;font-weight:700}.b{font-size:21px}.cell{fill:#fff;stroke:#7c879a;stroke-width:2}.sel{fill:#f7efe6;stroke:#b15a2b;stroke-width:3}</style>
<text class="h" x="20" y="42">Dòng</text>
<g transform="translate(90,62)">
<rect class="cell" x="0" y="0" width="62" height="60"/><rect class="cell" x="62" y="0" width="62" height="60"/><rect class="sel" x="124" y="0" width="62" height="60"/><rect class="cell" x="186" y="0" width="62" height="60"/><rect class="cell" x="248" y="0" width="62" height="60"/><rect class="cell" x="310" y="0" width="62" height="60"/><rect class="cell" x="372" y="0" width="62" height="60"/><rect class="sel" x="434" y="0" width="62" height="60"/><rect class="cell" x="496" y="0" width="62" height="60"/><rect class="cell" x="558" y="0" width="62" height="60"/><rect class="cell" x="620" y="0" width="62" height="60"/><rect class="cell" x="682" y="0" width="62" height="60"/><rect class="sel" x="744" y="0" width="62" height="60"/><rect class="cell" x="806" y="0" width="62" height="60"/><rect class="cell" x="868" y="0" width="62" height="60"/>
<g class="h" text-anchor="middle"><text x="31" y="40">a</text><text x="93" y="40">b</text><text x="155" y="40">c</text><text x="217" y="40">b</text><text x="279" y="40">d</text><text x="341" y="40">a</text><text x="403" y="40">c</text><text x="465" y="40">d</text><text x="527" y="40">a</text><text x="589" y="40">b</text><text x="651" y="40">d</text><text x="713" y="40">c</text><text x="775" y="40">a</text><text x="837" y="40">a</text><text x="899" y="40">b</text></g></g>
<g class="b"><text x="90" y="175">Vị trí 3: khóa c xuất hiện 3 lần trong hậu tố → c₃=3</text><text x="90" y="225">Vị trí 8: khóa d xuất hiện 2 lần trong hậu tố → c₈=2</text><text x="90" y="275">Vị trí 13: khóa a xuất hiện 2 lần trong hậu tố → c₁₃=2</text></g>
<rect x="260" y="305" width="600" height="42" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text class="h" x="560" y="334" text-anchor="middle">Chỉ giữ khóa đã chọn và bộ đếm trong hậu tố</text>
</svg>
