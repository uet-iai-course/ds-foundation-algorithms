<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">Phần tử nặng trên dòng mười lăm phần tử</title><desc id="desc">Biểu đồ cột tần suất trên dòng mười lăm phần tử: a cao 5, tô màu khác; b cao 4; c cao 3; d cao 3. Đường ngang liền ở mức 5, nhãn ngưỡng r/κ = 15/3 = 5; a là phần tử nặng. Đường ngang nét đứt ở mức 4, nhãn b xuất hiện r/κ − 1 = 4 lần, không đạt; bộ nhớ nhỏ khó tách 5 khỏi 4.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="380" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><line x1="120" y1="320" x2="760" y2="320" stroke="#d5dbe5" stroke-width="1"/><text x="106" y="329" font-size="24" fill="#6b7788" text-anchor="end" font-weight="normal">0</text><line x1="120" y1="268" x2="760" y2="268" stroke="#d5dbe5" stroke-width="1"/><text x="106" y="277" font-size="24" fill="#6b7788" text-anchor="end" font-weight="normal">1</text><line x1="120" y1="216" x2="760" y2="216" stroke="#d5dbe5" stroke-width="1"/><text x="106" y="225" font-size="24" fill="#6b7788" text-anchor="end" font-weight="normal">2</text><line x1="120" y1="164" x2="760" y2="164" stroke="#d5dbe5" stroke-width="1"/><text x="106" y="173" font-size="24" fill="#6b7788" text-anchor="end" font-weight="normal">3</text><line x1="120" y1="112" x2="760" y2="112" stroke="#d5dbe5" stroke-width="1"/><text x="106" y="121" font-size="24" fill="#6b7788" text-anchor="end" font-weight="normal">4</text><line x1="120" y1="60" x2="760" y2="60" stroke="#d5dbe5" stroke-width="1"/><text x="106" y="69" font-size="24" fill="#6b7788" text-anchor="end" font-weight="normal">5</text><rect x="160" y="60" width="90" height="260" fill="#a85b23"/><text x="205" y="356" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">a</text><text x="205" y="50" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold">f = 5</text><rect x="310" y="112" width="90" height="208" fill="#2f3e7a"/><text x="355" y="356" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">b</text><text x="355" y="102" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold">f = 4</text><rect x="460" y="164" width="90" height="156" fill="#2f3e7a"/><text x="505" y="356" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">c</text><text x="505" y="154" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold">f = 3</text><rect x="610" y="164" width="90" height="156" fill="#2f3e7a"/><text x="655" y="356" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">d</text><text x="655" y="154" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold">f = 3</text><line x1="120" y1="60" x2="790" y2="60" stroke="#a85b23" stroke-width="4"/><text x="800" y="69" font-size="26" fill="#a85b23" text-anchor="start" font-weight="bold">ngưỡng r/κ = 15/3 = 5</text><text x="800" y="104" font-size="25" fill="#a85b23" text-anchor="start" font-weight="normal">a: phần tử nặng</text><line x1="120" y1="112" x2="790" y2="112" stroke="#2f3e7a" stroke-width="3" stroke-dasharray="10 7"/><text x="800" y="152" font-size="25" fill="#2f3e7a" text-anchor="start" font-weight="normal">b: r/κ − 1 = 4 lần, không đạt</text><text x="800" y="188" font-size="25" fill="#233247" text-anchor="start" font-weight="normal" font-style="italic">bộ nhớ nhỏ khó tách 5 khỏi 4</text><line x1="120" y1="320" x2="760" y2="320" stroke="#233247" stroke-width="2"/><line x1="120" y1="28.80000000000001" x2="120" y2="320" stroke="#233247" stroke-width="2"/><text x="40" y="190.0" font-size="24" fill="#233247" text-anchor="middle" transform="rotate(-90 40 190.0)">tần suất</text></g></svg>
