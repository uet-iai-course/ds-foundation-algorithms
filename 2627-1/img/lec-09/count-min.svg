<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
<title id="title">Tần suất thật và nhiễu va chạm trong Count-Min Sketch</title><desc id="desc">Khóa x có tần suất thật 6. Ba ô truy vấn chứa 9, 7 và 11, tương ứng với nhiễu va chạm 3, 1 và 5; giá trị nhỏ nhất là 7.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f3e7a"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#18223c}.h{font-size:27px;font-weight:700}.b{font-size:22px}.cell{fill:#fff;stroke:#7c879a;stroke-width:2}.hit{fill:#f7efe6;stroke:#b15a2b;stroke-width:3}.line{stroke:#2f3e7a;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<rect x="30" y="170" width="115" height="70" rx="14" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text class="h" x="87" y="214" text-anchor="middle">khóa x</text>
<text class="b" x="190" y="100">h₁(x)=2</text><text class="b" x="190" y="210">h₂(x)=4</text><text class="b" x="190" y="320">h₃(x)=1</text>
<path class="line" d="M145 190 L300 90"/><path class="line" d="M145 205 L300 205"/><path class="line" d="M145 220 L300 315"/>
<g transform="translate(320,55)"><text class="b" x="-30" y="37">1</text><rect class="cell" x="0" y="0" width="110" height="65"/><rect class="cell" x="110" y="0" width="110" height="65"/><rect class="hit" x="220" y="0" width="110" height="65"/><rect class="cell" x="330" y="0" width="110" height="65"/><rect class="cell" x="440" y="0" width="110" height="65"/><rect class="cell" x="550" y="0" width="110" height="65"/><text class="h" x="275" y="42" text-anchor="middle">9</text></g>
<g transform="translate(320,165)"><text class="b" x="-30" y="37">2</text><rect class="cell" x="0" y="0" width="110" height="65"/><rect class="cell" x="110" y="0" width="110" height="65"/><rect class="cell" x="220" y="0" width="110" height="65"/><rect class="cell" x="330" y="0" width="110" height="65"/><rect class="hit" x="440" y="0" width="110" height="65"/><rect class="cell" x="550" y="0" width="110" height="65"/><text class="h" x="495" y="42" text-anchor="middle">7</text></g>
<g transform="translate(320,275)"><text class="b" x="-30" y="37">3</text><rect class="cell" x="0" y="0" width="110" height="65"/><rect class="hit" x="110" y="0" width="110" height="65"/><rect class="cell" x="220" y="0" width="110" height="65"/><rect class="cell" x="330" y="0" width="110" height="65"/><rect class="cell" x="440" y="0" width="110" height="65"/><rect class="cell" x="550" y="0" width="110" height="65"/><text class="h" x="165" y="42" text-anchor="middle">11</text></g>
<text class="b" x="1010" y="96" text-anchor="end">6 + nhiễu 3</text><text class="b" x="1010" y="206" text-anchor="end">6 + nhiễu 1</text><text class="b" x="1010" y="316" text-anchor="end">6 + nhiễu 5</text>
<text class="h" x="650" y="405" text-anchor="middle">fₓ = 6; ước lượng = min(9, 7, 11) = 7</text>
</svg>
