<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Hai phân bố cùng độ dài và cùng số phần tử phân biệt</title><desc id="desc">Hai biểu đồ cột cùng trục, mỗi biểu đồ mười một cột cho mười một phần tử phân biệt của một dòng dài r = 100. Bên trái, đều nhất: một cột cao 10, mười cột cao 9; F0 = 11; F2 = 10 bình phương cộng 10 nhân 9 bình phương = 910. Bên phải, lệch nhất: một cột cao 90, mười cột cao 1; F0 = 11; F2 = 90 bình phương cộng 10 = 8 110. Cột đầu mỗi biểu đồ tô màu khác và có nhãn số.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="400" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="300" y="34" font-size="27" fill="#233247" text-anchor="middle" font-weight="bold">Đều nhất</text><rect x="40" y="274.4" width="38" height="25.6" fill="#a85b23"/><text x="59.0" y="266.44444444444446" font-size="23" fill="#233247" text-anchor="middle" font-weight="bold">10</text><rect x="88" y="277.0" width="38" height="23.0" fill="#2f3e7a"/><text x="107.0" y="269.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="bold">9</text><rect x="136" y="277.0" width="38" height="23.0" fill="#2f3e7a"/><rect x="184" y="277.0" width="38" height="23.0" fill="#2f3e7a"/><rect x="232" y="277.0" width="38" height="23.0" fill="#2f3e7a"/><rect x="280" y="277.0" width="38" height="23.0" fill="#2f3e7a"/><rect x="328" y="277.0" width="38" height="23.0" fill="#2f3e7a"/><rect x="376" y="277.0" width="38" height="23.0" fill="#2f3e7a"/><rect x="424" y="277.0" width="38" height="23.0" fill="#2f3e7a"/><rect x="472" y="277.0" width="38" height="23.0" fill="#2f3e7a"/><rect x="520" y="277.0" width="38" height="23.0" fill="#2f3e7a"/><line x1="30" y1="300" x2="570" y2="300" stroke="#233247" stroke-width="2"/><text x="300" y="332" font-size="23" fill="#6b7788" text-anchor="middle" font-weight="normal">11 phần tử phân biệt; F₀ = 11</text><text x="300" y="362" font-size="23" fill="#6b7788" text-anchor="middle" font-weight="normal">r = 10 + 10·9 = 100</text><text x="300" y="396" font-size="26" fill="#2f3e7a" text-anchor="middle" font-weight="bold">F₂ = 10² + 10·9² = 910</text><text x="900" y="34" font-size="27" fill="#233247" text-anchor="middle" font-weight="bold">Lệch nhất</text><rect x="640" y="70.0" width="38" height="230.0" fill="#a85b23"/><text x="659.0" y="62.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="bold">90</text><rect x="688" y="297.4" width="38" height="2.6" fill="#2f3e7a"/><text x="707.0" y="289.44444444444446" font-size="23" fill="#233247" text-anchor="middle" font-weight="bold">1</text><rect x="736" y="297.4" width="38" height="2.6" fill="#2f3e7a"/><rect x="784" y="297.4" width="38" height="2.6" fill="#2f3e7a"/><rect x="832" y="297.4" width="38" height="2.6" fill="#2f3e7a"/><rect x="880" y="297.4" width="38" height="2.6" fill="#2f3e7a"/><rect x="928" y="297.4" width="38" height="2.6" fill="#2f3e7a"/><rect x="976" y="297.4" width="38" height="2.6" fill="#2f3e7a"/><rect x="1024" y="297.4" width="38" height="2.6" fill="#2f3e7a"/><rect x="1072" y="297.4" width="38" height="2.6" fill="#2f3e7a"/><rect x="1120" y="297.4" width="38" height="2.6" fill="#2f3e7a"/><line x1="630" y1="300" x2="1170" y2="300" stroke="#233247" stroke-width="2"/><text x="900" y="332" font-size="23" fill="#6b7788" text-anchor="middle" font-weight="normal">11 phần tử phân biệt; F₀ = 11</text><text x="900" y="362" font-size="23" fill="#6b7788" text-anchor="middle" font-weight="normal">r = 90 + 10·1 = 100</text><text x="900" y="396" font-size="26" fill="#2f3e7a" text-anchor="middle" font-weight="bold">F₂ = 90² + 10·1² = 8 110</text><line x1="600" y1="20" x2="600" y2="390" stroke="#d5dbe5" stroke-width="2"/></g></svg>
