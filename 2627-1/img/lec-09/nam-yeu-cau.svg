<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Năm yêu cầu trên dòng lượt truy cập</title><desc id="desc">Bên trái: khối dòng lượt truy cập (IP, URL). Năm mũi tên tới năm yêu cầu, mỗi yêu cầu kèm một ô phác thảo ghi dấu hỏi: (a) số người dùng phân biệt trong tháng, d xấp xỉ 10 mũ 6; (b) phân bố lượt theo người dùng lệch đến đâu; (c) một địa chỉ gửi bao nhiêu yêu cầu, địa chỉ gửi ít nhất 1%; (d) lượt vào một URL trong 10 mũ 9 lượt gần nhất; (e) các URL phổ biến gần đây. Hai yêu cầu cuối viền nét đứt, hỏi về phần gần đây.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="400" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="10" y="130" width="230" height="140" rx="10" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="125" y="180" font-size="25" fill="#233247" text-anchor="middle" font-weight="bold">Dòng lượt</text><text x="125" y="212" font-size="25" fill="#233247" text-anchor="middle" font-weight="bold">truy cập</text><text x="125" y="244" font-size="23" fill="#6b7788" text-anchor="middle" font-weight="normal">(IP, URL)</text><line x1="242" y1="200" x2="300" y2="46" stroke="#2f3e7a" stroke-width="2" marker-end="url(#arrow)"/><rect x="306" y="14" width="690" height="64" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="326" y="55" font-size="25" fill="#2f3e7a" text-anchor="start" font-weight="bold">(a)</text><text x="380" y="55" font-size="24" fill="#233247" text-anchor="start" font-weight="normal">số người dùng phân biệt trong tháng, d ≈ 10⁶</text><rect x="1012" y="14" width="176" height="64" rx="10" fill="#ffffff" stroke="#6b7788" stroke-width="2"/><text x="1100" y="55" font-size="23" fill="#6b7788" text-anchor="middle" font-weight="normal">phác thảo: ?</text><line x1="242" y1="200" x2="300" y2="122" stroke="#2f3e7a" stroke-width="2" marker-end="url(#arrow)"/><rect x="306" y="90" width="690" height="64" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="326" y="131" font-size="25" fill="#2f3e7a" text-anchor="start" font-weight="bold">(b)</text><text x="380" y="131" font-size="24" fill="#233247" text-anchor="start" font-weight="normal">phân bố lượt theo người dùng lệch đến đâu</text><rect x="1012" y="90" width="176" height="64" rx="10" fill="#ffffff" stroke="#6b7788" stroke-width="2"/><text x="1100" y="131" font-size="23" fill="#6b7788" text-anchor="middle" font-weight="normal">phác thảo: ?</text><line x1="242" y1="200" x2="300" y2="198" stroke="#2f3e7a" stroke-width="2" marker-end="url(#arrow)"/><rect x="306" y="166" width="690" height="64" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="326" y="207" font-size="25" fill="#2f3e7a" text-anchor="start" font-weight="bold">(c)</text><text x="380" y="207" font-size="24" fill="#233247" text-anchor="start" font-weight="normal">một địa chỉ gửi bao nhiêu yêu cầu; địa chỉ gửi ≥ 1%</text><rect x="1012" y="166" width="176" height="64" rx="10" fill="#ffffff" stroke="#6b7788" stroke-width="2"/><text x="1100" y="207" font-size="23" fill="#6b7788" text-anchor="middle" font-weight="normal">phác thảo: ?</text><line x1="242" y1="200" x2="300" y2="274" stroke="#2f3e7a" stroke-width="2" marker-end="url(#arrow)"/><rect x="306" y="242" width="690" height="64" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5" stroke-dasharray="10 6"/><text x="326" y="283" font-size="25" fill="#a85b23" text-anchor="start" font-weight="bold">(d)</text><text x="380" y="283" font-size="24" fill="#233247" text-anchor="start" font-weight="normal">lượt vào một URL trong 10⁹ lượt gần nhất</text><rect x="1012" y="242" width="176" height="64" rx="10" fill="#ffffff" stroke="#6b7788" stroke-width="2"/><text x="1100" y="283" font-size="23" fill="#6b7788" text-anchor="middle" font-weight="normal">phác thảo: ?</text><line x1="242" y1="200" x2="300" y2="350" stroke="#2f3e7a" stroke-width="2" marker-end="url(#arrow)"/><rect x="306" y="318" width="690" height="64" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5" stroke-dasharray="10 6"/><text x="326" y="359" font-size="25" fill="#a85b23" text-anchor="start" font-weight="bold">(e)</text><text x="380" y="359" font-size="24" fill="#233247" text-anchor="start" font-weight="normal">các URL phổ biến gần đây</text><rect x="1012" y="318" width="176" height="64" rx="10" fill="#ffffff" stroke="#6b7788" stroke-width="2"/><text x="1100" y="359" font-size="23" fill="#6b7788" text-anchor="middle" font-weight="normal">phác thảo: ?</text></g></svg>
