<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
<title id="title">Trạng thái DGIM của MMDS Hình 4.2</title><desc id="desc">Hai mươi lăm ô bit từ cũ bên trái sang mới bên phải: 1011011000101110110010110, dưới mỗi ô ghi vị trí từ r−24 tới r. Sáu khung bao các thùng, tam giác dưới ô đánh dấu mốc phải: khung trái cùng bị cắt ở mép trái với dấu ba chấm, nhãn cỡ 8, mốc r−22; hai khung cỡ 4, mốc r−14 và r−8; một khung cỡ 2, mốc r−4, phủ bốn ô 1001; hai khung cỡ 1, mốc r−2 và r−1. Ba bit 0 ở r−13, r−3 và r nằm ngoài mọi khung. Đường đứng nét đứt trước vị trí r−9 đánh dấu mười vị trí cuối, k = 10.</desc>
