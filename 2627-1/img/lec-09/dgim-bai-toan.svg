nchor="middle" font-weight="normal">6</text><rect x="383" y="70" width="54" height="60" rx="5" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><text x="410.0" y="112" font-size="30" fill="#233247" text-anchor="middle" font-weight="normal">0</text><text x="410.0" y="162" font-size="22" fill="#6b7788" text-anchor="middle" font-weight="normal">7</text><rect x="443" y="70" width="54" height="60" rx="5" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><text x="470.0" y="112" font-size="30" fill="#233247" text-anchor="middle" font-weight="normal">0</text><text x="470.0" y="162" font-size="22" fill="#6b7788" text-anchor="middle" font-weight="normal">8</text><rect x="503" y="70" width="54" height="60" rx="5" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><text x="530.0" y="112" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">1</text><text x="530.0" y="162" font-size="22" fill="#6b7788" text-anchor="middle" font-weight="normal">9</text><rect x="563" y="70" width="54" height="60" rx="5" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><text x="590.0" y="112" font-size="30" fill="#233247" text-anchor="middle" font-weight="normal">0</text><text x="590.0" y="162" font-size="22" fill="#6b7788" text-anchor="middle" font-weight="normal">10</text><rect x="623" y="70" width="54" height="60" rx="5" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><text x="650.0" y="112" font-size="30" fill="#233247" text-anchor="middle" font-weight="normal">0</text><text x="650.0" y="162" font-size="22" fill="#6b7788" text-anchor="middle" font-weight="normal">11</text><rect x="683" y="70" width="54" height="60" rx="5" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><text x="710.0" y="112" font-size="30" fill="#233247" text-anchor="middle" font-weight="normal">0</text><text x="710.0" y="162" font-size="22" fill="#6b7788" text-anchor="middle" font-weight="normal">12</text><rect x="743" y="70" width="54" height="60" rx="5" fill="#ffffff" stroke="#6b7788" stroke