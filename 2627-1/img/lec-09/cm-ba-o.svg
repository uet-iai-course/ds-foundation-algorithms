<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Ba ô của một phần tử trong bảng Count-Min</title><desc id="desc">Bảng ba hàng, mỗi hàng tám ô. Ô mà phần tử u được băm tới có viền đậm: hàng 1 chứa 104, hàng 2 chứa 78 (tô màu khác), hàng 3 chứa 90; các ô khác để trống. Chú thích bên phải: ô của u ở mỗi hàng bằng f_u cộng nhiễu không âm; ước lượng là min(104, 78, 90) = 78.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="300" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="130" y="66" font-size="26" fill="#233247" text-anchor="end" font-weight="bold">hàng 1</text><rect x="153" y="20" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><rect x="245" y="20" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><rect x="337" y="20" width="86" height="70" rx="6" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="380.0" y="67" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">104</text><rect x="429" y="20" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><rect x="521" y="20" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><rect x="613" y="20" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><rect x="705" y="20" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><rect x="797" y="20" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><text x="130" y="152" font-size="26" fill="#233247" text-anchor="end" font-weight="bold">hàng 2</text><rect x="153" y="106" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><rect x="245" y="106" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><rect x="337" y="106" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><rect x="429" y="106" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><rect x="521" y="106" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><rect x="613" y="106" width="86" height="70" rx="6" fill="#fff4e9" stroke="#a85b23" stroke-width="4"/><text x="656.0" y="153" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">78</text><rect x="705" y="106" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><rect x="797" y="106" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><text x="130" y="238" font-size="26" fill="#233247" text-anchor="end" font-weight="bold">hàng 3</text><rect x="153" y="192" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><rect x="245" y="192" width="86" height="70" rx="6" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="288.0" y="239" font-size="30" fill="#233247" text-anchor="middle" font-weight="bold">90</text><rect x="337" y="192" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><rect x="429" y="192" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><rect x="521" y="192" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><rect x="613" y="192" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><rect x="705" y="192" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><rect x="797" y="192" width="86" height="70" rx="6" fill="#ffffff" stroke="#6b7788" stroke-width="1.5"/><text x="916" y="70" font-size="26" fill="#233247" text-anchor="start" font-weight="normal">ô của u ở mỗi hàng:</text><text x="916" y="110" font-size="26" fill="#233247" text-anchor="start" font-weight="normal">fᵤ + nhiễu ≥ 0</text><text x="916" y="180" font-size="26" fill="#a85b23" text-anchor="start" font-weight="bold">ước lượng:</text><text x="916" y="222" font-size="27" fill="#a85b23" text-anchor="start" font-weight="bold">min(104, 78, 90) = 78</text></g></svg>
