<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 430" role="img" aria-labelledby="title desc">
<title id="title">Cập nhật DGIM khi một bit 1 đến</title><desc id="desc">Hai dải thùng, đọc từ cũ bên trái sang mới bên phải. Dải trên: thùng cỡ 8 mốc r−22, cỡ 4 mốc r−14, cỡ 4 mốc r−8, cỡ 2 mốc r−4, hai thùng cỡ 1 mốc r−2 và r−1 viền nét đứt, và thùng cỡ 1 mới mốc r+1 do bit 1 ở r+1 tạo ra. Mũi tên nhãn gộp hai thùng cỡ 1 cũ nhất đi xuống dải dưới. Dải dưới, sau cập nhật: cỡ 8 mốc r−22, cỡ 4 mốc r−14, cỡ 4 mốc r−8, cỡ 2 mốc r−4, cỡ 2 mốc r−1 viền nét đứt, cỡ 1 mốc r+1. Chú thích: kích thước từ mới về cũ là 1, 2, 2, 4, 4, 8, không giảm; mỗi kích thước có một hoặc hai thùng.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1300" height="430" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="190" y="30" font-size="18" fill="#6b7788" text-anchor="start" font-weight="normal">cũ → mới</text><text x="20" y="90" font-size="20" fill="#233247" text-anchor="start" font-weight="bold">Trước gộp</text><rect x="190" y="50" width="190" height="64" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="285.0" y="78" font-size="21" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cỡ 8</text><text x="285.0" y="102" font-size="16" fill="#233247" text-anchor="middle" font-weight="normal">mốc r−22</text><rect x="394" y="50" width="150" height="64" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="469.0" y="78" font-size="21" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cỡ 4</text><text x="469.0" y="102" font-size="16" fill="#233247" text-anchor="middle" font-weight="normal">mốc r−14</text><rect x="558" y="50" width="150" height="64" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="633.0" y="78" font-size="21" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cỡ 4</text><text x="633.0" y="102" font-size="16" fill="#233247" text-anchor="middle" font-weight="normal">mốc r−8</text><rect x="722" y="50" width="110" height="64" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="777.0" y="78" font-size="21" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cỡ 2</text><text x="777.0" y="102" font-size="16" fill="#233247" text-anchor="middle" font-weight="normal">mốc r−4</text><rect x="846" y="50" width="80" height="64" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="3" stroke-dasharray="8 5"/><text x="886.0" y="78" font-size="21" fill="#a85b23" text-anchor="middle" font-weight="bold">cỡ 1</text><text x="886.0" y="102" font-size="16" fill="#233247" text-anchor="middle" font-weight="normal">mốc r−2</text><rect x="940" y="50" width="80" height="64" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="3" stroke-dasharray="8 5"/><text x="980.0" y="78" font-size="21" fill="#a85b23" text-anchor="middle" font-weight="bold">cỡ 1</text><text x="980.0" y="102" font-size="16" fill="#233247" text-anchor="middle" font-weight="normal">mốc r−1</text><rect x="1034" y="50" width="80" height="64" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="1074.0" y="78" font-size="21" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cỡ 1</text><text x="1074.0" y="102" font-size="16" fill="#233247" text-anchor="middle" font-weight="normal">mốc r+1</text><text x="1034" y="146" font-size="16" fill="#2f3e7a" text-anchor="start" font-weight="normal">thùng mới của bit 1 ở r+1</text><path d="M846,122 L846,132 L1020,132 L1020,122" fill="none" stroke="#a85b23" stroke-width="3"/><line x1="933.0" y1="132" x2="901.0" y2="238" stroke="#a85b23" stroke-width="3"/><path d="M892.0,230 L901.0,248 L910.0,230 Z" fill="#a85b23"/><text x="913.0" y="190" font-size="18" fill="#a85b23" text-anchor="end" font-weight="bold">gộp hai thùng cỡ 1 cũ nhất</text><text x="20" y="290" font-size="20" fill="#233247" text-anchor="start" font-weight="bold">Sau cập nhật</text><rect x="190" y="250" width="190" height="64" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="285.0" y="278" font-size="21" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cỡ 8</text><text x="285.0" y="302" font-size="16" fill="#233247" text-anchor="middle" font-weight="normal">mốc r−22</text><rect x="394" y="250" width="150" height="64" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="469.0" y="278" font-size="21" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cỡ 4</text><text x="469.0" y="302" font-size="16" fill="#233247" text-anchor="middle" font-weight="normal">mốc r−14</text><rect x="558" y="250" width="150" height="64" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="633.0" y="278" font-size="21" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cỡ 4</text><text x="633.0" y="302" font-size="16" fill="#233247" text-anchor="middle" font-weight="normal">mốc r−8</text><rect x="722" y="250" width="110" height="64" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="777.0" y="278" font-size="21" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cỡ 2</text><text x="777.0" y="302" font-size="16" fill="#233247" text-anchor="middle" font-weight="normal">mốc r−4</text><rect x="846" y="250" width="110" height="64" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="3" stroke-dasharray="8 5"/><text x="901.0" y="278" font-size="21" fill="#a85b23" text-anchor="middle" font-weight="bold">cỡ 2</text><text x="901.0" y="302" font-size="16" fill="#233247" text-anchor="middle" font-weight="normal">mốc r−1</text><rect x="970" y="250" width="80" height="64" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="1010.0" y="278" font-size="21" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cỡ 1</text><text x="1010.0" y="302" font-size="16" fill="#233247" text-anchor="middle" font-weight="normal">mốc r+1</text><text x="590" y="370" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">Kích thước từ mới về cũ: 1, 2, 2, 4, 4, 8, không giảm (quy tắc 6)</text><text x="590" y="400" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">Mỗi kích thước có một hoặc hai thùng (quy tắc 4)</text></g></svg>
