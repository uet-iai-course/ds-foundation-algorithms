le cx="922.0" cy="340" r="11" fill="#a85b23"/><circle cx="988.0" cy="340" r="11" fill="#a85b23"/><text x="906.0" y="347" font-size="18" fill="#a85b23" text-anchor="end" font-weight="bold">vị trí 13</text><text x="1074.0" y="336" font-size="20" fill="#a85b23" text-anchor="start" font-weight="bold">v₁₃ = 2</text><text x="1074.0" y="362" font-size="18" fill="#233247" text-anchor="start" font-weight="normal">15·(2·2−1) = 45</text><rect x="390" y="410" width="500" height="46" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="640" y="441" font-size="22" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Trung bình 55; giá trị thật F₂ = 59</text></g></svg>
