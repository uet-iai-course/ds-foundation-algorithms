<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
<title id="title">Ba biến AMS trên dòng mười lăm phần tử</title><desc id="desc">Hàng trên: mười lăm ô đánh số vị trí 1 đến 15 chứa dòng a b c b d a c d a b d c a a b; ba ô vị trí 3, 8, 13 có viền dày. Bên dưới, ba đường kẻ từ vị trí được chọn tới cuối dòng, mỗi đường một kiểu nét, chấm tròn đánh dấu các lần xuất hiện của cùng phần tử: từ vị trí 3, phần tử c ở 3, 7, 12, v3 = 3, ước lượng 15 nhân 5 bằng 75; từ vị trí 8, phần tử d ở 8, 11, v8 = 2, ước lượng 45; từ vị trí 13, phần tử a ở 13, 14, v13 = 2, ước lượng 45. Dòng cuối: trung bình 55, giá trị thật F2 bằng 59.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1280" height="470" fill="#ffffff"/>
