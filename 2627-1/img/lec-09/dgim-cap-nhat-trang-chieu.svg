<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Cập nhật DGIM khi một bit 1 đến</title><desc id="desc">Hai dải thùng, đọc từ cũ bên trái sang mới bên phải, dưới mỗi cỡ ghi mốc phải. Dải trên, trước gộp: cỡ 8 mốc r−22, cỡ 4 mốc r−14, cỡ 4 mốc r−8, cỡ 2 mốc r−4, hai thùng cỡ 1 mốc r−2 và r−1 viền nét đứt, và thùng mới cỡ 1 mốc r+1. Mũi tên nhãn gộp hai thùng cỡ 1 cũ nhất đi xuống dải dưới. Dải dưới, sau cập nhật: cỡ 8 mốc r−22, cỡ 4 mốc r−14, cỡ 4 mốc r−8, cỡ 2 mốc r−4, cỡ 2 mốc r−1 viền nét đứt, cỡ 1 mốc r+1. Chú thích: từ mới về cũ 1, 2, 2, 4, 4, 8, không giảm; mỗi kích thước có một hoặc hai thùng.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="420" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="190" y="26" font-size="21" fill="#6b7788" text-anchor="start" font-weight="normal">cũ → mới; dưới mỗi cỡ là mốc phải</text><text x="10" y="86" font-size="24" fill="#233247" text-anchor="start" font-weight="bold">Trước gộp</text><rect x="190" y="44" width="170" height="70" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="275.0" y="74" font-size="24" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cỡ 8</text><text x="275.0" y="102" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">r−22</text><rect x="372" y="44" width="135" height="70" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="439.5" y="74" font-size="24" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cỡ 4</text><text x="439.5" y="102" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">r−14</text><rect x="519" y="44" width="135" height="70" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="586.5" y="74" font-size="24" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cỡ 4</text><text x="586.5" y="102" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">r−8</text><rect x="666" y="44" width="104" height="70" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="718.0" y="74" font-size="24" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cỡ 2</text><text x="718.0" y="102" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">r−4</text><rect x="782" y="44" width="80" height="70" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="3" stroke-dasharray="8 5"/><text x="822.0" y="74" font-size="24" fill="#a85b23" text-anchor="middle" font-weight="bold">cỡ 1</text><text x="822.0" y="102" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">r−2</text><rect x="874" y="44" width="80" height="70" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="3" stroke-dasharray="8 5"/><text x="914.0" y="74" font-size="24" fill="#a85b23" text-anchor="middle" font-weight="bold">cỡ 1</text><text x="914.0" y="102" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">r−1</text><rect x="966" y="44" width="80" height="70" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="1006.0" y="74" font-size="24" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cỡ 1</text><text x="1006.0" y="102" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">r+1</text><text x="1006" y="146" font-size="21" fill="#2f3e7a" text-anchor="middle" font-weight="normal">thùng mới</text><path d="M782,120 L782,132 L954,132 L954,120" fill="none" stroke="#a85b23" stroke-width="3"/><line x1="868.0" y1="132" x2="834.0" y2="226" stroke="#a85b23" stroke-width="3"/><path d="M825.0,220 L834.0,238 L843.0,220 Z" fill="#a85b23"/><text x="838.0" y="190" font-size="23" fill="#a85b23" text-anchor="end" font-weight="bold">gộp hai thùng cỡ 1 cũ nhất</text><text x="10" y="284" font-size="24" fill="#233247" text-anchor="start" font-weight="bold">Sau cập nhật</text><rect x="190" y="242" width="170" height="70" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="275.0" y="272" font-size="24" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cỡ 8</text><text x="275.0" y="300" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">r−22</text><rect x="372" y="242" width="135" height="70" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="439.5" y="272" font-size="24" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cỡ 4</text><text x="439.5" y="300" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">r−14</text><rect x="519" y="242" width="135" height="70" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="586.5" y="272" font-size="24" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cỡ 4</text><text x="586.5" y="300" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">r−8</text><rect x="666" y="242" width="104" height="70" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="718.0" y="272" font-size="24" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cỡ 2</text><text x="718.0" y="300" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">r−4</text><rect x="782" y="242" width="104" height="70" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="3" stroke-dasharray="8 5"/><text x="834.0" y="272" font-size="24" fill="#a85b23" text-anchor="middle" font-weight="bold">cỡ 2</text><text x="834.0" y="300" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">r−1</text><rect x="898" y="242" width="80" height="70" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="938.0" y="272" font-size="24" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cỡ 1</text><text x="938.0" y="300" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">r+1</text><text x="600" y="358" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">Từ mới về cũ: 1, 2, 2, 4, 4, 8, không giảm (quy tắc 6)</text><text x="600" y="394" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">Mỗi kích thước có một hoặc hai thùng (quy tắc 4)</text></g></svg>
