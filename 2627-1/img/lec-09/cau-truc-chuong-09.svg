<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Cấu trúc của Bài 09</title><desc id="desc">Sơ đồ đọc từ trên xuống. Một dòng đọc một lượt đi vào năm khối song song. Mục 2: bao nhiêu phần tử phân biệt, đại lượng F0 bằng d, cấu trúc Flajolet–Martin, bảo đảm xác suất hai phía, phạm vi toàn dòng. Mục 3: phân bố lệch đến đâu, đại lượng F2, cấu trúc biến AMS, bảo đảm kỳ vọng đúng F2, phạm vi toàn dòng. Mục 4: phần tử u xuất hiện bao nhiêu lần, đại lượng f_u, cấu trúc Count-Min, bảo đảm không ước lượng thấp và sai số nhỏ, phạm vi toàn dòng. Mục 5: bao nhiêu bit 1 trong k vị trí cuối, đại lượng y_k, cấu trúc DGIM, sai số tối đa 50 phần trăm, phạm vi gần đây. Mục 6: phần tử nào phổ biến gần đây, đại lượng D_r(u), cấu trúc cửa sổ suy giảm, ít hơn 1/(cθ) điểm, phạm vi gần đây. Hai khối phạm vi gần đây có viền nét đứt. Năm mũi tên hội tụ vào khối Mục 7, chọn cấu trúc theo câu hỏi.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="380" y="16" width="440" height="70" rx="10" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="600" y="60" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">Dòng x₁, x₂, … đọc một lượt</text><line x1="600" y1="88" x2="130.0" y2="128" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="134" width="220" height="360" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="130.0" y="170" font-size="26" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Mục 2</text><text x="130.0" y="210" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">Bao nhiêu phần tử</text><text x="130.0" y="236" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">phân biệt?</text><text x="130.0" y="278" font-size="19" fill="#6b7788" text-anchor="middle" font-weight="normal" font-style="italic">Đại lượng:</text><text x="130.0" y="306" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold" font-style="italic">F<tspan baseline-shift="sub" font-size="16">0</tspan> = d</text><text x="130.0" y="348" font-size="19" fill="#6b7788" text-anchor="middle" font-weight="normal" font-style="italic">Cấu trúc:</text><text x="130.0" y="376" font-size="21" fill="#233247" text-anchor="middle" font-weight="bold">Flajolet–Martin</text><text x="130.0" y="418" font-size="19" fill="#6b7788" text-anchor="middle" font-weight="normal" font-style="italic">Bảo đảm:</text><text x="130.0" y="446" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">xác suất hai phía</text><text x="130.0" y="482" font-size="18" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Phạm vi: toàn dòng</text><line x1="130.0" y1="496" x2="600" y2="552" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="600" y1="88" x2="365.0" y2="128" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="255" y="134" width="220" height="360" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="365.0" y="170" font-size="26" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Mục 3</text><text x="365.0" y="210" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">Phân bố lệch</text><text x="365.0" y="236" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">đến đâu?</text><text x="365.0" y="278" font-size="19" fill="#6b7788" text-anchor="middle" font-weight="normal" font-style="italic">Đại lượng:</text><text x="365.0" y="306" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold" font-style="italic">F<tspan baseline-shift="sub" font-size="16">2</tspan></text><text x="365.0" y="348" font-size="19" fill="#6b7788" text-anchor="middle" font-weight="normal" font-style="italic">Cấu trúc:</text><text x="365.0" y="376" font-size="21" fill="#233247" text-anchor="middle" font-weight="bold">biến AMS</text><text x="365.0" y="418" font-size="19" fill="#6b7788" text-anchor="middle" font-weight="normal" font-style="italic">Bảo đảm:</text><text x="365.0" y="446" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">kỳ vọng đúng F₂</text><text x="365.0" y="482" font-size="18" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Phạm vi: toàn dòng</text><line x1="365.0" y1="496" x2="600" y2="552" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="600" y1="88" x2="600.0" y2="128" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="490" y="134" width="220" height="360" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="600.0" y="170" font-size="26" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Mục 4</text><text x="600.0" y="210" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">Phần tử u xuất hiện</text><text x="600.0" y="236" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">bao nhiêu lần?</text><text x="600.0" y="278" font-size="19" fill="#6b7788" text-anchor="middle" font-weight="normal" font-style="italic">Đại lượng:</text><text x="600.0" y="306" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold" font-style="italic">f<tspan baseline-shift="sub" font-size="16">u</tspan></text><text x="600.0" y="348" font-size="19" fill="#6b7788" text-anchor="middle" font-weight="normal" font-style="italic">Cấu trúc:</text><text x="600.0" y="376" font-size="21" fill="#233247" text-anchor="middle" font-weight="bold">Count-Min</text><text x="600.0" y="418" font-size="19" fill="#6b7788" text-anchor="middle" font-weight="normal" font-style="italic">Bảo đảm:</text><text x="600.0" y="446" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">không thấp; sai số nhỏ</text><text x="600.0" y="482" font-size="18" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Phạm vi: toàn dòng</text><line x1="600.0" y1="496" x2="600" y2="552" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="600" y1="88" x2="835.0" y2="128" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="725" y="134" width="220" height="360" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5" stroke-dasharray="10 6"/><text x="835.0" y="170" font-size="26" fill="#a85b23" text-anchor="middle" font-weight="bold">Mục 5</text><text x="835.0" y="210" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">Bao nhiêu bit 1 trong</text><text x="835.0" y="236" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">k vị trí cuối?</text><text x="835.0" y="278" font-size="19" fill="#6b7788" text-anchor="middle" font-weight="normal" font-style="italic">Đại lượng:</text><text x="835.0" y="306" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold" font-style="italic">y<tspan baseline-shift="sub" font-size="16">k</tspan></text><text x="835.0" y="348" font-size="19" fill="#6b7788" text-anchor="middle" font-weight="normal" font-style="italic">Cấu trúc:</text><text x="835.0" y="376" font-size="21" fill="#233247" text-anchor="middle" font-weight="bold">DGIM</text><text x="835.0" y="418" font-size="19" fill="#6b7788" text-anchor="middle" font-weight="normal" font-style="italic">Bảo đảm:</text><text x="835.0" y="446" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">sai số ≤ 50%</text><text x="835.0" y="482" font-size="18" fill="#a85b23" text-anchor="middle" font-weight="bold">Phạm vi: gần đây</text><line x1="835.0" y1="496" x2="600" y2="552" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="600" y1="88" x2="1070.0" y2="128" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="960" y="134" width="220" height="360" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5" stroke-dasharray="10 6"/><text x="1070.0" y="170" font-size="26" fill="#a85b23" text-anchor="middle" font-weight="bold">Mục 6</text><text x="1070.0" y="210" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">Phần tử nào phổ</text><text x="1070.0" y="236" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">biến gần đây?</text><text x="1070.0" y="278" font-size="19" fill="#6b7788" text-anchor="middle" font-weight="normal" font-style="italic">Đại lượng:</text><text x="1070.0" y="306" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold" font-style="italic">D<tspan baseline-shift="sub" font-size="16">r</tspan>(u)</text><text x="1070.0" y="348" font-size="19" fill="#6b7788" text-anchor="middle" font-weight="normal" font-style="italic">Cấu trúc:</text><text x="1070.0" y="376" font-size="21" fill="#233247" text-anchor="middle" font-weight="bold">cửa sổ suy giảm</text><text x="1070.0" y="418" font-size="19" fill="#6b7788" text-anchor="middle" font-weight="normal" font-style="italic">Bảo đảm:</text><text x="1070.0" y="446" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">ít hơn 1/(cθ) điểm</text><text x="1070.0" y="482" font-size="18" fill="#a85b23" text-anchor="middle" font-weight="bold">Phạm vi: gần đây</text><line x1="1070.0" y1="496" x2="600" y2="552" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="558" width="540" height="66" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="600" y="600" font-size="26" fill="#26704e" text-anchor="middle" font-weight="bold">Mục 7. Chọn cấu trúc theo câu hỏi</text></g></svg>
