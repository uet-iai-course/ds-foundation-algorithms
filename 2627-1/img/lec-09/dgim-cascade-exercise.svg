<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
<title id="title">Trạng thái đầu của Bài 4.6.3</title><desc id="desc">Dãy bucket viết từ cũ sang mới. Phần trái chưa xác định chứa ít nhất một bucket 8; phần nhìn thấy kết thúc bằng 4, 4, 2, 2, 1. Ba bit 1 sẽ được thêm ở phía mới.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b15a2b"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#18223c}.h{font-size:28px;font-weight:700}.b{font-size:22px}.box{fill:#fff;stroke:#2f3e7a;stroke-width:4}.unk{fill:#f7efe6;stroke:#b15a2b;stroke-width:4}.arrow{stroke:#b15a2b;stroke-width:4;fill:none;marker-end:url(#a)}</style>
<text class="h" x="40" y="45">cũ</text><path d="M95 37 H1020" stroke="#7c879a" stroke-width="3" marker-end="url(#a)"/><text class="h" x="1070" y="45" text-anchor="end">mới</text>
<g transform="translate(45,100)"><rect class="unk" x="0" y="0" width="250" height="92" rx="12"/><rect class="box" x="270" y="0" width="125" height="92" rx="12"/><rect class="box" x="415" y="0" width="125" height="92" rx="12"/><rect class="box" x="560" y="0" width="105" height="92" rx="12"/><rect class="box" x="685" y="0" width="105" height="92" rx="12"/><rect class="box" x="810" y="0" width="85" height="92" rx="12"/><g class="h" text-anchor="middle"><text x="125" y="56">… ≥ 8</text><text x="332" y="56">4</text><text x="477" y="56">4</text><text x="612" y="56">2</text><text x="737" y="56">2</text><text x="852" y="56">1</text></g></g>
<path class="arrow" d="M945 145 H1080"/><text class="h" x="1015" y="125" text-anchor="middle">+1, +1, +1</text><text class="b" x="560" y="250" text-anchor="middle">Phần trái không cho biết đang có một hay hai bucket 8</text><text class="h" x="560" y="315" text-anchor="middle">Ghi trạng thái sau từng cập nhật và mọi lần gộp lan truyền</text>
</svg>
