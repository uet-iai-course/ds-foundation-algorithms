<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Số vé theo tuần của hai phim</title><desc id="desc">Hai dãy cột theo tuần, từ tuần −9 bên trái tới tuần hiện nay bên phải. Phim A: mười cột cao 1, mỗi tuần 1 đơn vị vé. Phim B: chín tuần đầu 0, tuần hiện nay cột cao 2. Khung nét đứt bao tuần hiện nay, nhãn cửa sổ một tuần: A 1, B 2.</desc>
