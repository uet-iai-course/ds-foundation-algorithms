<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Cây Huffman của A–E, lượt ghép và từ mã</title><desc id="desc">Cây Huffman của A–E. Gốc trọng số 39, ghi lượt 4, có nhánh 0 tới lá A 15 và nhánh 1 tới nút 24, lượt 3. Nút 24 có nhánh 0 tới nút 13, lượt 2, và nhánh 1 tới nút 11, lượt 1. Nút 13 có hai lá B 7, bit 0, và C 6, bit 1; nút 11 có hai lá D 6, bit 0, và E 5, bit 1. Mỗi lá ghi từ mã: A 0, B 100, C 101, D 110, E 111.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
