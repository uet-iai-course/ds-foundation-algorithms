<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Dòng bit 1011 có ba cách đọc</title><desc id="desc">Bên trái: dòng bit của mã 3 bit cắt thành các khối đều 3 bit, mỗi khối là một ký hiệu, chỉ một cách đọc. Bên phải: mã a = 1, b = 01, c = 101, d = 011; dòng bốn bit 1, 0, 1, 1 vẽ ba lần, mỗi lần một cách cắt, các phần xen kẽ hai kiểu tô: 1 | 01 | 1 đọc là a, b, a; 101 | 1 đọc là c, a; 1 | 011 đọc là a, d.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="300" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="20.0" y="36.0" font-size="24" fill="#233247" text-anchor="start" font-weight="bold">Mã 3 bit: cắt thành khối đều</text><rect x="20.0" y="60.0" width="112.0" height="60.0" rx="6" fill="#f4f6f9" stroke="#233247" stroke-width="2"/><text x="76.0" y="98.0" font-size="22" fill="#233247" text-anchor="middle" font-weight="normal">3 bit</text><rect x="140.0" y="60.0" width="112.0" height="60.0" rx="6" fill="#f4f6f9" stroke="#233247" stroke-width="2"/><text x="196.0" y="98.0" font-size="22" fill="#233247" text-anchor="middle" font-weight="normal">3 bit</text><rect x="260.0" y="60.0" width="112.0" height="60.0" rx="6" fill="#f4f6f9" stroke="#233247" stroke-width="2"/><text x="316.0" y="98.0" font-size="22" fill="#233247" text-anchor="middle" font-weight="normal">3 bit</text><rect x="380.0" y="60.0" width="112.0" height="60.0" rx="6" fill="#f4f6f9" stroke="#233247" stroke-width="2"/><text x="436.0" y="98.0" font-size="22" fill="#233247" text-anchor="middle" font-weight="normal">3 bit</text><text x="20.0" y="160.0" font-size="22" fill="#5b6778" text-anchor="start" font-weight="normal" font-style="italic">mỗi khối là một ký hiệu:</text><text x="20.0" y="192.0" font-size="22" fill="#5b6778" text-anchor="start" font-weight="normal" font-style="italic">chỉ một cách đọc</text><line x1="560.0" y1="20.0" x2="560.0" y2="280.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 6"/><text x="600.0" y="36.0" font-size="24" fill="#233247" text-anchor="start" font-weight="bold">Mã a = 1, b = 01, c = 101, d = 011</text><rect x="600.0" y="64.0" width="46.0" height="56.0" rx="4" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="623.0" y="102.0" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">1</text><rect x="656.0" y="64.0" width="92.0" height="56.0" rx="4" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="702.0" y="102.0" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">0 1</text><rect x="758.0" y="64.0" width="46.0" height="56.0" rx="4" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="781.0" y="102.0" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">1</text><text x="830.0" y="102.0" font-size="25" fill="#233247" text-anchor="start" font-weight="bold">→  a b a</text><rect x="600.0" y="138.0" width="138.0" height="56.0" rx="4" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="669.0" y="176.0" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">1 0 1</text><rect x="748.0" y="138.0" width="46.0" height="56.0" rx="4" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="771.0" y="176.0" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">1</text><text x="830.0" y="176.0" font-size="25" fill="#233247" text-anchor="start" font-weight="bold">→  c a</text><rect x="600.0" y="212.0" width="46.0" height="56.0" rx="4" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="623.0" y="250.0" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">1</text><rect x="656.0" y="212.0" width="138.0" height="56.0" rx="4" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="725.0" y="250.0" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">0 1 1</text><text x="830.0" y="250.0" font-size="25" fill="#233247" text-anchor="start" font-weight="bold">→  a d</text></g></svg>
