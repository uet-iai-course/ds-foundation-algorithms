<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
<title id="title">Khoảng mã của hai chuỗi bit và khoảng chuỗi</title><desc id="desc">Trục số từ 0,42 tới 0,51. Thanh trên là khoảng chuỗi từ 0,4305 tới 0,4783 của bảy chữ A và END. Thanh giữa, viền liền, là khoảng mã từ 0,4375 tới 0,46875 của chuỗi 01110, ghi nằm trong. Thanh dưới, viền nét đứt, là khoảng mã từ 0,4375 tới 0,5 của chuỗi 0111, ghi vượt cận trên. Đường gióng nét đứt từ hai đầu mỗi thanh xuống trục.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="260" fill="#ffffff"/>
