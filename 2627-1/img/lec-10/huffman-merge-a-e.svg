<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-label="Bốn lượt ghép Huffman các ký hiệu A đến E thành các nút trọng số 11, 13, 24 và 39" aria-labelledby="title desc">
  <title id="title">Bốn lượt ghép Huffman cho năm ký hiệu A đến E</title>
  <desc id="desc">Các trọng số ban đầu 15, 7, 6, 6, 5 được ghép lần lượt thành 11, 13, 24 và 39.</desc>
  <defs><style>.b{fill:#fff;stroke:#2f3e7a;stroke-width:3}.m{fill:#f7efe6;stroke:#b15a2b;stroke-width:3}.t{font:24px sans-serif;fill:#263238}.a{stroke:#b15a2b;stroke-width:4;fill:none;marker-end:url(#x)}</style><marker id="x" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b15a2b"/></marker></defs>
  <g text-anchor="middle"><rect class="b" x="35" y="45" width="130" height="70" rx="10"/><text class="t" x="100" y="75">A</text><text class="t" x="100" y="102">15</text><rect class="b" x="185" y="45" width="130" height="70" rx="10"/><text class="t" x="250" y="75">B</text><text class="t" x="250" y="102">7</text><rect class="b" x="335" y="45" width="130" height="70" rx="10"/><text class="t" x="400" y="75">C</text><text class="t" x="400" y="102">6</text><rect class="b" x="485" y="45" width="130" height="70" rx="10"/><text class="t" x="550" y="75">D</text><text class="t" x="550" y="102">6</text><rect class="b" x="635" y="45" width="130" height="70" rx="10"/><text class="t" x="700" y="75">E</text><text class="t" x="700" y="102">5</text></g>
  <path class="a" d="M610 125Q640 165 675 185"/><path class="a" d="M735 125Q720 165 695 185"/><rect class="m" x="635" y="190" width="120" height="58" rx="10"/><text class="t" x="662" y="227">11</text>
  <path class="a" d="M280 125Q320 230 390 265"/><path class="a" d="M405 125Q420 220 420 265"/><rect class="m" x="355" y="270" width="120" height="58" rx="10"/><text class="t" x="382" y="307">13</text>
  <path class="a" d="M465 300Q560 340 660 310"/><path class="a" d="M695 250L695 300"/><rect class="m" x="635" y="305" width="120" height="58" rx="10"/><text class="t" x="662" y="342">24</text>
  <path class="a" d="M165 80Q520 5 880 180"/><path class="a" d="M755 335Q850 320 895 250"/><rect class="m" x="860" y="185" width="150" height="70" rx="10"/><text class="t" x="900" y="228">39</text>
  <text class="t" x="55" y="395">Ghép hai trọng số nhỏ nhất; hòa được phá tùy ý nhưng phải nhất quán.</text>
</svg>
