<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Thu hẹp khoảng theo B, I, L</title><desc id="desc">Ba thanh ngang xếp chồng, mỗi thanh là khoảng hiện thời phóng to ra toàn chiều rộng và chia thành chín khoảng ký hiệu theo thứ tự khoảng trắng, A, B, E, G, I, L, S, T, trong đó L rộng gấp đôi. Thanh 1 là khoảng từ 0 tới 1, ô B tô, viền dày. Thanh 2 là khoảng từ 0,2 tới 0,3, ô I tô. Thanh 3 là khoảng từ 0,25 tới 0,26, ô L tô. Đường nét đứt nối hai đầu ô được chọn với hai đầu thanh kế tiếp. Dòng cuối: sau B, I, L, khoảng từ 0,256 tới 0,258, độ rộng 0,002.</desc>
