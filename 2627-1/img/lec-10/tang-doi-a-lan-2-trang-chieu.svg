<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Cây sau lần tăng thứ hai của A</title><desc id="desc">Cây sau lần tăng thứ hai. Gốc #9 trọng số 19 có con E #8 trọng số 10 và nút #7 trọng số 9. Nút #7 có con #6 trọng số 5 và #5 trọng số 4. Nút #6 có hai lá A #4 trọng số 3, viền dày, và C #3 trọng số 2; nút #5 có hai lá B #2 và D #1, cùng trọng số 2. Mũi tên cong nét đứt có nhãn đổi A với D nối vị trí #4 với vị trí #1. Bên phải: danh sách trọng số theo vị trí 2, 2, 2, 3, 4, 5, 9, 10, 19, các cặp anh em nối bằng ngoặc.</desc>
