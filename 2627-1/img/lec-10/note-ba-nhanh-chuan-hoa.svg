<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" role="img" aria-labelledby="title desc">
<title id="title">Ba trường hợp chuẩn hóa của mã số học</title><desc id="desc">Ba trục số [0; 1) xếp chồng, mỗi trục có vạch ở 0, 1/4, 1/2, 3/4 và 1, và một đoạn tô biểu diễn khoảng hiện thời. Trục 1, nửa dưới: đoạn nằm trong [0; 1/2); ghi phát 0 rồi m bit 1, η ↦ 2η. Trục 2, nửa trên: đoạn nằm trong [1/2; 1); ghi phát 1 rồi m bit 0, η ↦ 2η − 1. Trục 3, khoảng giữa: đoạn nằm trong [1/4; 3/4) và chứa 1/2; ghi m ← m + 1, η ↦ 2η − 1/2. Mỗi trường hợp kết thúc bằng phép phóng to gấp đôi.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="840" height="560" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="40.0" y="48.0" font-size="23" fill="#2f3e7a" text-anchor="start" font-weight="bold">Nửa dưới</text><line x1="40.0" y1="110.0" x2="500.0" y2="110.0" stroke="#233247" stroke-width="2"/><line x1="40.0" y1="100.0" x2="40.0" y2="120.0" stroke="#233247" stroke-width="2"/><text x="40.0" y="148.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">0</text><line x1="155.0" y1="100.0" x2="155.0" y2="120.0" stroke="#233247" stroke-width="2"/><text x="155.0" y="148.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">1/4</text><line x1="270.0" y1="100.0" x2="270.0" y2="120.0" stroke="#233247" stroke-width="2"/><text x="270.0" y="148.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">1/2</text><line x1="385.0" y1="100.0" x2="385.0" y2="120.0" stroke="#233247" stroke-width="2"/><text x="385.0" y="148.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">3/4</text><line x1="500.0" y1="100.0" x2="500.0" y2="120.0" stroke="#233247" stroke-width="2"/><text x="500.0" y="148.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">1</text><rect x="95.2" y="84.0" width="128.8" height="26.0" rx="4" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="530.0" y="92.0" font-size="21" fill="#233247" text-anchor="start" font-weight="bold">phát 0, rồi m bit 1</text><text x="530.0" y="124.0" font-size="21" fill="#26704e" text-anchor="start" font-weight="bold">η ↦ 2η</text><text x="530.0" y="156.0" font-size="18" fill="#5b6778" text-anchor="start" font-weight="normal">rồi phóng to ×2</text><text x="40.0" y="248.0" font-size="23" fill="#2f3e7a" text-anchor="start" font-weight="bold">Nửa trên</text><line x1="40.0" y1="310.0" x2="500.0" y2="310.0" stroke="#233247" stroke-width="2"/><line x1="40.0" y1="300.0" x2="40.0" y2="320.0" stroke="#233247" stroke-width="2"/><text x="40.0" y="348.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">0</text><line x1="155.0" y1="300.0" x2="155.0" y2="320.0" stroke="#233247" stroke-width="2"/><text x="155.0" y="348.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">1/4</text><line x1="270.0" y1="300.0" x2="270.0" y2="320.0" stroke="#233247" stroke-width="2"/><text x="270.0" y="348.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">1/2</text><line x1="385.0" y1="300.0" x2="385.0" y2="320.0" stroke="#233247" stroke-width="2"/><text x="385.0" y="348.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">3/4</text><line x1="500.0" y1="300.0" x2="500.0" y2="320.0" stroke="#233247" stroke-width="2"/><text x="500.0" y="348.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">1</text><rect x="306.8" y="284.0" width="128.8" height="26.0" rx="4" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="530.0" y="292.0" font-size="21" fill="#233247" text-anchor="start" font-weight="bold">phát 1, rồi m bit 0</text><text x="530.0" y="324.0" font-size="21" fill="#26704e" text-anchor="start" font-weight="bold">η ↦ 2η − 1</text><text x="530.0" y="356.0" font-size="18" fill="#5b6778" text-anchor="start" font-weight="normal">rồi phóng to ×2</text><text x="40.0" y="448.0" font-size="23" fill="#2f3e7a" text-anchor="start" font-weight="bold">Khoảng giữa</text><line x1="40.0" y1="510.0" x2="500.0" y2="510.0" stroke="#233247" stroke-width="2"/><line x1="40.0" y1="500.0" x2="40.0" y2="520.0" stroke="#233247" stroke-width="2"/><text x="40.0" y="548.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">0</text><line x1="155.0" y1="500.0" x2="155.0" y2="520.0" stroke="#233247" stroke-width="2"/><text x="155.0" y="548.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">1/4</text><line x1="270.0" y1="500.0" x2="270.0" y2="520.0" stroke="#233247" stroke-width="2"/><text x="270.0" y="548.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">1/2</text><line x1="385.0" y1="500.0" x2="385.0" y2="520.0" stroke="#233247" stroke-width="2"/><text x="385.0" y="548.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">3/4</text><line x1="500.0" y1="500.0" x2="500.0" y2="520.0" stroke="#233247" stroke-width="2"/><text x="500.0" y="548.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">1</text><rect x="205.6" y="484.0" width="138.0" height="26.0" rx="4" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="530.0" y="492.0" font-size="21" fill="#233247" text-anchor="start" font-weight="bold">m ← m + 1</text><text x="530.0" y="524.0" font-size="21" fill="#26704e" text-anchor="start" font-weight="bold">η ↦ 2η − 1/2</text><text x="530.0" y="556.0" font-size="18" fill="#5b6778" text-anchor="start" font-weight="normal">rồi phóng to ×2</text></g></svg>
