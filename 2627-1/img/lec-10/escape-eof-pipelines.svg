<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-label="Hai đường ống nén và giải nén Huffman thích nghi đồng bộ qua ESCAPE, EOS và cập nhật cây" aria-labelledby="title desc">
  <title id="title">Hai đường ống Huffman thích nghi đồng bộ</title><desc id="desc">Bộ nén và bộ giải nén cùng khởi tạo cây chứa ESCAPE và EOS, cùng cập nhật sau mỗi ký hiệu; ký hiệu mới đi qua ESCAPE rồi dữ liệu thô.</desc>
  <defs><style>.b{fill:#fff;stroke:#2f3e7a;stroke-width:3}.a{fill:#f7efe6;stroke:#b15a2b;stroke-width:3}.t{font:23px sans-serif;fill:#263238}.x{stroke:#b15a2b;stroke-width:4;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b15a2b"/></marker></defs>
  <text class="t" x="35" y="55">Bộ nén</text><rect class="b" x="160" y="20" width="190" height="60" rx="10"/><text class="t" x="190" y="58">khởi tạo cây</text><path class="x" d="M355 50L465 50"/><rect class="a" x="470" y="20" width="250" height="60" rx="10"/><text class="t" x="495" y="58">mã ký hiệu / ESCAPE</text><path class="x" d="M725 50L835 50"/><rect class="b" x="840" y="20" width="210" height="60" rx="10"/><text class="t" x="865" y="58">cập nhật cây</text>
  <text class="t" x="35" y="175">Dòng bit</text><rect class="a" x="160" y="135" width="890" height="60" rx="10"/><text class="t" x="210" y="173">ESCAPE · byte thô của ký hiệu mới · mã các ký hiệu đã biết · EOS</text>
  <text class="t" x="35" y="295">Bộ giải nén</text><rect class="b" x="160" y="260" width="190" height="60" rx="10"/><text class="t" x="190" y="298">khởi tạo cây</text><path class="x" d="M355 290L465 290"/><rect class="a" x="470" y="260" width="250" height="60" rx="10"/><text class="t" x="500" y="298">giải mã / đọc byte thô</text><path class="x" d="M725 290L835 290"/><rect class="b" x="840" y="260" width="210" height="60" rx="10"/><text class="t" x="865" y="298">cập nhật cây</text>
  <text class="t" x="160" y="385">Hai phía phải chạy cùng hàm khởi tạo và cùng quy tắc cập nhật.</text>
</svg>
