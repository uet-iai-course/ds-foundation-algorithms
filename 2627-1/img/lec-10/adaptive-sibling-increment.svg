<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="410" viewBox="0 0 1050 410" role="img" aria-label="Tăng trọng số lá A và các nút tổ tiên tới gốc trong cây Huffman thích nghi" aria-labelledby="title desc">
  <title id="title">Tăng trọng số dọc đường lên gốc</title><desc id="desc">Lá A tăng từ một lên hai, sau đó các nút tổ tiên lần lượt tăng một; danh sách nút vẫn được xét theo trọng số không giảm và các cặp anh em đứng kề nhau.</desc>
  <defs><style>.e{stroke:#455a64;stroke-width:4}.n{fill:#fff;stroke:#2f3e7a;stroke-width:3}.u{fill:#f7efe6;stroke:#b15a2b;stroke-width:4}.t{font:24px sans-serif;fill:#263238}.h{font:bold 24px sans-serif;fill:#b15a2b}</style></defs>
  <path class="e" d="M520 55L350 145M520 55L690 145M350 145L270 250M350 145L430 250M690 145L610 250M690 145L770 250"/>
  <g text-anchor="middle"><circle class="u" cx="270" cy="250" r="48"/><text class="h" x="270" y="244">A</text><text class="h" x="270" y="275">1→2</text><circle class="n" cx="430" cy="250" r="45"/><text class="t" x="430" y="258">B:2</text><circle class="n" cx="610" cy="250" r="45"/><text class="t" x="610" y="258">C:2</text><circle class="n" cx="770" cy="250" r="45"/><text class="t" x="770" y="258">D:2</text><circle class="u" cx="350" cy="145" r="43"/><text class="h" x="350" y="153">3→4</text><circle class="n" cx="690" cy="145" r="43"/><text class="t" x="690" y="153">4</text><circle class="u" cx="520" cy="55" r="45"/><text class="h" x="520" y="63">7→8</text></g>
  <text class="t" x="105" y="350">Cập nhật một đường: lá A → cha → gốc.</text><text class="t" x="105" y="385">Trước mỗi lần tăng, kiểm tra thứ tự trọng số.</text>
</svg>
