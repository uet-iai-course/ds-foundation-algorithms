<title id="title">Cây ban đầu của bài tập ba lần tăng A</title><desc id="desc">Cây ban đầu. Gốc #9 trọng số 18 có con E #8 trọng số 10 và nút #7 trọng số 8. Nút #7 có con #6 trọng số 4 và #5 trọng số 4. Nút #6 có hai lá D #4 và C #3; nút #5 có hai lá B #2 và A #1; bốn lá cùng trọng số 2. Bên phải: danh sách trọng số theo vị trí 2, 2, 2, 2, 4, 4, 8, 10, 18.</desc>
