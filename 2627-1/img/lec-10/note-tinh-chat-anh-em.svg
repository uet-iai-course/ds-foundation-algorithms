<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img" aria-labelledby="title desc">
<title id="title">Tính chất anh em của một cây Huffman</title><desc id="desc">Cây có trọng số của Ví dụ 10.11. Gốc #9 trọng số 17 có con bit 0 là lá E #8 trọng số 10 và con bit 1 là nút #7 trọng số 7. Nút #7 có con bit 0 là #6 trọng số 4 và con bit 1 là #5 trọng số 3. Nút #6 có hai lá D #4 (bit 0) và C #3 (bit 1), cùng trọng số 2; nút #5 có hai lá B #2 trọng số 2 (bit 0) và A #1 trọng số 1 (bit 1). Phía dưới là danh sách vị trí #1 đến #9 với trọng số 1, 2, 2, 2, 3, 4, 7, 10, 17; ngoặc ghi &quot;anh em&quot; nối các cặp #1–#2, #3–#4, #5–#6, #7–#8.</desc>
