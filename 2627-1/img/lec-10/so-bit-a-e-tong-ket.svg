<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Thông điệp A–E qua các bộ mã</title><desc id="desc">Trục ngang số bit cho thông điệp A–E, đoạn từ 80 tới 120 vẽ theo tỷ lệ, sau dấu ngắt là vạch 312. Các vạch có nhãn: 312, ASCII; 117, mã 3 bit; 102, độ dài Shannon; 89, Shannon–Fano; 87, Huffman; 87, mã số học lý tưởng; 85,25, I(x), đích, vạch nét đứt. Hai nhãn 87 xếp chồng ở cùng vị trí.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
