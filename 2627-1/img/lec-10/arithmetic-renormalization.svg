<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-label="Ba nhánh E1, E2 và E3 theo thứ tự loại trừ để chuẩn hóa khoảng nửa mở trong mã số học" aria-labelledby="title desc">
  <title id="title">Ba nhánh chuẩn hóa cho khoảng nửa mở</title><desc id="desc">E1 phát bit không rồi các bit một đang chờ. E2 phát bit một rồi các bit không đang chờ. E3 tăng bộ đếm bit chờ. Ba điều kiện được xét theo thứ tự.</desc>
  <defs><style>.bar{fill:#e9eef8;stroke:#2f3e7a;stroke-width:3}.range{fill:#f7efe6;stroke:#b15a2b;stroke-width:4}.tick{stroke:#455a64;stroke-width:2}.t{font:21px sans-serif;fill:#263238}.h{font:bold 23px sans-serif;fill:#2f3e7a}.f{font:bold 21px sans-serif;fill:#b15a2b}</style></defs>
  <text class="h" x="30" y="62">E1: H ≤ 1/2</text><text class="f" x="30" y="95">0, rồi các bit 1 chờ; [L,H) ↦ [2L,2H)</text><rect class="bar" x="500" y="38" width="530" height="50"/><rect class="range" x="540" y="38" width="205" height="50"/>
  <text class="h" x="30" y="182">E2: L ≥ 1/2</text><text class="f" x="30" y="215">1, rồi các bit 0 chờ; [L,H) ↦ [2L−1,2H−1)</text><rect class="bar" x="500" y="158" width="530" height="50"/><rect class="range" x="790" y="158" width="200" height="50"/>
  <text class="h" x="30" y="302">E3: 1/4 ≤ L &lt; H ≤ 3/4</text><text class="f" x="30" y="335">pending + 1; [L,H) ↦ [2L−1/2,2H−1/2)</text><rect class="bar" x="500" y="278" width="530" height="50"/><rect class="range" x="650" y="278" width="230" height="50"/>
  <g class="tick"><path d="M500 338V355M632.5 338V355M765 338V355M897.5 338V355M1030 338V355"/></g><g class="t" text-anchor="middle"><text x="500" y="385">0</text><text x="632.5" y="385">1/4</text><text x="765" y="385">1/2</text><text x="897.5" y="385">3/4</text><text x="1030" y="385">1</text></g>
  <text class="t" x="430" y="418">Kiểm tra E1, nếu sai mới kiểm tra E2, rồi E3; nếu cả ba sai thì dừng.</text>
</svg>
