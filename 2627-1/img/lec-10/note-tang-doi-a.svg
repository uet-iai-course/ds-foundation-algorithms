<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1400" role="img" aria-labelledby="title desc">
<title id="title">Cây trước và sau các phép đổi khi tăng A</title><desc id="desc">Hai cây xếp từ trên xuống. Cây trên, sau lần tăng thứ hai: gốc #9 trọng số 19 có con E #8 trọng số 10 và nút #7 trọng số 9; #7 có con #6 trọng số 5 gồm A #4 trọng số 3 và C #3 trọng số 2, và con #5 trọng số 4 gồm B #2 và D #1 cùng trọng số 2. Mũi tên cong nét đứt ghi &quot;đổi A với D&quot; nối vị trí #4 của A với vị trí #1 của D. Danh sách trọng số theo vị trí: 2, 2, 2, 3, 4, 5, 9, 10, 19. Cây dưới, sau lần tăng thứ tư: gốc #9 trọng số 21 có con #8 trọng số 11 và lá E #7 trọng số 10; #8 có con #6 trọng số 6 và lá A #5 trọng số 5; #6 có con #4 trọng số 4 và lá C #3 trọng số 2; #4 có hai lá B #2 và D #1 cùng trọng số 2. Ghi chú: đổi A với #5, rồi đổi #7 với E; A 2 bit, C 3 bit, B và D 4 bit, E 1 bit. Danh sách: 2, 2, 2, 4, 5, 6, 10, 11, 21.</desc>
