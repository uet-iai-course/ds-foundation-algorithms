<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 760" role="img" aria-labelledby="title desc">
<title id="title">Cấu trúc của Bài 10</title><desc id="desc">Sơ đồ đọc từ trên xuống. Thông điệp x đi vào khối mô hình xác suất (Mục 1), khối này cho phân phối P tới ba bộ mã đặt cạnh nhau: Huffman tĩnh (Mục 3, tối ưu trong các mã ký hiệu), Huffman thích nghi (Mục 4, một lượt) và mã số học (Mục 5, 6, ít hơn I(x) + 2 bit). Ba bộ mã cùng phát dòng bit; khối giải mã dùng cùng mô hình và cùng quy tắc để trả lại x. Dưới cùng là hai khối: Mục 2 (mã tiền tố, Kraft, entropy, H ≤ độ dài trung bình &lt; H + 1), viền nét đứt, dùng để đo cả ba bộ mã; và Mục 7, chọn cặp mô hình–bộ mã.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="820" height="760" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="260.0" y="14.0" width="300.0" height="56.0" rx="10" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="410.0" y="51.0" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">Thông điệp x</text><line x1="410.0" y1="72.0" x2="410.0" y2="104.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="170.0" y="108.0" width="480.0" height="64.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="410.0" y="150.0" font-size="25" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Mô hình xác suất (Mục 1)</text><text x="430.0" y="200.0" font-size="21" fill="#5b6778" text-anchor="start" font-weight="normal" font-style="italic">phân phối P</text><line x1="410.0" y1="174.0" x2="410.0" y2="212.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="410.0" y1="216.0" x2="142.0" y2="240.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="20.0" y="244.0" width="245.0" height="170.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="142.0" y="284.0" font-size="24" fill="#a85b23" text-anchor="middle" font-weight="bold">Huffman tĩnh</text><text x="142.0" y="318.0" font-size="23" fill="#a85b23" text-anchor="middle" font-weight="bold">Mục 3</text><text x="142.0" y="356.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">tối ưu trong</text><text x="142.0" y="386.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">các mã ký hiệu</text><line x1="142.0" y1="416.0" x2="410.0" y2="452.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="410.0" y1="216.0" x2="407.0" y2="240.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="285.0" y="244.0" width="245.0" height="170.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="407.0" y="284.0" font-size="24" fill="#a85b23" text-anchor="middle" font-weight="bold">Huffman</text><text x="407.0" y="318.0" font-size="23" fill="#a85b23" text-anchor="middle" font-weight="bold">thích nghi</text><text x="407.0" y="356.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">Mục 4</text><text x="407.0" y="386.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">một lượt</text><line x1="407.0" y1="416.0" x2="410.0" y2="452.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="410.0" y1="216.0" x2="672.0" y2="240.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="550.0" y="244.0" width="245.0" height="170.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="672.0" y="284.0" font-size="24" fill="#a85b23" text-anchor="middle" font-weight="bold">Mã số học</text><text x="672.0" y="318.0" font-size="23" fill="#a85b23" text-anchor="middle" font-weight="bold">Mục 5, 6</text><text x="672.0" y="356.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">ít hơn</text><text x="672.0" y="386.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">I(x) + 2 bit</text><line x1="672.0" y1="416.0" x2="410.0" y2="452.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="250.0" y="456.0" width="320.0" height="56.0" rx="10" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="410.0" y="493.0" font-size="25" fill="#233247" text-anchor="middle" font-weight="bold">Dòng bit</text><line x1="410.0" y1="514.0" x2="410.0" y2="546.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="110.0" y="550.0" width="600.0" height="64.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="410.0" y="590.0" font-size="23" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Giải mã: cùng mô hình, cùng quy tắc → x</text><rect x="20.0" y="636.0" width="380.0" height="108.0" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5" stroke-dasharray="10 6"/><text x="210.0" y="670.0" font-size="21" fill="#26704e" text-anchor="middle" font-weight="bold">Mục 2: mã tiền tố, Kraft,</text><text x="210.0" y="700.0" font-size="21" fill="#26704e" text-anchor="middle" font-weight="bold">entropy, H ≤ ℓ̄ &lt; H + 1</text><text x="210.0" y="728.0" font-size="19" fill="#5b6778" text-anchor="middle" font-weight="normal">dùng để đo cả ba bộ mã</text><rect x="420.0" y="636.0" width="380.0" height="108.0" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="610.0" y="680.0" font-size="22" fill="#26704e" text-anchor="middle" font-weight="bold">Mục 7: chọn cặp</text><text x="610.0" y="712.0" font-size="22" fill="#26704e" text-anchor="middle" font-weight="bold">mô hình–bộ mã</text></g></svg>
