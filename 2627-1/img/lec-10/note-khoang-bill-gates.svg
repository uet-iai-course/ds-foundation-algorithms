<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" aria-labelledby="title desc">
<title id="title">Thu hẹp khoảng khi mã hóa B, I, L</title><desc id="desc">Ba thanh ngang xếp chồng, mỗi thanh là khoảng hiện thời phóng to ra toàn chiều rộng và chia thành chín khoảng ký hiệu theo thứ tự khoảng trắng, A, B, E, G, I, L, S, T, trong đó L rộng gấp đôi. Thanh 1 là [0; 1), độ rộng 1, ô B được tô. Thanh 2 là [0,2; 0,3), độ rộng 0,1, ô I được tô. Thanh 3 là [0,25; 0,26), độ rộng 0,01, ô L được tô. Các đường nét đứt nối hai đầu ô được tô với hai đầu thanh kế tiếp. Dòng cuối: sau ba ký hiệu B, I, L, khoảng là [0,256; 0,258), độ rộng 0,002.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
