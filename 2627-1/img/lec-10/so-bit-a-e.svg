<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
<title id="title">Số bit cho thông điệp A–E trước Huffman</title><desc id="desc">Trục ngang số bit cho thông điệp A–E từ 80 tới 120. Các vạch có nhãn: 117, mã 3 bit; 102, độ dài Shannon; 87, mã độ dài (1, 3, 3, 3, 3) cho sẵn; 85,25, I(x), đích, vạch nét đứt. Đoạn từ 85,25 tới 87 tô, viền dày, ghi mã tối ưu nằm ở đây, chưa có cách dựng.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
