ke-width="3"/><line x1="229.5" y1="138.0" x2="272.0" y2="138.0" stroke="#a85b23" stroke-width="3"/><text x="280.0" y="146.0" font-size="23" fill="#a85b23" font-weight="bold">87<tspan font-size="21" fill="#233247" font-weight="normal">: mã (1, 3, 3, 3, 3) cho sẵn</tspan></text><circle cx="657.0" cy="240" r="7" fill="#2f3e7a"/><line x1="657.0" y1="240.0" x2="657.0" y2="84.0" stroke="#2f3e7a" stroke-width="3"/><text x="657.0" y="54.0" font-size="23" fill="#2f3e7a" text-anchor="middle" font-weight="bold">102</text><text x="657.0" y="78.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">độ dài Shannon</text><circle cx="1084.5" cy="240" r="7" fill="#2f3e7a"/><line x1="1084.5" y1="240.0" x2="1084.5" y2="146.0" stroke="#2f3e7a" stroke-width="3"/><text x="1084.5" y="116.0" font-size="23" fill="#2f3e7a" text-anchor="end" font-weight="bold">117</text><text x="1084.5" y="140.0" font-size="21" fill="#233247" text-anchor="end" font-weight="normal">mã 3 bit</text></g></svg>
