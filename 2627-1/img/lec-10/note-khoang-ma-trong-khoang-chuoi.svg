<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" role="img" aria-labelledby="title desc">
<title id="title">Khoảng mã nằm trong khoảng chuỗi</title><desc id="desc">Trục số từ 0,42 tới 0,51. Thanh trên cùng là khoảng chuỗi [0,4305; 0,4783) của bảy chữ A và END. Thanh thứ hai là khoảng mã [0,4375; 0,46875) của chuỗi 01110, nằm trong khoảng chuỗi. Thanh thứ ba là khoảng mã [0,453125; 0,46875) của chuỗi 011101 do quy tắc trung điểm cho, cũng nằm trong. Thanh dưới cùng, viền nét đứt, là khoảng mã [0,4375; 0,5) của chuỗi 0111, vượt cận trên 0,4783.</desc>
