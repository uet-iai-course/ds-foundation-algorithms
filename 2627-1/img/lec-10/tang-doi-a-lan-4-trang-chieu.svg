<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">Cây sau ba lần tăng A từ trọng số 2</title><desc id="desc">Cây sau lần tăng thứ ba của bài tập. Gốc #9 trọng số 21 có con #8 trọng số 11 và lá E #7 trọng số 10. Nút #8 có con #6 trọng số 6 và lá A #5 trọng số 5, viền dày. Nút #6 có con #4 trọng số 4 và lá C #3 trọng số 2. Nút #4 có hai lá B #2 và D #1 cùng trọng số 2. Ghi chú: đổi A với #5, rồi đổi #7 với E; E 1 bit, A 2 bit, C 3 bit, B và D 4 bit. Bên phải: danh sách trọng số 2, 2, 2, 4, 5, 6, 10, 11, 21, các cặp anh em nối bằng ngoặc.</desc>
