<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
<title id="title">Cây nhị phân hoàn hảo độ sâu 3 và mã 0, 10, 110, 111</title><desc id="desc">Cây nhị phân hoàn hảo độ sâu 3. Gốc có hai con 0 và 1; nút 0 có hai con 00 và 01, nút 1 có hai con 10 và 11; tầng lá có tám lá 000, 001, 010, 011, 100, 101, 110, 111, mỗi cạnh ghi bit 0 hoặc 1. Bốn nút của mã tiền tố 0, 10, 110, 111 tô màu cam và viền dày: nút 0 ở độ sâu 1, nút 10 ở độ sâu 2, hai lá 110 và 111.</desc>
