e" font-weight="normal">0,5</text><line x1="745.0" y1="88.0" x2="745.0" y2="100.0" stroke="#233247" stroke-width="2"/><text x="745.0" y="126.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">0,625</text><line x1="890.0" y1="88.0" x2="890.0" y2="100.0" stroke="#233247" stroke-width="2"/><text x="890.0" y="126.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">0,75</text><line x1="1035.0" y1="88.0" x2="1035.0" y2="100.0" stroke="#233247" stroke-width="2"/><text x="1035.0" y="126.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">0,875</text><line x1="1180.0" y1="88.0" x2="1180.0" y2="100.0" stroke="#233247" stroke-width="2"/><text x="1180.0" y="126.0" font-size="20" fill="#233247" text-anchor="end" font-weight="normal">1</text></g></svg>
