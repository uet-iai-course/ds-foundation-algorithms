<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" role="img" aria-labelledby="title desc">
<title id="title">Năm khoảng mã của mã A–E</title><desc id="desc">Đoạn từ 0 tới 1 chia thành năm khoảng mã liền nhau của mã A–E, mỗi khoảng ghi từ mã và độ rộng: 0 từ 0 tới 0,5, rộng 1/2; 100 từ 0,5 tới 0,625; 101 từ 0,625 tới 0,75; 110 từ 0,75 tới 0,875; 111 từ 0,875 tới 1; bốn khoảng sau rộng 1/8. Năm khoảng rời nhau và phủ kín đoạn.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="140" fill="#ffffff"/>
