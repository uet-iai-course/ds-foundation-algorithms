<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 620" role="img" aria-labelledby="title desc">
<title id="title">Cây mã và khoảng mã của mã Huffman A–E</title><desc id="desc">Phía trên: cây mã của mã Huffman A–E. Gốc có nhánh 0 tới lá A (từ mã 0) và nhánh 1 tới nút 1; nút 1 có hai con 10 và 11; nút 10 có hai lá B (100) và C (101); nút 11 có hai lá D (110) và E (111). Đường 1, 0, 1 tới lá C được tô đậm, ghi giải mã 101 thành C. Phía dưới: đoạn [0; 1) chia thành năm khoảng mã ghi từ mã và độ rộng: 0 là [0; 0,5) rộng 1/2; 100, 101, 110, 111 là [0,5; 0,625), [0,625; 0,75), [0,75; 0,875), [0,875; 1), mỗi khoảng rộng 1/8. Các khoảng rời nhau và phủ kín [0; 1).</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
