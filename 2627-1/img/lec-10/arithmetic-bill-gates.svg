<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-label="Các khoảng thu hẹp theo ba ký hiệu B, I, L khi mã hóa số học BILL GATES" aria-labelledby="title desc">
  <title id="title">Thu hẹp và phóng đại khoảng khi mã hóa BILL GATES</title><desc id="desc">Hàng đầu biểu diễn đúng tỷ lệ khoảng B rộng một phần mười trong không đến một. Mỗi hàng sau phóng đại khoảng trước thành toàn chiều rộng rồi chọn I rộng một phần mười và L rộng hai phần mười. Khoảng cuối quá hẹp để vẽ theo tỷ lệ nên chỉ đánh dấu vị trí và ghi hai cận.</desc>
  <defs><style>.base{fill:#e9eef8;stroke:#2f3e7a;stroke-width:3}.pick{fill:#f7efe6;stroke:#b15a2b;stroke-width:3}.t{font:22px sans-serif;fill:#263238}.h{font:bold 23px sans-serif;fill:#2f3e7a}.z{font:bold 20px sans-serif;fill:#b15a2b}.guide{stroke:#b15a2b;stroke-width:2;stroke-dasharray:7 6;fill:none}</style></defs>
  <text class="h" x="35" y="65">[0; 1)</text><rect class="base" x="210" y="38" width="800" height="48"/><rect class="pick" x="370" y="38" width="80" height="48"/><text class="t" x="368" y="112">B: [0,2; 0,3)</text>
  <path class="guide" d="M370 88L210 143M450 88L1010 143"/><text class="z" x="1025" y="145">×10</text><text class="h" x="35" y="170">phóng đại B</text><rect class="base" x="210" y="143" width="800" height="48"/><rect class="pick" x="610" y="143" width="80" height="48"/><text class="t" x="600" y="217">I: [0,25; 0,26)</text>
  <path class="guide" d="M610 193L210 248M690 193L1010 248"/><text class="z" x="1025" y="250">×10</text><text class="h" x="35" y="275">phóng đại BI</text><rect class="base" x="210" y="248" width="800" height="48"/><rect class="pick" x="690" y="248" width="160" height="48"/><text class="t" x="680" y="322">L: [0,256; 0,258)</text>
  <path class="guide" d="M690 298L210 353M850 298L1010 353"/><text class="z" x="1025" y="355">×5</text><text class="h" x="35" y="380">phóng đại BIL</text><rect class="base" x="210" y="353" width="800" height="48"/><line x1="696.87" y1="348" x2="696.87" y2="406" stroke="#b15a2b" stroke-width="4"/><text class="t" x="380" y="430">BILL GATES: [0,2572167752; 0,2572167756), vạch chỉ vị trí</text>
</svg>
