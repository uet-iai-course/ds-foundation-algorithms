<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="400" viewBox="0 0 1050 400" role="img" aria-label="Đổi chỗ nút A với nút D sau khi tăng trọng số trong cây Huffman thích nghi" aria-labelledby="title desc">
  <title id="title">Đổi chỗ sau khi tăng A vi phạm tính chất anh em</title><desc id="desc">Sau khi A tăng từ hai lên ba, A được đổi vị trí với D là nút cuối còn trọng số hai, rồi tiếp tục cập nhật từ cha mới.</desc>
  <defs><style>.n{fill:#fff;stroke:#2f3e7a;stroke-width:3}.a{fill:#f7efe6;stroke:#b15a2b;stroke-width:4}.t{font:24px sans-serif;fill:#263238}.x{stroke:#b15a2b;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b15a2b"/></marker></defs>
  <text class="t" x="35" y="55">Trước khi tăng A</text><g text-anchor="middle"><rect class="a" x="250" y="25" width="130" height="65" rx="10"/><text class="t" x="315" y="65">A:2</text><rect class="n" x="400" y="25" width="130" height="65" rx="10"/><text class="t" x="465" y="65">B:2</text><rect class="n" x="550" y="25" width="130" height="65" rx="10"/><text class="t" x="615" y="65">C:2</text><rect class="n" x="700" y="25" width="130" height="65" rx="10"/><text class="t" x="765" y="65">D:2</text></g>
  <path class="x" d="M315 100Q540 205 755 105"/><text class="t" x="420" y="165">đổi với nút cuối có trọng số 2</text>
  <text class="t" x="35" y="255">Sau đổi và tăng</text><g text-anchor="middle"><rect class="n" x="250" y="225" width="130" height="65" rx="10"/><text class="t" x="315" y="265">D:2</text><rect class="n" x="400" y="225" width="130" height="65" rx="10"/><text class="t" x="465" y="265">B:2</text><rect class="n" x="550" y="225" width="130" height="65" rx="10"/><text class="t" x="615" y="265">C:2</text><rect class="a" x="700" y="225" width="130" height="65" rx="10"/><text class="t" x="765" y="265">A:3</text></g>
  <text class="t" x="200" y="355">Tiếp tục tại cha mới của A; không đổi A với tổ tiên của chính nó.</text>
</svg>
