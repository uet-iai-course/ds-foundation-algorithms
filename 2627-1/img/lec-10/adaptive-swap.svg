    <circle class="n" cx="815" cy="135" r="41"/><text class="t" x="815" y="131">E:10</text><text class="t" x="815" y="158">#8</text>
    <circle class="n" cx="300" cy="225" r="41"/><text class="t" x="300" y="221">4</text><text class="t" x="300" y="248">#5</text>
    <circle class="u" cx="540" cy="225" r="41"/><text class="h" x="540" y="221">4</text><text class="h" x="540" y="248">#6</text>
    <circle class="n" cx="235" cy="330" r="39"/><text class="t" x="235" y="326">D:2</text><text class="t" x="235" y="353">#1</text>
    <circle class="n" cx="365" cy="330" r="39"/><text class="t" x="365" y="326">B:2</text><text class="t" x="365" y="353">#2</text>
