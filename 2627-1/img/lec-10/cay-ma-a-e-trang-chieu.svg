#233247" text-anchor="middle" font-weight="bold">0</text><circle cx="740" cy="125" r="30" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="740.0" y="133.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="bold">1</text><circle cx="600" cy="205" r="30" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="600.0" y="213.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="bold">10</text><circle cx="880" cy="205" r="30" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="880.0" y="213.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="bold">11</text><rect x="468.0" y="237.0" width="104.0" height="56.0" rx="8" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="520.0" y="261.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">B</text><text x="520.0" y="286.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="bold">100</text><rect x="628.0" y="237.0" width="104.0" height="56.0" rx="8" fill="#fff4e9" stroke="#a85b23" stroke-width="5"/><text x="680.0" y="261.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">C</text><text x="680.0" y="286.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="bold">101</text><rect x="768.0" y="237.0" width="104.0" height="56.0" rx="8" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="820.0" y="261.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">D</text><text x="820.0" y="286.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="bold">110</text><rect x="908.0" y="237.0" width="104.0" height="56.0" rx="8" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="960.0" y="261.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">E</text><text x="960.0" y="286.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="bold">111</text><text x="20.0" y="220.0" font-size="22" fill="#a85b23" text-anchor="start" font-weight="bold">Đường tô đậm, nét dày:</text><text x="20.0" y="252.0" font-size="22" fill="#a85b23" text-anchor="start" font-weight="bold">giải mã 101 → C</text></g></svg>
