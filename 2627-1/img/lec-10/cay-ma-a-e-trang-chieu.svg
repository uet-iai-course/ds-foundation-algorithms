<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Cây mã A–E và đường giải mã 101</title><desc id="desc">Cây mã của mã A–E. Gốc có nhánh 0 tới lá A, từ mã 0, và nhánh 1 tới nút 1. Nút 1 có con 10 và 11; nút 10 có hai lá B, 100, và C, 101; nút 11 có hai lá D, 110, và E, 111. Đường từ gốc qua bit 1, 0, 1 tới lá C tô màu cam và nét dày hơn, ghi giải mã 101 thành C.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="300" fill="#ffffff"/>
