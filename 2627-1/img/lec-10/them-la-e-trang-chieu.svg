<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
<title id="title">Thêm lá E trọng số 0 rồi cập nhật</title><desc id="desc">Hai cây đặt cạnh nhau. Cây trái, trước khi thêm E: gốc #7 trọng số 8 có con #6 trọng số 5 gồm D #4 trọng số 3 và C #3 trọng số 2, và con #5 trọng số 3 gồm B #2 trọng số 2 và A #1 trọng số 1. Cây phải, sau khi thêm và cập nhật E: gốc #9 trọng số 9 có con #8 trọng số 5 gồm D #6 trọng số 3 và C #5 trọng số 2, và con #7 trọng số 4 gồm B #4 trọng số 2 và nút #3 trọng số 2; nút #3 có hai lá A #2 trọng số 1 và lá mới E #1, trọng số 0 rồi 1. Đường từ E qua #3, #7 tới gốc tô màu cam, nét dày hơn.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="280" fill="#ffffff"/>
