<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Mô hình, ba bộ mã và các mạch của Bài 10</title><desc id="desc">Sơ đồ đọc từ trái sang phải. Thông điệp x đi vào khối mô hình xác suất, khối này cho phân phối P tới ba bộ mã xếp chồng: mạch 3, Huffman tĩnh, tối ưu trong các mã ký hiệu; mạch 4, Huffman thích nghi, một lượt, không đầu mục; mạch 5, mã số học, bản lý tưởng ít hơn I(x) + 2 bit. Ba bộ mã phát dòng bit; khối giải mã dùng cùng mô hình, cùng quy tắc để trả lại x. Dưới cùng: khối viền nét đứt mạch 2, mã tiền tố, Kraft, entropy, đo và chứng minh cho cả ba bộ mã; khối mạch 6, chọn cặp mô hình–bộ mã theo phân phối, số lượt đọc, đầu mục.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="500" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="8.0" y="175.0" width="165.0" height="80.0" rx="10" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="90.5" y="223.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold">Thông điệp x</text><line x1="175.0" y1="215.0" x2="205.0" y2="215.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="210.0" y="165.0" width="200.0" height="100.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="310.0" y="193.7" font-size="23" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Mô hình</text><text x="310.0" y="222.7" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">xác suất</text><text x="310.0" y="251.7" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">phân phối P</text><line x1="412.0" y1="215.0" x2="448.0" y2="70.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="452.0" y="15.0" width="340.0" height="110.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="622.0" y="63.0" font-size="24" fill="#a85b23" text-anchor="middle" font-weight="bold">3. Huffman tĩnh</text><text x="622.0" y="93.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">tối ưu trong các mã ký hiệu</text><line x1="794.0" y1="70.0" x2="838.0" y2="215.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="412.0" y1="215.0" x2="448.0" y2="200.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="452.0" y="145.0" width="340.0" height="110.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="622.0" y="193.0" font-size="24" fill="#a85b23" text-anchor="middle" font-weight="bold">4. Huffman thích nghi</text><text x="622.0" y="223.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">một lượt, không đầu mục</text><line x1="794.0" y1="200.0" x2="838.0" y2="215.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="412.0" y1="215.0" x2="448.0" y2="330.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="452.0" y="275.0" width="340.0" height="110.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="622.0" y="323.0" font-size="24" fill="#a85b23" text-anchor="middle" font-weight="bold">5. Mã số học</text><text x="622.0" y="353.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">lý tưởng: &lt; I(x) + 2 bit</text><line x1="794.0" y1="330.0" x2="838.0" y2="215.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="842.0" y="175.0" width="130.0" height="80.0" rx="10" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="907.0" y="223.0" font-size="24" fill="#233247" text-anchor="middle" font-weight="bold">Dòng bit</text><line x1="974.0" y1="215.0" x2="1000.0" y2="215.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="1004.0" y="150.0" width="190.0" height="130.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="1099.0" y="194.3" font-size="22" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Giải mã</text><text x="1099.0" y="222.3" font-size="22" fill="#233247" text-anchor="middle" font-weight="normal">cùng mô hình,</text><text x="1099.0" y="250.3" font-size="22" fill="#233247" text-anchor="middle" font-weight="normal">cùng quy tắc → x</text><rect x="8.0" y="405.0" width="585.0" height="88.0" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5" stroke-dasharray="10 6"/><text x="300.5" y="442.2" font-size="23" fill="#26704e" text-anchor="middle" font-weight="bold">2. Mã tiền tố, Kraft, entropy</text><text x="300.5" y="471.2" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">đo và chứng minh cho cả ba bộ mã</text><rect x="612.0" y="405.0" width="582.0" height="88.0" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="903.0" y="442.2" font-size="23" fill="#26704e" text-anchor="middle" font-weight="bold">6. Chọn cặp mô hình–bộ mã</text><text x="903.0" y="471.2" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">theo phân phối, số lượt đọc, đầu mục</text></g></svg>
