<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Danh sách nút và các cặp anh em</title><desc id="desc">Bên trái: cây có trọng số. Gốc #9 trọng số 17 có con bit 0 là lá E #8 trọng số 10 và con bit 1 là nút #7 trọng số 7. Nút #7 có con #6 trọng số 4, bit 0, và #5 trọng số 3, bit 1. Nút #6 có hai lá D #4, bit 0, và C #3, bit 1, cùng trọng số 2; nút #5 có hai lá B #2 trọng số 2, bit 0, và A #1 trọng số 1, bit 1. Bên phải: danh sách vị trí #1 tới #9 xếp dọc từ dưới lên với trọng số 1, 2, 2, 2, 3, 4, 7, 10, 17 và ngoặc ghi anh em nối các cặp #1–#2, #3–#4, #5–#6, #7–#8.</desc>
