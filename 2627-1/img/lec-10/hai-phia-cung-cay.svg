<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Hai phía cùng cập nhật một cây</title><desc id="desc">Hai làn ngang. Làn trên là bên nén: ký hiệu x_t đi vào khối cây T_t, phát từ mã, rồi khối cập nhật viền nét đứt ghi cập nhật cục bộ trên đường lá–gốc, cho cây T_t+1. Làn dưới là bên giải nén: dòng bit đi vào khối cây T_t, giải ra x_t, rồi khối cập nhật cho cây T_t+1. Mũi tên dòng bit nối hai làn. Chú thích: cùng cây ở hai phía, không gửi bảng số đếm.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="300" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="20.0" y="40.0" font-size="23" fill="#233247" text-anchor="start" font-weight="bold">Bên nén</text><rect x="20.0" y="54.0" width="140.0" height="62.0" rx="10" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="90.0" y="92.7" font-size="23" fill="#233247" text-anchor="middle" font-weight="bold">xₜ</text><line x1="162.0" y1="85.0" x2="200.0" y2="85.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="204.0" y="50.0" width="200.0" height="70.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="304.0" y="93.0" font-size="24" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cây Tₜ</text><line x1="406.0" y1="85.0" x2="444.0" y2="85.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="448.0" y="54.0" width="150.0" height="62.0" rx="10" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="523.0" y="92.7" font-size="23" fill="#233247" text-anchor="middle" font-weight="bold">từ mã</text><line x1="600.0" y1="85.0" x2="638.0" y2="85.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="642.0" y="46.0" width="260.0" height="78.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5" stroke-dasharray="10 6"/><text x="772.0" y="78.3" font-size="22" fill="#a85b23" text-anchor="middle" font-weight="bold">cập nhật cục bộ</text><text x="772.0" y="106.3" font-size="22" fill="#233247" text-anchor="middle" font-weight="normal">trên đường lá–gốc</text><line x1="904.0" y1="85.0" x2="942.0" y2="85.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="946.0" y="50.0" width="200.0" height="70.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="1046.0" y="93.0" font-size="24" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cây Tₜ₊₁</text><text x="20.0" y="210.0" font-size="23" fill="#233247" text-anchor="start" font-weight="bold">Bên giải nén</text><rect x="20.0" y="224.0" width="140.0" height="62.0" rx="10" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="90.0" y="262.7" font-size="23" fill="#233247" text-anchor="middle" font-weight="bold">dòng bit</text><line x1="162.0" y1="255.0" x2="200.0" y2="255.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="204.0" y="220.0" width="200.0" height="70.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="304.0" y="263.0" font-size="24" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cây Tₜ</text><line x1="406.0" y1="255.0" x2="444.0" y2="255.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="448.0" y="224.0" width="150.0" height="62.0" rx="10" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="523.0" y="262.7" font-size="23" fill="#233247" text-anchor="middle" font-weight="bold">xₜ</text><line x1="600.0" y1="255.0" x2="638.0" y2="255.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="642.0" y="216.0" width="260.0" height="78.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5" stroke-dasharray="10 6"/><text x="772.0" y="248.3" font-size="22" fill="#a85b23" text-anchor="middle" font-weight="bold">cập nhật cục bộ</text><text x="772.0" y="276.3" font-size="22" fill="#233247" text-anchor="middle" font-weight="normal">trên đường lá–gốc</text><line x1="904.0" y1="255.0" x2="942.0" y2="255.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="946.0" y="220.0" width="200.0" height="70.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="1046.0" y="263.0" font-size="24" fill="#2f3e7a" text-anchor="middle" font-weight="bold">cây Tₜ₊₁</text><line x1="523.0" y1="132.0" x2="523.0" y2="172.0" stroke="#26704e" stroke-width="3" marker-end="url(#arrow)"/><text x="540.0" y="160.0" font-size="21" fill="#26704e" text-anchor="start" font-weight="bold">dòng bit</text><text x="1190.0" y="160.0" font-size="21" fill="#5b6778" text-anchor="end" font-weight="normal" font-style="italic">cùng cây ở hai phía; không gửi bảng số đếm</text></g></svg>
