<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
<title id="title">Tự thông tin và số bit Huffman cho hai xác suất</title><desc id="desc">Biểu đồ cột theo bit mỗi ký hiệu, trục từ 0 tới 2. Cặp cột thứ nhất, xác suất 1/3: tự thông tin 1,585 bit, cột đặc; Huffman 1 hoặc 2 bit, cột sọc tới 1 cùng đoạn viền nét đứt từ 1 tới 2. Cặp cột thứ hai, xác suất 0,9: tự thông tin 0,152 bit, cột đặc; Huffman 1 bit, cột sọc. Nhãn số ghi trên mỗi cột; chú giải: cột đặc là tự thông tin, cột sọc là Huffman.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="260" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fff4e9"/><line x1="0" y1="0" x2="0" y2="12" stroke="#a85b23" stroke-width="4"/></pattern></defs><line x1="80.0" y1="220.0" x2="1180.0" y2="220.0" stroke="#233247" stroke-width="2"/><line x1="80.0" y1="220.0" x2="80.0" y2="20.0" stroke="#233247" stroke-width="2"/><line x1="72.0" y1="220.0" x2="80.0" y2="220.0" stroke="#233247" stroke-width="2"/><text x="64.0" y="227.0" font-size="20" fill="#5b6778" text-anchor="end" font-weight="normal">0</text><line x1="72.0" y1="130.0" x2="80.0" y2="130.0" stroke="#233247" stroke-width="2"/><text x="64.0" y="137.0" font-size="20" fill="#5b6778" text-anchor="end" font-weight="normal">1</text><line x1="72.0" y1="40.0" x2="80.0" y2="40.0" stroke="#233247" stroke-width="2"/><text x="64.0" y="47.0" font-size="20" fill="#5b6778" text-anchor="end" font-weight="normal">2</text><text x="90.0" y="22.0" font-size="20" fill="#5b6778" text-anchor="start" font-weight="normal" font-style="italic">bit mỗi ký hiệu</text><rect x="200.0" y="77.3" width="120.0" height="142.7" rx="0" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="260.0" y="67.3" font-size="22" fill="#2f3e7a" text-anchor="middle" font-weight="bold">1,585</text><rect x="350" y="130" width="120" height="90" fill="url(#hatch)" stroke="#a85b23" stroke-width="2.5"/><rect x="350.0" y="40.0" width="120.0" height="90.0" rx="0" fill="#ffffff" stroke="#a85b23" stroke-width="2.5" stroke-dasharray="8 6"/><text x="410.0" y="30.0" font-size="22" fill="#a85b23" text-anchor="middle" font-weight="bold">1 hoặc 2</text><text x="335.0" y="250.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="bold">xác suất 1/3</text><rect x="640.0" y="206.3" width="120.0" height="13.7" rx="0" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="700.0" y="196.3" font-size="22" fill="#2f3e7a" text-anchor="middle" font-weight="bold">0,152</text><rect x="790" y="130" width="120" height="90" fill="url(#hatch)" stroke="#a85b23" stroke-width="2.5"/><text x="850.0" y="120.0" font-size="22" fill="#a85b23" text-anchor="middle" font-weight="bold">1</text><text x="775.0" y="250.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="bold">xác suất 0,9</text><rect x="960.0" y="60.0" width="34.0" height="26.0" rx="0" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="1004.0" y="81.0" font-size="20" fill="#233247" text-anchor="start" font-weight="normal">tự thông tin I(s)</text><rect x="960" y="104" width="34" height="26" fill="url(#hatch)" stroke="#a85b23" stroke-width="2.5"/><text x="1004.0" y="125.0" font-size="20" fill="#233247" text-anchor="start" font-weight="normal">Huffman</text></g></svg>
