<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Ba trường hợp chuẩn hóa của mã số học</title><desc id="desc">Ba trục số từ 0 tới 1 đặt cạnh nhau, mỗi trục có vạch ở 1/4, 1/2, 3/4 và một đoạn tô là khoảng hiện thời. Trục 1, nửa dưới: đoạn nằm trong khoảng từ 0 tới 1/2; ghi high nhỏ hơn 2Q, phát 0 rồi m bit 1, η thành 2η. Trục 2, nửa trên: đoạn nằm trong khoảng từ 1/2 tới 1; ghi low ít nhất 2Q, phát 1 rồi m bit 0, η thành 2η − 1. Trục 3, khoảng giữa: đoạn nằm trong khoảng từ 1/4 tới 3/4 và chứa 1/2; ghi low ít nhất Q và high nhỏ hơn 3Q, m tăng 1, η thành 2η − 1/2. Mỗi trường hợp kết thúc bằng phép phóng to gấp đôi.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="330" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="30.0" y="32.0" font-size="24" fill="#2f3e7a" text-anchor="start" font-weight="bold">Nửa dưới</text><line x1="30.0" y1="90.0" x2="370.0" y2="90.0" stroke="#233247" stroke-width="2"/><line x1="30.0" y1="80.0" x2="30.0" y2="100.0" stroke="#233247" stroke-width="2"/><text x="30.0" y="126.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">0</text><line x1="115.0" y1="80.0" x2="115.0" y2="100.0" stroke="#233247" stroke-width="2"/><text x="115.0" y="126.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">1/4</text><line x1="200.0" y1="80.0" x2="200.0" y2="100.0" stroke="#233247" stroke-width="2"/><text x="200.0" y="126.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">1/2</text><line x1="285.0" y1="80.0" x2="285.0" y2="100.0" stroke="#233247" stroke-width="2"/><text x="285.0" y="126.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">3/4</text><line x1="370.0" y1="80.0" x2="370.0" y2="100.0" stroke="#233247" stroke-width="2"/><text x="370.0" y="126.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">1</text><rect x="70.8" y="64.0" width="95.2" height="22.0" rx="4" fill="#fff4e9" stroke="#a85b23" stroke-width="3"/><text x="30.0" y="182.0" font-size="22" fill="#233247" text-anchor="start" font-weight="bold">high &lt; 2Q</text><text x="30.0" y="220.0" font-size="22" fill="#233247" text-anchor="start" font-weight="normal">phát 0 rồi m bit 1</text><text x="30.0" y="258.0" font-size="22" fill="#26704e" text-anchor="start" font-weight="bold">η ↦ 2η</text><text x="30.0" y="296.0" font-size="20" fill="#5b6778" text-anchor="start" font-weight="normal" font-style="italic">rồi phóng to ×2</text><text x="425.0" y="32.0" font-size="24" fill="#2f3e7a" text-anchor="start" font-weight="bold">Nửa trên</text><line x1="425.0" y1="90.0" x2="765.0" y2="90.0" stroke="#233247" stroke-width="2"/><line x1="425.0" y1="80.0" x2="425.0" y2="100.0" stroke="#233247" stroke-width="2"/><text x="425.0" y="126.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">0</text><line x1="510.0" y1="80.0" x2="510.0" y2="100.0" stroke="#233247" stroke-width="2"/><text x="510.0" y="126.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">1/4</text><line x1="595.0" y1="80.0" x2="595.0" y2="100.0" stroke="#233247" stroke-width="2"/><text x="595.0" y="126.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">1/2</text><line x1="680.0" y1="80.0" x2="680.0" y2="100.0" stroke="#233247" stroke-width="2"/><text x="680.0" y="126.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">3/4</text><line x1="765.0" y1="80.0" x2="765.0" y2="100.0" stroke="#233247" stroke-width="2"/><text x="765.0" y="126.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">1</text><rect x="622.2" y="64.0" width="95.2" height="22.0" rx="4" fill="#fff4e9" stroke="#a85b23" stroke-width="3"/><text x="425.0" y="182.0" font-size="22" fill="#233247" text-anchor="start" font-weight="bold">low ≥ 2Q</text><text x="425.0" y="220.0" font-size="22" fill="#233247" text-anchor="start" font-weight="normal">phát 1 rồi m bit 0</text><text x="425.0" y="258.0" font-size="22" fill="#26704e" text-anchor="start" font-weight="bold">η ↦ 2η − 1</text><text x="425.0" y="296.0" font-size="20" fill="#5b6778" text-anchor="start" font-weight="normal" font-style="italic">rồi phóng to ×2</text><text x="820.0" y="32.0" font-size="24" fill="#2f3e7a" text-anchor="start" font-weight="bold">Khoảng giữa</text><line x1="820.0" y1="90.0" x2="1160.0" y2="90.0" stroke="#233247" stroke-width="2"/><line x1="820.0" y1="80.0" x2="820.0" y2="100.0" stroke="#233247" stroke-width="2"/><text x="820.0" y="126.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">0</text><line x1="905.0" y1="80.0" x2="905.0" y2="100.0" stroke="#233247" stroke-width="2"/><text x="905.0" y="126.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">1/4</text><line x1="990.0" y1="80.0" x2="990.0" y2="100.0" stroke="#233247" stroke-width="2"/><text x="990.0" y="126.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">1/2</text><line x1="1075.0" y1="80.0" x2="1075.0" y2="100.0" stroke="#233247" stroke-width="2"/><text x="1075.0" y="126.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">3/4</text><line x1="1160.0" y1="80.0" x2="1160.0" y2="100.0" stroke="#233247" stroke-width="2"/><text x="1160.0" y="126.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">1</text><rect x="942.4" y="64.0" width="102.0" height="22.0" rx="4" fill="#fff4e9" stroke="#a85b23" stroke-width="3"/><text x="820.0" y="182.0" font-size="22" fill="#233247" text-anchor="start" font-weight="bold">Q ≤ low, high &lt; 3Q</text><text x="820.0" y="220.0" font-size="22" fill="#233247" text-anchor="start" font-weight="normal">m ← m + 1</text><text x="820.0" y="258.0" font-size="22" fill="#26704e" text-anchor="start" font-weight="bold">η ↦ 2η − 1/2</text><text x="820.0" y="296.0" font-size="20" fill="#5b6778" text-anchor="start" font-weight="normal" font-style="italic">rồi phóng to ×2</text></g></svg>
