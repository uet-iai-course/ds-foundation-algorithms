<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1180" role="img" aria-labelledby="title desc">
<title id="title">Thêm một lá trọng số 0 cho ký hiệu mới</title><desc id="desc">Hai cây xếp từ trên xuống. Cây trên, trước khi thêm E: gốc #7 trọng số 8 có con #6 trọng số 5 gồm D #4 trọng số 3 và C #3 trọng số 2, và con #5 trọng số 3 gồm B #2 trọng số 2 và A #1 trọng số 1; danh sách 1, 2, 2, 3, 3, 5, 8. Cây dưới, sau khi thêm và cập nhật E: vị trí cũ của A thành nút trong #3 với hai con A #2 trọng số 1 và lá mới E #1, trọng số 0 trước khi tăng và 1 sau khi tăng; #3 cùng B #4 là con của #7 trọng số 4; #8 trọng số 5 gồm D #6 và C #5; gốc #9 trọng số 9. Đường từ E qua #3, #7 tới gốc được tô đậm. Danh sách: 1, 1, 2, 2, 2, 3, 4, 5, 9.</desc>
