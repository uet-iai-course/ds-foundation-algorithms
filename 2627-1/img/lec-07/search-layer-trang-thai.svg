<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" role="img" aria-labelledby="title desc">
<title id="title">Ba tập của SEARCH-LAYER</title><desc id="desc">Sau khi mở b với ef bằng 3: V gồm e, a, b, s; C gồm s; W gồm b, a, s. C và W là hai tập con của V; s thuộc cả C và W; e chỉ thuộc V.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="20" y="20" width="820" height="380" rx="10" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="45" y="66" font-size="30" fill="#233247" text-anchor="start" font-weight="bold">V: đỉnh đã thấy</text><rect x="230" y="90" width="300" height="290" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5" stroke-dasharray="12 7"/><rect x="410" y="150" width="410" height="210" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="250" y="130" font-size="28" fill="#a85b23" text-anchor="start" font-weight="bold">C: chưa mở</text><text x="800" y="190" font-size="28" fill="#2f3e7a" text-anchor="end" font-weight="bold">W: ef đỉnh gần q nhất</text><text x="125" y="270" font-size="34" fill="#233247" text-anchor="middle" font-weight="bold">e : 9</text><text x="470" y="270" font-size="34" fill="#233247" text-anchor="middle" font-weight="bold">s : 8</text><text x="670" y="255" font-size="34" fill="#233247" text-anchor="middle" font-weight="bold">b : 5</text><text x="670" y="320" font-size="34" fill="#233247" text-anchor="middle" font-weight="bold">a : 7</text></g></svg>
