<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Trạng thái của SEARCH-LAYER</title><desc id="desc">Tập đã thăm V, hàng đợi ứng viên C theo điểm gần nhất và tập kết quả W giữ không quá ef phần tử gần nhất.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f3e7a"/></marker></defs>
  <rect x="35" y="85" width="250" height="190" rx="18" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="160" y="125" text-anchor="middle" font-size="27" font-weight="700" fill="#b15a2b">C</text><text x="160" y="160" text-anchor="middle" font-size="20">ứng viên chưa mở</text><circle cx="90" cy="215" r="15" fill="#fff" stroke="#b15a2b" stroke-width="3"/><circle cx="145" cy="205" r="15" fill="#fff" stroke="#b15a2b" stroke-width="3"/><circle cx="205" cy="230" r="15" fill="#fff" stroke="#b15a2b" stroke-width="3"/>
  <path d="M300 180H430" stroke="#2f3e7a" stroke-width="5" marker-end="url(#a)"/><text x="365" y="153" text-anchor="middle" font-size="20">lấy gần nhất</text>
  <rect x="450" y="60" width="250" height="240" rx="18" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="575" y="105" text-anchor="middle" font-size="27" font-weight="700" fill="#2f3e7a">mở lân cận</text><g stroke="#2f3e7a" stroke-width="3"><path d="M575 180L515 235M575 180L635 235M575 180L575 255"/></g><g fill="#fff" stroke="#2f3e7a" stroke-width="3"><circle cx="575" cy="180" r="18"/><circle cx="515" cy="235" r="15"/><circle cx="635" cy="235" r="15"/><circle cx="575" cy="255" r="15"/></g>
  <path d="M715 180H810" stroke="#2f3e7a" stroke-width="5" marker-end="url(#a)"/>
  <rect x="830" y="85" width="135" height="190" rx="18" fill="#eef7f2" stroke="#2f7d5b" stroke-width="3"/><text x="897" y="125" text-anchor="middle" font-size="27" font-weight="700" fill="#2f7d5b">W</text><text x="897" y="158" text-anchor="middle" font-size="18">tốt nhất</text><text x="897" y="185" text-anchor="middle" font-size="18">|W| ≤ ef</text><circle cx="870" cy="225" r="14" fill="#fff" stroke="#2f7d5b" stroke-width="3"/><circle cx="920" cy="225" r="14" fill="#fff" stroke="#2f7d5b" stroke-width="3"/>
  <text x="575" y="335" text-anchor="middle" font-size="20">V ngăn mở lại một đỉnh đã thăm</text>
</svg>
