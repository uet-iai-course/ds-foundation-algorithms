<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 375" role="img" aria-labelledby="title desc">
<title id="title">Mã hóa PQ với hai đoạn</title><desc id="desc">Đoạn 1 có tâm 0 tại (0; 2) và tâm 1 tại (2; 0); x ở (0,2; 1,8) gần tâm 0. Đoạn 2 có tâm 0 tại (0; 0) và tâm 1 tại (3; 0); x ở (2,7; 0,1) gần tâm 1. Mã của x là (0, 1). Truy vấn q ở (0,1; 1,9) trong đoạn 1 và (2,5; 0,2) trong đoạn 2.</desc>
