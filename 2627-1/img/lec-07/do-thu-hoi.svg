<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
<title id="title">Độ thu hồi tại 5</title><desc id="desc">Tập đúng gồm a, b, c, d, e; tập chỉ mục trả về gồm c, d, e, f, g. Phần giao có ba phần tử c, d, e.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif"><circle cx="250" cy="230" r="170" fill="#edf4ff" fill-opacity="0.85" stroke="#2f3e7a" stroke-width="4"/><circle cx="470" cy="230" r="170" fill="#fff4e9" fill-opacity="0.6" stroke="#a85b23" stroke-width="4" stroke-dasharray="14 8"/><text x="190" y="40" font-size="32" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Tập đúng</text><text x="530" y="40" font-size="32" fill="#a85b23" text-anchor="middle" font-weight="bold">Tập trả về</text><text x="165" y="195" font-size="40" fill="#233247" text-anchor="middle" font-weight="bold">a</text><text x="165" y="275" font-size="40" fill="#233247" text-anchor="middle" font-weight="bold">b</text><text x="360" y="165" font-size="40" fill="#233247" text-anchor="middle" font-weight="bold">c</text><text x="360" y="235" font-size="40" fill="#233247" text-anchor="middle" font-weight="bold">d</text><text x="360" y="305" font-size="40" fill="#233247" text-anchor="middle" font-weight="bold">e</text><text x="555" y="195" font-size="40" fill="#233247" text-anchor="middle" font-weight="bold">f</text><text x="555" y="275" font-size="40" fill="#233247" text-anchor="middle" font-weight="bold">g</text><text x="360" y="440" font-size="30" fill="#233247" text-anchor="middle" font-weight="normal">giao gồm c, d, e</text></g></svg>
