<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
<title id="title">Độ thu hồi tại 3 trên năm điểm</title><desc id="desc">Tập đúng gồm y4, y2, y5; chỉ mục trả y4, y5, y1. Phần giao có hai phần tử y4, y5, nên độ thu hồi tại 3 bằng 2/3; y2 ở khoảng cách 1,2 bị thiếu, y1 ở khoảng cách 2,5 đứng vào chỗ của nó.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif"><circle cx="250" cy="230" r="170" fill="#edf4ff" fill-opacity="0.85" stroke="#2f3e7a" stroke-width="4"/><circle cx="470" cy="230" r="170" fill="#fff4e9" fill-opacity="0.6" stroke="#a85b23" stroke-width="4" stroke-dasharray="14 8"/><text x="170" y="40" font-size="30" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Tập đúng 𝒩₃(q)</text><text x="560" y="40" font-size="30" fill="#a85b23" text-anchor="middle" font-weight="bold">Chỉ mục trả</text><text x="165" y="245" font-size="40" fill="#233247" text-anchor="middle" font-weight="bold">y₂</text><text x="360" y="195" font-size="40" fill="#233247" text-anchor="middle" font-weight="bold">y₄</text><text x="360" y="285" font-size="40" fill="#233247" text-anchor="middle" font-weight="bold">y₅</text><text x="555" y="245" font-size="40" fill="#233247" text-anchor="middle" font-weight="bold">y₁</text><text x="165" y="292" font-size="30" fill="#6b7788" text-anchor="middle" font-weight="normal">1,2</text><text x="555" y="292" font-size="30" fill="#6b7788" text-anchor="middle" font-weight="normal">2,5</text><text x="360" y="440" font-size="30" fill="#233247" text-anchor="middle" font-weight="normal">giao gồm y₄, y₅: recall@3 = 2/3</text></g></svg>
