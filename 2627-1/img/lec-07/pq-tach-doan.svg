"bold">đoạn 2</text><line x1="438" y1="124" x2="438" y2="160" stroke="#a85b23" stroke-width="3" marker-end="url(#arrow)"/><rect x="358" y="168" width="160" height="74" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="438.0" y="198.4" font-size="24" fill="#a85b23" text-anchor="middle" font-weight="bold">bộ mã 2</text><text x="438.0" y="228.4" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">256 tâm</text><line x1="438" y1="248" x2="438" y2="284" stroke="#a85b23" stroke-width="3" marker-end="url(#arrow)"/><rect x="388" y="290" width="100" height="56" rx="10" fill="#ffffff" stroke="#a85b23" stroke-width="2.5"/><text x="438.0" y="327.8" font-size="28" fill="#a85b23" text-anchor="middle" font-weight="bold">i2</text><text x="438" y="376" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">8 bit</text><rect x="550" y="20" width="86" height="56" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="593" y="58" font-size="26" fill="#233247" text-anchor="middle" font-weight="normal">x5</text><rect x="640" y="20" width="86" height="56" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="683" y="58" font-size="26" fill="#233247" text-anchor="middle" font-weight="normal">x6</text><text x="638" y="112" font-size="26" fill="#26704e" text-anchor="middle" font-weight="bold">đoạn 3</text><line x1="638" y1="124" x2="638" y2="160" stroke="#26704e" stroke-width="3" marker-end="url(#arrow)"/><rect x="558" y="168" width="160" height="74" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="638.0" y="198.4" font-size="24" fill="#26704e" text-anchor="middle" font-weight="bold">bộ mã 3</text><text x="638.0" y="228.4" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">256 tâm</text><line x1="638" y1="248" x2="638" y2="284" stroke="#26704e" stroke-width="3" marker-end="url(#arrow)"/><rect x="588" y="290" width="100" height="56" rx="10" fill="#ffffff" stroke="#2670