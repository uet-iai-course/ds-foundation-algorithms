<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 435" role="img" aria-labelledby="title desc">
<title id="title">Lượng tử hóa tích với bốn đoạn</title><desc id="desc">Véc-tơ tám chiều chia thành bốn đoạn hai chiều. Mỗi đoạn được mã hóa bằng bộ mã con riêng 256 tâm thành một chỉ số 8 bit; mã PQ là bộ bốn chỉ số, dài 32 bit.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
