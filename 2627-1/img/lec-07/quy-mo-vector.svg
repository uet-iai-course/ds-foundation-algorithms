<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Quy mô kho mười tỷ véc-tơ</title><desc id="desc">So sánh phép quét trực tiếp trên véc-tơ 3072 chiều với mã lượng tử hóa tích 512 byte cho mỗi véc-tơ.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f3e7a"/></marker></defs>
  <rect x="25" y="35" width="270" height="275" rx="18" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/>
  <text x="160" y="85" text-anchor="middle" font-size="29" font-weight="700" fill="#2f3e7a">10 tỷ véc-tơ</text>
  <text x="160" y="130" text-anchor="middle" font-size="23">3.072 chiều</text><text x="160" y="168" text-anchor="middle" font-size="23">32 bit / tọa độ</text>
  <text x="160" y="230" text-anchor="middle" font-size="27" font-weight="700" fill="#b15a2b">122,88 TB</text><text x="160" y="266" text-anchor="middle" font-size="20">dữ liệu thô</text>
  <path d="M310 172H455" stroke="#2f3e7a" stroke-width="5" marker-end="url(#a)"/>
  <text x="382" y="145" text-anchor="middle" font-size="20" fill="#2f3e7a">chia 512 đoạn</text>
  <rect x="475" y="35" width="225" height="275" rx="18" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/>
  <text x="588" y="82" text-anchor="middle" font-size="27" font-weight="700" fill="#b15a2b">Mã PQ</text>
  <g fill="#fff" stroke="#b15a2b"><rect x="505" y="112" width="44" height="44" rx="5"/><rect x="555" y="112" width="44" height="44" rx="5"/><rect x="605" y="112" width="44" height="44" rx="5"/></g>
  <text x="662" y="142" font-size="26">…</text><text x="588" y="195" text-anchor="middle" font-size="22">512 mã × 8 bit</text>
  <text x="588" y="246" text-anchor="middle" font-size="27" font-weight="700" fill="#2f7d5b">5,12 TB</text><text x="588" y="278" text-anchor="middle" font-size="20">chưa tính mã định danh</text>
  <path d="M720 172H855" stroke="#2f3e7a" stroke-width="5" marker-end="url(#a)"/>
  <rect x="875" y="90" width="95" height="165" rx="14" fill="#fff" stroke="#2f3e7a" stroke-width="3"/><circle cx="922" cy="132" r="18" fill="#2f7d5b"/><path d="M899 191h46M899 217h46" stroke="#2f3e7a" stroke-width="5"/>
  <text x="845" y="300" text-anchor="middle" font-size="21" fill="#2f3e7a">chỉ mục + truy vấn</text>
</svg>
