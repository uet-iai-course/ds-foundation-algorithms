38" cy="400" r="18" fill="#ffffff" stroke="#a85b23" stroke-width="4"/><text x="538" y="452" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">p6</text><circle cx="616" cy="400" r="18" fill="#ffffff" stroke="#2f3e7a" stroke-width="4"/><text x="616" y="452" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">p7</text><circle cx="694" cy="400" r="18" fill="#ffffff" stroke="#2f3e7a" stroke-width="4"/><text x="694" y="452" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">p8</text><circle cx="772" cy="400" r="18" fill="#ffffff" stroke="#2f3e7a" stroke-width="4"/><text x="772" y="452" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">p9</text><circle cx="850" cy="400" r="18" fill="#ffffff" stroke="#2f3e7a" stroke-width="4"/><text x="850" y="452" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">p10</text><circle cx="928" cy="400" r="18" fill="#ffffff" stroke="#2f3e7a" stroke-width="4"/><text x="928" y="452" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">p11</text><line x1="569.2" y1="362" x2="569.2" y2="396" stroke="#a85b23" stroke-width="2" stroke-dasharray="4 4"/><rect x="558.2" y="341" width="22" height="22" fill="#a85b23" transform="rotate(45 569.2 352)"/><text x="595.2" y="362" font-size="28" fill="#a85b23" text-anchor="start" font-weight="bold" font-style="italic">q</text><line x1="560" y1="520" x2="612" y2="520" stroke="#a85b23" stroke-width="6"/><text x="624" y="530" font-size="26" fill="#233247" text-anchor="start" font-weight="normal">đường tham lam từ s</text></g></svg>
