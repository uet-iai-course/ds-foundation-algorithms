<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545" role="img" aria-labelledby="title desc">
<title id="title">Cạnh dài rút ngắn đường đi</title><desc id="desc">Mười hai điểm s, p1 đến p11 trên một đường thẳng, q nằm giữa p6 và p7, gần p6 hơn. Chỉ có cạnh giữa hai điểm liền kề thì tham lam từ s cần 6 bước tới p6; thêm cạnh dài s–p4, p4–p8, p8–p11 thì chỉ cần 3 bước s, p4, p5, p6.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
