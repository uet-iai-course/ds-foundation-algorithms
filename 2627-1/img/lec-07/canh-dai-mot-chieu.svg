85b23" stroke-width="4"/><text x="460" y="202" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">p5</text><circle cx="538" cy="150" r="18" fill="#ffffff" stroke="#a85b23" stroke-width="4"/><text x="538" y="202" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">p6</text><circle cx="616" cy="150" r="18" fill="#ffffff" stroke="#2f3e7a" stroke-width="4"/><text x="616" y="202" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">p7</text><circle cx="694" cy="150" r="18" fill="#ffffff" stroke="#2f3e7a" stroke-width="4"/><text x="694" y="202" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">p8</text><circle cx="772" cy="150" r="18" fill="#ffffff" stroke="#2f3e7a" stroke-width="4"/><text x="772" y="202" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">p9</text><circle cx="850" cy="150" r="18" fill="#ffffff" stroke="#2f3e7a" stroke-width="4"/><text x="850" y="202" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">p10</text><circle cx="928" cy="150" r="18" fill="#ffffff" stroke="#2f3e7a" stroke-width="4"/><text x="928" y="202" font-size="24" fill="#233247" text-anchor="middle" font-weight="normal">p11</text><line x1="569.2" y1="112" x2="569.2" y2="146" stroke="#a85b23" stroke-width="2" stroke-dasharray="4 4"/><rect x="558.2" y="91" width="22" height="22" fill="#a85b23" transform="rotate(45 569.2 102)"/><text x="595.2" y="112" font-size="28" fill="#a85b23" text-anchor="start" font-weight="bold" font-style="italic">q</text><text x="40" y="305" font-size="30" fill="#233247" text-anchor="start" font-weight="bold">Thêm cạnh dài: s → p4 → p5 → p6, 3 bước</text><line x1="88" y1="400" x2="130" y2="400" stroke="#9aa6b8" stroke-width="3"/><line x1="166" y1="400" x2="208" y2="400" stroke="#9aa6b8" stroke-width="3"/><line x1="244" y1="400" x2="286" y2="400" stroke="#9aa6b8" stroke-width="3"/><line x1="322" y1="400" x2="364" y2="400" stroke="#9aa6b8" stroke-wi