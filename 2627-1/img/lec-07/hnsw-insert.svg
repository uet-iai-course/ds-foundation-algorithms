<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Chèn một điểm vào HNSW</title><desc id="desc">Nếu chỉ mục rỗng thì đặt điểm vào. Nếu không, hạ điểm vào với ef bằng một, rồi tìm với efConstruction, chọn lân cận, nối, cắt từng đầu và truyền W xuống tầng sau.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f3e7a"/></marker></defs>
  <g font-family="sans-serif" text-anchor="middle"><rect x="20" y="90" width="190" height="170" rx="14" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="115" y="130" font-size="21" font-weight="700">1. chọn tầng</text><text x="115" y="166" font-size="18">rỗng: đặt điểm vào</text><text x="115" y="198" font-size="18">khác rỗng: ep cũ</text><rect x="265" y="70" width="205" height="210" rx="14" fill="#fff" stroke="#2f3e7a" stroke-width="3"/><text x="367" y="112" font-size="21" font-weight="700">2. hạ điểm vào</text><text x="367" y="150" font-size="18">tầng L … ℓ+1</text><text x="367" y="180" font-size="18">ef = 1</text><text x="367" y="218" font-size="17">chưa nối cạnh</text><rect x="525" y="70" width="205" height="210" rx="14" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="627" y="112" font-size="21" font-weight="700">3. tìm và chọn</text><text x="627" y="150" font-size="18">efConstruction</text><text x="627" y="180" font-size="18">tối đa M lân cận</text><text x="627" y="215" font-size="18">ep ← W mỗi tầng</text><rect x="785" y="90" width="195" height="170" rx="14" fill="#eef7f2" stroke="#2f7d5b" stroke-width="3"/><text x="882" y="130" font-size="21" font-weight="700">4. nối và cắt</text><text x="882" y="168" font-size="18">nối hai chiều ban đầu</text><text x="882" y="198" font-size="18">tầng 0: Mmax,0</text><text x="882" y="228" font-size="18">tầng trên: Mmax</text></g>
  <g stroke="#2f3e7a" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M220 175H252"/><path d="M480 175H512"/><path d="M740 175H772"/></g>
  <text x="500" y="330" text-anchor="middle" font-size="21" fill="#2f3e7a">nếu ℓ &gt; L, điểm mới trở thành điểm vào toàn cục</text>
</svg>
