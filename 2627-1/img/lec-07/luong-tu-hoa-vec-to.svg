<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" role="img" aria-labelledby="title desc">
<title id="title">Lượng tử hóa véc-tơ với ba tâm</title><desc id="desc">Ba tâm c0 tại (0, 0), c1 tại (2, 0), c2 tại (0, 2) chia mặt phẳng thành ba ô; ranh giới là các đường tọa độ thứ nhất bằng 1, tọa độ thứ hai bằng 1 và hai tọa độ bằng nhau. Điểm x tại (1,7; 0,4) nằm trong ô của c1 nên được thay bằng c1.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif"><polygon points="26.0,534.0 250,534.0 250,310 26.0,310" fill="#f4f6f9"/><polygon points="250,534.0 488.0,534.0 488.0,72.0 250,310" fill="#edf4ff"/><polygon points="26.0,310 250,310 488.0,72.0 26.0,72.0" fill="#fff4e9"/><line x1="250" y1="534.0" x2="250" y2="310" stroke="#233247" stroke-width="2" stroke-dasharray="8 6"/><line x1="26.0" y1="310" x2="250" y2="310" stroke="#233247" stroke-width="2" stroke-dasharray="8 6"/><line x1="250" y1="310" x2="488.0" y2="72.0" stroke="#233247" stroke-width="2" stroke-dasharray="8 6"/><rect x="99" y="439" width="22" height="22" fill="#2f3e7a"/><text x="128" y="490" font-size="30" fill="#2f3e7a" text-anchor="start" font-weight="bold">c0</text><rect x="379" y="439" width="22" height="22" fill="#2f3e7a"/><text x="408" y="490" font-size="30" fill="#2f3e7a" text-anchor="start" font-weight="bold">c1</text><rect x="99" y="159" width="22" height="22" fill="#2f3e7a"/><text x="128" y="210" font-size="30" fill="#2f3e7a" text-anchor="start" font-weight="bold">c2</text><text x="47.0" y="345.0" font-size="26" fill="#233247" text-anchor="start" font-weight="normal">ô của c0</text><text x="355.0" y="513.0" font-size="26" fill="#233247" text-anchor="middle" font-weight="normal">ô của c1</text><text x="145.0" y="107.0" font-size="26" fill="#233247" text-anchor="start" font-weight="normal">ô của c2</text><line x1="348.0" y1="394.0" x2="382" y2="444" stroke="#26704e" stroke-width="4"/><circle cx="348.0" cy="394.0" r="11" fill="#26704e"/><text x="334.0" y="376.0" font-size="32" fill="#26704e" text-anchor="end" font-weight="bold" font-style="italic">x</text></g></svg>
