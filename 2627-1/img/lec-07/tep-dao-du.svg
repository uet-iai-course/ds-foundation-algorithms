<title id="title">Véc-tơ dư trong tệp đảo</title><desc id="desc">Mũi tên xanh từ μ1 tới y8 là phần dư r(y8) được mã hóa bằng PQ. Hai đoạn nét đứt từ μ1 và μ0 tới q là truy vấn dư dùng khi quét L1 và L0.</desc>
