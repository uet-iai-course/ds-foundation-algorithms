<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" role="img" aria-labelledby="title desc">
<title id="title">Chọn lân cận gần nhất và chọn đa dạng</title><desc id="desc">Điểm mới x có bốn ứng viên: c1, c2, c3 cùng một phía, c4 ở phía đối diện. Chọn hai đỉnh gần nhất cho c1 và c3 cùng phía; quy tắc đa dạng cho c1 và c4 ở hai phía.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="10" y="20" width="440" height="330" rx="10" fill="#ffffff" stroke="#c5ccd8" stroke-width="2.5"/><text x="230" y="60" font-size="28" fill="#a85b23" text-anchor="middle" font-weight="bold">Chọn 2 đỉnh gần nhất</text><line x1="225" y1="210" x2="349" y2="191.4" stroke="#a85b23" stroke-width="6"/><line x1="225" y1="210" x2="373.79999999999995" y2="247.2" stroke="#a85b23" stroke-width="6"/><circle cx="349.0" cy="191.4" r="16" fill="#ffffff" stroke="#2f3e7a" stroke-width="4"/><text x="349.0" y="165.4" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">c1</text><circle cx="386.2" cy="154.2" r="16" fill="#ffffff" stroke="#2f3e7a" stroke-width="4"/><text x="386.2" y="128.2" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">c2</text><circle cx="373.8" cy="247.2" r="16" fill="#ffffff" stroke="#2f3e7a" stroke-width="4"/><text x="373.8" y="293.2" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">c3</text><circle cx="39.0" cy="179.0" r="16" fill="#ffffff" stroke="#2f3e7a" stroke-width="4"/><text x="39.0" y="153.0" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">c4</text><circle cx="225.0" cy="210.0" r="18" fill="#eef7f2" stroke="#26704e" stroke-width="4"/><text x="225.0" y="219.0" font-size="26" fill="#26704e" text-anchor="middle" font-weight="bold">x</text><text x="230" y="325" font-size="28" fill="#233247" text-anchor="middle" font-weight="normal">{c1, c3}</text><rect x="480" y="20" width="440" height="330" rx="10" fill="#ffffff" stroke="#c5ccd8" stroke-width="2.5"/><text x="700" y="60" font-size="28" fill="#26704e" text-anchor="middle" font-weight="bold">Quy tắc đa dạng</text><line x1="695" y1="210" x2="819" y2="191.4" stroke="#26704e" stroke-width="6"/><line x1="695" y1="210" x2="509" y2="179.0" stroke="#26704e" stroke-width="6"/><circle cx="819.0" cy="191.4" r="16" fill="#ffffff" stroke="#2f3e7a" stroke-width="4"/><text x="819.0" y="165.4" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">c1</text><circle cx="856.2" cy="154.2" r="16" fill="#ffffff" stroke="#2f3e7a" stroke-width="4"/><text x="856.2" y="128.2" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">c2</text><circle cx="843.8" cy="247.2" r="16" fill="#ffffff" stroke="#2f3e7a" stroke-width="4"/><text x="843.8" y="293.2" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">c3</text><circle cx="509.0" cy="179.0" r="16" fill="#ffffff" stroke="#2f3e7a" stroke-width="4"/><text x="509.0" y="153.0" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">c4</text><circle cx="695.0" cy="210.0" r="18" fill="#eef7f2" stroke="#26704e" stroke-width="4"/><text x="695.0" y="219.0" font-size="26" fill="#26704e" text-anchor="middle" font-weight="bold">x</text><text x="700" y="325" font-size="28" fill="#233247" text-anchor="middle" font-weight="normal">{c1, c4}</text></g></svg>
