<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 456" role="img" aria-labelledby="title desc">
<title id="title">Quét đủ và bốn chỉ mục trên kho mười tỷ véc-tơ</title><desc id="desc">Hai cột thanh theo thang log. Bộ nhớ: quét đủ 122,88 TB, LSH hơn 122,88 TB, HNSW khoảng 125,5 TB, đều vượt ngân sách 6 TB; PQ quét đủ 5,12 TB và IVF-PQ khoảng 5,2 TB vừa ngân sách. Một truy vấn với 10 mũ 12 thao tác mỗi giây: quét đủ 30,72 s, PQ quét đủ 5,12 s, đều vượt ngân sách 10 ms; IVF-PQ khoảng 3,6 ms vừa ngân sách; LSH và HNSW không có con số, phụ thuộc số véc-tơ được đo.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif"><text x="365.0" y="34" font-size="28" fill="#233247" text-anchor="middle" font-weight="bold">Bộ nhớ (thang log)</text><text x="880.0" y="34" font-size="28" fill="#233247" text-anchor="middle" font-weight="bold">Một truy vấn (thang log)</text><text x="10" y="106" font-size="27" fill="#233247" text-anchor="start" font-weight="bold">Quét đủ</text><rect x="200" y="78" width="229.84293229561808" height="40" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="441.8429322956181" y="107" font-size="26" fill="#233247" text-anchor="start" font-weight="normal">122,88 TB vượt</text><rect x="700" y="78" width="323.0943272178822" height="40" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="1035.0943272178822" y="107" font-size="26" fill="#233247" text-anchor="start" font-weight="normal">30,72 s vượt</text><text x="10" y="164" font-size="27" fill="#233247" text-anchor="start" font-weight="bold">LSH</text><rect x="200" y="136" width="229.84293229561808" height="40" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="441.8429322956181" y="165" font-size="26" fill="#233247" text-anchor="start" font-weight="normal">&gt; 122,88 TB vượt</text><text x="784.0" y="165" font-size="26" fill="#6b7788" text-anchor="start" font-weight="normal" font-style="italic">phụ thuộc số ứng viên</text><text x="10" y="222" font-size="27" fill="#233247" text-anchor="start" font-weight="bold">HNSW</text><rect x="200" y="194" width="230.85080983987632" height="40" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="442.8508098398763" y="223" font-size="26" fill="#233247" text-anchor="start" font-weight="normal">≈ 125,5 TB vượt</text><text x="784.0" y="223" font-size="26" fill="#6b7788" text-anchor="start" font-weight="normal" font-style="italic">phụ thuộc số đỉnh đã thấy</text><text x="10" y="280" font-size="27" fill="#233247" text-anchor="start" font-weight="bold">PQ quét đủ</text><rect x="200" y="252" width="78.01969570734138" height="40" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="297.5966375422008" y="281" font-size="26" fill="#233247" text-anchor="start" font-weight="normal">5,12 TB vừa</text><rect x="700" y="252" width="267.06743719025985" height="40" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="979.0674371902599" y="281" font-size="26" fill="#233247" text-anchor="start" font-weight="normal">5,12 s vượt</text><text x="10" y="338" font-size="27" fill="#233247" text-anchor="start" font-weight="bold">IVF-PQ</text><rect x="200" y="310" width="78.76036779982792" height="40" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="297.5966375422008" y="339" font-size="26" fill="#233247" text-anchor="start" font-weight="normal">≈ 5,2 TB vừa</text><rect x="700" y="310" width="40.053780055244715" height="40" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="784.0" y="339" font-size="26" fill="#233247" text-anchor="start" font-weight="normal">≈ 3,6 ms vừa</text><line x1="285.5966375422008" y1="64" x2="285.5966375422008" y2="366" stroke="#26704e" stroke-width="3" stroke-dasharray="10 7"/><text x="285.5966375422008" y="396" font-size="26" fill="#26704e" text-anchor="middle" font-weight="bold">ngân sách 6 TB</text><line x1="772.0" y1="64" x2="772.0" y2="366" stroke="#26704e" stroke-width="3" stroke-dasharray="10 7"/><text x="772.0" y="396" font-size="26" fill="#26704e" text-anchor="middle" font-weight="bold">ngân sách 10 ms</text><line x1="200.0" y1="406" x2="200.0" y2="416" stroke="#6b7788" stroke-width="2"/><text x="200.0" y="442" font-size="24" fill="#6b7788" text-anchor="middle" font-weight="normal">1 TB</text><line x1="420.0" y1="406" x2="420.0" y2="416" stroke="#6b7788" stroke-width="2"/><text x="420.0" y="442" font-size="24" fill="#6b7788" text-anchor="middle" font-weight="normal">100 TB</text><line x1="700.0" y1="406" x2="700.0" y2="416" stroke="#6b7788" stroke-width="2"/><text x="700.0" y="442" font-size="24" fill="#6b7788" text-anchor="middle" font-weight="normal">1 ms</text><line x1="916.0" y1="406" x2="916.0" y2="416" stroke="#6b7788" stroke-width="2"/><text x="916.0" y="442" font-size="24" fill="#6b7788" text-anchor="middle" font-weight="normal">1 s</text><line x1="1060.0" y1="406" x2="1060.0" y2="416" stroke="#6b7788" stroke-width="2"/><text x="1060.0" y="442" font-size="24" fill="#6b7788" text-anchor="middle" font-weight="normal">100 s</text></g></svg>
