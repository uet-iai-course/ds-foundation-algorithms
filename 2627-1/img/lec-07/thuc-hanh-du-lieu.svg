<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 450" role="img" aria-labelledby="title desc">
<title id="title">Dữ liệu của sổ thực hành bài giảng 8</title><desc id="desc">Bốn mảng đi qua bốn thao tác. xt kích thước 10 mũ 6 nhân 64 dùng để học tâm thô và bộ mã; xb kích thước 10 mũ 4 nhân 64 được gán vào danh sách và mã hóa thành kho mã; xq gồm 100 truy vấn 64 chiều cho kết quả I kích thước 100 nhân 10; quét đủ trên xb với các truy vấn xq cho gt kích thước 100 nhân 10, tập đúng 10 hàng xóm của mỗi truy vấn. nok đếm số truy vấn có cột đầu của I bằng cột đầu của gt.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="20" y="20" width="230" height="78" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="135.0" y="51.3" font-size="28" fill="#2f3e7a" text-anchor="middle" font-weight="bold">xt</text><text x="135.0" y="86.3" font-size="25" fill="#233247" text-anchor="middle" font-weight="normal">10⁶ × 64</text><line x1="256" y1="59" x2="330" y2="59" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="338" y="20" width="470" height="78" rx="10" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="573.0" y="68.1" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">train: học tâm thô, bộ mã</text><line x1="814" y1="59" x2="888" y2="59" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="896" y="20" width="300" height="78" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="1046.0" y="68.1" font-size="26" fill="#26704e" text-anchor="middle" font-weight="bold">bộ mã</text><rect x="20" y="116" width="230" height="78" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="135.0" y="147.3" font-size="28" fill="#2f3e7a" text-anchor="middle" font-weight="bold">xb</text><text x="135.0" y="182.3" font-size="25" fill="#233247" text-anchor="middle" font-weight="normal">10⁴ × 64</text><line x1="256" y1="155" x2="330" y2="155" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="338" y="116" width="470" height="78" rx="10" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="573.0" y="164.1" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">add: gán danh sách, mã hóa</text><line x1="814" y1="155" x2="888" y2="155" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="896" y="116" width="300" height="78" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="1046.0" y="164.1" font-size="26" fill="#26704e" text-anchor="middle" font-weight="bold">kho mã</text><rect x="20" y="212" width="230" height="78" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="135.0" y="243.3" font-size="28" fill="#a85b23" text-anchor="middle" font-weight="bold">xq</text><text x="135.0" y="278.3" font-size="25" fill="#233247" text-anchor="middle" font-weight="normal">100 × 64</text><line x1="256" y1="251" x2="330" y2="251" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="338" y="212" width="470" height="78" rx="10" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="573.0" y="260.1" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">search(xq, 10)</text><line x1="814" y1="251" x2="888" y2="251" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="896" y="212" width="300" height="78" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="1046.0" y="260.1" font-size="26" fill="#26704e" text-anchor="middle" font-weight="bold">I: 100 × 10</text><rect x="20" y="308" width="230" height="78" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="135.0" y="339.3" font-size="28" fill="#a85b23" text-anchor="middle" font-weight="bold">xb, xq</text><text x="135.0" y="374.3" font-size="25" fill="#233247" text-anchor="middle" font-weight="normal">kho, truy vấn</text><line x1="256" y1="347" x2="330" y2="347" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="338" y="308" width="470" height="78" rx="10" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="573.0" y="356.1" font-size="26" fill="#233247" text-anchor="middle" font-weight="bold">quét đủ (faiss.knn, ô mã 21)</text><line x1="814" y1="347" x2="888" y2="347" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="896" y="308" width="300" height="78" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="1046.0" y="339.85" font-size="26" fill="#26704e" text-anchor="middle" font-weight="bold">gt: 100 × 10</text><text x="1046.0" y="372.35" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">tập đúng 𝒩₁₀(q)</text><text x="1196" y="432" font-size="26" fill="#a85b23" text-anchor="end" font-weight="bold">nok: số truy vấn có I[:, 0] = gt[:, 0]</text></g></svg>
