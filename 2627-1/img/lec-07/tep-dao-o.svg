<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" aria-labelledby="title desc">
<title id="title">Tệp đảo với bốn danh sách</title><desc id="desc">Bốn tâm thô μ0 đến μ3 chia mặt phẳng thành bốn ô; mỗi ô ứng với một danh sách đảo L0 đến L3 gồm bốn điểm. Truy vấn q ở (6; 3,5) gần μ1 nhất rồi đến μ0; điểm y3 thuộc ô của μ0, sát ranh giới với ô của μ1.</desc>
