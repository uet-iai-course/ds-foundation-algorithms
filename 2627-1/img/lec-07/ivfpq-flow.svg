<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Luồng truy vấn IVF-PQ theo từng danh sách</title><desc id="desc">Truy vấn chọn các tâm thô. Với mỗi danh sách i, hệ thống lấy truy vấn dư q trừ mu i, lập bảng ADC riêng, chấm mã phần dư rồi trả tối đa K mã định danh.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f3e7a"/></marker></defs>
  <g text-anchor="middle" font-family="sans-serif"><rect x="20" y="92" width="150" height="155" rx="14" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="95" y="142" font-size="23" font-weight="700">truy vấn q</text><text x="95" y="182" font-size="19">chọn nprobe</text><text x="95" y="212" font-size="19">tâm thô</text><rect x="220" y="67" width="210" height="205" rx="14" fill="#fff" stroke="#2f3e7a" stroke-width="3"/><text x="325" y="112" font-size="22" font-weight="700">mỗi danh sách i</text><text x="325" y="154" font-size="21">qᵢ = q − μᵢ</text><text x="325" y="192" font-size="18">lập bảng ADC riêng</text><text x="325" y="225" font-size="18">cho qᵢ</text><rect x="480" y="67" width="220" height="205" rx="14" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="590" y="112" font-size="22" font-weight="700">quét Lᵢ</text><text x="590" y="154" font-size="18">(id(y), PQ(y − μᵢ))</text><text x="590" y="192" font-size="18">cộng các ô tra</text><text x="590" y="225" font-size="18">của mã phần dư</text><rect x="750" y="92" width="225" height="155" rx="14" fill="#eef7f2" stroke="#2f7d5b" stroke-width="3"/><text x="862" y="142" font-size="22" font-weight="700">hàng đợi chung</text><text x="862" y="182" font-size="18">giữ tối đa K mã</text><text x="862" y="212" font-size="18">định danh gần nhất</text></g>
  <g stroke="#2f3e7a" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M180 170H208"/><path d="M440 170H468"/><path d="M710 170H738"/></g><text x="500" y="330" text-anchor="middle" font-size="21" fill="#2f3e7a">chi phí quét phụ thuộc tổng |Lᵢ| của các danh sách được mở</text>
</svg>
