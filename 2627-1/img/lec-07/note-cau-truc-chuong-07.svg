<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">Cấu trúc của Bài 07</title><desc id="desc">Sơ đồ đọc từ trên xuống. Khối trên cùng là bài toán trung tâm của Mục 1: kho 10 mũ 10 véc-tơ, D bằng 3072, 122,88 TB; quét đủ cần 3,072 nhân 10 mũ 13 lượt tọa độ, 30,72 giây mỗi truy vấn; chi phí bằng số véc-tơ được đo n_c nhân chi phí một phép đo. Hai mũi tên tách hai nhánh. Nhánh 1, giảm số véc-tơ được đo: khối viền nét đứt &quot;Bài 06: LSH, chỉ đo véc-tơ chung thùng với q, đã học&quot;; khối Mục 2 &quot;đồ thị lân cận, tham lam, chùm, SEARCH-LAYER&quot;, mũi tên xuống khối Mục 3 &quot;HNSW: đồ thị nhiều tầng, O(log N) phép đo, bộ nhớ khoảng 125,5 TB&quot;. Nhánh 2, giảm chi phí một phép đo và bộ nhớ: khối Mục 4 &quot;PQ: lượng tử hóa véc-tơ, lượng tử hóa tích, bảng tra khoảng cách, cận sai số, mã 512 byte, kho mã 5,12 TB, quét đủ 5,12 giây&quot;. Mũi tên từ Mục 3 và Mục 4 hội tụ vào khối Mục 5 &quot;IVF-PQ: giảm cả hai thừa số, khoảng 5,2 TB, khoảng 3,6 ms&quot;, rồi sang khối Mục 6 &quot;chọn chỉ mục theo bộ nhớ, thời gian, độ thu hồi&quot;. Dòng cuối: mục tiêu 6 TB và 10 ms mỗi truy vấn, Mục 1 và Tình huống 07.1.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#233247"/></marker></defs>
<rect x="0" y="0" width="1200" height="860" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="200.0" y="14.0" width="800.0" height="150.0" rx="10" fill="#f4f6f9" stroke="#233247" stroke-width="3"/><text x="600.0" y="50.0" font-size="25" fill="#233247" text-anchor="middle" font-weight="bold">Bài toán trung tâm (Mục 1)</text><text x="600.0" y="84.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">Kho 10¹⁰ véc-tơ, D = 3072, 122,88 TB</text><text x="600.0" y="114.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="normal">quét đủ: 3,072·10¹³ lượt tọa độ, 30,72 s mỗi truy vấn</text><text x="600.0" y="146.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="bold">chi phí = n<tspan baseline-shift="sub" font-size="75%">c</tspan> × chi phí một phép đo</text><line x1="420.0" y1="166.0" x2="300.0" y2="214.0" stroke="#233247" stroke-width="3" marker-end="url(#arrow)"/><line x1="780.0" y1="166.0" x2="900.0" y2="214.0" stroke="#233247" stroke-width="3" marker-end="url(#arrow)"/><text x="300.0" y="240.0" font-size="22" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Nhánh 1: giảm n<tspan baseline-shift="sub" font-size="75%">c</tspan></text><text x="300.0" y="266.0" font-size="19" fill="#2f3e7a" text-anchor="middle" font-weight="normal">(số véc-tơ được đo)</text><text x="900.0" y="240.0" font-size="22" fill="#a85b23" text-anchor="middle" font-weight="bold">Nhánh 2: giảm chi phí một phép đo</text><text x="900.0" y="266.0" font-size="19" fill="#a85b23" text-anchor="middle" font-weight="normal">và bộ nhớ</text><line x1="240.0" y1="276.0" x2="170.0" y2="288.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><line x1="435.0" y1="274.0" x2="435.0" y2="286.0" stroke="#2f3e7a" stroke-width="2"/><line x1="900.0" y1="274.0" x2="900.0" y2="286.0" stroke="#a85b23" stroke-width="2"/><rect x="20.0" y="290.0" width="250.0" height="150.0" rx="10" fill="#f4f6f9" stroke="#5b6778" stroke-width="2.5" stroke-dasharray="8 6"/><text x="145.0" y="324.0" font-size="22" fill="#5b6778" text-anchor="middle" font-weight="bold">Bài 06: LSH</text><text x="145.0" y="356.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">chỉ đo véc-tơ</text><text x="145.0" y="384.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">chung thùng với q</text><text x="145.0" y="412.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">(đã học)</text><rect x="300.0" y="290.0" width="270.0" height="150.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="435.0" y="324.0" font-size="22" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Mục 2</text><text x="435.0" y="356.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">đồ thị lân cận,</text><text x="435.0" y="384.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">tham lam, chùm,</text><text x="435.0" y="412.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">SEARCH-LAYER</text><line x1="435.0" y1="442.0" x2="435.0" y2="476.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="300.0" y="480.0" width="270.0" height="150.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="435.0" y="514.0" font-size="22" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Mục 3: HNSW</text><text x="435.0" y="546.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">đồ thị nhiều tầng,</text><text x="435.0" y="574.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">O(log N) phép đo,</text><text x="435.0" y="602.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">bộ nhớ ≈125,5 TB</text><rect x="760.0" y="290.0" width="280.0" height="340.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="900.0" y="324.0" font-size="22" fill="#a85b23" text-anchor="middle" font-weight="bold">Mục 4: PQ</text><text x="900.0" y="356.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">lượng tử hóa véc-tơ,</text><text x="900.0" y="384.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">lượng tử hóa tích,</text><text x="900.0" y="412.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">bảng tra khoảng cách,</text><text x="900.0" y="440.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">cận sai số,</text><text x="900.0" y="468.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">mã 512 byte,</text><text x="900.0" y="496.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">kho mã 5,12 TB,</text><text x="900.0" y="524.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">quét đủ 5,12 s</text><line x1="435.0" y1="632.0" x2="560.0" y2="676.0" stroke="#233247" stroke-width="3" marker-end="url(#arrow)"/><line x1="900.0" y1="632.0" x2="740.0" y2="676.0" stroke="#233247" stroke-width="3" marker-end="url(#arrow)"/><rect x="420.0" y="680.0" width="360.0" height="110.0" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="600.0" y="714.0" font-size="22" fill="#26704e" text-anchor="middle" font-weight="bold">Mục 5: IVF-PQ</text><text x="600.0" y="746.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">giảm cả hai thừa số:</text><text x="600.0" y="774.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">≈5,2 TB, ≈3,6 ms</text><line x1="780.0" y1="735.0" x2="846.0" y2="735.0" stroke="#233247" stroke-width="3" marker-end="url(#arrow)"/><rect x="850.0" y="680.0" width="330.0" height="110.0" rx="10" fill="#ffffff" stroke="#233247" stroke-width="2.5"/><text x="1015.0" y="714.0" font-size="22" fill="#233247" text-anchor="middle" font-weight="bold">Mục 6</text><text x="1015.0" y="746.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">chọn chỉ mục theo bộ nhớ,</text><text x="1015.0" y="774.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">thời gian, độ thu hồi</text><text x="600.0" y="830.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal" font-style="italic">Mục tiêu: 6 TB và 10 ms mỗi truy vấn (Mục 1; Tình huống 07.1)</text></g></svg>
