<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Tính khoảng cách bất đối xứng bằng bảng tra</title><desc id="desc">Mỗi véc-tơ con của truy vấn đầy đủ tạo một hàng khoảng cách tới các tâm; mã PQ chọn một ô ở mỗi hàng rồi cộng.</desc>
  <text x="35" y="58" font-size="24" font-weight="700" fill="#2f3e7a">truy vấn q đầy đủ</text><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="35" y="80" width="140" height="50" rx="8"/><rect x="35" y="145" width="140" height="50" rx="8"/><rect x="35" y="210" width="140" height="50" rx="8"/></g><g font-size="20" text-anchor="middle"><text x="105" y="112">q⁽¹⁾</text><text x="105" y="177">q⁽²⁾</text><text x="105" y="242">q⁽³⁾</text></g>
  <text x="385" y="50" font-size="22" fill="#2f3e7a">bảng tra khoảng cách theo từng đoạn</text>
  <g stroke="#adb6c5" stroke-width="2"><path d="M245 75V275M335 75V275M425 75V275M515 75V275M605 75V275"/><path d="M245 75H605M245 140H605M245 205H605M245 275H605"/></g>
  <g fill="#f7efe6" stroke="#b15a2b" stroke-width="3"><rect x="335" y="75" width="90" height="65"/><rect x="515" y="140" width="90" height="65"/><rect x="245" y="205" width="90" height="70"/></g>
  <g font-size="18" text-anchor="middle"><text x="290" y="108">0</text><text x="380" y="108">i₁</text><text x="470" y="108">2</text><text x="560" y="108">3</text><text x="290" y="175">0</text><text x="380" y="175">1</text><text x="470" y="175">2</text><text x="560" y="175">i₂</text><text x="290" y="245">i₃</text><text x="380" y="245">1</text><text x="470" y="245">2</text><text x="560" y="245">3</text></g>
  <path d="M640 175H765" stroke="#2f3e7a" stroke-width="5"/><rect x="785" y="100" width="180" height="150" rx="14" fill="#eef7f2" stroke="#2f7d5b" stroke-width="3"/><text x="875" y="145" text-anchor="middle" font-size="22" font-weight="700">3 phép tra</text><text x="875" y="185" text-anchor="middle" font-size="22">+</text><text x="875" y="220" text-anchor="middle" font-size="22" font-weight="700">2 phép cộng</text>
  <text x="500" y="335" text-anchor="middle" font-size="22" fill="#2f3e7a">mã cơ sở dữ liệu: (i₁, i₂, i₃)</text>
</svg>
