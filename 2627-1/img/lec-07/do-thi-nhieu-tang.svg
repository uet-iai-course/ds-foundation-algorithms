<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" role="img" aria-labelledby="title desc">
<title id="title">Đồ thị nhiều tầng</title><desc id="desc">Tầng 0 chứa mười hai điểm s, p1 đến p11 với cạnh ngắn; tầng 1 chứa s, p2, p4, p6, p8, p10; tầng 2 chứa s, p4, p8. Truy vấn q ở giữa p6 và p7: ở tầng 2 tham lam đi s, p4, p8; xuống tầng 1 từ p8 sang p6; xuống tầng 0 tìm quanh p6.</desc>
