<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 380" role="img" aria-labelledby="title desc">
<title id="title">Truy hồi ngữ nghĩa bằng véc-tơ nhúng</title><desc id="desc">Mười tỷ đoạn văn bản và câu truy vấn đi qua cùng một mô hình nhúng, thành véc-tơ 3072 chiều. Kết quả là K đoạn có véc-tơ gần véc-tơ truy vấn q nhất.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="20" y="40" width="240" height="90" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="140.0" y="77.3" font-size="28" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Đoạn văn bản</text><text x="140.0" y="112.3" font-size="25" fill="#233247" text-anchor="middle" font-weight="normal">10¹⁰ đoạn</text><rect x="20" y="230" width="240" height="90" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="140.0" y="284.8" font-size="28" fill="#a85b23" text-anchor="middle" font-weight="bold">Câu truy vấn</text><rect x="345" y="40" width="230" height="280" rx="10" fill="#f4f6f9" stroke="#233247" stroke-width="2.5"/><text x="460.0" y="172.3" font-size="28" fill="#233247" text-anchor="middle" font-weight="bold">Mô hình nhúng</text><text x="460.0" y="207.3" font-size="25" fill="#233247" text-anchor="middle" font-weight="normal">cùng một mô hình</text><line x1="266" y1="85" x2="337" y2="85" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="266" y1="275" x2="337" y2="275" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="660" y="40" width="300" height="90" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="810.0" y="77.3" font-size="28" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Kho véc-tơ</text><text x="810.0" y="112.3" font-size="25" fill="#233247" text-anchor="middle" font-weight="normal">10¹⁰ véc-tơ × 3072 chiều</text><rect x="660" y="230" width="300" height="90" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="810.0" y="267.3" font-size="28" fill="#a85b23" text-anchor="middle" font-weight="bold">Véc-tơ truy vấn q</text><text x="810.0" y="302.3" font-size="25" fill="#233247" text-anchor="middle" font-weight="normal">3072 chiều</text><line x1="581" y1="85" x2="652" y2="85" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="581" y1="275" x2="652" y2="275" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="1050" y="135" width="230" height="90" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="1165.0" y="172.3" font-size="28" fill="#26704e" text-anchor="middle" font-weight="bold">K đoạn</text><text x="1165.0" y="207.3" font-size="25" fill="#233247" text-anchor="middle" font-weight="normal">gần q nhất</text><line x1="966" y1="100" x2="1042" y2="160" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="966" y1="260" x2="1042" y2="200" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><text x="1005" y="362" font-size="24" fill="#6b7788" text-anchor="middle" font-weight="normal" font-style="italic">so khoảng cách giữa q và mọi véc-tơ trong kho</text></g></svg>
