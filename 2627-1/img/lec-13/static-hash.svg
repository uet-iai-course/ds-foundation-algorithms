<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="t d"><title id="t">Vết băm tĩnh với một ngăn tràn</title><desc id="d">Hình trích các ngăn 1 đến 3 trong tổng 10 ngăn của nguồn. Với sức chứa một mục, Music vào ngăn 1, History vào ngăn 2, Physics vào ngăn nhà 3 và Elec Eng vào một ngăn tràn.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#B15A2B"/></marker></defs><g font-family="sans-serif"><text x="160" y="45" text-anchor="middle" font-size="27" fill="#2F3E7A">khóa tìm kiếm</text><text x="745" y="42" text-anchor="middle" font-size="23" fill="#2F3E7A">trích ngăn 1–3 trong tổng 10 ngăn · c = 1</text><g font-size="23"><text x="60" y="105">Music</text><text x="60" y="165">History</text><text x="60" y="225">Physics</text><text x="60" y="285">Elec. Eng.</text></g><path d="M220 88H430M220 150H430M220 212H430M220 274H430" stroke="#B15A2B" stroke-width="3" marker-end="url(#a)"/><text x="325" y="65" text-anchor="middle" font-size="22">h(khóa)</text><g font-size="24" text-anchor="middle"><rect x="480" y="65" width="410" height="65" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="520" y="105">1</text><text x="700" y="105">Music</text><rect x="480" y="145" width="410" height="65" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="520" y="185">2</text><text x="700" y="185">History</text><rect x="480" y="225" width="410" height="65" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="520" y="265">3</text><text x="700" y="265">Physics</text><path d="M890 257H930" stroke="#B15A2B" stroke-width="3" marker-end="url(#a)"/><rect x="940" y="225" width="145" height="65" fill="#FFF8EF" stroke="#B15A2B" stroke-width="3"/><text x="1012" y="252" font-size="18">tràn</text><text x="1012" y="278" font-size="18">Elec. Eng.</text></g><text x="745" y="350" text-anchor="middle" font-size="22" fill="#555">Physics và Elec. Eng. va chạm; giả thiết c = 1 cho t = 1</text></g></svg>
