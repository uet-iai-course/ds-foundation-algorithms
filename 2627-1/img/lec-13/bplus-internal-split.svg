<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="t d"><title id="t">Tách nút trong với m bằng 6</title><desc id="d">Nút tràn có 5,10,15,20,25,30; khóa 15 được đẩy lên cha; hai nút mới giữ 5,10 và 20,25,30.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#B15A2B"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><text x="235" y="60" font-size="25" fill="#2F3E7A">nút trong tràn</text><rect x="35" y="90" width="400" height="75" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="235" y="137" font-size="27">5 | 10 | 15 | 20 | 25 | 30</text><path d="M450 130H620" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><text x="535" y="105" font-size="22">đẩy 15</text><rect x="725" y="35" width="130" height="65" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="790" y="77" font-size="28">15</text><rect x="590" y="230" width="210" height="70" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="695" y="274" font-size="27">5 | 10</text><rect x="830" y="230" width="240" height="70" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="950" y="274" font-size="27">20 | 25 | 30</text><path d="M770 100L695 230M810 100L950 230" stroke="#555" stroke-width="3"/><text x="830" y="365" font-size="22" fill="#555">15 không còn trong hai nút mới</text></g></svg>
