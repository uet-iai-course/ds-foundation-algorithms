<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="t d"><title id="t">B+-Tree sau khi tách lá</title><desc id="d">Gốc có ba khóa phân cách 7, 10, 19 và bốn con lá liên kết.</desc><g font-family="sans-serif" text-anchor="middle"><rect x="430" y="35" width="260" height="70" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/><text x="560" y="80" font-size="30">7 | 10 | 19</text><g fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"><rect x="30" y="250" width="230" height="80" rx="10"/><rect x="300" y="250" width="230" height="80" rx="10"/><rect x="570" y="250" width="230" height="80" rx="10"/><rect x="840" y="250" width="250" height="80" rx="10"/></g><g font-size="25"><text x="145" y="300">2 | 3 | 5</text><text x="415" y="300">7 | 8 | 9</text><text x="685" y="300">10 | 11 | 17</text><text x="965" y="300">19 | 23 | 29 | 31</text></g><g stroke="#2F3E7A" stroke-width="3"><path d="M470 105L145 250M530 105L415 250M590 105L685 250M650 105L965 250"/><path d="M260 290H300M530 290H570M800 290H840" marker-end="url(#a)"/></g><text x="560" y="395" font-size="24" fill="#B15A2B">khóa 10 còn ở lá phải và được sao chép lên gốc</text></g><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#2F3E7A"/></marker></defs></svg>
