<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" role="img" aria-labelledby="title desc"><title id="title">Ba dãy do chọn thay thế tạo ra</title><desc id="desc">Từ mười hai tên con vật, chọn thay thế với ba vị trí hoạt động tạo ba dãy lần lượt dài bảy, ba và hai.</desc><g font-family="sans-serif"><text x="40" y="45" font-size="25" fill="#2F3E7A" font-weight="700">Dãy 1 · 7 khóa</text><rect x="40" y="65" width="1080" height="75" rx="12" fill="#EDF7EE" stroke="#2E7D32" stroke-width="3"/><text x="580" y="112" text-anchor="middle" font-size="25">emu · kangaroo · platypus · wallaby · warthog · wombat · zebra</text><text x="40" y="195" font-size="25" fill="#2F3E7A" font-weight="700">Dãy 2 · 3 khóa</text><rect x="40" y="215" width="1080" height="75" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="580" y="262" text-anchor="middle" font-size="27">hyena · lion · meerkat</text><text x="40" y="345" font-size="25" fill="#2F3E7A" font-weight="700">Dãy 3 · 2 khóa</text><rect x="40" y="365" width="1080" height="75" rx="12" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="580" y="412" text-anchor="middle" font-size="27">baboon · hornbill</text></g></svg>
