<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Phân cấp lưu trữ và đơn vị truyền</title><desc id="desc">Dữ liệu đi từ tệp trên thiết bị lưu trữ qua khối vào các khung đệm trong bộ nhớ chính.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#B15A2B"/></marker></defs>
  <rect x="45" y="70" width="260" height="270" rx="24" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="4"/><text x="175" y="115" text-anchor="middle" font-size="28" font-family="sans-serif" fill="#2F3E7A" font-weight="700">Thiết bị lưu trữ</text>
  <rect x="85" y="155" width="180" height="42" fill="#fff" stroke="#2F3E7A"/><rect x="85" y="205" width="180" height="42" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><rect x="85" y="255" width="180" height="42" fill="#fff" stroke="#2F3E7A"/><text x="175" y="234" text-anchor="middle" font-size="23" font-family="sans-serif">một khối</text>
  <path d="M285 226 H470" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><text x="375" y="205" text-anchor="middle" font-size="22" font-family="sans-serif">một lần truyền</text>
  <rect x="505" y="70" width="445" height="270" rx="24" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/><text x="727" y="115" text-anchor="middle" font-size="28" font-family="sans-serif" fill="#2F3E7A" font-weight="700">Bộ nhớ chính: B khung</text>
  <g font-family="sans-serif" font-size="23" text-anchor="middle"><rect x="555" y="155" width="120" height="120" fill="#fff" stroke="#2F3E7A" stroke-width="3"/><text x="615" y="222">khung 1</text><rect x="690" y="155" width="120" height="120" fill="#fff" stroke="#2F3E7A" stroke-width="3"/><text x="750" y="222">khung 2</text><rect x="825" y="155" width="80" height="120" fill="#fff" stroke="#2F3E7A" stroke-width="3"/><text x="865" y="222">…</text></g>
</svg>
