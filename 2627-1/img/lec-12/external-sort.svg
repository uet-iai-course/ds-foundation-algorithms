<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc"><title id="title">Hai pha của sắp xếp trộn ngoài</title><desc id="desc">Tệp đầu vào được chia thành các nhóm B khối để tạo dãy con đã sắp, rồi các nhóm tối đa B trừ một dãy được trộn qua nhiều lượt.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#B15A2B"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><rect x="30" y="155" width="180" height="100" rx="12" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="120" y="197" font-size="25">tệp N khối</text><text x="120" y="229" font-size="21">chưa sắp</text><path d="M210 205H330" stroke="#B15A2B" stroke-width="4" marker-end="url(#a)"/><rect x="335" y="95" width="275" height="220" rx="16" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="472" y="135" font-size="26" font-weight="700">Pha 1: tạo dãy con</text><text x="472" y="185" font-size="22">đọc tối đa B khối</text><text x="472" y="220" font-size="22">sắp trong bộ nhớ</text><text x="472" y="255" font-size="22">ghi dãy đã sắp</text><text x="472" y="290" font-size="22" fill="#2F3E7A">r₀ = ⌈N/B⌉</text><path d="M610 205H730" stroke="#B15A2B" stroke-width="4" marker-end="url(#a)"/><rect x="735" y="95" width="330" height="220" rx="16" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="900" y="135" font-size="26" font-weight="700">Pha 2: trộn nhiều lượt</text><text x="900" y="185" font-size="22">k = B − 1 dãy đầu vào</text><text x="900" y="220" font-size="22">1 khung đầu ra</text><text x="900" y="255" font-size="22">lặp đến khi còn 1 dãy</text><text x="900" y="290" font-size="22" fill="#2F3E7A">p = ⌈logₖ r₀⌉</text></g></svg>
