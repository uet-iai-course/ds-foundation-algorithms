<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc"><title id="title">Vật chất hóa và truyền dòng</title><desc id="desc">Nhánh vật chất hóa ghi toàn bộ kết quả trung gian rồi đọc lại; nhánh truyền dòng chuyển trực tiếp từng khối sang toán tử sau.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#B15A2B"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><text x="90" y="105" font-size="25" fill="#2F3E7A" font-weight="700">Vật chất hóa</text><rect x="220" y="55" width="200" height="90" rx="12" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="320" y="108" font-size="24">sắp xếp</text><path d="M420 100H520" stroke="#B15A2B" stroke-width="4" marker-end="url(#a)"/><rect x="525" y="55" width="210" height="90" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="630" y="91" font-size="22">ghi rồi đọc</text><text x="630" y="120" font-size="22">tệp trung gian</text><path d="M735 100H835" stroke="#B15A2B" stroke-width="4" marker-end="url(#a)"/><rect x="840" y="55" width="220" height="90" rx="12" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="950" y="108" font-size="24">toán tử sau</text><text x="90" y="315" font-size="25" fill="#2F3E7A" font-weight="700">Truyền dòng</text><rect x="220" y="265" width="200" height="90" rx="12" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="320" y="318" font-size="24">sắp xếp</text><path d="M420 310H835" stroke="#2E7D32" stroke-width="6" marker-end="url(#a)"/><text x="630" y="285" font-size="22" fill="#2E7D32">khối kết quả cuối chuyển trực tiếp</text><rect x="840" y="265" width="220" height="90" rx="12" fill="#EDF7EE" stroke="#2E7D32" stroke-width="3"/><text x="950" y="318" font-size="24">toán tử sau</text></g></svg>
