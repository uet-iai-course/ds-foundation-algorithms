<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Hai nhánh của bộ quản lý đệm</title><desc id="desc">Yêu cầu khối được kiểm tra trong bảng tra cứu; nếu trúng thì trả khung, nếu trượt thì chọn nạn nhân, ghi khối bẩn và đọc khối mới.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#B15A2B"/></marker></defs>
<g font-family="sans-serif" text-anchor="middle"><rect x="35" y="170" width="170" height="70" rx="12" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="120" y="213" font-size="25">yêu cầu khối</text><path d="M205 205H345" stroke="#B15A2B" stroke-width="4" marker-end="url(#a)"/><polygon points="455,120 565,205 455,290 345,205" fill="#fff" stroke="#2F3E7A" stroke-width="3"/><text x="455" y="198" font-size="23">đang ở</text><text x="455" y="226" font-size="23">trong đệm?</text><path d="M565 180H750" stroke="#2E7D32" stroke-width="4" marker-end="url(#a)"/><text x="650" y="158" font-size="22" fill="#2E7D32">trúng</text><rect x="755" y="140" width="205" height="75" rx="12" fill="#EDF7EE" stroke="#2E7D32" stroke-width="3"/><text x="857" y="185" font-size="24">trả vị trí khung</text><path d="M455 290V350H650" stroke="#B15A2B" stroke-width="4" marker-end="url(#a)"/><text x="510" y="335" font-size="22" fill="#B15A2B">trượt</text><rect x="655" y="310" width="305" height="80" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="807" y="342" font-size="22">chọn nạn nhân → ghi nếu bẩn</text><text x="807" y="373" font-size="22">→ đọc khối cần thiết</text></g></svg>
