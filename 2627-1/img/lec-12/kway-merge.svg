<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
  <title id="title">Trộn hai dãy đã sắp</title>
  <desc id="desc">Hai khung đầu vào giữ đầu dãy emu và lion; emu là bản ghi nhỏ nhất và được chuyển sang khung đầu ra.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#B15A2B"/></marker></defs>
  <g font-family="sans-serif">
    <text x="185" y="62" text-anchor="middle" font-size="27" fill="#2F3E7A" font-weight="700">hai dãy đầu vào</text>
    <g font-size="23" text-anchor="middle">
      <rect x="35" y="105" width="300" height="82" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/><text x="185" y="155">R₁: emu · kangaroo · wallaby</text>
      <rect x="35" y="230" width="300" height="82" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="185" y="280">R₂: lion · platypus · wombat</text>
    </g>
    <path d="M335 146H470" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/>
    <rect x="475" y="135" width="250" height="145" rx="18" fill="#fff" stroke="#2F3E7A" stroke-width="3"/>
    <text x="600" y="183" text-anchor="middle" font-size="25">chọn đầu nhỏ nhất</text><text x="600" y="235" text-anchor="middle" font-size="38" fill="#B15A2B" font-weight="700">emu</text>
    <path d="M725 207H865" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/>
    <rect x="870" y="165" width="170" height="85" fill="#EDF7EE" stroke="#2E7D32" stroke-width="3"/><text x="955" y="219" text-anchor="middle" font-size="28">emu</text><text x="955" y="290" text-anchor="middle" font-size="22">khung đầu ra</text>
  </g>
</svg>
