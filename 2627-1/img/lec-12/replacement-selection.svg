<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">Bố trí chọn thay thế</title><desc id="desc">Luồng đầu vào đi vào hàng đợi ưu tiên; phần tử nhỏ nhất được xuất, khóa mới nhỏ hơn khóa vừa xuất bị đóng băng cho dãy kế tiếp.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#B15A2B"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><rect x="30" y="175" width="190" height="85" rx="12" fill="#EEF2FA" stroke="#2F3E7A" stroke-width="3"/><text x="125" y="210" font-size="24">khóa kế tiếp</text><text x="125" y="239" font-size="21">từ đầu vào</text><path d="M220 217H355" stroke="#B15A2B" stroke-width="4" marker-end="url(#a)"/><rect x="360" y="90" width="340" height="260" rx="20" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/><text x="530" y="135" font-size="26" font-weight="700">hàng đợi ưu tiên</text><text x="530" y="185" font-size="22">phần tử đang hoạt động</text><rect x="420" y="210" width="220" height="55" fill="#fff" stroke="#2F3E7A" stroke-width="3"/><text x="530" y="245" font-size="24">lấy khóa nhỏ nhất</text><text x="530" y="310" font-size="21" fill="#7B5EA7">khóa nhỏ hơn: đóng băng</text><path d="M700 217H850" stroke="#B15A2B" stroke-width="4" marker-end="url(#a)"/><rect x="855" y="175" width="225" height="85" rx="12" fill="#EDF7EE" stroke="#2E7D32" stroke-width="3"/><text x="967" y="210" font-size="24">dãy đang tạo</text><text x="967" y="241" font-size="21">không giảm</text></g></svg>
