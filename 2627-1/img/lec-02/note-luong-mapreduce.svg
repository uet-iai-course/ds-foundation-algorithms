<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" role="img" aria-labelledby="title desc">
<title id="title">Luồng một công việc MapReduce</title><desc id="desc">Luồng một công việc MapReduce đọc từ trái sang phải qua tám khối nối bằng mũi tên. Khối dữ liệu viền mảnh: đầu vào X là dãy cặp thuộc (K₁ × V₁)*; dãy Z các cặp trung gian thuộc (K₂ × V₂)*; các nhóm (k, L_k), mỗi khóa một nhóm; đầu ra Y là dãy cặp thuộc (K₃ × V₃)*. Khối do hệ thống thực hiện viền xám nét đứt: chia X thành X₁, …, X_m theo vị trí; phân phối bằng h và nhóm theo khóa. Khối do người lập trình viết viền cam liền, đậm: Map với m tác vụ, một lần gọi cho mỗi cặp; Reduce với r tác vụ, một lần gọi cho mỗi khóa. Dưới đường kẻ đứt là ví dụ: cặp (chó, 1) do Map phát từ d₂ nằm trong Z, h(chó) chọn một tác vụ Reduce, nhóm của chó là [1, 1], và Reduce phát (chó, 2) vào Y.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1240" height="470" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="10.0" y="100.0" width="135.0" height="140.0" rx="10" fill="#ffffff" stroke="#2f3e7a" stroke-width="2"/><text x="77.5" y="132.0" font-size="19" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Đầu vào X</text><text x="77.5" y="166.0" font-size="17" fill="#233247" text-anchor="middle" font-weight="normal">dãy cặp</text><text x="77.5" y="194.0" font-size="17" fill="#233247" text-anchor="middle" font-weight="normal">(K₁ × V₁)*</text><line x1="147.0" y1="170.0" x2="163.0" y2="170.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="165.0" y="70.0" width="135.0" height="200.0" rx="10" fill="#f4f6f9" stroke="#5b6778" stroke-width="3" stroke-dasharray="9 6"/><text x="232.5" y="112.0" font-size="19" fill="#5b6778" text-anchor="middle" font-weight="bold">Chia phần</text><text x="232.5" y="152.0" font-size="17" fill="#233247" text-anchor="middle" font-weight="normal">X₁, …, X<tspan baseline-shift="sub" font-size="75%">m</tspan></text><text x="232.5" y="180.0" font-size="17" fill="#233247" text-anchor="middle" font-weight="normal">theo vị trí</text><line x1="302.0" y1="170.0" x2="318.0" y2="170.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="320.0" y="70.0" width="135.0" height="200.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="3.5"/><text x="387.5" y="112.0" font-size="19" fill="#a85b23" text-anchor="middle" font-weight="bold">Map</text><text x="387.5" y="152.0" font-size="17" fill="#233247" text-anchor="middle" font-weight="normal">m tác vụ,</text><text x="387.5" y="180.0" font-size="17" fill="#233247" text-anchor="middle" font-weight="normal">một lần gọi</text><text x="387.5" y="208.0" font-size="17" fill="#233247" text-anchor="middle" font-weight="normal">mỗi cặp</text><line x1="457.0" y1="170.0" x2="473.0" y2="170.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="475.0" y="100.0" width="135.0" height="140.0" rx="10" fill="#ffffff" stroke="#2f3e7a" stroke-width="2"/><text x="542.5" y="132.0" font-size="19" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Dãy Z</text><text x="542.5" y="166.0" font-size="17" fill="#233247" text-anchor="middle" font-weight="normal">cặp trung gian</text><text x="542.5" y="194.0" font-size="17" fill="#233247" text-anchor="middle" font-weight="normal">(K₂ × V₂)*</text><line x1="612.0" y1="170.0" x2="628.0" y2="170.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="630.0" y="70.0" width="135.0" height="200.0" rx="10" fill="#f4f6f9" stroke="#5b6778" stroke-width="3" stroke-dasharray="9 6"/><text x="697.5" y="112.0" font-size="19" fill="#5b6778" text-anchor="middle" font-weight="bold">Phân phối h</text><text x="697.5" y="152.0" font-size="17" fill="#233247" text-anchor="middle" font-weight="normal">và nhóm</text><text x="697.5" y="180.0" font-size="17" fill="#233247" text-anchor="middle" font-weight="normal">theo khóa</text><line x1="767.0" y1="170.0" x2="783.0" y2="170.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="785.0" y="100.0" width="135.0" height="140.0" rx="10" fill="#ffffff" stroke="#2f3e7a" stroke-width="2"/><text x="852.5" y="132.0" font-size="19" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Nhóm (k, L<tspan baseline-shift="sub" font-size="75%">k</tspan>)</text><text x="852.5" y="166.0" font-size="17" fill="#233247" text-anchor="middle" font-weight="normal">mỗi khóa</text><text x="852.5" y="194.0" font-size="17" fill="#233247" text-anchor="middle" font-weight="normal">một nhóm</text><line x1="922.0" y1="170.0" x2="938.0" y2="170.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="940.0" y="70.0" width="135.0" height="200.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="3.5"/><text x="1007.5" y="112.0" font-size="19" fill="#a85b23" text-anchor="middle" font-weight="bold">Reduce</text><text x="1007.5" y="152.0" font-size="17" fill="#233247" text-anchor="middle" font-weight="normal">r tác vụ,</text><text x="1007.5" y="180.0" font-size="17" fill="#233247" text-anchor="middle" font-weight="normal">một lần gọi</text><text x="1007.5" y="208.0" font-size="17" fill="#233247" text-anchor="middle" font-weight="normal">mỗi khóa</text><line x1="1077.0" y1="170.0" x2="1093.0" y2="170.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="1095.0" y="100.0" width="135.0" height="140.0" rx="10" fill="#ffffff" stroke="#2f3e7a" stroke-width="2"/><text x="1162.5" y="132.0" font-size="19" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Đầu ra Y</text><text x="1162.5" y="166.0" font-size="17" fill="#233247" text-anchor="middle" font-weight="normal">dãy cặp</text><text x="1162.5" y="194.0" font-size="17" fill="#233247" text-anchor="middle" font-weight="normal">(K₃ × V₃)*</text><rect x="170.0" y="22.0" width="18.0" height="18.0" rx="2" fill="#fff4e9" stroke="#a85b23" stroke-width="3"/><text x="196.0" y="37.0" font-size="18" fill="#a85b23" text-anchor="start" font-weight="normal">Người lập trình viết (viền liền, đậm)</text><rect x="640.0" y="22.0" width="18.0" height="18.0" rx="2" fill="#f4f6f9" stroke="#5b6778" stroke-width="3" stroke-dasharray="5 4"/><text x="666.0" y="37.0" font-size="18" fill="#5b6778" text-anchor="start" font-weight="normal">Hệ thống thực hiện (viền nét đứt)</text><line x1="30.0" y1="300.0" x2="1210.0" y2="300.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><text x="620.0" y="334.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">Ví dụ: (chó, 1) do Map phát từ d₂ nằm trong Z; h(chó) chọn một tác vụ Reduce;</text><text x="620.0" y="364.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">nhóm của chó là L<tspan baseline-shift="sub" font-size="75%">chó</tspan> = [1, 1], gồm một giá trị từ d₁ và một từ d₂;</text><text x="620.0" y="394.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">Reduce(chó, [1, 1]) phát (chó, 2) vào Y.</text><text x="620.0" y="444.0" font-size="18" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">Mỗi khóa phân biệt của Z có đúng một nhóm và một lần gọi Reduce (Mệnh đề 02.11).</text></g></svg>
