<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Đếm từ trong Hadoop MapReduce</title><desc id="desc">Một công việc MapReduce đọc HDFS, tách lọc trong Map, nhóm khóa, cộng và ghi HDFS.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2f3e7a"/></marker></defs><rect x="5" y="80" width="220" height="94" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="115.0" y="114" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">HDFS</text><text x="115.0" y="149" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">Văn bản A/B</text><path d="M225,130 L240,130" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><rect x="245" y="80" width="220" height="129" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="355.0" y="114" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">Map</text><text x="355.0" y="149" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">Tách, lọc</text><text x="355.0" y="184" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">phát (w,1)</text><path d="M465,130 L480,130" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><rect x="485" y="80" width="220" height="129" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="595.0" y="114" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">Nhóm khóa</text><text x="595.0" y="149" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">Cùng từ</text><text x="595.0" y="184" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">về cùng nơi</text><path d="M705,130 L720,130" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><rect x="725" y="80" width="220" height="94" rx="10" fill="#edf4ff" stroke="#