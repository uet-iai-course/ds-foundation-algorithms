<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Cấu trúc của Bài 02</title><desc id="desc">Sơ đồ đọc từ trên xuống. Khối trên cùng là bài toán trung tâm của Mục 1: đếm từ trên kho web nằm ở nhiều máy, hơn 400 TB, một máy đọc với tốc độ 35 MB/s mất khoảng 132 ngày. Sáu mũi tên đi xuống sáu cột, mỗi cột ghi mục, nội dung và kết quả chính dưới một đường kẻ đứt. Mục 1: cụm máy và hệ tệp phân tán; Bổ đề 02.2, gộp không phụ thuộc thứ tự. Mục 2: Map, nhóm theo khóa, Reduce; Mệnh đề 02.11 và 02.15, công việc đúng và Combine giữ kết quả. Mục 3: ba thiết kế khóa và giá trị; y = Av, D = 3, μ = s*/κ*. Mục 4: chi phí song song hóa; W_P = n − 1, thời gian pha bằng giá trị lớn nhất, C = I + H, S_P = T₁/T_P. Cột đọc thêm, viền nét đứt: hệ thống thực thi và phục hồi; Mệnh đề 02.41 và 02.43, chạy lại không tính trùng. Mục 5: thực hành Hadoop; 5 cặp ra từ Map, 4 cặp sau Combine, 3 cặp ra từ Reduce.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
