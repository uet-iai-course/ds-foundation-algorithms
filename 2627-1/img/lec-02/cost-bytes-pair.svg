<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Ba yếu tố tính byte khi gửi từng cặp</title><desc id="desc">Một triệu ảnh, mỗi ảnh gửi đến 999999 khóa cặp, mỗi bản mang một triệu byte ảnh.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1565c0"/></marker></defs><g font-family="Arial, sans-serif"><rect x="15" y="55" width="330" height="155" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="180.0" y="106.5" font-size="27" fill="#1565c0" text-anchor="middle">Số ảnh</text><text x="180.0" y="141.5" font-size="27" fill="#1565c0" text-anchor="middle">1 000 000</text><text x="180.0" y="176.5" font-size="27" fill="#1565c0" text-anchor="middle">N</text><text x="377" y="148" font-size="45" fill="#233247" text-anchor="middle">×</text><rect x="410" y="55" width="370" height="155" rx="10" fill="#f6f9fc" stroke="#ef6c00" stroke-width="2"/><text x="595.0" y="106.5" font-size="27" fill="#ef6c00" text-anchor="middle">Nơi nhận mỗi ảnh</text><text x="595.0" y="141.5" font-size="27" fill="#ef6c00" text-anchor="middle">999 999</text><text x="595.0" y="176.5" font-size="27" fill="#ef6c00" text-anchor="middle">N − 1</text><text x="812" y="148" font-size="45" fill="#233247" text-anchor="middle">×</text><rect x="845" y="55" width="340" height="155" rx="10" fill="#f6f9fc" stroke="#2e7d32" stroke-width="2"/><text x="1015.0" y="106.5" font-size="27" fill="#2e7d32" text-anchor="middle">Byte mỗi ảnh</text><text x="1015.0" y="141.5" font-size="27" fill="#2e7d32" text-anchor="middle">1 000 000</text><text x="1015.0" y="176.5" font-size="27" fill="#2e7d32" text-anchor="middle">B</text><text x="600" y="295" font-size="29" fill="#233247" text-anchor="middle">Mỗi lần gửi một ảnh được tính B byte tải ảnh</text></g></svg>