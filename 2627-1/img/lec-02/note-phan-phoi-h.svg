<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" role="img" aria-labelledby="title desc">
<title id="title">Phân phối đầu ra Map bằng hàm h</title><desc id="desc">Quy tắc phân phối h(mèo) = 0, h(chim) = 0, h(chó) = 1. Bên trái là hai tác vụ Map. M₁ đọc d₁ = “mèo chó mèo”, tính h cho từng cặp và ghi lên đĩa cục bộ hai tệp: tệp cho R₀ gồm (mèo, 1), (mèo, 1); tệp cho R₁ gồm (chó, 1). M₂ đọc d₂ = “chó chim”, ghi tệp cho R₀ gồm (chim, 1) và tệp cho R₁ gồm (chó, 1). Các mũi tên dẫn tệp tới tác vụ Reduce đích: R₀ nhận (mèo, 1), (mèo, 1), (chim, 1); R₁ nhận (chó, 1), (chó, 1). Hai khung đĩa cục bộ viền nét đứt. Dòng cuối: mọi tác vụ Map dùng cùng h, nên hai cặp (chó, 1) cùng tới R₁.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1180" height="470" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="590.0" y="34.0" font-size="21" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Quy tắc phân phối: h(mèo) = 0, h(chim) = 0, h(chó) = 1</text><rect x="20.0" y="60.0" width="330.0" height="170.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="185.0" y="92.0" font-size="18" fill="#2f3e7a" text-anchor="middle" font-weight="bold">M₁ đọc d₁ = “mèo chó mèo”</text><text x="185.0" y="130.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">(mèo, 1) → h = 0</text><text x="185.0" y="162.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">(chó, 1) → h = 1</text><text x="185.0" y="194.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">(mèo, 1) → h = 0</text><line x1="352.0" y1="145.0" x2="418.0" y2="145.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="420.0" y="80.0" width="360.0" height="130.0" rx="10" fill="#f4f6f9" stroke="#5b6778" stroke-width="2.5" stroke-dasharray="8 6"/><text x="600.0" y="108.0" font-size="17" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">Đĩa cục bộ của máy chạy Map</text><text x="600.0" y="146.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">Tệp cho R₀: (mèo, 1), (mèo, 1)</text><text x="600.0" y="180.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">Tệp cho R₁: (chó, 1)</text><rect x="20.0" y="250.0" width="330.0" height="170.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="185.0" y="282.0" font-size="18" fill="#2f3e7a" text-anchor="middle" font-weight="bold">M₂ đọc d₂ = “chó chim”</text><text x="185.0" y="320.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">(chó, 1) → h = 1</text><text x="185.0" y="352.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">(chim, 1) → h = 0</text><line x1="352.0" y1="335.0" x2="418.0" y2="335.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="420.0" y="270.0" width="360.0" height="130.0" rx="10" fill="#f4f6f9" stroke="#5b6778" stroke-width="2.5" stroke-dasharray="8 6"/><text x="600.0" y="298.0" font-size="17" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">Đĩa cục bộ của máy chạy Map</text><text x="600.0" y="336.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">Tệp cho R₀: (chim, 1)</text><text x="600.0" y="370.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">Tệp cho R₁: (chó, 1)</text><rect x="860.0" y="80.0" width="300.0" height="120.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="1010.0" y="115.0" font-size="20" fill="#a85b23" text-anchor="middle" font-weight="bold">R₀ nhận</text><text x="1010.0" y="150.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">(mèo, 1), (mèo, 1),</text><text x="1010.0" y="178.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">(chim, 1)</text><rect x="860.0" y="270.0" width="300.0" height="100.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="1010.0" y="305.0" font-size="20" fill="#a85b23" text-anchor="middle" font-weight="bold">R₁ nhận</text><text x="1010.0" y="340.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">(chó, 1), (chó, 1)</text><line x1="782.0" y1="140.0" x2="858.0" y2="135.0" stroke="#5b6778" stroke-width="2" marker-end="url(#arrow)"/><line x1="782.0" y1="175.0" x2="858.0" y2="300.0" stroke="#5b6778" stroke-width="2" marker-end="url(#arrow)"/><line x1="782.0" y1="330.0" x2="858.0" y2="170.0" stroke="#5b6778" stroke-width="2" marker-end="url(#arrow)"/><line x1="782.0" y1="365.0" x2="858.0" y2="330.0" stroke="#5b6778" stroke-width="2" marker-end="url(#arrow)"/><text x="590.0" y="458.0" font-size="19" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">Mọi tác vụ Map dùng cùng h, nên hai cặp (chó, 1) từ M₁ và M₂ cùng tới R₁.</text></g></svg>
