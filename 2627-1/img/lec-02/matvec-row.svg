<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Các bản ghi (i, j, a_ij) của hàng i nằm ở hai khối DFS: khối 1 chứa cột 1 và 2, khối 2 chứa cột 3 đến q. Hai mũi tên dẫn tới y_i bằng tổng theo j của a_ij nhân v_j, cần đủ q tích. Véc-tơ v nằm trong bộ nhớ của mỗi máy chạy Map." font-family="Arial, Helvetica, sans-serif" viewBox="0 0 1120 252" width="1120" height="252"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs><text x="20" y="32" text-anchor="start" font-size="25" fill="#2f3e7a" font-weight="normal">Các bản ghi (i, j, a<tspan baseline-shift="sub" font-size="75%">ij</tspan>) của hàng i nằm ở hai khối DFS</text><rect x="20" y="52" width="330" height="120" rx="8" fill="#f8fafc" stroke="#2f3e7a" stroke-width="2" stroke-dasharray="7 5"/><text x="185" y="84" text-anchor="middle" font-size="24" fill="#526070" font-weight="normal">Khối 1</text><text x="185" y="124" text-anchor="middle" font-size="25" fill="#2f3e7a" font-weight="normal">(i, 1, a<tspan baseline-shift="sub" font-size="75%">i1</tspan>), (i, 2, a<tspan baseline-shift="sub" font-size="75%">i2</tspan>)</text><rect x="370" y="52" width="330" height="120" rx="8" fill="#f8fafc" stroke="#2f3e7a" stroke-width="2" stroke-dasharray="7 5"/><text x="535" y="84" text-anchor="middle" font-size="24" fill="#526070" font-weight="normal">Khối 2</text><text x="535" y="124" text-anchor="middle" font-size="25" fill="#2f3e7a" font-weight="normal">(i, 3, a<tspan baseline-shift="sub" font-size="75%">i3</tspan>), …, (i, q, a<tspan baseline-shift="sub" font-size="75%">iq</tspan>)</text><path d="M705,112 L792,112" stroke="#2f3e7a" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M185,176 L185,196 L950,196 L950,180" stroke="#2f3e7a" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="800" y="52" width="300" height="120" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="950" y="96" text-anchor="middle" font-size="28" fill="#2f3e7a" font-weight="bold">y<tspan baseline-shift="sub" font-size="75%">i</tspan> = Σ<tspan baseline-shift="sub" font-size="75%">j</tspan> a<tspan baseline-shift="sub" font-size="75%">ij</tspan> v<tspan baseline-shift="sub" font-size="75%">j</tspan></text><text x="950" y="140" text-anchor="middle" font-size="24" fill="#a85b23" font-weight="normal">cần đủ q tích</text><text x="560" y="236" text-anchor="middle" font-size="24" fill="#526070" font-weight="normal">v = (v<tspan baseline-shift="sub" font-size="75%">1</tspan>, …, v<tspan baseline-shift="sub" font-size="75%">q</tspan>) nằm trong bộ nhớ của mỗi máy chạy Map</text></svg>
