<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Máy A hỏng làm đầu ra cục bộ của M1 đã hoàn tất không truy cập được. Máy B đọc bản sao B1, chạy lại M1, thông báo địa chỉ mới cho Reduce chưa lấy phần đó." font-family="Arial, sans-serif" viewBox="0 0 1120 300"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f3e7a"/></marker></defs><rect x="25" y="45" width="315" height="140" rx="7" fill="#ffebee" stroke="#2f3e7a" stroke-width="2"/><text x="182.5" y="90.0" text-anchor="middle" font-size="24" fill="#2f3e7a">Máy A hỏng</text><text x="182.5" y="124.0" text-anchor="middle" font-size="24" fill="#2f3e7a">M₁ đã xong</text><text x="182.5" y="158.0" text-anchor="middle" font-size="24" fill="#2f3e7a">Đầu ra Map cục bộ</text><path d="M45,77 l272,85 M317,77 l-272,85" stroke="#b23b3b" stroke-width="5"/><rect x="405" y="45" width="310" height="140" rx="7" fill="#e8f5e9" stroke="#2f3e7a" stroke-width="2"/><text x="560.0" y="90.0" text-anchor="middle" font-size="24" fill="#2f3e7a">Máy B còn hoạt động</text><text x="560.0" y="124.0" text-anchor="middle" font-size="24" fill="#2f3e7a">Đọc bản sao B₁</text><text x="560.0" y="158.0" text-anchor="middle" font-size="24" fill="#2f3e7a">Chạy lại M₁</text><path d="M345,115 L397,115" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="805" y="45" width="290" height="140" rx="7" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="950.0" y="90.0" text-anchor="middle" font-size="24" fill="#2f3e7a">Reduce đang đợi</text><text x="950.0" y="124.0" text-anchor="middle" font-size="24" fill="#2f3e7a">Lấy phần trung gian</text><text x="950.0" y="158.0" text-anchor="middle" font-size="24" fill="#2f3e7a">từ địa chỉ mới</text><path d="M720,115 L797,115" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="560" y="250" text-anchor="middle" font-size="26" fill="#2f3e7a">Đầu vào còn bản sao; đầu ra trung gian đã mất phải được tính lại.</text></svg>