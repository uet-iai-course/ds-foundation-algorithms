<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Khôi phục phần sạch của A</title><desc id="desc">Nguồn A còn trên HDFS; đọc lại, tách và lọc để tái tạo phần A đã mất; phần B còn lưu được giữ.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2f3e7a"/></marker></defs><rect x="10" y="40" width="230" height="94" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="125.0" y="74" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">HDFS còn A</text><text x="125.0" y="109" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">Đọc lại A</text><rect x="325" y="40" width="220" height="94" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="435.0" y="74" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">Tách từ</text><text x="435.0" y="109" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">5 từ</text><rect x="630" y="40" width="220" height="94" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="740.0" y="74" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">Bỏ “và”</text><text x="740.0" y="109" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">4 từ</text><rect x="935" y="40" width="255" height="94" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="1062.5" y="74" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">Tái tạo phần A</text><text x="1062.5" y="109" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">Dữ liệu sạch</text><path d="M240,85 L315,85" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><path d="M545,85 L620,85" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><path d="M850,85 L925,85" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><rect x="325" y="220" width="525" height="59" rx="10" fill="#e8f5e9" stroke="#2f3e7a" stroke-width="2"/><text x="587.5" y="254" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">Phần B còn lưu: giữ nguyên</text></svg>