<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Đặt tên từ hình bốn ảnh</title><desc id="desc">Mỗi ảnh có ba bản gửi trung gian, rho bằng ba; mỗi khóa nhận hai ảnh, q bằng hai.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1565c0"/></marker></defs><g font-family="Arial, sans-serif"><rect x="30" y="115" width="180" height="90" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="120.0" y="169.0" font-size="27" fill="#1565c0" text-anchor="middle">P₁</text><path d="M210,160 L570,48" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="10" width="250" height="80" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="705.0" y="41.5" font-size="27" fill="#1565c0" text-anchor="middle">Khóa {1, 2}</text><text x="705.0" y="76.5" font-size="27" fill="#1565c0" text-anchor="middle">P₁ và P2</text><path d="M210,160 L570,153" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="115" width="250" height="80" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="705.0" y="146.5" font-size="27" fill="#1565c0" text-anchor="middle">Khóa {1, 3}</text><text x="705.0" y="181.5" font-size="27" fill="#1565c0" text-anchor="middle">P₁ và P3</text><path d="M210,160 L570,258" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="220" width="250" height="80" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="705.0" y="251.5" font-size="27" fill="#1565c0" text-anchor="middle">Khóa {1, 4}</text><text x="705.0" y="286.5" font-size="27" fill="#1565c0" text-anchor="middle">P₁ và P4</text><text x="345" y="325" font-size="29" fill="#ef6c00" text-anchor="middle">ρ = 3 nơi nhận / ảnh</text><text x="1000" y="130" font-size="30" fill="#2e7d32" text-anchor="middle">q = 2 ảnh</text><text x="1000" y="175" font-size="27" fill="#2e7d32" text-anchor="middle">ở mỗi khóa</text></g></svg>