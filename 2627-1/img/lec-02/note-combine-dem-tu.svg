<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" role="img" aria-labelledby="title desc">
<title id="title">Combine trong đếm từ trên hai văn bản</title><desc id="desc">Hai hàng là hai tác vụ Map. Tác vụ Map 1 đọc d₁ = “mèo chó mèo”, phát (mèo, 1), (chó, 1), (mèo, 1); Combine thay hai cặp (mèo, 1) bằng (mèo, 2), nên gửi (mèo, 2), (chó, 1). Tác vụ Map 2 đọc d₂ = “chó chim”, phát (chó, 1), (chim, 1) và Combine giữ nguyên hai cặp đó. Bên phải, sau nhóm theo khóa: mèo có danh sách [2], Reduce phát (mèo, 2); chó có [1, 1], gồm một cặp từ mỗi tác vụ Map, Reduce phát (chó, 2); chim có [1], Reduce phát (chim, 1). Dòng cuối: trước Combine 5 cặp, sau Combine 4 cặp.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1180" height="470" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="20.0" y="52.0" font-size="21" fill="#2f3e7a" text-anchor="start" font-weight="bold">Tác vụ Map 1: d₁ = “mèo chó mèo”</text><rect x="20.0" y="70.0" width="300.0" height="150.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="170.0" y="100.0" font-size="18" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">Map phát</text><text x="170.0" y="134.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">(mèo, 1)</text><text x="170.0" y="164.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">(chó, 1)</text><text x="170.0" y="194.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">(mèo, 1)</text><line x1="322.0" y1="145.0" x2="398.0" y2="145.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><text x="360.0" y="130.0" font-size="17" fill="#26704e" text-anchor="middle" font-weight="bold">Combine</text><rect x="400.0" y="70.0" width="260.0" height="150.0" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="530.0" y="100.0" font-size="18" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">Gửi qua mạng</text><text x="530.0" y="134.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="bold">(mèo, 2)</text><text x="530.0" y="164.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="bold">(chó, 1)</text><text x="20.0" y="262.0" font-size="21" fill="#2f3e7a" text-anchor="start" font-weight="bold">Tác vụ Map 2: d₂ = “chó chim”</text><rect x="20.0" y="280.0" width="300.0" height="150.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="170.0" y="310.0" font-size="18" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">Map phát</text><text x="170.0" y="344.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">(chó, 1)</text><text x="170.0" y="374.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">(chim, 1)</text><line x1="322.0" y1="355.0" x2="398.0" y2="355.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><text x="360.0" y="340.0" font-size="17" fill="#26704e" text-anchor="middle" font-weight="bold">Combine</text><rect x="400.0" y="280.0" width="260.0" height="150.0" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="530.0" y="310.0" font-size="18" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">Gửi qua mạng</text><text x="530.0" y="344.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="bold">(chó, 1)</text><text x="530.0" y="374.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="bold">(chim, 1)</text><text x="950.0" y="50.0" font-size="21" fill="#a85b23" text-anchor="middle" font-weight="bold">Nhóm theo khóa và Reduce</text><rect x="760.0" y="95.0" width="200.0" height="70.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="860.0" y="139.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">mèo: [2]</text><line x1="962.0" y1="130.0" x2="1018.0" y2="130.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><text x="1095.0" y="139.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="bold">(mèo, 2)</text><rect x="760.0" y="225.0" width="200.0" height="70.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="860.0" y="269.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">chó: [1, 1]</text><line x1="962.0" y1="260.0" x2="1018.0" y2="260.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><text x="1095.0" y="269.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="bold">(chó, 2)</text><rect x="760.0" y="355.0" width="200.0" height="70.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="860.0" y="399.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">chim: [1]</text><line x1="962.0" y1="390.0" x2="1018.0" y2="390.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><text x="1095.0" y="399.0" font-size="21" fill="#233247" text-anchor="middle" font-weight="bold">(chim, 1)</text><line x1="662.0" y1="135.0" x2="758.0" y2="130.0" stroke="#5b6778" stroke-width="2" marker-end="url(#arrow)"/><line x1="662.0" y1="165.0" x2="758.0" y2="255.0" stroke="#5b6778" stroke-width="2" marker-end="url(#arrow)"/><line x1="662.0" y1="345.0" x2="758.0" y2="265.0" stroke="#5b6778" stroke-width="2" marker-end="url(#arrow)"/><line x1="662.0" y1="375.0" x2="758.0" y2="390.0" stroke="#5b6778" stroke-width="2" marker-end="url(#arrow)"/><text x="590.0" y="455.0" font-size="19" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">Trước Combine 5 cặp, sau Combine 4 cặp; hai cặp (chó, 1) từ hai tác vụ Map gặp nhau ở Reduce.</text></g></svg>
