<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-label="Bộ đếm lần chạy mẫu: năm cặp đầu ra Map, bốn cặp đầu ra Combine, ba cặp đầu ra Reduce. Đây là số bản ghi, không phải thời gian hay số byte."><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2f3e7a"/></marker></defs><rect x="15" y="60" width="300" height="170" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="165.0" y="122.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">Map tạo</text><text x="165.0" y="153.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">5 cặp</text><text x="165.0" y="184.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">Map output records</text><path d="M322 145L397 145" fill="none" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#a)"/><rect x="405" y="60" width="310" height="170" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="560.0" y="122.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">Sau Combine</text><text x="560.0" y="153.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">4 cặp</text><text x="560.0" y="184.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">Combine output records</text><path d="M722 145L797 145" fill="none" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#a)"/><rect x="805" y="60" width="300" height="170" rx="8" fill="#e8f5e9" stroke="#2f3e7a" stroke-width="2"/><text x="955.0" y="122.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#2f3e7a">Reduce trả</text><text x="955.0" y="153.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#2f3e7a">3 cặp</text><text x="955.0" y="184.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#2f3e7a">Reduce output records</text><text x="560" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">Số bản ghi từ lần chạy mẫu; không phải số byte hay thời gian.</text></svg>