<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" role="img" aria-label="Hadoop cấp dòng văn bản cho Map Python, nhận cặp từ và số đếm qua tab; phân phối và sắp xếp để Reduce đọc dòng cùng khóa liền nhau rồi cộng. Minh họa khóa mèo khi chưa dùng Combine."><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2f3e7a"/></marker></defs><rect x="10" y="55" width="315" height="155" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="167.5" y="109.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">Map bằng Python</text><text x="167.5" y="140.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">stdin: dòng văn bản</text><text x="167.5" y="171.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">stdout: từ TAB số đếm</text><path d="M332 130L395 130" fill="none" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#a)"/><rect x="405" y="55" width="310" height="155" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="560.0" y="109.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">Hadoop</text><text x="560.0" y="140.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">Phân phối, sắp xếp</text><text x="560.0" y="171.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">Cùng khóa liền nhau</text><path d="M722 130L785 130" fill="none" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#a)"/><rect x="795" y="55" width="315" height="155" rx="8" fill="#e8f5e9" stroke="#2f3e7a" stroke-width="2"/><text x="952.5" y="109.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#2f3e7a">Reduce bằng Python</text><text x="952.5" y="140.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#2f3e7a">stdin: dòng cùng khóa</text><text x="952.5" y="171.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#2f3e7a">stdout: từ TAB tổng</text><text x="560" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#2f3e7a">Ví dụ một khóa: mèo TAB 1, mèo TAB 1 → mèo TAB 2</text><text x="560" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#2f3e7a">Tạm chưa dùng Combine; các dòng được đọc lần lượt.</text></svg>