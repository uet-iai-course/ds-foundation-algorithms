<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Bài toán cặp ảnh</title><desc id="desc">Hai ảnh được hàm độ tương tự đã cho đánh giá; trả chỉ số cặp khác nhau nếu vượt ngưỡng. Không minh họa số đo thực nghiệm.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1565c0"/></marker></defs><g font-family="Arial, sans-serif"><rect x="40" y="25" width="220" height="105" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="150.0" y="86.5" font-size="27" fill="#1565c0" text-anchor="middle">Ảnh Pᵢ</text><rect x="40" y="195" width="220" height="105" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="150.0" y="256.5" font-size="27" fill="#1565c0" text-anchor="middle">Ảnh Pⱼ</text><path d="M260,80 L530,135" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><path d="M260,245 L530,185" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="540" y="100" width="300" height="120" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="690.0" y="151.5" font-size="27" fill="#1565c0" text-anchor="middle">Hàm s cho trước</text><text x="690.0" y="186.5" font-size="27" fill="#1565c0" text-anchor="middle">Độ tương tự</text><path d="M840,160 L955,160" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="965" y="100" width="225" height="120" rx="10" fill="#f6f9fc" stroke="#2e7d32" stroke-width="2"/><text x="1077.5" y="151.5" font-size="27" fill="#2e7d32" text-anchor="middle">Vượt τ</text><text x="1077.5" y="186.5" font-size="27" fill="#2e7d32" text-anchor="middle">Giữ (i, j)</text><text x="710" y="310" font-size="26" fill="#233247" text-anchor="middle">Chỉ xét i &lt; j: không tự so sánh, không lặp thứ tự</text></g></svg>