<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Quan sát hai nơi nhận dữ liệu</title><desc id="desc">Văn bản được Map đọc; năm cặp được Reduce nhận. Đặt bộ đếm tại hai đầu vào.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1565c0"/></marker></defs><g font-family="Arial, sans-serif"><rect x="20" y="55" width="230" height="95" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="135.0" y="94.0" font-size="27" fill="#1565c0" text-anchor="middle">D1: dữ liệu lớn</text><text x="135.0" y="129.0" font-size="27" fill="#1565c0" text-anchor="middle">D2: lớn lớn</text><path d="M250,105 L350,105" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="355" y="65" width="180" height="80" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="445.0" y="114.0" font-size="27" fill="#1565c0" text-anchor="middle">Map</text><path d="M535,105 L895,105" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="900" y="65" width="240" height="80" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="1020.0" y="114.0" font-size="27" fill="#1565c0" text-anchor="middle">Reduce</text><text x="705" y="80" font-size="27" fill="#233247" text-anchor="middle">5 cặp trung gian</text><rect x="265" y="210" width="275" height="80" rx="10" fill="#f6f9fc" stroke="#2e7d32" stroke-width="2"/><text x="402.5" y="241.5" font-size="27" fill="#2e7d32" text-anchor="middle">Bộ đếm đầu vào Map</text><text x="402.5" y="276.5" font-size="27" fill="#2e7d32" text-anchor="middle">Đọc hai tài liệu</text><rect x="835" y="210" width="330" height="80" rx="10" fill="#f6f9fc" stroke="#ef6c00" stroke-width="2"/><text x="1000.0" y="241.5" font-size="27" fill="#ef6c00" text-anchor="middle">Bộ đếm đầu vào Reduce</text><text x="1000.0" y="276.5" font-size="27" fill="#ef6c00" text-anchor="middle">Nhận năm cặp</text><path d="M315,210 L315,115" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><path d="M870,210 L870,115" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/></g></svg>