<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 375" role="img" aria-labelledby="title desc"><title id="title">Bộ điều phối giao tác vụ cho tiến trình trên các máy</title><desc id="desc">Sơ đồ phân công minh họa dựa Hình2.3. Master giao Map0,Map1 cho Worker ở máyA,B; giao Reduce0,Reduce1 cho Worker ở máyC,D. Các mũi tên là phân công, không phải dữ liệu; không khẳng định bốn tác vụ chạy đồng thời.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2f3e7a"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:25px;fill:#263238}.head{font-weight:bold;fill:#2f3e7a}.arrow{fill:none;stroke:#2f3e7a;stroke-width:2.5;marker-end:url(#arrow)}.fault{fill:#fff0ee;stroke:#b3392e;stroke-width:2}.box{fill:#edf4ff;stroke:#2f3e7a;stroke-width:2}.good{fill:#edf7ef;stroke:#387343;stroke-width:2}</style><rect x="280" y="20" width="540" height="100" rx="8" class="box"/><text x="310" y="58" class="head">Bộ điều phối (Master)</text><text x="310" y="95" class="">Chờ → đang chạy → hoàn thành</text><rect x="20" y="205" width="235" height="105" rx="8" class="box"/><text x="37" y="243" class="head">Máy A · Worker</text><text x="37" y="282" class="">Chạy Map 0</text><path d="M310 120 L137 193" class="arrow"/><rect x="295" y="205" width="235" height="105" rx="8" class="box"/><text x="312" y="243" class="head">Máy B · Worker</text><text x="312" y="282" class="">Chạy Map 1</text><path d="M412 120 L412 193" class="arrow"/><rect x="570" y="205" width="235" height="105" rx="8" class="box"/><text x="587" y="243" class="head">Máy C · Worker</text><text x="587" y="282" class="">Chạy Reduce 0</text><path d="M687 120 L687 193" class="arrow"/><rect x="845" y="205" width="235" height="105" rx="8" class="box"/><text x="862" y="243" class="head">Máy D · Worker</text><text x="862" y="282" class="">Chạy Reduce 1</text><path d="M790 120 L962 193" class="arrow"/><text x="20" y="350" class="">Worker báo hoàn thành; bộ điều phối cập nhật trạng thái rồi giao việc tiếp.</text></svg>