<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Đọc lặp dải vector</title><desc id="desc">Một dải dài L j phục vụ hai tác vụ Map xử lý hai phần ma trận; tổng hai lần đọc là hai L j.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1565c0"/></marker></defs><g font-family="Arial, sans-serif"><rect x="30" y="100" width="310" height="120" rx="10" fill="#f6f9fc" stroke="#7b1fa2" stroke-width="2"/><text x="185.0" y="151.5" font-size="27" fill="#7b1fa2" text-anchor="middle">Dải vector j</text><text x="185.0" y="186.5" font-size="27" fill="#7b1fa2" text-anchor="middle">Lⱼ phần tử</text><path d="M340,135 L690,65" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><path d="M340,185 L690,245" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="700" y="20" width="430" height="90" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="915.0" y="56.5" font-size="27" fill="#1565c0" text-anchor="middle">Map A: phần ma trận thứ nhất</text><text x="915.0" y="91.5" font-size="27" fill="#1565c0" text-anchor="middle">Đọc Lⱼ phần tử</text><rect x="700" y="200" width="430" height="90" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="915.0" y="236.5" font-size="27" fill="#1565c0" text-anchor="middle">Map B: phần ma trận thứ hai</text><text x="915.0" y="271.5" font-size="27" fill="#1565c0" text-anchor="middle">Đọc Lⱼ phần tử</text><text x="495" y="55" font-size="25" fill="#233247" text-anchor="middle">Lần đọc 1</text><text x="495" y="255" font-size="25" fill="#233247" text-anchor="middle">Lần đọc 2</text><text x="585" y="330" font-size="28" fill="#233247" text-anchor="middle">Hai tác vụ cùng đọc dải j → tính Lⱼ + Lⱼ = 2Lⱼ</text></g></svg>