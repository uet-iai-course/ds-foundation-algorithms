<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 400" role="img" aria-labelledby="title desc">
  <title id="title">Khôi phục các tác vụ sau lỗi công nhân</title>
  <desc id="desc">Khi máy chạy map hỏng, cả tác vụ đang chạy và đã xong trên máy đó được lập lịch lại vì tệp trung gian cục bộ mất; khi máy reduce hỏng, tác vụ đang chạy được lập lịch lại.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B15A2B"/></marker></defs>
  <g font-family="sans-serif"><rect x="400" y="18" width="250" height="68" rx="12" fill="#fff" stroke="#B15A2B" stroke-width="3"/><text x="525" y="61" text-anchor="middle" font-size="29" font-weight="700">Bộ điều phối</text>
  <rect x="35" y="125" width="430" height="235" rx="14" fill="#ffebee" stroke="#c62828" stroke-width="3"/><text x="250" y="165" text-anchor="middle" font-size="28" font-weight="700" fill="#c62828">Công nhân map hỏng</text><text x="70" y="214" font-size="25">• chạy lại tác vụ đang chạy</text><text x="70" y="253" font-size="25">• chạy lại tác vụ đã xong</text><text x="70" y="292" font-size="25">• báo vị trí tệp mới</text><text x="70" y="331" font-size="23" fill="#546e7a">Tệp trung gian nằm trên đĩa cục bộ.</text>
  <rect x="585" y="125" width="430" height="235" rx="14" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="800" y="165" text-anchor="middle" font-size="28" font-weight="700" fill="#2f3e7a">Công nhân reduce hỏng</text><text x="620" y="214" font-size="25">• chạy lại tác vụ đang chạy</text><text x="620" y="253" font-size="25">• đọc lại dữ liệu trung gian</text><text x="620" y="292" font-size="25">• ghi lại phần kết quả</text><text x="620" y="331" font-size="23" fill="#546e7a">Tác vụ đã xong không cần chạy lại.</text></g>
  <g fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#a)"><path d="M465 125L500 92"/><path d="M585 125L550 92"/></g>
</svg>
