<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc">
<title id="title">Luồng công việc năm hàm theo Hình 2.6</title>
<desc id="desc">Đầu vào đến f và h. Các cung f đến g, f đến i, h đến i, h đến j, g đến j, i đến j. Đầu ra của j đi tới hệ tệp phân tán hoặc ứng dụng. Mũi tên biểu diễn dữ liệu, không phải trình tự các máy.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2f3e7a"/></marker></defs>
<g fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)">
<path d="M70 70H200"/><path d="M70 260H200"/>
<path d="M290 70H470"/><path d="M290 85L470 250"/>
<path d="M290 260H470"/><path d="M290 240Q490 125 750 165"/>
<path d="M560 70L750 150"/><path d="M560 260L750 185"/>
<path d="M840 170H1020"/>
</g>
<g fill="#edf4ff" stroke="#2f3e7a" stroke-width="2">
<rect x="200" y="35" width="90" height="70" rx="8"/><rect x="200" y="225" width="90" height="70" rx="8"/>
<rect x="470" y="35" width="90" height="70" rx="8"/><rect x="470" y="225" width="90" height="70" rx="8"/>
<rect x="750" y="135" width="90" height="70" rx="8"/>
</g>
<g font-family="sans-serif" font-size="34" fill="#263238" text-anchor="middle">
<text x="245" y="82">f</text><text x="245" y="272">h</text><text x="515" y="82">g</text><text x="515" y="272">i</text><text x="795" y="182">j</text>
</g>
<g font-family="sans-serif" font-size="26" fill="#263238"><text x="30" y="35">Đầu vào</text><text x="870" y="135">Đầu ra</text><text x="295" y="337">i nhận từ f và h; j nhận từ g, h và i.</text></g>
</svg>
