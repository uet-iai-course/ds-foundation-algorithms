<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 390" role="img" aria-labelledby="title desc">
  <title id="title">Hệ tệp phân tán đặt bản sao khối dữ liệu gần các tác vụ</title>
  <desc id="desc">Một tệp được chia thành ba khối. Các khối có bản sao trên ba máy công nhân; bộ điều phối gán tác vụ đọc bản sao cục bộ.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B15A2B"/></marker></defs>
  <rect x="25" y="130" width="210" height="115" rx="14" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/>
  <text x="130" y="165" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#2f3e7a">Tệp đầu vào</text>
  <g font-family="sans-serif" font-size="25" text-anchor="middle"><rect x="48" y="188" width="50" height="36" fill="#F7EFE6" stroke="#B15A2B"/><text x="73" y="215">C0</text><rect x="105" y="188" width="50" height="36" fill="#e8f5e9" stroke="#2E7D32"/><text x="130" y="215">C1</text><rect x="162" y="188" width="50" height="36" fill="#f3e5f5" stroke="#7B5EA7"/><text x="187" y="215">C2</text></g>
  <rect x="405" y="18" width="230" height="72" rx="12" fill="#fff" stroke="#B15A2B" stroke-width="3"/><text x="520" y="62" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#37474f">Bộ điều phối</text>
  <g font-family="sans-serif"><g transform="translate(305 135)"><rect width="210" height="205" rx="13" fill="#fafafa" stroke="#607d8b" stroke-width="3"/><text x="105" y="38" text-anchor="middle" font-size="26" font-weight="700">Công nhân 1</text><text x="105" y="76" text-anchor="middle" font-size="24">bản sao C0, C2</text><rect x="35" y="105" width="140" height="55" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="105" y="141" text-anchor="middle" font-size="25">tác vụ C0</text></g><g transform="translate(545 135)"><rect width="210" height="205" rx="13" fill="#fafafa" stroke="#607d8b" stroke-width="3"/><text x="105" y="38" text-anchor="middle" font-size="26" font-weight="700">Công nhân 2</text><text x="105" y="76" text-anchor="middle" font-size="24">bản sao C1, C0</text><rect x="35" y="105" width="140" height="55" rx="9" fill="#e8f5e9" stroke="#2E7D32" stroke-width="2"/><text x="105" y="141" text-anchor="middle" font-size="25">tác vụ C1</text></g><g transform="translate(785 135)"><rect width="210" height="205" rx="13" fill="#fafafa" stroke="#607d8b" stroke-width="3"/><text x="105" y="38" text-anchor="middle" font-size="26" font-weight="700">Công nhân 3</text><text x="105" y="76" text-anchor="middle" font-size="24">bản sao C2, C1</text><rect x="35" y="105" width="140" height="55" rx="9" fill="#f3e5f5" stroke="#7B5EA7" stroke-width="2"/><text x="105" y="141" text-anchor="middle" font-size="25">tác vụ C2</text></g></g>
  <g fill="none" stroke="#B15A2B" stroke-width="3" marker-end="url(#a)"><path d="M235 188H295"/><path d="M520 90L410 127"/><path d="M520 90L650 127"/><path d="M520 90L890 127"/></g>
</svg>
