<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Không Combine: M1 đọc mèo chó mèo, lưu hai cặp mèo vào phần R0 và cặp chó vào phần R1; M2 đọc chó chim, lưu chim vào phần R0 và chó vào phần R1. Quy tắc f cho trước với hai Reduce." font-family="Arial, sans-serif" viewBox="0 0 1120 340"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f3e7a"/></marker></defs><text x="245" y="28" text-anchor="middle" font-size="25" fill="#2f3e7a">Tác vụ Map</text><text x="570" y="28" text-anchor="middle" font-size="25" fill="#2f3e7a">Phần cho R₀</text><text x="920" y="28" text-anchor="middle" font-size="25" fill="#2f3e7a">Phần cho R₁</text><rect x="30" y="60" width="325" height="85" rx="7" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="192.5" y="94.5" text-anchor="middle" font-size="25" fill="#2f3e7a">M₁</text><text x="192.5" y="128.5" text-anchor="middle" font-size="25" fill="#2f3e7a">mèo chó mèo</text><path d="M359,103 L400,103" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="410" y="60" width="320" height="85" rx="7" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="570.0" y="111.5" text-anchor="middle" font-size="24" fill="#2f3e7a">(mèo,1), (mèo,1)</text><rect x="760" y="60" width="320" height="85" rx="7" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="920.0" y="111.5" text-anchor="middle" font-size="24" fill="#2f3e7a">(chó,1)</text><rect x="30" y="185" width="325" height="85" rx="7" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="192.5" y="219.5" text-anchor="middle" font-size="25" fill="#2f3e7a">M₂</text><text x="192.5" y="253.5" text-anchor="middle" font-size="25" fill="#2f3e7a">chó chim</text><path d="M359,228 L400,228" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="410" y="185" width="320" height="85" rx="7" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="570.0" y="236.5" text-anchor="middle" font-size="24" fill="#2f3e7a">(chim,1)</text><rect x="760" y="185" width="320" height="85" rx="7" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="920.0" y="236.5" text-anchor="middle" font-size="24" fill="#2f3e7a">(chó,1)</text><text x="560" y="312" text-anchor="middle" font-size="25" fill="#2f3e7a">f(mèo) = 0; f(chim) = 0; f(chó) = 1 — quy tắc minh họa</text></svg>