<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" role="img" aria-labelledby="title desc"><title id="title">Mọi Map cùng phân chia đầu ra theo một hàm khóa</title><desc id="desc">Minh họa h(dữ)=h(liệu)=0,h(lớn)=1. Map 0 trên A phát hai tệp, Map 1 trên B có tệp R0 rỗng. R0 thu dữ và liệu; R1 thu ba số1 của lớn từ cả hai Map.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2f3e7a"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:25px;fill:#263238}.head{font-weight:bold;fill:#2f3e7a}.arrow{fill:none;stroke:#2f3e7a;stroke-width:2.5;marker-end:url(#arrow)}.fault{fill:#fff0ee;stroke:#b3392e;stroke-width:2}.box{fill:#edf4ff;stroke:#2f3e7a;stroke-width:2}.good{fill:#edf7ef;stroke:#387343;stroke-width:2}</style><text x="20" y="30" class="head">Tệp trung gian trên máy chạy Map</text><text x="750" y="30" class="head">Đầu vào tác vụ Reduce</text><rect x="20" y="65" width="445" height="120" rx="8" class="box"/><text x="38" y="95" class="head">Map 0 · đĩa cục bộ máy A</text><text x="38" y="132" class="">Gửi R0: (dữ,1), (liệu,1)</text><text x="38" y="167" class="">Gửi R1: (lớn,1)</text><rect x="20" y="225" width="445" height="120" rx="8" class="box"/><text x="38" y="255" class="head">Map 1 · đĩa cục bộ máy B</text><text x="38" y="292" class="">Gửi R0: rỗng</text><text x="38" y="327" class="">Gửi R1: (lớn,1), (lớn,1)</text><rect x="750" y="65" width="325" height="120" rx="8" class="good"/><text x="770" y="97" class="head">R0: h(k) = 0</text><text x="770" y="135" class="">dữ → [1]</text><text x="770" y="168" class="">liệu → [1]</text><rect x="750" y="225" width="325" height="120" rx="8" class="good"/><text x="770" y="257" class="head">R1: h(k) = 1</text><text x="770" y="300" class="">lớn → [1, 1, 1]</text><path d="M465 130 L738 130" class="arrow"/><path d="M465 165 C600 165 615 275 738 275" class="arrow"/><path d="M465 325 L620 325 L738 310" class="arrow"/></svg>