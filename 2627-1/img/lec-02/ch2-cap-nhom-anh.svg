<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" role="img" aria-labelledby="t d">
  <title id="t">Cặp chéo u–v và cặp nội bộ nhóm u trong reducer {u,v}</title>
  <desc id="d">Reducer {u,v} với v là nhóm kế tiếp u. Panel trái: hai ảnh đại diện nhóm u nối chéo tới hai ảnh đại diện nhóm v bằng bốn đường vô hướng liền. Panel phải: hai ảnh trong nhóm u nối bằng nét đứt, ghi chú chỉ giao ở đây.</desc>
  <rect x="0" y="0" width="1080" height="300" fill="#edf4ff"/>
  <!-- Panel trái -->
  <rect x="10" y="10" width="600" height="280" rx="10" fill="#ffffff" stroke="#2f3e7a" stroke-width="2"/>
  <text x="30" y="42" font-size="24" fill="#2f3e7a" font-family="sans-serif">Reducer {u, v}: cặp chéo</text>
  <text x="30" y="72" font-size="24" fill="#B15A2B" font-family="sans-serif">Trích hai ảnh mỗi nhóm</text>
  <!-- Ảnh nhóm u -->
  <rect x="60" y="110" width="70" height="70" rx="6" fill="#fff0df" stroke="#2f3e7a" stroke-width="2"/>
  <text x="95" y="152" font-size="24" fill="#2f3e7a" text-anchor="middle" font-family="sans-serif">u₁</text>
  <rect x="60" y="200" width="70" height="70" rx="6" fill="#fff0df" stroke="#2f3e7a" stroke-width="2"/>
  <text x="95" y="242" font-size="24" fill="#2f3e7a" text-anchor="middle" font-family="sans-serif">u₂</text>
  <!-- Ảnh nhóm v -->
  <rect x="490" y="110" width="70" height="70" rx="6" fill="#fff0df" stroke="#B15A2B" stroke-width="2"/>
  <text x="525" y="152" font-size="24" fill="#B15A2B" text-anchor="middle" font-family="sans-serif">v₁</text>
  <rect x="490" y="200" width="70" height="70" rx="6" fill="#fff0df" stroke="#B15A2B" stroke-width="2"/>
  <text x="525" y="242" font-size="24" fill="#B15A2B" text-anchor="middle" font-family="sans-serif">v₂</text>
  <!-- 4 cặp chéo, đường vô hướng liền -->
  <line x1="130" y1="145" x2="490" y2="145" stroke="#2f3e7a" stroke-width="2"/>
  <line x1="130" y1="145" x2="490" y2="235" stroke="#2f3e7a" stroke-width="2"/>
  <line x1="130" y1="235" x2="490" y2="145" stroke="#2f3e7a" stroke-width="2"/>
  <line x1="130" y1="235" x2="490" y2="235" stroke="#2f3e7a" stroke-width="2"/>
  <text x="310" y="100" font-size="24" fill="#2f3e7a" text-anchor="middle" font-family="sans-serif">v là nhóm kế tiếp u</text>
  <!-- Panel phải -->
  <rect x="630" y="10" width="440" height="280" rx="10" fill="#ffffff" stroke="#2f3e7a" stroke-width="2"/>
  <text x="650" y="42" font-size="24" fill="#2f3e7a" font-family="sans-serif">Cặp nội bộ nhóm u</text>
  <rect x="700" y="90" width="70" height="60" rx="6" fill="#fff0df" stroke="#2f3e7a" stroke-width="2"/>
  <text x="735" y="132" font-size="24" fill="#2f3e7a" text-anchor="middle" font-family="sans-serif">u₁</text>
  <rect x="700" y="180" width="70" height="60" rx="6" fill="#fff0df" stroke="#2f3e7a" stroke-width="2"/>
  <text x="735" y="222" font-size="24" fill="#2f3e7a" text-anchor="middle" font-family="sans-serif">u₂</text>
  <line x1="735" y1="150" x2="735" y2="180" stroke="#B15A2B" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="800" y="140" font-size="24" fill="#B15A2B" font-family="sans-serif">chỉ giao ở đây</text>
  <text x="650" y="275" font-size="24" fill="#2f3e7a" font-family="sans-serif">Nét đứt: cặp nội bộ</text>
</svg>
