<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hai rack: A và D giữ bản sao cùng khối B1. Map chạy ở A hoặc D đọc cục bộ; B cùng rack A đọc qua mạng trong rack; C đọc bản ở A phải qua đường nối hai rack. Mỗi Map chỉ xử lý một bản của dữ liệu logic." font-family="Arial, sans-serif" viewBox="0 0 1120 295"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f3e7a"/></marker></defs><rect x="15" y="40" width="520" height="235" rx="7" fill="#f8fafc" stroke="#2f3e7a" stroke-width="2"/><rect x="585" y="40" width="520" height="235" rx="7" fill="#f8fafc" stroke="#2f3e7a" stroke-width="2"/><text x="275" y="29" text-anchor="middle" font-size="25" fill="#2f3e7a">Tủ rack 1</text><text x="845" y="29" text-anchor="middle" font-size="25" fill="#2f3e7a">Tủ rack 2</text><rect x="35" y="72" width="220" height="80" rx="7" fill="#e8f5e9" stroke="#2f3e7a" stroke-width="2"/><text x="145.0" y="104.0" text-anchor="middle" font-size="23" fill="#2f3e7a">A: bản sao B₁</text><text x="145.0" y="138.0" text-anchor="middle" font-size="23" fill="#2f3e7a">Map đọc tại máy</text><rect x="300" y="72" width="215" height="80" rx="7" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="407.5" y="121.0" text-anchor="middle" font-size="23" fill="#2f3e7a">B: không có B₁</text><rect x="605" y="72" width="220" height="80" rx="7" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="715.0" y="121.0" text-anchor="middle" font-size="23" fill="#2f3e7a">C: không có B₁</text><rect x="860" y="72" width="220" height="80" rx="7" fill="#e8f5e9" stroke="#2f3e7a" stroke-width="2"/><text x="970.0" y="121.0" text-anchor="middle" font-size="23" fill="#2f3e7a">D: bản sao B₁</text><path d="M260,118 L294,118" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="275" y="190" text-anchor="middle" font-size="23" fill="#2f3e7a">Nếu Map chạy ở B: đọc từ A.</text><path d="M150,160 L150,220" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M150,220 L715,220" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="432.5" y="254.0" text-anchor="middle" font-size="22" fill="#2f3e7a">C đọc từ A: đi qua đường nối hai rack</text><path d="M715,220 L715,160" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="840" y="190" text-anchor="middle" font-size="23" fill="#2f3e7a">Map ở D cũng đọc tại máy.</text></svg>