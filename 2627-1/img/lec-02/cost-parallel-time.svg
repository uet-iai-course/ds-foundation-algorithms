<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Cùng năm đơn vị công việc: thời gian từ năm c còn ba c</title><desc id="desc">Một máy chạy R0 hai c rồi R1 ba c. Hai máy chạy hai tác vụ đồng thời, hoàn tất sau ba c. Tổng công việc không đổi.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1565c0"/></marker></defs><g font-family="Arial, sans-serif"><text x="175" y="45" font-size="28" fill="#233247" text-anchor="middle">Một máy: nối tiếp</text><text x="175" y="175" font-size="28" fill="#233247" text-anchor="middle">Hai máy: đồng thời</text><rect x="360" y="10" width="300" height="65" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="510.0" y="51.5" font-size="27" fill="#1565c0" text-anchor="middle">R0: 2c</text><rect x="660" y="10" width="450" height="65" rx="10" fill="#f6f9fc" stroke="#ef6c00" stroke-width="2"/><text x="885.0" y="51.5" font-size="27" fill="#ef6c00" text-anchor="middle">R1: 3c</text><text x="175" y="225" font-size="25" fill="#233247" text-anchor="middle">Máy A</text><text x="175" y="305" font-size="25" fill="#233247" text-anchor="middle">Máy B</text><rect x="360" y="185" width="300" height="65" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="510.0" y="226.5" font-size="27" fill="#1565c0" text-anchor="middle">R0: 2c</text><rect x="360" y="265" width="450" height="65" rx="10" fill="#f6f9fc" stroke="#ef6c00" stroke-width="2"/><text x="585.0" y="306.5" font-size="27" fill="#ef6c00" text-anchor="middle">R1: 3c</text><text x="360" y="135" font-size="24" fill="#233247" text-anchor="middle">0c</text><text x="510" y="135" font-size="24" fill="#233247" text-anchor="middle">1c</text><text x="660" y="135" font-size="24" fill="#233247" text-anchor="middle">2c</text><text x="810" y="135" font-size="24" fill="#233247" text-anchor="middle">3c</text><text x="960" y="135" font-size=