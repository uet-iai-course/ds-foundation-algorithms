<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tác vụ từ chờ được giao cho máy, chuyển đang chạy rồi hoàn tất khi báo xong. Khi lỗi hoặc mất liên lạc, tác vụ chưa hoàn tất được đưa về hàng chờ để giao lại. Trường hợp mất đầu ra Map đã xong được xét riêng." font-family="Arial, sans-serif" viewBox="0 0 1120 310"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f3e7a"/></marker></defs><rect x="30" y="60" width="260" height="100" rx="7" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="160.0" y="119.0" text-anchor="middle" font-size="25" fill="#2f3e7a">Chờ</text><rect x="430" y="60" width="260" height="100" rx="7" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="560.0" y="102.0" text-anchor="middle" font-size="25" fill="#2f3e7a">Đang chạy</text><text x="560.0" y="136.0" text-anchor="middle" font-size="25" fill="#2f3e7a">ghi rõ máy nhận</text><rect x="830" y="60" width="260" height="100" rx="7" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="960.0" y="102.0" text-anchor="middle" font-size="25" fill="#2f3e7a">Hoàn tất</text><text x="960.0" y="136.0" text-anchor="middle" font-size="25" fill="#2f3e7a">ghi vị trí đầu ra</text><path d="M295,109 L422,109" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="358.5" y="99.0" text-anchor="middle" font-size="22" fill="#2f3e7a">giao việc</text><path d="M695,109 L823,109" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="759.0" y="99.0" text-anchor="middle" font-size="22" fill="#2f3e7a">báo xong</text><path d="M560,166 L560,250" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M560,250 L160,250" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="360.0" y="285.0" text-anchor="middle" font-size="22" fill="#2f3e7a">mất liên lạc / lỗi: xếp lại hàng chờ</text><path d="M160,250 L160,166" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/></svg>