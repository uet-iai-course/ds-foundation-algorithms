<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 350" role="img" aria-labelledby="title desc">
<title id="title">Dữ liệu chia khối và lưu bản sao trên nhiều máy</title>
<desc id="desc">Dữ liệu được chia thành khối A, B, C. Máy 1 lưu A và B; máy 2 lưu B và C; máy 3 lưu C và A. Mỗi khối có hai bản sao trên hai máy khác nhau trong hình minh họa.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#65748b"/></marker></defs>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#2f3e7a">
<text x="270" y="27" font-size="25">Dữ liệu được chia thành các khối</text><rect x="90" y="40" width="120" height="36" rx="4" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="150.0" y="66" font-size="23">Khối A</text><rect x="210" y="40" width="120" height="36" rx="4" fill="#fff3e0" stroke="#97500c" stroke-width="2"/><text x="270.0" y="66" font-size="23">Khối B</text><rect x="330" y="40" width="120" height="36" rx="4" fill="#e8f5e9" stroke="#25632a" stroke-width="2"/><text x="390.0" y="66" font-size="23">Khối C</text><path d="M270 80 V103 M90 103 H450 M90 103 V121 M270 103 V121 M450 103 V121" fill="none" stroke="#65748b" stroke-width="2"/><rect x="20" y="123" width="140" height="137" rx="10" fill="#fafbfc" stroke="#65748b" stroke-width="2"/><text x="90" y="152" font-size="25">Máy 1</text><rect x="33" y="165" width="114" height="36" rx="4" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="90.0" y="191" font-size="23">Khối A</text><rect x="33" y="212" width="114" height="36" rx="4" fill="#fff3e0" stroke="#97500c" stroke-width="2"/><text x="90.0" y="238" font-size="23">Khối B</text><rect x="200" y="123" width="140" height="137" rx="10" fill="#fafbfc" stroke="#65748b" stroke-width="2"/><text x="270" y="152" font-size="25">Máy 2</text><rect x="213" y="165" width="114" height="36" rx="4" fill="#fff3e0" stroke="#97500c" stroke-width="2"/><text x="270.0" y="191" font-size="23">Khối B</text><rect x="213" y="212" width="114" height="36" rx="4" fill="#e8f5e9" stroke="#25632a" stroke-width="2"/><text x="270.0" y="238" font-size="23">Khối C</text><rect x="380" y="123" width="140" height="137" rx="10" fill="#fafbfc" stroke="#65748b" stroke-width="2"/><text x="450" y="152" font-size="25">Máy 3</text><rect x="393" y="165" width="114" height="36" rx="4" fill="#e8f5e9" stroke="#25632a" stroke-width="2"/><text x="450.0" y="191" font-size="23">Khối C</text><rect x="393" y="212" width="114" height="36" rx="4" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="450.0" y="238" font-size="23">Khối A</text><path d="M90 260 V281 H450 V260 M270 260 V281" fill="none" stroke="#65748b" stroke-width="2"/><text x="270" y="311" font-size="23">Các máy phổ thông nối mạng</text><text x="270" y="343" font-size="24">Mỗi khối có bản sao ở máy khác</text></g></svg>
