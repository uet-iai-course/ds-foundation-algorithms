<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">Trạng thái tổng và số lượng cho trung bình</title><desc id="desc">Hai khung trái là hai tác vụ Map. Tác vụ Map 1 giữ [2, 4], gộp (2, 1) ⊕ (4, 1) = (6, 2) và Combine phát (g, (6, 2)); tác vụ Map 2 giữ [9] và phát (g, (9, 1)). Hai mũi tên dẫn tới Reduce: (6, 2) ⊕ (9, 1) = (15, 3), rồi μ = 15/3 = 5, ghi là đúng. Dưới đường kẻ đứt, một khung viền nét đứt màu đỏ ghi cách sai: chia sớm cho 3 và 9, trung bình của 3 và 9 là 6, khác 5.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1100" height="420" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="20.0" y="36.0" font-size="21" fill="#2f3e7a" text-anchor="start" font-weight="bold">Trạng thái (s, κ): tổng và số lượng</text><rect x="20.0" y="60.0" width="330.0" height="120.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="185.0" y="92.0" font-size="20" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Tác vụ Map 1: [2, 4]</text><text x="185.0" y="126.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">(2, 1) ⊕ (4, 1) = (6, 2)</text><text x="185.0" y="158.0" font-size="18" fill="#26704e" text-anchor="middle" font-weight="normal">Combine phát (g, (6, 2))</text><rect x="20.0" y="200.0" width="330.0" height="100.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="185.0" y="232.0" font-size="20" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Tác vụ Map 2: [9]</text><text x="185.0" y="268.0" font-size="18" fill="#26704e" text-anchor="middle" font-weight="normal">phát (g, (9, 1))</text><line x1="352.0" y1="120.0" x2="448.0" y2="175.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><line x1="352.0" y1="250.0" x2="448.0" y2="195.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="450.0" y="130.0" width="300.0" height="110.0" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="3"/><text x="600.0" y="165.0" font-size="20" fill="#26704e" text-anchor="middle" font-weight="bold">Reduce: (6, 2) ⊕ (9, 1)</text><text x="600.0" y="200.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="normal">= (15, 3)</text><line x1="752.0" y1="185.0" x2="818.0" y2="185.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="820.0" y="140.0" width="250.0" height="90.0" rx="10" fill="#ffffff" stroke="#26704e" stroke-width="3"/><text x="945.0" y="180.0" font-size="22" fill="#26704e" text-anchor="middle" font-weight="bold">μ = 15/3 = 5</text><text x="945.0" y="212.0" font-size="18" fill="#26704e" text-anchor="middle" font-weight="normal" font-style="italic">đúng</text><line x1="30.0" y1="320.0" x2="1070.0" y2="320.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><rect x="20.0" y="336.0" width="1050.0" height="66.0" rx="10" fill="#f4f6f9" stroke="#a3312b" stroke-width="2.5" stroke-dasharray="9 6"/><text x="545.0" y="376.0" font-size="20" fill="#a3312b" text-anchor="middle" font-weight="normal">Cách sai, nét đứt: chia sớm cho 3 = (2 + 4)/2 và 9; trung bình của 3 và 9 là 6 ≠ 5.</text></g></svg>
