<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Ba khoản tạo tổng chi phí</title><desc id="desc">Cộng bộ ma trận, các lần đọc dải vector và cặp tích đến Reduce. Đơn vị bản ghi chuẩn hóa.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1565c0"/></marker></defs><g font-family="Arial, sans-serif"><rect x="20" y="65" width="315" height="140" rx="10" fill="#f6f9fc" stroke="#2e7d32" stroke-width="2"/><text x="177.5" y="126.5" font-size="27" fill="#2e7d32" text-anchor="middle">Ma trận vào Map</text><text x="177.5" y="161.5" font-size="27" fill="#2e7d32" text-anchor="middle">z đơn vị</text><text x="365" y="150" font-size="44" fill="#233247" text-anchor="middle">+</text><rect x="405" y="65" width="360" height="140" rx="10" fill="#f6f9fc" stroke="#7b1fa2" stroke-width="2"/><text x="585.0" y="126.5" font-size="27" fill="#7b1fa2" text-anchor="middle">Vector vào Map</text><text x="585.0" y="161.5" font-size="27" fill="#7b1fa2" text-anchor="middle">Cộng aⱼ × Lⱼ qua các dải</text><text x="800" y="150" font-size="44" fill="#233247" text-anchor="middle">+</text><rect x="840" y="65" width="340" height="140" rx="10" fill="#f6f9fc" stroke="#ef6c00" stroke-width="2"/><text x="1010.0" y="126.5" font-size="27" fill="#ef6c00" text-anchor="middle">Tích vào Reduce</text><text x="1010.0" y="161.5" font-size="27" fill="#ef6c00" text-anchor="middle">z đơn vị</text><text x="600" y="285" font-size="30" fill="#233247" text-anchor="middle">Ba khoản cùng đơn vị: bản ghi chuẩn hóa</text></g></svg>