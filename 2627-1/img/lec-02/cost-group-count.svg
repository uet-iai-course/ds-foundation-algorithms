<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Đếm theo cặp nhóm</title><desc id="desc">Mỗi ảnh nhóm u được gửi tới g trừ một khóa cặp nhóm. Mỗi khóa nhận hai nhóm, mỗi nhóm N trên g ảnh. Ba nhánh là phần trích, không phải chỉ ba đích.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1565c0"/></marker></defs><g font-family="Arial, sans-serif"><rect x="15" y="105" width="245" height="100" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="137.5" y="146.5" font-size="27" fill="#1565c0" text-anchor="middle">Ảnh thuộc nhóm u</text><text x="137.5" y="181.5" font-size="27" fill="#1565c0" text-anchor="middle">N / g ảnh mỗi nhóm</text><path d="M260,155 L540,48" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="550" y="5" width="335" height="88" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="717.5" y="40.5" font-size="27" fill="#1565c0" text-anchor="middle">{u, v₁}</text><text x="717.5" y="75.5" font-size="27" fill="#1565c0" text-anchor="middle">Hai nhóm: 2 × N/g</text><path d="M260,155 L540,153" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="550" y="110" width="335" height="88" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="717.5" y="145.5" font-size="27" fill="#1565c0" text-anchor="middle">{u, v₂}</text><text x="717.5" y="180.5" font-size="27" fill="#1565c0" text-anchor="middle">Hai nhóm: 2 × N/g</text><path d="M260,155 L540,258" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="550" y="215" width="335" height="88" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="717.5" y="250.5" font-size="27" fill="#1565c0" text-anchor="middle">{u, v cuối}</text><text x="717.5" y="285.5" font-size="27" fill="#1565c0" text-anchor="middle">Hai nhóm: 2 × N/g</text><text x="1045" y="100" font-size="35" fill="#ef6c00" text-anchor="middle">g − 1</text><text x="1045" y="145" font-size="24" fill="#233247" text-anchor="middle">khóa cặp nhóm</text><text x="1045" y="190" font-size="25" fill="#233247" text-anchor="middle">khác nhau</text><text x="325" y="325" font-size="26" fill="#233247" text-anchor="middle">… gửi tới mọi nhóm khác u</text></g></svg>