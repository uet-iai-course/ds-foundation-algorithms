<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Tổng và tải lớn nhất</title><desc id="desc">R0 nhận hai giá trị thuộc khóa dữ và liệu; R1 nhận ba giá trị khóa lớn. Tổng năm, lớn nhất ba.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1565c0"/></marker></defs><g font-family="Arial, sans-serif"><text x="155" y="80" font-size="30" fill="#233247" text-anchor="middle">Tác vụ R0</text><text x="155" y="200" font-size="30" fill="#233247" text-anchor="middle">Tác vụ R1</text><rect x="320" y="30" width="215" height="85" rx="10" fill="#f6f9fc" stroke="#2e7d32" stroke-width="2"/><text x="427.5" y="81.5" font-size="27" fill="#2e7d32" text-anchor="middle">dữ: 1</text><rect x="560" y="30" width="215" height="85" rx="10" fill="#f6f9fc" stroke="#2e7d32" stroke-width="2"/><text x="667.5" y="81.5" font-size="27" fill="#2e7d32" text-anchor="middle">liệu: 1</text><rect x="320" y="150" width="215" height="85" rx="10" fill="#f6f9fc" stroke="#ef6c00" stroke-width="2"/><text x="427.5" y="201.5" font-size="27" fill="#ef6c00" text-anchor="middle">lớn: 1</text><rect x="560" y="150" width="215" height="85" rx="10" fill="#f6f9fc" stroke="#ef6c00" stroke-width="2"/><text x="667.5" y="201.5" font-size="27" fill="#ef6c00" text-anchor="middle">lớn: 1</text><rect x="800" y="150" width="215" height="85" rx="10" fill="#f6f9fc" stroke="#ef6c00" stroke-width="2"/><text x="907.5" y="201.5" font-size="27" fill="#ef6c00" text-anchor="middle">lớn: 1</text><text x="600" y="315" font-size="31" fill="#233247" text-anchor="middle">Tổng: 2 + 3 = 5 giá trị     |     Lớn nhất: 3 giá trị</text></g></svg>