<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Hai nhóm cùng đến một nơi</title><desc id="desc">Chia một triệu ảnh thành một nghìn nhóm đều. Một khóa cặp nhóm nhận hai nhóm, tổng hai nghìn ảnh.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1565c0"/></marker></defs><g font-family="Arial, sans-serif"><rect x="30" y="40" width="340" height="105" rx="10" fill="#f6f9fc" stroke="#2e7d32" stroke-width="2"/><text x="200.0" y="84.0" font-size="27" fill="#2e7d32" text-anchor="middle">Nhóm u</text><text x="200.0" y="119.0" font-size="27" fill="#2e7d32" text-anchor="middle">1000 ảnh</text><rect x="30" y="200" width="340" height="105" rx="10" fill="#f6f9fc" stroke="#7b1fa2" stroke-width="2"/><text x="200.0" y="244.0" font-size="27" fill="#7b1fa2" text-anchor="middle">Nhóm v</text><text x="200.0" y="279.0" font-size="27" fill="#7b1fa2" text-anchor="middle">1000 ảnh</text><path d="M370,90 L700,135" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><path d="M370,250 L700,175" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="710" y="90" width="450" height="135" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="935.0" y="131.5" font-size="27" fill="#1565c0" text-anchor="middle">Một khóa {u, v}</text><text x="935.0" y="166.5" font-size="27" fill="#1565c0" text-anchor="middle">2000 ảnh đã nhận</text><text x="935.0" y="201.5" font-size="27" fill="#1565c0" text-anchor="middle">Dùng lại để so sánh nhiều cặp</text></g></svg>