<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Đếm từ phân biệt bằng hai công việc</title><desc id="desc">Hai khung đọc từ trái sang phải. Khung trái là công việc 1 với khóa là từ: Map phát 5 cặp, d₁ cho (mèo, 1), (chó, 1), (mèo, 1), d₂ cho (chó, 1), (chim, 1); Combine còn 4 cặp, d₁ cho (mèo, 1), (chó, 1), d₂ giữ nguyên; Reduce nhận mèo [1], chó [1, 1], chim [1] và phát đúng một cặp (w, 1) cho mỗi từ phân biệt, tức 3 cặp. Mũi tên dẫn sang khung phải, công việc 2 với khóa chung g: Map đổi mỗi cặp thành (g, 1), nhóm g có [1, 1, 1], Reduce phát (g, 3), nên D = 3. Dòng cuối: cộng số từ phân biệt của từng văn bản cho 2 + 2 = 4 vì chó bị đếm hai lần.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="400" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="10.0" y="50.0" width="700.0" height="290.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="360.0" y="36.0" font-size="21" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Công việc 1: khóa là từ w, giữ dấu hiệu hiện diện</text><text x="130.0" y="90.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="bold">Map: 5 cặp</text><text x="30.0" y="124.0" font-size="18" fill="#233247" text-anchor="start" font-weight="normal">d₁: (mèo, 1), (chó, 1), (mèo, 1)</text><text x="30.0" y="154.0" font-size="18" fill="#233247" text-anchor="start" font-weight="normal">d₂: (chó, 1), (chim, 1)</text><text x="130.0" y="214.0" font-size="19" fill="#26704e" text-anchor="middle" font-weight="bold">Combine: 4 cặp</text><text x="30.0" y="248.0" font-size="18" fill="#233247" text-anchor="start" font-weight="normal">d₁: (mèo, 1), (chó, 1)</text><text x="30.0" y="278.0" font-size="18" fill="#233247" text-anchor="start" font-weight="normal">d₂: (chó, 1), (chim, 1)</text><line x1="370.0" y1="70.0" x2="370.0" y2="320.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><text x="540.0" y="90.0" font-size="19" fill="#a85b23" text-anchor="middle" font-weight="bold">Reduce: 3 cặp</text><text x="390.0" y="130.0" font-size="18" fill="#233247" text-anchor="start" font-weight="normal">mèo: [1] → (mèo, 1)</text><text x="390.0" y="164.0" font-size="18" fill="#233247" text-anchor="start" font-weight="normal">chó: [1, 1] → (chó, 1)</text><text x="390.0" y="198.0" font-size="18" fill="#233247" text-anchor="start" font-weight="normal">chim: [1] → (chim, 1)</text><text x="540.0" y="270.0" font-size="18" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">đúng một cặp cho mỗi từ</text><text x="540.0" y="296.0" font-size="18" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">phân biệt</text><line x1="712.0" y1="195.0" x2="778.0" y2="195.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="780.0" y="50.0" width="410.0" height="290.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="3"/><text x="985.0" y="36.0" font-size="21" fill="#a85b23" text-anchor="middle" font-weight="bold">Công việc 2: khóa chung g, cộng</text><text x="800.0" y="110.0" font-size="19" fill="#233247" text-anchor="start" font-weight="normal">Map: (w, 1) → (g, 1), ba lần</text><text x="800.0" y="150.0" font-size="19" fill="#233247" text-anchor="start" font-weight="normal">Nhóm: g: [1, 1, 1]</text><text x="800.0" y="190.0" font-size="19" fill="#233247" text-anchor="start" font-weight="normal">Reduce: (g, 1 + 1 + 1) = (g, 3)</text><rect x="840.0" y="250.0" width="290.0" height="60.0" rx="10" fill="#ffffff" stroke="#26704e" stroke-width="3"/><text x="985.0" y="289.0" font-size="24" fill="#26704e" text-anchor="middle" font-weight="bold">D = 3</text><text x="600.0" y="380.0" font-size="19" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">Cộng số từ phân biệt của từng văn bản cho 2 + 2 = 4 vì chó bị đếm hai lần.</text></g></svg>
