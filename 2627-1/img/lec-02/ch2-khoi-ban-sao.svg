<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc"><title id="title">Minh họa khối và bản sao trên các máy</title><desc id="desc">Sơ đồ khái niệm theo mục 2.1: ba khối có bản sao trên những máy khác nhau; không biểu diễn cấu hình cụm thực tế.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B15A2B"/></marker></defs><g font-family="sans-serif" font-size="28" fill="#263238"><rect x="30" y="55" width="310" height="250" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="185.0" y="190.0" text-anchor="middle"></text><text x="185" y="115" text-anchor="middle">Máy A</text><rect x="55" y="175" width="260" height="60" rx="10" fill="#fff0df" stroke="#2f3e7a" stroke-width="2"/><text x="185.0" y="215.0" text-anchor="middle">Khối 1, Khối 2</text><rect x="385" y="55" width="310" height="250" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="540.0" y="190.0" text-anchor="middle"></text><text x="540" y="115" text-anchor="middle">Máy B</text><rect x="410" y="175" width="260" height="60" rx="10" fill="#fff0df" stroke="#2f3e7a" stroke-width="2"/><text x="540.0" y="215.0" text-anchor="middle">Khối 2, Khối 3</text><rect x="740" y="55" width="310" height="250" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="895.0" y="190.0" text-anchor="middle"></text><text x="895" y="115" text-anchor="middle">Máy C</text><rect x="765" y="175" width="260" height="60" rx="10" fill="#fff0df" stroke="#2f3e7a" stroke-width="2"/><text x="895.0" y="215.0" text-anchor="middle">Khối 1, Khối 3</text><text x="540" y="360" text-anchor="middle">Một khối có bản sao ở nhiều máy; đọc bản sao gần tác vụ</text></g></svg>