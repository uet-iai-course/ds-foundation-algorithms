<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" role="img" aria-label="HDFS gồm NameNode quản lý vị trí và hai DataNode lưu khối với bản sao. YARN gồm ResourceManager cấp tài nguyên và hai NodeManager chạy tác vụ. Sáu container nối cùng mạng Docker trên một máy vật lý."><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2f3e7a"/></marker></defs><text x="275" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#2f3e7a">HDFS: lưu dữ liệu</text><text x="845" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#2f3e7a">YARN: chạy tác vụ</text><rect x="145" y="55" width="260" height="80" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="275.0" y="87.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">NameNode</text><text x="275.0" y="118.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">Vị trí khối</text><rect x="715" y="55" width="260" height="80" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="845.0" y="87.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">ResourceManager</text><text x="845.0" y="118.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">Cấp tài nguyên</text><rect x="20" y="205" width="240" height="88" rx="8" fill="#e8f5e9" stroke="#2f3e7a" stroke-width="2"/><text x="140.0" y="241.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">DataNode 1</text><text x="140.0" y="272.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">Khối và bản sao</text><path d="M275 140L140 198" fill="none" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#a)"/><rect x="300" y="205" width="240" height="88" rx="8" fill="#e8f5e9" stroke="#2f3e7a" stroke-width="2"/><text x="420.0" y="241.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">DataNode 2</text><text x="420.0" y="272.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">Khối và bản sao</text><path d="M275 140L420 198" fill="none" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#a)"/><rect x="580" y="205" width="240" height="88" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="700.0" y="241.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">NodeManager 1</text><text x="700.0" y="272.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">Chạy Map / Reduce</text><path d="M845 140L700 198" fill="none" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#a)"/><rect x="860" y="205" width="240" height="88" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="980.0" y="241.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">NodeManager 2</text><text x="980.0" y="272.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">Chạy Map / Reduce</text><path d="M845 140L980 198" fill="none" stroke="#2f3e7a" stroke-width="2.5" marker-end="url(#a)"/><text x="560" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#2f3e7a">Một mạng Docker · Sáu container · Chung CPU, RAM của một máy</text></svg>