<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Đếm năm cặp</title><desc id="desc">Ba cặp từ D1 và hai cặp từ D2, giả sử mỗi cặp cùng B byte.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1565c0"/></marker></defs><g font-family="Arial, sans-serif"><text x="100" y="70" font-size="30" fill="#233247" text-anchor="middle">D1</text><text x="100" y="205" font-size="30" fill="#233247" text-anchor="middle">D2</text><rect x="190" y="25" width="210" height="85" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="295.0" y="59.0" font-size="27" fill="#1565c0" text-anchor="middle">(dữ, 1)</text><text x="295.0" y="94.0" font-size="27" fill="#1565c0" text-anchor="middle">B byte</text><rect x="425" y="25" width="210" height="85" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="530.0" y="59.0" font-size="27" fill="#1565c0" text-anchor="middle">(liệu, 1)</text><text x="530.0" y="94.0" font-size="27" fill="#1565c0" text-anchor="middle">B byte</text><rect x="660" y="25" width="210" height="85" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="765.0" y="59.0" font-size="27" fill="#1565c0" text-anchor="middle">(lớn, 1)</text><text x="765.0" y="94.0" font-size="27" fill="#1565c0" text-anchor="middle">B byte</text><rect x="190" y="160" width="210" height="85" rx="10" fill="#f6f9fc" stroke="#ef6c00" stroke-width="2"/><text x="295.0" y="194.0" font-size="27" fill="#ef6c00" text-anchor="middle">(lớn, 1)</text><text x="295.0" y="229.0" font-size="27" fill="#ef6c00" text-anchor="middle">B byte</text><rect x="425" y="160" width="210" height="85" rx="10" fill="#f6f9fc" stroke="#ef6c00" stroke-width="2"/><text x="530.0" y="194.0" font-size="27" fill="#ef6c00" text-anchor="middle">(lớn, 1)</text><text x="530.0" y="229.0" font-size="27" fill="#ef6c00" text-anchor="middle">B byte</text><text x="600" y="320" font-size="30" fill="#233247" text-anchor="middle">3 cặp + 2 cặp = 5 cặp; mỗi cặp dài B byte</text></g></svg>