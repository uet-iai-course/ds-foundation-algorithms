<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc">
  <title id="title">Bộ kết hợp giảm số cặp trước khi phân vùng</title>
  <desc id="desc">Mỗi tác vụ map gộp các cặp cùng khóa ở máy cục bộ; hàm phân vùng gửi mỗi khóa đến đúng một tác vụ reduce.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B15A2B"/></marker></defs>
  <g font-family="sans-serif"><text x="180" y="38" text-anchor="middle" font-size="29" font-weight="700" fill="#2f3e7a">Đầu ra Map task</text><text x="520" y="38" text-anchor="middle" font-size="29" font-weight="700" fill="#2f3e7a">Bộ kết hợp</text><text x="895" y="38" text-anchor="middle" font-size="29" font-weight="700" fill="#2f3e7a">Phân vùng theo khóa</text>
  <g font-size="24"><rect x="25" y="70" width="310" height="145" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="48" y="108">M1: (lớn,1) × 20</text><text x="48" y="145">M1: (dữ liệu,1) × 5</text><text x="48" y="182">M1: (mô hình,1) × 2</text><rect x="25" y="255" width="310" height="130" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="48" y="293">M2: (lớn,1) × 16</text><text x="48" y="330">M2: (dữ liệu,1) × 4</text><text x="48" y="367">M2: (thuật toán,1) × 3</text>
  <rect x="410" y="85" width="220" height="285" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="438" y="126">(lớn,20)</text><text x="438" y="162">(dữ liệu,5)</text><text x="438" y="198">(mô hình,2)</text><path d="M430 224H610" stroke="#B15A2B" stroke-width="2" stroke-dasharray="6 5"/><text x="438" y="264">(lớn,16)</text><text x="438" y="300">(dữ liệu,4)</text><text x="438" y="336">(thuật toán,3)</text>
  <rect x="750" y="76" width="290" height="125" rx="12" fill="#e8f5e9" stroke="#2E7D32" stroke-width="3"/><text x="775" y="115" font-weight="700">Reduce task 0</text><text x="775" y="155">mọi cặp khóa “lớn”</text><rect x="750" y="245" width="290" height="125" rx="12" fill="#f3e5f5" stroke="#7B5EA7" stroke-width="3"/><text x="775" y="284" font-weight="700">Reduce task 1</text><text x="775" y="324">các khóa còn lại</text></g></g>
  <g fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#a)"><path d="M335 145H395"/><path d="M335 317H395"/><path d="M630 145H735"/><path d="M630 300H735"/></g><text x="686" y="222" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#37474f">h(k) mod r</text>
</svg>
