<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kho 400 TB, mỗi máy đọc 35 MB/s. Một máy đọc cả 400 TB mất khoảng 132 ngày. 1000 máy, mỗi máy đọc 0,4 TB trên đĩa của chính nó, cùng đọc đồng thời mất khoảng 3,2 giờ." font-family="Arial, Helvetica, sans-serif" viewBox="0 0 560 350" width="560" height="350"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs><text x="280" y="30" text-anchor="middle" font-size="25" fill="#2f3e7a" font-weight="normal">Kho 400 TB, mỗi máy đọc 35 MB/s</text><rect x="20" y="52" width="520" height="112" rx="8" fill="#f8fafc" stroke="#2f3e7a" stroke-width="2"/><text x="40" y="90" text-anchor="start" font-size="26" fill="#2f3e7a" font-weight="bold">1 máy</text><rect x="40" y="104" width="150" height="50" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="115" y="138" text-anchor="middle" font-size="25" fill="#2f3e7a" font-weight="normal">400 TB</text><path d="M200,129 L290,129" stroke="#2f3e7a" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="410" y="139" text-anchor="middle" font-size="28" fill="#a85b23" font-weight="bold">≈ 132 ngày</text><rect x="20" y="186" width="520" height="150" rx="8" fill="#f8fafc" stroke="#2f3e7a" stroke-width="2"/><text x="40" y="222" text-anchor="start" font-size="26" fill="#2f3e7a" font-weight="bold">1000 máy</text><rect x="40" y="238" width="46" height="50" rx="5" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><rect x="96" y="238" width="46" height="50" rx="5" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><rect x="152" y="238" width="46" height="50" rx="5" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><rect x="208" y="238" width="46" height="50" rx="5" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="270" y="272" text-anchor="middle" font-size="30" fill="#2f3e7a" font-weight="normal">…</text><rect x="292" y="238" width="46" height="50" rx="5" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><path d="M348,263 L392,263" stroke="#2f3e7a" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="465" y="273" text-anchor="middle" font-size="28" fill="#26704e" font-weight="bold">≈ 3,2 giờ</text><text x="190" y="322" text-anchor="middle" font-size="22" fill="#526070" font-weight="normal">mỗi máy đọc 0,4 TB tại chỗ</text></svg>
