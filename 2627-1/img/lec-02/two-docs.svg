<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Máy 1 giữ văn bản mèo chó mèo, chó xuất hiện 1 lần; máy 2 giữ văn bản chó chim, chó xuất hiện 1 lần. Đầu ra cần trả: mèo 2, chó 1 cộng 1 bằng 2, chim 1. Số 2 của chó cần đóng góp từ cả hai máy." font-family="Arial, Helvetica, sans-serif" viewBox="0 0 340 476" width="340" height="476"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs><rect x="10" y="10" width="320" height="120" rx="8" fill="#f8fafc" stroke="#2f3e7a" stroke-width="2"/><text x="30" y="46" text-anchor="start" font-size="25" fill="#2f3e7a" font-weight="bold">Máy 1</text><text x="170" y="84" text-anchor="middle" font-size="25" fill="#2f3e7a" font-weight="normal">“mèo chó mèo”</text><text x="170" y="116" text-anchor="middle" font-size="24" fill="#a85b23" font-weight="normal">chó: 1 lần</text><rect x="10" y="150" width="320" height="120" rx="8" fill="#f8fafc" stroke="#2f3e7a" stroke-width="2"/><text x="30" y="186" text-anchor="start" font-size="25" fill="#2f3e7a" font-weight="bold">Máy 2</text><text x="170" y="224" text-anchor="middle" font-size="25" fill="#2f3e7a" font-weight="normal">“chó chim”</text><text x="170" y="256" text-anchor="middle" font-size="24" fill="#a85b23" font-weight="normal">chó: 1 lần</text><path d="M170,276 L170,318" stroke="#2f3e7a" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="10" y="326" width="320" height="140" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="170" y="360" text-anchor="middle" font-size="25" fill="#2f3e7a" font-weight="normal">mèo 2</text><text x="170" y="394" text-anchor="middle" font-size="25" fill="#a85b23" font-weight="bold">chó 1 + 1 = 2</text><text x="170" y="428" text-anchor="middle" font-size="25" fill="#2f3e7a" font-weight="normal">chim 1</text><text x="170" y="456" text-anchor="middle" font-size="20" fill="#526070" font-weight="normal">đầu ra cần trả</text></svg>
