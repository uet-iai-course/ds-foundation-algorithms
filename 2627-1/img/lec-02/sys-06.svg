<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="R0 sắp xếp nhóm chim trước mèo. Reduce cho chim nhận một giá trị 1, trả 1; Reduce cho mèo đọc hai giá trị 1, tổng lần lượt 0 rồi 1 rồi 2. Không cần chứa mọi giá trị đếm từ trong RAM." font-family="Arial, sans-serif" viewBox="0 0 1120 315"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f3e7a"/></marker></defs><rect x="20" y="70" width="285" height="155" rx="7" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="162.5" y="122.5" text-anchor="middle" font-size="24" fill="#2f3e7a">R₀ sau sắp xếp</text><text x="162.5" y="156.5" text-anchor="middle" font-size="24" fill="#2f3e7a">(chim,1)</text><text x="162.5" y="190.5" text-anchor="middle" font-size="24" fill="#2f3e7a">(mèo,1), (mèo,1)</text><path d="M310,147 L405,147" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="415" y="70" width="330" height="155" rx="7" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="580.0" y="122.5" text-anchor="middle" font-size="24" fill="#2f3e7a">Reduce theo từng khóa</text><text x="580.0" y="156.5" text-anchor="middle" font-size="24" fill="#2f3e7a">chim: tổng = 1</text><text x="580.0" y="190.5" text-anchor="middle" font-size="24" fill="#2f3e7a">mèo: 0 → 1 → 2</text><path d="M750,147 L835,147" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="845" y="70" width="250" height="155" rx="7" fill="#e8f5e9" stroke="#2f3e7a" stroke-width="2"/><text x="970.0" y="122.5" text-anchor="middle" font-size="24" fill="#2f3e7a">Kết quả</text><text x="970.0" y="156.5" text-anchor="middle" font-size="24" fill="#2f3e7a">(chim,1)</text><text x="970.0" y="190.5" text-anchor="middle" font-size="24" fill="#2f3e7a">(mèo,2)</text><text x="560" y="280" text-anchor="middle" font-size="24" fill="#2f3e7a">Bộ đếm đọc từng giá trị; hệ thống có thể ghép các đoạn đã sắp xếp trên đĩa.</text></svg>