<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Dùng lại dữ liệu sau lọc</title><desc id="desc">Đánh dấu lưu đệm trước hành động đầu; lần tính đầu lưu các phần, hành động sau dùng lại phần còn lưu.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2f3e7a"/></marker></defs><rect x="10" y="105" width="290" height="94" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="155.0" y="139" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">Tách → lọc</text><text x="155.0" y="174" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">Theo từng phần</text><rect x="425" y="105" width="330" height="94" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="590.0" y="139" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">Dữ liệu sạch</text><text x="590.0" y="174" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">Đánh dấu lưu đệm</text><rect x="870" y="20" width="320" height="94" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="1030.0" y="54" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">Lưu số đếm</text><text x="1030.0" y="89" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">Tính và lưu lần đầu</text><rect x="870" y="215" width="320" height="94" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="1030.0" y="249" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">sach.count() → 7</text><text x="1030.0" y="284" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263238">Dùng phần còn lưu</text><path d="M300,150 L415,150" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><path d="M755,135 L860,70" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/><path d="M755,175 L860,255" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"/></svg>