<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">Chia đầu vào để tạo tác vụ Map</title><desc id="desc">Phần 0 chứa D1 được giao Map 0, phần 1 chứa D2 được giao Map 1. Hai tác vụ cùng mã hàm, khác phần dữ liệu.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2f3e7a"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:25px;fill:#263238}.head{font-weight:bold;fill:#2f3e7a}.arrow{fill:none;stroke:#2f3e7a;stroke-width:2.5;marker-end:url(#arrow)}.fault{fill:#fff0ee;stroke:#b3392e;stroke-width:2}.box{fill:#edf4ff;stroke:#2f3e7a;stroke-width:2}.good{fill:#edf7ef;stroke:#387343;stroke-width:2}</style><text x="20" y="32" class="head">Phần dữ liệu đầu vào</text><text x="460" y="32" class="head">Tác vụ được tạo</text><text x="825" y="32" class="head">Lời gọi hàm</text><rect x="20" y="70" width="310" height="95" rx="8" class="box"/><text x="38" y="107" class="">Phần 0</text><text x="38" y="143" class="">D1: dữ liệu lớn</text><path d="M330 118 L450 118" class="arrow"/><rect x="460" y="70" width="280" height="95" rx="8" class="box"/><text x="480" y="110" class="">Tác vụ Map 0</text><text x="480" y="145" class="">Đọc phần 0</text><path d="M740 118 L805 118" class="arrow"/><text x="825" y="125" class="">Map(D1)</text><rect x="20" y="205" width="310" height="95" rx="8" class="box"/><text x="38" y="242" class="">Phần 1</text><text x="38" y="278" class="">D2: lớn lớn</text><path d="M330 253 L450 253" class="arrow"/><rect x="460" y="205" width="280" height="95" rx="8" class="box"/><text x="480" y="245" class="">Tác vụ Map 1</text><text x="480" y="280" class="">Đọc phần 1</text><path d="M740 253 L805 253" class="arrow"/><text x="825" y="260" class="">Map(D2)</text><text x="20" y="343" class="">Minh họa: mỗi phần chứa một tài liệu; hai tác vụ dùng cùng hàm Map.</text></svg>