<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" role="img" aria-label="Cùng trục thời gian: một máy cộng 16 số trong 15 tau. Bốn máy cùng cộng cục bộ từ 0 đến 3 tau, sau đó máy 1 gộp từ 3 đến 6 tau. Các thanh và mốc dùng 60 pixel cho một tau." viewBox="0 0 1120 352" width="1120"><text x="135" y="54" text-anchor="end" font-size="26" fill="#2f3e7a">1 máy</text><rect x="160" y="24" width="900" height="40" rx="4" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="610" y="52" text-anchor="middle" font-size="26" fill="#2f3e7a">15τ</text><line x1="25" y1="86" x2="1090" y2="86" stroke="#526070" stroke-width="2" /><text x="45" y="111" text-anchor="middle" font-size="24" fill="#2f3e7a">4 máy</text><text x="135" y="144" text-anchor="end" font-size="24" fill="#2f3e7a">Máy 1</text><rect x="160" y="118" width="180" height="34" rx="4" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="250" y="143" text-anchor="middle" font-size="24" fill="#2f3e7a">3τ</text><rect x="340" y="118" width="180" height="34" rx="4" fill="#dce8ff" stroke="#2f3e7a" stroke-width="2"/><text x="430" y="143" text-anchor="middle" font-size="24" fill="#2f3e7a">3τ</text><text x="135" y="188" text-anchor="end" font-size="24" fill="#2f3e7a">Máy 2</text><rect x="160" y="162" width="180" height="34" rx="4" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="250" y="187" text-anchor="middle" font-size="24" fill="#2f3e7a">3τ</text><text x="135" y="232" text-anchor="end" font-size="24" fill="#2f3e7a">Máy 3</text><rect x="160" y="206" width="180" height="34" rx="4" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="250" y="231" text-anchor="middle" font-size="24" fill="#2f3e7a">3τ</text><text x="135" y="276" text-anchor="end" font-size="24" fill="#2f3e7a">Máy 4</text><rect x="160" y="250" width="180" height="34" rx="4" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="250" y="275" text-anchor="middle" font-size="24" fill="#2f3e7a">3τ</text><text x="645" y="156" text-anchor="start" font-size="26" fill="#2f3e7a">Mỗi máy cộng 4 số: 3 phép cộng.</text><text x="645" y="203" text-anchor="start" font-size="26" fill="#2f3e7a">Máy 1 gộp 4 tổng: 3 phép cộng.</text><text x="645" y="250" text-anchor="start" font-size="26" fill="#2f3e7a">Kết thúc sau 6τ.</text><line x1="160" y1="310" x2="1060" y2="310" stroke="#526070" stroke-width="2" /><line x1="160" y1="305" x2="160" y2="315" stroke="#526070" stroke-width="2" /><text x="160" y="342" text-anchor="middle" font-size="24" fill="#526070">0τ</text><line x1="340" y1="305" x2="340" y2="315" stroke="#526070" stroke-width="2" /><text x="340" y="342" text-anchor="middle" font-size="24" fill="#526070">3τ</text><line x1="520" y1="305" x2="520" y2="315" stroke="#526070" stroke-width="2" /><text x="520" y="342" text-anchor="middle" font-size="24" fill="#526070">6τ</text><line x1="700" y1="305" x2="700" y2="315" stroke="#526070" stroke-width="2" /><text x="700" y="342" text-anchor="middle" font-size="24" fill="#526070">9τ</text><line x1="880" y1="305" x2="880" y2="315" stroke="#526070" stroke-width="2" /><text x="880" y="342" text-anchor="middle" font-size="24" fill="#526070">12τ</text><line x1="1060" y1="305" x2="1060" y2="315" stroke="#526070" stroke-width="2" /><text x="1060" y="342" text-anchor="middle" font-size="24" fill="#526070">15τ</text></svg>