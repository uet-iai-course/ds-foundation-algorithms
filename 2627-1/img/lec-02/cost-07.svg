<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" role="img" aria-label="Bốn máy trong rack gửi, mỗi máy 100 MB; tất cả 400 MB qua một đường nối 100 MB mỗi giây tới máy nhận trong rack khác." viewBox="0 0 1120 305" width="1120"><defs><marker id="cost-rack-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f3e7a"/></marker></defs><rect x="20" y="40" width="300" height="245" rx="4" fill="#f8fafc" stroke="#2f3e7a" stroke-width="2"/><text x="170" y="28" text-anchor="middle" font-size="28" fill="#2f3e7a">Tủ rack gửi</text><rect x="40" y="60" width="260" height="42" rx="4" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="170" y="89" text-anchor="middle" font-size="26" fill="#2f3e7a">Máy 1: 100 MB</text><rect x="40" y="115" width="260" height="42" rx="4" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="170" y="144" text-anchor="middle" font-size="26" fill="#2f3e7a">Máy 2: 100 MB</text><rect x="40" y="170" width="260" height="42" rx="4" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="170" y="199" text-anchor="middle" font-size="26" fill="#2f3e7a">Máy 3: 100 MB</text><rect x="40" y="225" width="260" height="42" rx="4" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="170" y="254" text-anchor="middle" font-size="26" fill="#2f3e7a">Máy 4: 100 MB</text><rect x="860" y="40" width="240" height="245" rx="4" fill="#f8fafc" stroke="#2f3e7a" stroke-width="2"/><text x="980" y="28" text-anchor="middle" font-size="28" fill="#2f3e7a">Tủ rack nhận</text><rect x="880" y="120" width="200" height="75" rx="4" fill="#dce8ff" stroke="#2f3e7a" stroke-width="2"/><text x="980" y="166" text-anchor="middle" font-size="28" fill="#2f3e7a">Máy nhận</text><line x1="320" y1="158" x2="870" y2="158" stroke="#526070" stroke-width="2" marker-end="url(#cost-rack-arrow)"/><text x="580" y="106" text-anchor="middle" font-size="26" fill="#2f3e7a">Một đường nối dùng chung</text><text x="580" y="140" text-anchor="middle" font-size="26" fill="#2f3e7a">B = 100 MB/s</text><text x="580" y="202" text-anchor="middle" font-size="26" fill="#2f3e7a">V = 4 × 100 = 400 MB</text></svg>