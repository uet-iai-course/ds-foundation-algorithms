<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HDFS quản lý tệp và các bản sao, cung cấp vị trí để giao Map gần dữ liệu, giữ đầu vào để đọc lại và lưu kết quả Reduce. NameNode giữ thông tin vị trí; DataNode lưu các khối. MapReduce chịu trách nhiệm lập lịch tác vụ." font-family="Arial, sans-serif" viewBox="0 0 1120 355"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f3e7a"/></marker></defs><rect x="20" y="25" width="1080" height="70" rx="7" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="560.0" y="69.0" text-anchor="middle" font-size="27" fill="#2f3e7a">HDFS: quản lý tệp, vị trí khối và các bản sao</text><path d="M185,100 L185,150" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="20" y="155" width="330" height="110" rx="7" fill="#e8f5e9" stroke="#2f3e7a" stroke-width="2"/><text x="185.0" y="202.0" text-anchor="middle" font-size="24" fill="#2f3e7a">Vị trí bản sao</text><text x="185.0" y="236.0" text-anchor="middle" font-size="24" fill="#2f3e7a">Giao Map gần dữ liệu</text><path d="M560,100 L560,150" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="395" y="155" width="330" height="110" rx="7" fill="#e8f5e9" stroke="#2f3e7a" stroke-width="2"/><text x="560.0" y="202.0" text-anchor="middle" font-size="24" fill="#2f3e7a">Đầu vào có bản sao</text><text x="560.0" y="236.0" text-anchor="middle" font-size="24" fill="#2f3e7a">Map có thể đọc lại</text><path d="M935,100 L935,150" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="770" y="155" width="330" height="110" rx="7" fill="#e8f5e9" stroke="#2f3e7a" stroke-width="2"/><text x="935.0" y="202.0" text-anchor="middle" font-size="24" fill="#2f3e7a">Lưu kết quả Reduce</text><text x="935.0" y="236.0" text-anchor="middle" font-size="24" fill="#2f3e7a">Giữ đầu ra đã hoàn tất</text><text x="560" y="318" text-anchor="middle" font-size="24" fill="#2f3e7a">NameNode giữ thông tin vị trí; DataNode lưu khối và phục vụ đọc/ghi.</text></svg>