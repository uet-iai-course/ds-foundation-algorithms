344.0" font-size="18" fill="#5b6778" text-anchor="middle" font-weight="normal">3</text><text x="91.0" y="234.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">2</text><text x="153.0" y="234.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">0</text><text x="215.0" y="234.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">1</text><text x="277.0" y="234.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">1</text><text x="34.0" y="296.0" font-size="18" fill="#5b6778" text-anchor="middle" font-weight="normal">4</text><text x="277.0" y="344.0" font-size="18" fill="#5b6778" text-anchor="middle" font-weight="normal">4</text><text x="91.0" y="296.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">1</text><text x="153.0" y="296.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">1</text><text x="215.0" y="296.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">0</text><text x="277.0" y="296.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">2</text><text x="34.0" y="58.0" font-size="18" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">i</text><text x="322.0" y="344.0" font-size="18" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">j</text><text x="388.0" y="50.0" font-size="21" fill="#2f3e7a" text-anchor="middle" font-weight="bold" font-style="italic">v</text><rect x="358.0" y="70.0" width="60.0" height="248.0" rx="0" fill="#ffffff" stroke="#233247" stroke-width="2.5"/><text x="388.0" y="110.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">1</text><text x="388.0" y="172.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">2</text><text x="388.0" y="234.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">3</text><text x="388.0" y="296.0" font-size="23" fill="#233247" text-anchor="middle" font-weight="normal">4</text><text x="620.0" y="50.0" font-size="21" fill="#26704e" text-anchor="middle" font-weight="bold">Combine trong mỗi khối</text><rect x="470.0" y="70.0" width="330.0" height="64.0" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="506.0" y="109.0" font-size="20" fill="#26704e" text-anchor="middle" font-weight="bold">A₁₁</text><text x="670.0" y="97.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal">(1, 1+4) = (1, 5)</text><text x="670.0" y="122.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal">(2, 0+2) = (2, 2)</text><rect x="470.0" y="142.0" width="330.0" height="64.0" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="506.0" y="181.0" font-size="20" fill="#26704e" text-anchor="middle" font-weight="bold">A₁₂</text><text x="670.0" y="169.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal">(1, 0+4) = (1, 4)</text><text x="670.0" y="194.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal">(2, 6+0) = (2, 6)</text><rect x="470.0" y="214.0" width="330.0" height="64.0" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="506.0" y="253.0" font-size="20" fill="#26704e" text-anchor="middle" font-weight="bold">A₂₁</text><text x="670.0" y="241.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal">(3, 2+0) = (3, 2)</text><text x="670.0" y="266.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal">(4, 1+2) = (4, 3)</text><rect x="470.0" y="286.0" width="330.0" height="64.0" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="2.5"/><text x="506.0" y="325.0" font-size="20" fill="#26704e" text-anchor="middle" font-weight="bold">A₂₂</text><text x="670.0" y="313.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal">(3, 3+4) = (3, 7)</text><text x="670.0" y="338.0" font-size="18" fill="#233247" text-anchor="middle" font-weight="normal">(4, 0+8) = (4, 8)</text><text x="1040.0" y="50.0" font-size="21" fill="#a85b23" text-anchor="middle" font-weight="bold">Reduce theo khóa hàng i</text><rect x="900.0" y="70.0" width="280.0" height="64.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="992.0" y="110.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">i = 1: [5, 4]</text><text x="1122.0" y="110.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="bold">y₁ = 9</text><rect x="900.0" y="142.0" width="280.0" height="64.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="992.0" y="182.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">i = 2: [2, 6]</text><text x="1122.0" y="182.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="bold">y₂ = 8</text><rect x="900.0" y="214.0" width="280.0" height="64.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="992.0" y="254.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">i = 3: [2, 7]</text><text x="1122.0" y="254.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="bold">y₃ = 9</text><rect x="900.0" y="286.0" width="280.0" height="64.0" rx="10" fill="#fff4e9" stroke="#a85b23" stroke-width="2.5"/><text x="992.0" y="326.0" font-size="19" fill="#233247" text-anchor="middle" font-weight="normal">i = 4: [3, 8]</text><text x="1122.0" y="326.0" font-size="20" fill="#233247" text-anchor="middle" font-weight="bold">y₄ = 11</text><line x1="802.0" y1="102.0" x2="898.0" y2="102.0" stroke="#5b6778" stroke-width="2" marker-end="url(#arrow)"/><line x1="802.0" y1="174.0" x2="898.0" y2="112.0" stroke="#5b6778" stroke-width="2" marker-end="url(#arrow)"/><line x1="802.0" y1="246.0" x2="898.0" y2="246.0" stroke="#5b6778" stroke-width="2" marker-end="url(#arrow)"/><line x1="802.0" y1="318.0" x2="898.0" y2="256.0" stroke="#5b6778" stroke-width="2" marker-end="url(#arrow)"/><text x="600.0" y="420.0" font-size="19" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">Mỗi hàng i nhận một tổng bộ phận từ khối bên trái và một từ khối bên phải; khóa là hàng i.</text><text x="600.0" y="452.0" font-size="19" fill="#5b6778" text-anchor="middle" font-weight="normal" font-style="italic">Map phát 16 cặp (i, aᵢⱼvⱼ), kể cả tích 0; Combine còn 8 cặp; y = (9, 8, 9, 11).</text></g></svg>
