<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Nhân ma trận–véc-tơ theo bốn khối</title><desc id="desc">Bên trái là ma trận A cỡ 4 × 4 với các hàng 1, 2, 0, 1; 0, 1, 2, 0; 2, 0, 1, 1; 1, 1, 0, 2, chia bằng nét đậm thành bốn khối 2 × 2: A₁₁ và A₁₂ ở trên, A₂₁ và A₂₂ ở dưới; cạnh đó là véc-tơ v = (1, 2, 3, 4). Cột giữa ghi các cặp Combine phát trong mỗi khối: A₁₁ cho (1, 5) và (2, 2); A₁₂ cho (1, 4) và (2, 6); A₂₁ cho (3, 2) và (4, 3); A₂₂ cho (3, 7) và (4, 8). Cột phải là Reduce theo khóa hàng: i = 1 nhận [5, 4], y₁ = 9; i = 2 nhận [2, 6], y₂ = 8; i = 3 nhận [2, 7], y₃ = 9; i = 4 nhận [3, 8], y₄ = 11. Dòng chú thích: Map phát 16 cặp kể cả tích 0, Combine còn 8 cặp, y = (9, 8, 9, 11).</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1200" height="470" fill="#ffffff"/>
