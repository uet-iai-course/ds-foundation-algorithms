<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="330" viewBox="0 0 1160 330" role="img" aria-labelledby="title desc"><title id="title">Các rack, kết nối mạng và bản sao khối trong HDFS</title><desc id="desc">Tệp chia thành A và B. Rack 1 gồm máy 1 lưu A B, máy 2 lưu B; rack 2 gồm máy 3 lưu A B, máy 4 lưu A. Mỗi rack có bộ chuyển mạch nối tới mạng liên rack. Mỗi khối có ba bản sao trên hai rack.</desc><style>text{font-family:Arial,sans-serif;fill:#2f3e7a;font-size:22px} .small{font-size:20px} .line{stroke:#526070;stroke-width:3;fill:none}</style>
