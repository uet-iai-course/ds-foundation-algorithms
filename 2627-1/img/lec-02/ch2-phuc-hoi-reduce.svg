<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 345" role="img" aria-labelledby="title desc"><title id="title">Phục hồi khi máy Reduce hỏng</title><desc id="desc">Bộ điều phối phát hiện máy D không phản hồi, đặt Reduce 1 về chờ, giao máy F thực hiện lại. Chỉ chạy lại Reduce1 đang thực hiện; đầu ra Reduce0 đã hoàn tất vẫn còn trong hệ tệp phân tán.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2f3e7a"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:25px;fill:#263238}.head{font-weight:bold;fill:#2f3e7a}.arrow{fill:none;stroke:#2f3e7a;stroke-width:2.5;marker-end:url(#arrow)}.fault{fill:#fff0ee;stroke:#b3392e;stroke-width:2}.box{fill:#edf4ff;stroke:#2f3e7a;stroke-width:2}.good{fill:#edf7ef;stroke:#387343;stroke-width:2}</style><rect x="10" y="55" width="252" height="150" rx="8" class="fault"/><text x="24" y="88" class="head">1. Phát hiện</text><text x="24" y="135" class="">Máy D không</text><text x="24" y="177" class="">phản hồi kiểm tra</text><path d="M262 125 L280 125" class="arrow"/><rect x="285" y="55" width="252" height="150" rx="8" class="box"/><text x="299" y="88" class="head">2. Đưa về chờ</text><text x="299" y="135" class="">Reduce 1 về chờ</text><text x="299" y="177" class="">Tác vụ đang chạy</text><path d="M537 125 L555 125" class="arrow"/><rect x="560" y="55" width="252" height="150" rx="8" class="box"/><text x="574" y="88" class="head">3. Giao máy khác</text><text x="574" y="135" class="">Chạy lại trên máy F</text><text x="574" y="177" class="">Đọc lại tệp Map</text><path d="M812 125 L830 125" class="arrow"/><rect x="835" y="55" width="252" height="150" rx="8" class="box"/><text x="849" y="88" class="head">4. Hoàn thành</text><text x="849" y="135" class="">Ghi kết quả mới</text><text x="849" y="177" class="">vào hệ tệp phân tán</text><rect x="10" y="245" width="1075" height="72" rx="8" class="good"/><text x="30" y="290" class="">Reduce 0 đã xong: giữ kết quả trong hệ tệp phân tán.</text></svg>