<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bên trái: một máy cộng 16 số a1 đến a16 bằng 15 phép cộng. Bên phải: bốn máy, mỗi máy giữ 4 số, gửi tổng cục bộ tới một bước gộp 4 tổng. Dòng dưới: ba đại lượng cần đo là số phép cộng, số giây và số byte qua mạng." font-family="Arial, Helvetica, sans-serif" viewBox="0 0 1120 246" width="1120" height="246"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs><rect x="20" y="40" width="330" height="150" rx="8" fill="#f8fafc" stroke="#2f3e7a" stroke-width="2"/><text x="185" y="28" text-anchor="middle" font-size="26" fill="#2f3e7a" font-weight="bold">Một máy</text><rect x="45" y="70" width="280" height="56" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="185" y="107" text-anchor="middle" font-size="26" fill="#2f3e7a" font-weight="normal">a₁ a₂ … a₁₆</text><text x="185" y="166" text-anchor="middle" font-size="26" fill="#a85b23" font-weight="normal">15 phép cộng</text><text x="760" y="28" text-anchor="middle" font-size="26" fill="#2f3e7a" font-weight="bold">Bốn máy, mỗi máy 4 số</text><rect x="420" y="44" width="140" height="56" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="490" y="81" text-anchor="middle" font-size="24" fill="#2f3e7a" font-weight="normal">a₁…a₄</text><path d="M490,104 L670,146" stroke="#2f3e7a" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="580" y="44" width="140" height="56" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="650" y="81" text-anchor="middle" font-size="24" fill="#2f3e7a" font-weight="normal">a₅…a₈</text><path d="M650,104 L730,146" stroke="#2f3e7a" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="740" y="44" width="140" height="56" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="810" y="81" text-anchor="middle" font-size="24" fill="#2f3e7a" font-weight="normal">a₉…a₁₂</text><path d="M810,1