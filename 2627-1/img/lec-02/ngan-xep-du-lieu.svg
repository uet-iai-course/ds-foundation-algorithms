<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 420" role="img" aria-labelledby="title desc">
  <title id="title">HDFS, Hadoop MapReduce và Spark trong ngăn xếp dữ liệu</title>
  <desc id="desc">HDFS lưu trữ dữ liệu phân tán. Lớp quản lý tài nguyên lập lịch công việc. Hadoop MapReduce và Spark là các máy thực thi; phía trên là giao diện dữ liệu và thư viện.</desc>
  <g font-family="sans-serif"><rect x="130" y="330" width="770" height="65" rx="10" fill="#546e7a"/><text x="515" y="371" text-anchor="middle" font-size="29" font-weight="700" fill="#fff">HDFS · khối · bản sao · vị trí dữ liệu</text><rect x="170" y="260" width="690" height="60" rx="10" fill="#90a4ae"/><text x="515" y="298" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Quản lý tài nguyên và lập lịch</text><rect x="210" y="180" width="610" height="70" rx="10" fill="#B15A2B"/><text x="515" y="211" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Máy thực thi</text><text x="515" y="242" text-anchor="middle" font-size="25" fill="#fff">Hadoop MapReduce · Spark</text><rect x="250" y="105" width="530" height="65" rx="10" fill="#2f3e7a"/><text x="515" y="145" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">Giao diện dữ liệu</text><rect x="300" y="30" width="430" height="65" rx="10" fill="#2E7D32"/><text x="515" y="70" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">Thư viện phân tích</text></g>
</svg>
