<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="R0 chưa hoàn tất trên máy hỏng bỏ đầu ra tạm, chạy lại ở máy khác từ các phần Map còn truy cập được, ghi O0 khi xong. O1 của R1 đã hoàn tất được giữ trong hệ tệp phân tán." font-family="Arial, sans-serif" viewBox="0 0 1120 300"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f3e7a"/></marker></defs><rect x="20" y="35" width="310" height="150" rx="7" fill="#ffebee" stroke="#2f3e7a" stroke-width="2"/><text x="175.0" y="85.0" text-anchor="middle" font-size="24" fill="#2f3e7a">R₀ trên máy hỏng</text><text x="175.0" y="119.0" text-anchor="middle" font-size="24" fill="#2f3e7a">Chưa hoàn tất</text><text x="175.0" y="153.0" text-anchor="middle" font-size="24" fill="#2f3e7a">Đầu ra tạm bỏ đi</text><path d="M336,110 L398,110" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="405" y="35" width="310" height="150" rx="7" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="560.0" y="85.0" text-anchor="middle" font-size="24" fill="#2f3e7a">R₀ trên máy khác</text><text x="560.0" y="119.0" text-anchor="middle" font-size="24" fill="#2f3e7a">Lấy phần trung gian</text><text x="560.0" y="153.0" text-anchor="middle" font-size="24" fill="#2f3e7a">Tính và ghi O₀</text><path d="M720,110 L784,110" stroke="#2f3e7a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="790" y="35" width="310" height="150" rx="7" fill="#e8f5e9" stroke="#2f3e7a" stroke-width="2"/><text x="945.0" y="85.0" text-anchor="middle" font-size="24" fill="#2f3e7a">Hệ tệp phân tán</text><text x="945.0" y="119.0" text-anchor="middle" font-size="24" fill="#2f3e7a">O₀: khi hoàn tất</text><text x="945.0" y="153.0" text-anchor="middle" font-size="24" fill="#2f3e7a">O₁: đã có, giữ lại</text><text x="560" y="250" text-anchor="middle" font-size="25" fill="#2f3e7a">Giả sử các phần trung gian Map và bản sao O₁ vẫn truy cập được.</text></svg>