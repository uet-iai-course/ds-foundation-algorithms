<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Bỏ đếm đôi để đếm các cặp ảnh</title><desc id="desc">Ma trận bốn ảnh có sáu ô phía trên đường chéo biểu diễn sáu cặp khác nhau; phía dưới lặp thứ tự, đường chéo tự so sánh.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1565c0"/></marker></defs><g font-family="Arial, sans-serif"><text x="160" y="28" font-size="25" fill="#233247" text-anchor="middle">P1</text><text x="65" y="80" font-size="25" fill="#233247" text-anchor="middle">P1</text><rect x="110" y="42" width="100" height="58" fill="#f2f3f5" stroke="#a6b1bd"/><text x="160" y="79" font-size="24" fill="#687584" text-anchor="middle">—</text><rect x="220" y="42" width="100" height="58" fill="#e8f5e9" stroke="#a6b1bd"/><text x="270" y="79" font-size="24" fill="#2e7d32" text-anchor="middle">1,2</text><rect x="330" y="42" width="100" height="58" fill="#e8f5e9" stroke="#a6b1bd"/><text x="380" y="79" font-size="24" fill="#2e7d32" text-anchor="middle">1,3</text><rect x="440" y="42" width="100" height="58" fill="#e8f5e9" stroke="#a6b1bd"/><text x="490" y="79" font-size="24" fill="#2e7d32" text-anchor="middle">1,4</text><text x="270" y="28" font-size="25" fill="#233247" text-anchor="middle">P2</text><text x="65" y="145" font-size="25" fill="#233247" text-anchor="middle">P2</text><rect x="110" y="107" width="100" height="58" fill="#f2f3f5" stroke="#a6b1bd"/><text x="160" y="144" font-size="24" fill="#687584" text-anchor="middle">lặp</text><rect x="220" y="107" width="100" height="58" fill="#f2f3f5" stroke="#a6b1bd"/><text x="270" y="144" font-size="24" fill="#687584" text-anchor="middle">—</text><rect x="330" y="107" width="100" height="58" fill="#e8f5e9" stroke="#a6b1bd"/><text x="380" y="144" font-size="24" fill="#2e7d32" text-anchor="middle">2,3</text><rect x="440" y="107" width="100" height="58" fill="#e8f5e9" stroke="#a