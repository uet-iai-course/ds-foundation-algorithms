<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Máy 1 giữ văn bản mèo chó mèo, chó xuất hiện 1 lần; máy 2 giữ văn bản chó chim, chó xuất hiện 1 lần. Đầu ra cần trả: mèo 2, chó 1 cộng 1 bằng 2, chim 1." font-family="Arial, Helvetica, sans-serif" viewBox="0 0 560 310" width="560" height="310"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs><rect x="10" y="10" width="260" height="130" rx="8" fill="#f8fafc" stroke="#2f3e7a" stroke-width="2"/><text x="28" y="44" text-anchor="start" font-size="24" fill="#2f3e7a" font-weight="bold">Máy 1</text><text x="140" y="84" text-anchor="middle" font-size="24" fill="#2f3e7a" font-weight="normal">“mèo chó mèo”</text><text x="140" y="120" text-anchor="middle" font-size="23" fill="#a85b23" font-weight="normal">chó: 1 lần</text><rect x="290" y="10" width="260" height="130" rx="8" fill="#f8fafc" stroke="#2f3e7a" stroke-width="2"/><text x="308" y="44" text-anchor="start" font-size="24" fill="#2f3e7a" font-weight="bold">Máy 2</text><text x="420" y="84" text-anchor="middle" font-size="24" fill="#2f3e7a" font-weight="normal">“chó chim”</text><text x="420" y="120" text-anchor="middle" font-size="23" fill="#a85b23" font-weight="normal">chó: 1 lần</text><path d="M140,146 L240,196" stroke="#2f3e7a" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M420,146 L320,196" stroke="#2f3e7a" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="10" y="204" width="540" height="96" rx="8" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2"/><text x="280" y="244" text-anchor="middle" font-size="25" fill="#2f3e7a" font-weight="normal">mèo 2 · chó 1 + 1 = 2 · chim 1</text><text x="280" y="282" text-anchor="middle" font-size="22" fill="#526070" font-weight="normal">đầu ra cần trả</text></svg>
