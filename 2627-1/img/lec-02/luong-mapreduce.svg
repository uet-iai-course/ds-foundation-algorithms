<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">Luồng xử lý MapReduce qua ba giai đoạn</title>
  <desc id="desc">Hai mảnh tài liệu đi qua map tạo cặp khóa giá trị, hệ thống nhóm theo khóa, rồi reduce tính tổng số lần xuất hiện.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B15A2B"/></marker></defs>
  <g font-family="sans-serif"><text x="165" y="40" text-anchor="middle" font-size="29" font-weight="700" fill="#2f3e7a">Map do người dùng viết</text><text x="560" y="40" text-anchor="middle" font-size="29" font-weight="700" fill="#2f3e7a">Hệ thống nhóm theo khóa</text><text x="960" y="40" text-anchor="middle" font-size="29" font-weight="700" fill="#2f3e7a">Reduce do người dùng</text>
  <g font-size="25"><rect x="20" y="78" width="260" height="125" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="42" y="115">D1: dữ liệu lớn</text><text x="42" y="151">→ (dữ liệu,1)</text><text x="42" y="183">→ (lớn,1)</text><rect x="20" y="235" width="260" height="125" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="42" y="272">D2: lớn lớn</text><text x="42" y="308">→ (lớn,1)</text><text x="42" y="340">→ (lớn,1)</text>
  <rect x="410" y="78" width="300" height="282" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="438" y="125">(dữ liệu,[1])</text><text x="438" y="185">(lớn,[1,1,1])</text><path d="M430 215H690" stroke="#B15A2B" stroke-width="2" stroke-dasharray="7 6"/><text x="438" y="257">Mọi giá trị cùng khóa</text><text x="438" y="292">đến đúng một reducer.</text>
  <rect x="850" y="110" width="240" height="95" rx="12" fill="#e8f5e9" stroke="#2E7D32" stroke-width="3"/><text x="875" y="150">(dữ liệu,1)</text><text x="875" y="184">(lớn,3)</text><rect x="850" y="250" width="240" height="78" rx="12" fill="#fff" stroke="#607d8b" stroke-width="3"/><text x="970" y="299" text-anchor="middle">Tệp kết quả</text></g></g>
  <g fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#a)"><path d="M280 140H395"/><path d="M280 297H395"/><path d="M710 185H835"/></g>
</svg>
