<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
<title id="title">Cộng sáu số trên ba máy</title><desc id="desc">Ba khối trên là ba máy. Máy 1 giữ a₁ = 2 và a₄ = 1, tính tổng bộ phận 3; máy 2 giữ a₂ = 4 và a₅ = 3, tính 7; máy 3 giữ a₃ = 9 và a₆ = 5, tính 14. Ba mũi tên dẫn ba tổng bộ phận xuống khối gộp ở dưới, nơi 3 + 7 + 14 = 24, bằng tổng a₁ + ⋯ + a₆ theo thứ tự chỉ số.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f3e7a"/></marker></defs>
<rect x="0" y="0" width="1000" height="380" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="30.0" y="20.0" width="300.0" height="170.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="180.0" y="58.0" font-size="24" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Máy 1</text><text x="180.0" y="100.0" font-size="22" fill="#233247" text-anchor="middle" font-weight="normal">a₁ = 2, a₄ = 1</text><line x1="60.0" y1="118.0" x2="300.0" y2="118.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><text x="180.0" y="158.0" font-size="22" fill="#233247" text-anchor="middle" font-weight="bold">Tổng bộ phận: 2 + 1 = 3</text><line x1="180.0" y1="192.0" x2="500.0" y2="262.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="350.0" y="20.0" width="300.0" height="170.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="500.0" y="58.0" font-size="24" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Máy 2</text><text x="500.0" y="100.0" font-size="22" fill="#233247" text-anchor="middle" font-weight="normal">a₂ = 4, a₅ = 3</text><line x1="380.0" y1="118.0" x2="620.0" y2="118.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><text x="500.0" y="158.0" font-size="22" fill="#233247" text-anchor="middle" font-weight="bold">Tổng bộ phận: 4 + 3 = 7</text><line x1="500.0" y1="192.0" x2="500.0" y2="262.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="670.0" y="20.0" width="300.0" height="170.0" rx="10" fill="#edf4ff" stroke="#2f3e7a" stroke-width="2.5"/><text x="820.0" y="58.0" font-size="24" fill="#2f3e7a" text-anchor="middle" font-weight="bold">Máy 3</text><text x="820.0" y="100.0" font-size="22" fill="#233247" text-anchor="middle" font-weight="normal">a₃ = 9, a₆ = 5</text><line x1="700.0" y1="118.0" x2="940.0" y2="118.0" stroke="#5b6778" stroke-width="2" stroke-dasharray="6 5"/><text x="820.0" y="158.0" font-size="22" fill="#233247" text-anchor="middle" font-weight="bold">Tổng bộ phận: 9 + 5 = 14</text><line x1="820.0" y1="192.0" x2="500.0" y2="262.0" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><rect x="250.0" y="268.0" width="500.0" height="90.0" rx="10" fill="#eef7f2" stroke="#26704e" stroke-width="3"/><text x="500.0" y="304.0" font-size="23" fill="#26704e" text-anchor="middle" font-weight="bold">Gộp ba tổng bộ phận</text><text x="500.0" y="340.0" font-size="22" fill="#233247" text-anchor="middle" font-weight="normal">3 + 7 + 14 = 24 = a₁ + a₂ + ⋯ + a₆</text></g></svg>
