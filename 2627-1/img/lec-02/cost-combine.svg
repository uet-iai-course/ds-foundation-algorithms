<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Gộp hai cặp trong D2</title><desc id="desc">D2 thay hai cặp lớn một bằng một cặp lớn hai; số cặp trung gian từ năm còn bốn.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1565c0"/></marker></defs><g font-family="Arial, sans-serif"><text x="100" y="70" font-size="30" fill="#233247" text-anchor="middle">D1</text><text x="100" y="205" font-size="30" fill="#233247" text-anchor="middle">D2</text><rect x="190" y="25" width="210" height="85" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="295.0" y="59.0" font-size="27" fill="#1565c0" text-anchor="middle">(dữ, 1)</text><text x="295.0" y="94.0" font-size="27" fill="#1565c0" text-anchor="middle">B byte</text><rect x="425" y="25" width="210" height="85" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="530.0" y="59.0" font-size="27" fill="#1565c0" text-anchor="middle">(liệu, 1)</text><text x="530.0" y="94.0" font-size="27" fill="#1565c0" text-anchor="middle">B byte</text><rect x="660" y="25" width="210" height="85" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="765.0" y="59.0" font-size="27" fill="#1565c0" text-anchor="middle">(lớn, 1)</text><text x="765.0" y="94.0" font-size="27" fill="#1565c0" text-anchor="middle">B byte</text><rect x="190" y="155" width="250" height="95" rx="10" fill="#f6f9fc" stroke="#ef6c00" stroke-width="2"/><text x="315.0" y="194.0" font-size="27" fill="#ef6c00" text-anchor="middle">(lớn, 1), (lớn, 1)</text><text x="315.0" y="229.0" font-size="27" fill="#ef6c00" text-anchor="middle">Gộp tại D2</text><path d="M440,200 L575,200" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="585" y="155" width="250" height="95" rx="10" fill="#f6f9fc" stroke="#2e7d32" stroke-width="2"/><text x="710.0" y="194.0" font-size="27" fill="#2e7d32" text-anchor="middle">(lớn, 2)</text><text x="710.0" y="229.0" font-size="27" fill="#2e7d32" text-anchor="middle">B byte</text><text x="600" y="320" font-size="30" fill="#233247" text-anchor="middle">D1 giữ 3 cặp; D2 gửi 1 cặp → tổng 4 cặp</text></g></svg>