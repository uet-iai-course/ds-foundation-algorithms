<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Hai khoản z khác nhau</title><desc id="desc">Mỗi phần tử ma trận lưu một bộ và phát một cặp tích. Hai bộ đếm nhận hai loại dữ liệu khác nhau.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1565c0"/></marker></defs><g font-family="Arial, sans-serif"><rect x="20" y="75" width="285" height="115" rx="10" fill="#f6f9fc" stroke="#2e7d32" stroke-width="2"/><text x="162.5" y="124.0" font-size="27" fill="#2e7d32" text-anchor="middle">z bộ ma trận</text><text x="162.5" y="159.0" font-size="27" fill="#2e7d32" text-anchor="middle">(i, j, m)</text><path d="M305,130 L420,130" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="425" y="90" width="145" height="85" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="497.5" y="141.5" font-size="27" fill="#1565c0" text-anchor="middle">Map</text><path d="M570,130 L685,130" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="690" y="75" width="275" height="115" rx="10" fill="#f6f9fc" stroke="#ef6c00" stroke-width="2"/><text x="827.5" y="124.0" font-size="27" fill="#ef6c00" text-anchor="middle">z cặp tích</text><text x="827.5" y="159.0" font-size="27" fill="#ef6c00" text-anchor="middle">(i, m × v[j])</text><path d="M965,130 L1010,130" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="1015" y="90" width="175" height="85" rx="10" fill="#f6f9fc" stroke="#1565c0" stroke-width="2"/><text x="1102.5" y="141.5" font-size="27" fill="#1565c0" text-anchor="middle">Reduce</text><text x="175" y="250" font-size="25" fill="#2e7d32" text-anchor="middle">Đếm z đơn vị vào Map</text><text x="850" y="250" font-size="25" fill="#ef6c00" text-anchor="middle">Đếm z đơn vị vào Reduce</text><text x="600" y="320" font-size="27" fill="#233247" text-anchor="middle">Đọc vector là khoản riêng, được đếm ở trang tiếp theo</text></g></svg>