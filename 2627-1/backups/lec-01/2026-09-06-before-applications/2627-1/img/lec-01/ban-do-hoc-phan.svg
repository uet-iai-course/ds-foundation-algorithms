<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Bản đồ 15 bài theo năm nhóm</title>
  <desc id="desc">Bài 1 là nền chung, dẫn đến năm nhóm bài liền nhau: Bài 2 đến 4 về xử lý phân tán và xếp hạng; Bài 5 đến 7 về tương đồng và hàng xóm gần; Bài 8 đến 9 về dòng dữ liệu và cửa sổ; Bài 10 đến 11 về nén dữ liệu và từ điển; Bài 12 đến 15 về lưu trữ, chỉ mục và kết nối.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#455a64"/></marker>
    <pattern id="stripe" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#2f3e7a" stroke-width="2"/></pattern>
    <pattern id="dot" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2.5" fill="#2e7d32"/></pattern>
  </defs>
  <rect width="1200" height="620" rx="22" fill="#fffdf9"/>
  <rect x="390" y="25" width="420" height="74" rx="16" fill="#2f3e7a"/>
  <text x="600" y="57" font-family="sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="white">Bài 1 · Chọn mô hình theo điểm nghẽn</text>
  <text x="600" y="86" font-family="sans-serif" font-size="22" text-anchor="middle" fill="white">dữ liệu · truy cập · bảo đảm</text>
  <g stroke="#455a64" stroke-width="4" fill="none" marker-end="url(#arr)">
    <path d="M600 100V145H130V185"/><path d="M600 145H365V185"/><path d="M600 145V185"/><path d="M600 145H835V185"/><path d="M600 145H1070V185"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <g stroke-width="4">
      <rect x="25" y="185" width="210" height="285" rx="18" fill="#edf4ff" stroke="#2f3e7a"/>
      <rect x="260" y="185" width="210" height="285" rx="18" fill="#eef7ee" stroke="#2e7d32" stroke-dasharray="14 8"/>
      <rect x="495" y="185" width="210" height="285" rx="18" fill="#fff4e8" stroke="#b15a2b" stroke-dasharray="5 6"/>
      <rect x="730" y="185" width="210" height="285" rx="18" fill="#f4effa" stroke="#6a4c93" stroke-dasharray="20 7 5 7"/>
      <rect x="965" y="185" width="210" height="285" rx="18" fill="#f2f4f5" stroke="#455a64" stroke-dasharray="2 7"/>
    </g>
    <rect x="36" y="197" width="188" height="261" rx="14" fill="url(#stripe)" fill-opacity=".16"/>
    <rect x="271" y="197" width="188" height="261" rx="14" fill="url(#dot)" fill-opacity=".22"/>
    <g fill="#263238">
      <text x="130" y="235" font-size="28" font-weight="700">Bài 2–4</text><text x="130" y="292" font-size="25">Xử lý phân tán</text><text x="130" y="328" font-size="25">và xếp hạng</text><text x="130" y="408" font-size="42">⇄</text>
      <text x="365" y="235" font-size="28" font-weight="700">Bài 5–7</text><text x="365" y="292" font-size="25">Tương đồng</text><text x="365" y="328" font-size="25">và hàng xóm gần</text><text x="365" y="408" font-size="42">≈</text>
      <text x="600" y="235" font-size="28" font-weight="700">Bài 8–9</text><text x="600" y="292" font-size="25">Dòng dữ liệu</text><text x="600" y="328" font-size="25">và cửa sổ</text><text x="600" y="408" font-size="42">→</text>
      <text x="835" y="235" font-size="28" font-weight="700">Bài 10–11</text><text x="835" y="292" font-size="25">Nén dữ liệu</text><text x="835" y="328" font-size="25">và từ điển</text><text x="835" y="408" font-size="42">⇥</text>
      <text x="1070" y="235" font-size="28" font-weight="700">Bài 12–15</text><text x="1070" y="292" font-size="25">Lưu trữ, chỉ mục</text><text x="1070" y="328" font-size="25">và kết nối</text><text x="1070" y="408" font-size="42">⌘</text>
    </g>
    <text x="600" y="535" font-size="26" font-weight="700" fill="#2f3e7a">Mỗi nhóm giữ liền các bài có chung biểu diễn và mô hình chi phí.</text>
    <text x="600" y="575" font-size="22" fill="#546e7a">Bài 1 là nền chung; số bài theo thứ tự đề xuất trong nguồn học phần</text>
  </g>
</svg>
